cent2:#fff1c9;--border:rgba(255,154,60,.4);--code:#0a0603}\nbody[data-theme=supernova]{--bg:#1a0505;--bg2:#4a1305;--panel:rgba(40,10,6,.8);--text:#fff1e0;--muted:#f1b99c;--accent:#ff5a36;--accent2:#ffd23f;--border:rgba(255,120,60,.45);--code:#150403}\nbody[data-theme=aurora]{--bg:#031a1a;--bg2:#06352e;--panel:rgba(4,36,34,.8);--text:#e8fff7;--muted:#9fd8c6;--accent:#3df5b0;--accent2:#4fd8ff;--border:rgba(61,245,176,.4);--code:#021412}\nbody[data-theme=cyber]{--bg:#0a0010;--bg2:#1b0030;--panel:rgba(18,4,32,.82);--text:#f6eaff;--muted:#c5a6e0;--accent:#ff2fd0;--accent2:#00f0ff;--border:rgba(255,47,208,.5);--code:#07000c}\nbody[data-theme=ocean]{--bg:#02122b;--bg2:#04294f;--panel:rgba(3,25,52,.8);--text:#e6f6ff;--muted:#8fc4e3;--accent:#2fb8ff;--accent2:#5cffd9;--border:rgba(47,184,255,.4);--code:#010d1d}\nbody[data-theme=sunset]{--bg:#2a0f3d;--bg2:#b3472f;--panel:rgba(48,16,56,.8);--text:#fff3ea;--muted:#ffc9b0;--accent:#ff8a3d;--accent2:#ff5fa2;--border:rgba(255,138,61,.5);--code:#1f0a2b}\nbody[data-theme=paper]{--bg:#f7f5ef;--bg2:#e9ecf5;--panel:rgba(255,255,255,.92);--text:#1d2233;--muted:#586079;--accent:#4a45e0;--accent2:#0a8aa8;--border:rgba(74,69,224,.3);--good:#12945c;--bad:#d1304a;--warn:#b57a00;--code:#eef0f7}\n*{box-sizing:border-box}html{scroll-behavior:smooth}\nbody{margin:0;font-family:Segoe UI,Roboto,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg) 70%) fixed;line-height:1.55;transition:background .6s}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}\n.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 18px 80px}\n#themebar{position:sticky;top:0;z-index:50;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--panel);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}\n#themebar button{border:1px solid var(--border);background:transparent;color:var(--text);padding:6px 11px;border-radius:20px;cursor:pointer;font-size:13px;transition:.25s}\n#themebar button:hover{transform:translateY(-2px)}#themebar button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;font-weight:700}\nnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}\nnav a{color:var(--text);text-decoration:none;font-size:13px;padding:5px 12px;border-radius:14px;border:1px dashed var(--border);background:var(--panel)}\nnav a:hover{background:var(--accent);color:#000}\n.hero{text-align:center;padding:50px 10px 20px}\n.hero h1{font-size:clamp(28px,5vw,50px);margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 4s ease-in-out infinite}\n@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--accent))}}\n.hero p{color:var(--muted);max-width:720px;margin:12px auto}\n.daytag{display:inline-block;margin-top:40px;padding:8px 22px;border-radius:30px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000}\nh2{font-size:25px;margin:44px 0 6px;display:flex;align-items:center;gap:10px}\nh2 .n{background:var(--accent);color:#000;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:16px;flex:none}\nh3{margin:16px 0 8px;color:var(--accent2)}\n.sub{color:var(--muted);margin:0 0 12px}\n.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.25)}\n.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}\n.reveal{opacity:0;transform:translateY(26px);transition:.7s}.reveal.in{opacity:1;transform:none}\n.big{font-size:36px}\n.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}\n.ok{background:var(--good);color:#031}.no{background:var(--bad);color:#fff}.wn{background:var(--warn);color:#210}\ncode{font-family:Consolas,Menlo,monospace;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--accent2);font-size:.92em}\n.cmd{display:block;font-family:Consolas,Menlo,monospace;background:var(--code);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;color:var(--accent2);position:relative;overflow-x:auto;white-space:pre}\n.cmd:after{content:\"copy\";position:absolute;right:8px;top:6px;font-size:10px;color:var(--muted)}.cmd.done:after{content:\"copied ✔\";color:var(--good)}\n.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;border:0;padding:7px 14px;border-radius:10px;font-weight:700;cursor:pointer;margin:3px;font-size:14px}\n.btn:hover{filter:brightness(1.15)}.btn.alt{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.alt.sel{background:var(--accent);color:#000}\n.warnbox{border-left:5px solid var(--warn);background:var(--panel);padding:10px 14px;border-radius:8px;margin:12px 0}.danger{border-left-color:var(--bad)}.safe{border-left-color:var(--good)}\n.flow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}\n.node{flex:1 1 120px;min-width:110px;text-align:center;padding:12px 6px;border-radius:14px;border:2px solid var(--border);background:var(--panel);transition:.4s;position:relative;font-size:14px}\n.node .big{display:block}.node.act{border-color:var(--accent2);transform:scale(1.07);box-shadow:0 0 22px var(--accent)}\n.node.act:after{content:\"\";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--accent2);animation:ping 1.2s infinite}\n@keyframes ping{to{transform:scale(1.15);opacity:0}}\n@keyframes bob{50%{transform:translateY(5px)}}\n.explain{min-height:48px;margin-top:10px;text-align:center}\n.bar{height:16px;border-radius:8px;background:var(--code);overflow:hidden;border:1px solid var(--border)}.bar i{display:block;height:100%;width:0;transition:.6s;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good))}\ntable{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--panel);color:var(--accent2)}td.ph{color:var(--muted);font-style:italic}\n.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin:5px 0;background:var(--panel);cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--accent)}\n.bigtxt{font-family:Consolas,monospace;font-size:44px;text-align:center;color:var(--accent2)}\n.fc{perspective:700px;height:130px;cursor:pointer}.fc>div{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}.fc.flip>div{transform:rotateY(180deg)}\n.fc span{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--panel)}\n.fc span+span{transform:rotateY(180deg);background:var(--accent);color:#000;font-weight:600}\ndetails{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--accent2)}\ninput[type=text],select,textarea{background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:14px;width:100%;font-family:inherit}\n.qrow{padding:10px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--panel);transition:.3s}.qrow.right{border-color:var(--good)}.qrow.wrong{border-color:var(--bad)}\n.qt{font-family:Consolas,monospace;font-size:13.5px;margin-bottom:6px;color:var(--accent2)}.qw{font-size:14px;margin-top:4px}\n.layer{padding:9px 14px;margin:4px 0;border-radius:10px;border:1px solid var(--border);display:flex;justify-content:space-between;transition:.5s}\n.layer.me{background:var(--accent);color:#000;font-weight:700}.layer.prov{opacity:.75}\n/* wifi / evil twin */\n.air{position:relative;height:210px;border:1px dashed var(--border);border-radius:14px;overflow:hidden;background:var(--code)}\n.dev{position:absolute;text-align:center;font-size:12px;z-index:2}.dev b{display:block;font-size:34px}\n.wave{position:absolute;border:2px solid var(--accent2);border-radius:50%;opacity:0;animation:wv 2.6s infinite;transform:translate(-50%,-50%)}\n.wave.bad{border-color:var(--bad)}@keyframes wv{0%{width:10px;height:10px;opacity:.9}100%{width:170px;height:170px;opacity:0}}\n.line{position:absolute;height:3px;background:var(--good);transform-origin:left center;transition:.5s;z-index:1}\n/* net seg */\n.net{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}\n.nd{width:98px;padding:10px 4px;text-align:center;border:2px solid var(--border);border-radius:12px;background:var(--panel);transition:.4s;font-size:12px}.nd b{display:block;font-size:30px}\n.nd.hit{border-color:var(--bad);box-shadow:0 0 18px var(--bad);animation:shake .4s 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.nd.safe2{border-color:var(--good)}\n.zone{border:2px dashed var(--border);border-radius:14px;padding:8px;flex:1 1 220px}.zone h4{margin:0 0 4px;text-align:center;color:var(--accent2);font-size:13px}\n/* phish */\n.mail{background:#fff;color:#222;border-radius:12px;padding:14px;font-family:Arial,sans-serif;font-size:14px;border:1px solid #ccc}\n.mail .hot{cursor:pointer;border-bottom:2px dotted #d33;transition:.2s}.mail .hot.found{background:#ffe08a;border-bottom:2px solid #d33}\n.mail .btnx{display:inline-block;background:#1a73e8;color:#fff;padding:8px 16px;border-radius:6px}\n/* cvss */\n.sev{display:inline-block;padding:4px 14px;border-radius:14px;font-weight:800;margin-top:6px}\n.fnd{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border);border-radius:10px;margin:5px 0;background:var(--panel);transition:.4s}\n.rep{background:#fff;color:#1b1f2a;border-radius:12px;padding:16px;font-size:14px;border-top:6px solid var(--accent)}.rep h4{margin:0 0 8px}.rep dt{font-weight:700;color:#444;margin-top:6px}.rep dd{margin:0}\n.state{display:inline-block;padding:6px 18px;border-radius:20px;font-weight:800;font-size:16px}\n\u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cdiv id=\"themebar\">\u003c/div>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"hero\">\n  \u003ch1>📡 Cyber Notes: Day 17 &amp; Day 18\u003c/h1>\n  \u003cp>Zero-level, visual-first. Day 17 = Wi-Fi, cloud, containers, IoT and phishing \u003cb>defence\u003c/b>. Day 18 = how a \u003cb>professional penetration test\u003c/b> is planned, scored and reported.\u003c/p>\n  \u003cdiv class=\"warnbox danger\" style=\"max-width:720px;margin:auto;text-align:left\">⚠️ \u003cb>Rule:\u003c/b> never crack Wi-Fi passwords or send deauthentication on a real network. Use only your own equipment or an instructor-provided training environment, with written authorization.\u003c/div>\n\u003c/div>\n\n\u003cnav>\n \u003ca href=\"#d17\">Day 17\u003c/a>\u003ca href=\"#wifi\">Wi-Fi\u003c/a>\u003ca href=\"#twin\">Rogue AP\u003c/a>\u003ca href=\"#cloud\">Cloud\u003c/a>\u003ca href=\"#cfg\">Cloud audit\u003c/a>\u003ca href=\"#cont\">Containers\u003c/a>\u003ca href=\"#iot\">IoT\u003c/a>\u003ca href=\"#phish\">Phishing\u003c/a>\u003ca href=\"#p17\">Practicals 17\u003c/a>\n \u003ca href=\"#d18\">Day 18\u003c/a>\u003ca href=\"#life\">Lifecycle\u003c/a>\u003ca href=\"#scope\">Scope/RoE\u003c/a>\u003ca href=\"#wstg\">OWASP WSTG\u003c/a>\u003ca href=\"#evid\">Evidence\u003c/a>\u003ca href=\"#cvss\">CVSS\u003c/a>\u003ca href=\"#prio\">Prioritize\u003c/a>\u003ca href=\"#rep\">Report\u003c/a>\u003ca href=\"#retest\">Retest\u003c/a>\u003ca href=\"#rev\">Revision\u003c/a>\n\u003c/nav>\n\n\u003c!-- ============ DAY 17 ============ -->\n\u003cdiv style=\"text-align:center\">\u003cspan class=\"daytag\" id=\"d17\">DAY 17\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Wireless Security, Cloud &amp; Modern Threats\u003c/h2>\n\n\u003ch2 id=\"wifi\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>Wi-Fi Security: WPA2 / WPA3 &amp; Secure Config\u003c/h2>\n\u003cp class=\"sub\">Click each protocol. The bar shows how safe it is today.\u003c/p>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv id=\"wchips\" style=\"text-align:center\">\u003c/div>\n  \u003cdiv class=\"bar\" style=\"margin:12px 0\">\u003ci id=\"wbar\">\u003c/i>\u003c/div>\n  \u003cdiv class=\"explain\" id=\"wtxt\">Pick a protocol 👆\u003c/div>\n\u003c/div>\n\u003cdiv class=\"two reveal\" style=\"margin-top:14px\">\n  \u003cdiv class=\"card\">\u003ch3>🔐 Encryption in 20 seconds\u003c/h3>\u003cp>Encryption scrambles Wi-Fi traffic so people nearby can't read it. \u003cb>AES\u003c/b> is the strong scrambler used by WPA2/WPA3. \u003cb>WPA3\u003c/b> also makes offline password guessing much harder.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>✅ Secure router settings\u003c/h3>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> Encryption: WPA2-AES or WPA3 (never WEP/Open)\u003c/label>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> Router admin password changed from default\u003c/label>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> Firmware up to date / auto-update\u003c/label>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> Guest network separate from main network\u003c/label>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> WPS disabled\u003c/label>\n  \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"rt\"> Remote (internet) admin disabled\u003c/label>\n  \u003cdiv class=\"bar\">\u003ci id=\"rbar\">\u003c/i>\u003c/div>\u003cdiv class=\"explain\" id=\"rtxt\">\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"twin\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>Rogue AP, Evil Twin &amp; Wireless Monitoring (concept)\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">A \u003cb>rogue AP\u003c/b> is an unauthorized access point. An \u003cb>evil twin\u003c/b> copies the name (SSID) of a real one to trick devices. See the idea, then turn defences on.\u003c/p>\n  \u003cdiv class=\"air\" id=\"air\">\n    \u003cdiv class=\"dev\" style=\"left:8%;top:38%\">\u003cb>📱\u003c/b>Your phone\u003c/div>\n    \u003cdiv class=\"dev\" style=\"left:45%;top:8%\" id=\"ap1\">\u003cb>📶\u003c/b>\"CafeWiFi\" (real)\u003c/div>\n    \u003cdiv class=\"dev\" style=\"left:45%;top:70%\" id=\"ap2\">\u003cb>👿\u003c/b>\"CafeWiFi\" (fake)\u003c/div>\n    \u003cdiv class=\"wave\" style=\"left:50%;top:22%\">\u003c/div>\u003cdiv class=\"wave bad\" style=\"left:50%;top:80%;animation-delay:1s\">\u003c/div>\n    \u003cdiv class=\"dev\" style=\"right:5%;top:38%\" id=\"mon\">\u003cb>🕵️\u003c/b>\u003cspan id=\"montxt\">WIPS: off\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn alt\" id=\"defbtn\" onclick=\"toggleDef()\">🛡️ Turn defences ON\u003c/button>\u003c/div>\n  \u003cdiv class=\"explain\" id=\"twintxt\">Both networks have the same name. A phone may pick the stronger signal, which could be the fake one.\u003c/div>\n  \u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cb>Defences\u003c/b>\u003cbr>• WPA3 / 802.1X with certificate check\u003cbr>• Use a VPN on public Wi-Fi\u003cbr>• Don't ignore certificate warnings\u003c/div>\u003cdiv class=\"card\">\u003cb>Monitoring\u003c/b>\u003cbr>• WIPS/WIDS alerts for unknown APs with your SSID\u003cbr>• Keep an inventory of approved APs\u003cbr>• Review wireless logs\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"cloud\" class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>Cloud Shared-Responsibility Model\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Provider secures the cloud itself. \u003cb>You\u003c/b> secure what you put and configure in it. Switch the service type:\u003c/p>\n  \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn alt sel\" onclick=\"srm('IaaS',this)\">IaaS (VM)\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"srm('PaaS',this)\">PaaS (platform)\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"srm('SaaS',this)\">SaaS (app)\u003c/button>\u003c/div>\n  \u003cdiv id=\"srm\">\u003c/div>\n  \u003cp style=\"margin-top:8px\">\u003cspan class=\"pill ok\">Highlighted = YOU\u003c/span> \u003cspan class=\"pill wn\">Faded = Provider\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"grid reveal\" style=\"margin-top:14px\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🪪\u003c/span>\u003ch3>IAM\u003c/h3>\u003cp>Who can do what. Use \u003cb>least privilege\u003c/b>: give only needed permissions, avoid wildcard \u003ccode>*\u003c/code> rights.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">📲\u003c/span>\u003ch3>MFA\u003c/h3>\u003cp>Second proof (app code, key). Must be ON for admins and root accounts.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🪣\u003c/span>\u003ch3>Storage permissions\u003c/h3>\u003cp>Buckets/blobs should be \u003cb>private by default\u003c/b>; encryption on; no public listing.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🧱\u003c/span>\u003ch3>Security groups\u003c/h3>\u003cp>Cloud firewalls. Don't open admin ports (SSH/RDP) to \u003ccode>0.0.0.0/0\u003c/code> (whole internet).\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">📜\u003c/span>\u003ch3>Audit logs\u003c/h3>\u003cp>Record who did what and when. Keep them ON, protected and reviewed.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"cfg\" class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Mock Cloud Config Audit (Practical 2)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Each line is a setting from a mock cloud account. Decide: \u003cb>Risky\u003c/b> or \u003cb>OK\u003c/b>.\u003c/p>\u003cdiv id=\"q_cloud\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"cont\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>Container Security\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv class=\"flow\" id=\"contflow\">\u003c/div>\n  \u003cdiv class=\"explain\" id=\"conttxt\">Click a stage 👆\u003c/div>\n\u003c/div>\n\u003cdiv class=\"two reveal\" style=\"margin-top:14px\">\n  \u003cdiv class=\"card\">\u003ch3>✅ Do\u003c/h3>\u003cul>\u003cli>Use small, trusted, up-to-date \u003cb>images\u003c/b>\u003c/li>\u003cli>Run as non-root user\u003c/li>\u003cli>Pass \u003cb>secrets\u003c/b> at runtime (secret store), not inside the image\u003c/li>\u003cli>Publish only needed ports, and bind to localhost if local\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>❌ Don't\u003c/h3>\u003cul>\u003cli>Hard-code passwords/API keys in Dockerfile or code\u003c/li>\u003cli>Run privileged containers\u003c/li>\u003cli>Expose database ports to the internet\u003c/li>\u003cli>Use \u003ccode>latest\u003c/code> from unknown sources\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\u003ch3>Look at exposed ports (read-only commands)\u003c/h3>\n\u003ccode class=\"cmd\">docker ps\u003c/code>\u003ccode class=\"cmd\">docker image ls\u003c/code>\n\u003cpre class=\"cmd\" style=\"cursor:default;white-space:pre\">0.0.0.0:8080-&gt;80/tcp      ← open to the whole network\n127.0.0.1:5432-&gt;5432/tcp  ← local only (safer)\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"iot\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>IoT Security &amp; Network Segmentation\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Cheap smart devices often have default passwords and old firmware. Segmentation limits the damage. Try it:\u003c/p>\n  \u003cdiv style=\"text-align:center\">\u003clabel class=\"chk\" style=\"display:inline-flex\">\u003cinput type=\"checkbox\" id=\"segon\"> Put IoT devices on a separate network (segmentation)\u003c/label>\n  \u003cbutton class=\"btn\" onclick=\"compromise()\">💥 Pretend the camera is compromised\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"resetNet()\">↺ Reset\u003c/button>\u003c/div>\n  \u003cdiv class=\"net\" id=\"net\">\u003c/div>\n  \u003cdiv class=\"explain\" id=\"nettxt\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid reveal\" style=\"margin-top:14px\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🔑\u003c/span>\u003ch3>Default credentials\u003c/h3>\u003cp>Change at setup. Unique strong password per device.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🩹\u003c/span>\u003ch3>Firmware updates\u003c/h3>\u003cp>Enable auto-update; replace devices the vendor no longer patches.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🧱\u003c/span>\u003ch3>Segmentation\u003c/h3>\u003cp>IoT on its own VLAN/guest network; block IoT → laptops/servers.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"phish\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>Phishing, Social Engineering &amp; Incident Reporting\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Click suspicious parts of this fake email. Find all 5 red flags. \u003cspan id=\"pfound\" class=\"pill wn\">0/5\u003c/span>\u003c/p>\n  \u003cdiv class=\"mail\">\n   \u003cb>From:\u003c/b> \u003cspan class=\"hot\" data-w=\"Sender domain is slightly off (support@paypa1-secure.com), not the real company.\">support@paypa1-secure.com\u003c/span>\u003cbr>\n   \u003cb>Subject:\u003c/b> \u003cspan class=\"hot\" data-w=\"Urgency and threat is a classic pressure tactic.\">URGENT: Account will be closed in 24 hours!\u003c/span>\u003chr>\n   \u003cspan class=\"hot\" data-w=\"Generic greeting: a real company usually uses your name.\">Dear Customer,\u003c/span>\u003cbr>\n   We noticed unusual activity. Please verify your password now.\u003cbr>\u003cbr>\n   \u003cspan class=\"hot btnx\" data-w=\"Hover shows a different link than the text. Never log in from email links.\">Verify Account\u003c/span>\u003cbr>\u003cbr>\n   \u003cspan class=\"hot\" data-w=\"Unexpected attachment (could carry malware).\">📎 invoice_details.zip\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"explain\" id=\"pwhy\">Click the highlighted-on-hover parts.\u003c/div>\n  \u003ch3>Incident reporting flow\u003c/h3>\u003cdiv class=\"flow\" id=\"incflow\">\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"p17\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Day 17 Practicals\u003c/h2>\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 1: Router / config-file security audit\u003c/summary>\u003cp>Use the router checklist in section 1 on your router admin page or the provided config file. For every item write: \u003cb>Current value → Risk → Fix\u003c/b>.\u003c/p>\u003c/details>\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 2: Mock cloud configuration\u003c/summary>\u003cp>Done in section 4: public storage, \u003ccode>*\u003c/code> permissions, world-open security groups, missing MFA and logging are the usual findings.\u003c/p>\u003c/details>\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 3: IoT threat model (example: smart camera)\u003c/summary>\n\u003ctable>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Smart camera example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Assets\u003c/td>\u003ctd>Video feed, home network, cloud account\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Entry points\u003c/td>\u003ctd>Default password, open port, outdated firmware, vendor cloud account\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Threats\u003c/td>\u003ctd>Unauthorized viewing, camera used to reach other devices, botnet use\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Segmentation\u003c/td>\u003ctd>Separate IoT VLAN; deny IoT → main LAN; allow only needed internet\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Patching\u003c/td>\u003ctd>Auto-updates on; check monthly; retire unsupported devices\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Credential policy\u003c/td>\u003ctd>Change default at setup; unique 14+ char password; MFA on vendor account; disable UPnP/remote access if unused\u003c/td>\u003c/tr>\u003c/table>\u003c/details>\n\u003ch3 class=\"reveal\">📝 Expected Output: Wireless / Cloud / IoT Audit Checklist\u003c/h3>\n\u003cdiv class=\"card reveal\">\u003ctable>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Check\u003c/th>\u003cth>Status\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Wi-Fi\u003c/td>\u003ctd>WPA2-AES/WPA3, WPS off, guest network\u003c/td>\u003ctd class=\"ph\">Pass/Fail\u003c/td>\u003ctd class=\"ph\">…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Router\u003c/td>\u003ctd>Admin password, firmware, remote admin\u003c/td>\u003ctd class=\"ph\">Pass/Fail\u003c/td>\u003ctd class=\"ph\">…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cloud\u003c/td>\u003ctd>Private storage, least-privilege IAM, MFA, SG, logs\u003c/td>\u003ctd class=\"ph\">Pass/Fail\u003c/td>\u003ctd class=\"ph\">…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Container\u003c/td>\u003ctd>Non-root, no secrets in image, minimal ports\u003c/td>\u003ctd class=\"ph\">Pass/Fail\u003c/td>\u003ctd class=\"ph\">…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IoT\u003c/td>\u003ctd>Default creds, updates, segmentation\u003c/td>\u003ctd class=\"ph\">Pass/Fail\u003c/td>\u003ctd class=\"ph\">…\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003c!-- ============ DAY 18 ============ -->\n\u003cdiv style=\"text-align:center;margin-top:60px\">\u003cspan class=\"daytag\" id=\"d18\">DAY 18\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Penetration Testing Methodology &amp; Professional Reporting\u003c/h2>\n\n\u003ch2 id=\"life\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>The Pentest Lifecycle (animated)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"flow\" id=\"plife\">\u003c/div>\u003cdiv class=\"explain\" id=\"plifetxt\">Press ▶ Play.\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn\" onclick=\"playP()\">▶ Play\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"clearInterval(pt)\">⏹ Stop\u003c/button>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"scope\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>Pre-engagement: Scope, RoE &amp; Authorization\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>📄 Documents before ANY testing\u003c/h3>\u003cul>\u003cli>\u003cb>Authorization letter\u003c/b>: signed permission\u003c/li>\u003cli>\u003cb>Scope\u003c/b>: exactly which assets/IPs/apps\u003c/li>\u003cli>\u003cb>RoE (Rules of Engagement)\u003c/b>: allowed methods, test hours, no-DoS, emergency contacts\u003c/li>\u003cli>Data handling &amp; reporting rules\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>🎯 Scope checker (try it)\u003c/h3>\n   \u003cp class=\"sub\">Scope: \u003ccode>10.10.0.0/24\u003c/code> and \u003ccode>app.lab.local\u003c/code>. RoE: scanning + validation allowed; \u003cb>no DoS\u003c/b>, \u003cb>no social engineering\u003c/b>.\u003c/p>\n   \u003cselect id=\"sa\">\u003coption>10.10.0.15\u003c/option>\u003coption>10.10.1.20\u003c/option>\u003coption>app.lab.local\u003c/option>\u003coption>payments.thirdparty.com\u003c/option>\u003c/select>\u003cbr>\u003cbr>\n   \u003cselect id=\"sx\">\u003coption>Port scan\u003c/option>\u003coption>Safe vulnerability validation\u003c/option>\u003coption>Denial of service\u003c/option>\u003coption>Phish the staff\u003c/option>\u003c/select>\n   \u003cdiv id=\"sres\" class=\"explain\">\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003ch2 class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>Recon → Enumeration → Validation → Impact\u003c/h2>\n\u003cdiv class=\"grid reveal\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🔭\u003c/span>\u003ch3>Reconnaissance\u003c/h3>\u003cp>Gather info. \u003ci>Passive\u003c/i> (public info) or \u003ci>active\u003c/i> (touching target).\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">📇\u003c/span>\u003ch3>Enumeration\u003c/h3>\u003cp>List services, versions, pages, users on in-scope assets.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">✅\u003c/span>\u003ch3>Validation\u003c/h3>\u003cp>Confirm a finding is real with the least risky method. Remove false positives.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">💼\u003c/span>\u003ch3>Impact analysis\u003c/h3>\u003cp>What could really happen to the business if abused?\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🔁\u003c/span>\u003ch3>Retesting\u003c/h3>\u003cp>After the fix, test again to prove it's gone.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Practical 1: Validate &amp; Classify Lab Findings\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Scanner says \"vulnerable\". Decide: \u003cb>Confirmed\u003c/b>, \u003cb>False positive\u003c/b> or \u003cb>Need more evidence\u003c/b>.\u003c/p>\u003cdiv id=\"q_val\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"wstg\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>OWASP Web Security Testing Guide (WSTG)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">OWASP WSTG is a free checklist of what to test on web apps. Click a category.\u003c/p>\u003cdiv id=\"wchips2\" style=\"text-align:center\">\u003c/div>\u003cdiv class=\"explain\" id=\"wstgtxt\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"evid\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>Evidence, Reproducibility &amp; Data Minimization\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>✅ Good evidence\u003c/h3>\u003cul>\u003cli>Screenshot with timestamp and URL/IP\u003c/li>\u003cli>Exact steps so anyone can \u003cb>reproduce\u003c/b>\u003c/li>\u003cli>Sensitive values \u003cb>masked\u003c/b> (e.g. \u003ccode>pa****rd\u003c/code>)\u003c/li>\u003cli>Minimal proof: version, one sample row count, harmless header\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>❌ Bad evidence\u003c/h3>\u003cul>\u003cli>Dumping full customer tables\u003c/li>\u003cli>Real passwords/emails/ID numbers in the report\u003c/li>\u003cli>\"It's vulnerable, trust me\" (no steps)\u003c/li>\u003cli>Reports sent unencrypted by email\u003c/li>\u003c/ul>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"cvss\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>CVSS Score Calculator (v3.1 Base)\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">CVSS gives a 0–10 \u003cb>technical severity\u003c/b>. Change the metrics and watch the score move.\u003c/p>\n  \u003cdiv class=\"grid\" id=\"cvsel\">\u003c/div>\n  \u003cdiv style=\"text-align:center\">\u003cdiv class=\"bigtxt\" id=\"cvnum\">0.0\u003c/div>\u003cspan class=\"sev\" id=\"cvsev\">None\u003c/span>\n  \u003cdiv class=\"bar\" style=\"margin-top:10px\">\u003ci id=\"cvbar\">\u003c/i>\u003c/div>\u003cp>\u003ccode id=\"cvvec\">\u003c/code>\u003c/p>\n  \u003cbutton class=\"btn alt\" onclick=\"cvPreset(0)\">Remote unauthenticated RCE\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"cvPreset(1)\">Stored XSS\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"cvPreset(2)\">Info leak (local)\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"prio\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Business Risk &amp; Remediation Prioritization\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">CVSS is not the whole story. Pick how important each asset is to the business; the list re-sorts (illustrative priority = CVSS × asset weight).\u003c/p>\u003cdiv id=\"prio\">\u003c/div>\n\u003cdiv class=\"explain\">Fix top-to-bottom: \u003cb>critical asset + high severity first\u003c/b>, quick wins in parallel.\u003c/div>\u003c/div>\n\n\u003ch2 class=\"reveal\">\u003cspan class=\"n\">9\u003c/span>Executive Summary vs Technical Findings\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>👔 Executive summary\u003c/h3>\u003cp>For managers. 1 page, plain language: overall risk, key business impact, top 3 actions, charts. \u003cb>No commands, no jargon.\u003c/b>\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>🛠️ Technical findings\u003c/h3>\u003cp>For engineers. Per finding: affected asset, evidence, steps to reproduce, CVSS, impact, exact fix, references.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"rep\" class=\"reveal\">\u003cspan class=\"n\">10\u003c/span>Practical 2: Build a Finding (live preview)\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv class=\"two\">\u003cdiv>\n   \u003cp>ID \u003cinput type=\"text\" id=\"r_id\" value=\"F-001\">\u003c/p>\n   \u003cp>Title \u003cinput type=\"text\" id=\"r_ti\" value=\"Outdated web server version on lab host\">\u003c/p>\n   \u003cp>Affected asset \u003cinput type=\"text\" id=\"r_as\" value=\"10.10.0.15 (lab web server)\">\u003c/p>\n   \u003cp>Severity \u003cselect id=\"r_sv\">\u003coption>Critical\u003c/option>\u003coption selected>High\u003c/option>\u003coption>Medium\u003c/option>\u003coption>Low\u003c/option>\u003coption>Informational\u003c/option>\u003c/select>\u003c/p>\n   \u003cp>Evidence \u003ctextarea id=\"r_ev\" rows=\"2\">Banner shows version 2.4.x (screenshot 01, 10:42 IST). Matches a known vulnerable release. Validated with a non-destructive check only.\u003c/textarea>\u003c/p>\n   \u003cp>Impact \u003ctextarea id=\"r_im\" rows=\"2\">An attacker could abuse the known flaw to affect availability or access of the web application.\u003c/textarea>\u003c/p>\n   \u003cp>Remediation \u003ctextarea id=\"r_rm\" rows=\"2\">Upgrade to the latest patched version; restrict admin interface to internal network.\u003c/textarea>\u003c/p>\n   \u003cp>References \u003cinput type=\"text\" id=\"r_rf\" value=\"Vendor advisory; CVE ID from the advisory; OWASP WSTG\">\u003c/p>\u003c/div>\n   \u003cdiv>\u003cdiv class=\"rep\" id=\"repv\">\u003c/div>\u003cdiv class=\"explain\" id=\"repw\">\u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"retest\" class=\"reveal\">\u003cspan class=\"n\">11\u003c/span>Practical 3: Retest &amp; Closure Status\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv class=\"flow\" id=\"rtflow\">\u003c/div>\n  \u003cdiv style=\"text-align:center;margin:12px\">\u003cspan class=\"state\" id=\"rtst\" style=\"background:var(--bad);color:#fff\">Open\u003c/span>\u003c/div>\n  \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn alt\" onclick=\"rt('fix')\">🔧 Apply fix\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"rt('pass')\">🔁 Retest: not reproducible\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"rt('fail')\">🔁 Retest: still reproducible\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"rt('risk')\">✍️ Owner accepts risk\u003c/button>\u003cbutton class=\"btn\" onclick=\"rt('reset')\">↺ Reset\u003c/button>\u003c/div>\n  \u003cdiv class=\"explain\" id=\"rttxt\">\u003c/div>\n  \u003ctable>\u003ctr>\u003cth>Status\u003c/th>\u003cth>Closure criteria\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"pill no\">Open\u003c/span>\u003c/td>\u003ctd>Finding exists or fix unverified\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"pill ok\">Fixed\u003c/span>\u003c/td>\u003ctd>Retest with same steps shows it is no longer reproducible; evidence attached\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"pill wn\">Accepted Risk\u003c/span>\u003c/td>\u003ctd>Business owner formally signs off, with reason and review date\u003c/td>\u003c/tr>\u003c/table>\n\u003c/div>\n\n\u003ch3 class=\"reveal\">📝 Expected Output: Professional Report Structure\u003c/h3>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"flow\" id=\"repflow\">\u003c/div>\u003cp class=\"sub\" style=\"margin-top:10px\">Rule: prove the issue with minimal evidence. No unnecessary exploit details, no real user data.\u003c/p>\u003c/div>\n\n\u003ch2 id=\"rev\" class=\"reveal\">\u003cspan class=\"n\">★\u003c/span>Quick Revision Flashcards\u003c/h2>\n\u003cdiv class=\"grid reveal\" id=\"cards\">\u003c/div>\n\u003cp style=\"text-align:center;color:var(--muted);margin-top:50px\">Authorized only · Minimal evidence · Clear fix · Always retest ✅\u003c/p>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\n/* ===== themes ===== */\nconst THEMES=[[\"galaxy\",\"🌌 Galaxy\"],[\"blackhole\",\"🕳️ Black Hole\"],[\"supernova\",\"💥 Supernova\"],[\"aurora\",\"🌿 Aurora\"],[\"cyber\",\"🌆 Cyberpunk\"],[\"ocean\",\"🌊 Deep Ocean\"],[\"sunset\",\"🌇 Sunset Retro\"],[\"paper\",\"📄 Light Paper\"]];\nTHEMES.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>setTheme(k);b.dataset.k=k;$('#themebar').appendChild(b)});\nfunction setTheme(k){document.body.dataset.theme=k;theme=k;$$('#themebar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));init();try{localStorage.setItem('th',k)}catch(e){}}\nconst cv=$('#bg'),c=cv.getContext('2d');let W,H,t=0,theme='galaxy',P=[];\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}\nfunction R(a,b){return a+Math.random()*(b-a)}\nfunction sp(){const a=R(0,6.28),v=R(.5,4);return{x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(60,200),m:200}}\nfunction init(){P=[];\n if(theme==='galaxy')for(let i=0;i\u003c160;i++)P.push({x:R(0,W),y:R(0,H),r:R(.4,2),ph:R(0,6)});\n if(theme==='blackhole')for(let i=0;i\u003c450;i++)P.push({a:R(0,6.28),r:R(70,Math.min(W,H)*.5),o:R(.2,.9)});\n if(theme==='supernova')for(let i=0;i\u003c170;i++)P.push(sp());\n if(theme==='ocean')for(let i=0;i\u003c55;i++)P.push({x:R(0,W),y:R(0,H),r:R(2,12),s:R(.3,1.3),ph:R(0,6)});\n if(theme==='sunset'||theme==='paper')for(let i=0;i\u003c40;i++)P.push({x:R(0,W),y:R(0,H),r:R(4,26),s:R(.1,.5),ph:R(0,6)})}\nfunction draw(){t++;c.clearRect(0,0,W,H);\n if(theme==='galaxy'){[[.2,.3,'rgba(120,80,255,.22)'],[.8,.6,'rgba(60,140,255,.2)'],[.5,.9,'rgba(200,80,255,.15)']].forEach(([x,y,col],i)=>{const g=c.createRadialGradient(W*x+Math.sin(t/200+i)*40,H*y,0,W*x,H*y,W*.4);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H)});P.forEach(p=>{c.globalAlpha=.4+.6*Math.abs(Math.sin(t*.03+p.ph));c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()});c.globalAlpha=1}\n else if(theme==='blackhole'){const cx=W*.5,cy=H*.45;P.forEach(p=>{p.a+=.9/Math.sqrt(p.r)*.12;const x=cx+Math.cos(p.a)*p.r*1.6,y=cy+Math.sin(p.a)*p.r*.38;c.globalAlpha=Math.max(0,p.o*(1-p.r/(Math.min(W,H)*.6)));c.fillStyle=p.r\u003c150?'#fff3d0':'#ff8a2a';c.fillRect(x,y,2,2)});c.globalAlpha=1;const g=c.createRadialGradient(cx,cy,30,cx,cy,140);g.addColorStop(0,'#000');g.addColorStop(.45,'#000');g.addColorStop(.6,'rgba(255,160,60,.4)');g.addColorStop(1,'transparent');c.fillStyle=g;c.beginPath();c.arc(cx,cy,140,0,6.28);c.fill()}\n else if(theme==='supernova'){const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,260);g.addColorStop(0,'rgba(255,220,100,.25)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.l--;const a=Math.max(p.l/p.m,0);c.fillStyle=`hsla(${15+a*40},100%,${50+a*20}%,${a})`;c.beginPath();c.arc(p.x,p.y,2.2,0,6.28);c.fill();if(p.l\u003c=0)P[i]=sp()})}\n else if(theme==='aurora'){for(let i=0;i\u003c4;i++){const base=H*(.2+i*.1);const g=c.createLinearGradient(0,base-90,0,base+170);const col=['61,245,176','79,216,255','140,120,255','60,255,120'][i];g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.5,`rgba(${col},.28)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.moveTo(0,H);for(let x=0;x\u003c=W;x+=10)c.lineTo(x,base+Math.sin(x*.004+t*.012+i*1.7)*70+Math.sin(x*.011+t*.02)*20);c.lineTo(W,H);c.fill()}}\n else if(theme==='cyber'){const hz=H*.55;c.lineWidth=1;c.strokeStyle='rgba(255,47,208,.55)';for(let i=0;i\u003c22;i++){const z=((i+(t*.04)%1)/22);const y=hz+z*z*(H-hz);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.strokeStyle='rgba(0,240,255,.45)';for(let i=-16;i\u003c=16;i++){c.beginPath();c.moveTo(W/2+i*20,hz);c.lineTo(W/2+i*W*.14,H);c.stroke()}const g=c.createLinearGradient(0,hz-80,0,hz);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(255,47,208,.3)');c.fillStyle=g;c.fillRect(0,hz-80,W,80)}\n else if(theme==='ocean'){P.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t*.02+p.ph)*.4;if(p.y\u003c-20){p.y=H+20;p.x=R(0,W)}c.strokeStyle='rgba(92,255,217,.55)';c.fillStyle='rgba(47,184,255,.12)';c.shadowColor='#5cffd9';c.shadowBlur=10;c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill();c.stroke();c.shadowBlur=0})}\n else if(theme==='sunset'){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(60,20,110,.45)');g.addColorStop(.6,'rgba(255,95,162,.3)');g.addColorStop(1,'rgba(255,160,60,.45)');c.fillStyle=g;c.fillRect(0,0,W,H);const sy=H*.72+Math.sin(t*.01)*6;const sg=c.createRadialGradient(W*.5,sy,10,W*.5,sy,170);sg.addColorStop(0,'rgba(255,230,140,.95)');sg.addColorStop(.5,'rgba(255,120,60,.55)');sg.addColorStop(1,'transparent');c.fillStyle=sg;c.beginPath();c.arc(W*.5,sy,170,0,6.28);c.fill();P.forEach(p=>{p.x+=p.s;if(p.x>W+30)p.x=-30;c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n else if(theme==='paper'){P.forEach(p=>{p.y-=p.s*.5;p.x+=Math.sin(t*.01+p.ph)*.3;if(p.y\u003c-30)p.y=H+30;c.fillStyle='rgba(74,69,224,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n requestAnimationFrame(draw)}\naddEventListener('resize',rs);\n\n/* ===== helpers ===== */\ndocument.addEventListener('click',e=>{const m=e.target.closest('.cmd');if(m&&m.tagName==='CODE'){navigator.clipboard&&navigator.clipboard.writeText(m.textContent.trim());m.classList.add('done');setTimeout(()=>m.classList.remove('done'),1200)}});\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.08});\nfunction mkFlow(el,items,cb){el.innerHTML=items.map((i,k)=>`\u003cdiv class=\"node\" data-k=\"${k}\" style=\"${cb?'cursor:pointer':''}\">\u003cspan class=\"big\">${i[0]}\u003c/span>\u003cb>${i[1]}\u003c/b>\u003c/div>`).join('');if(cb)el.querySelectorAll('.node').forEach(n=>n.onclick=()=>cb(+n.dataset.k,n))}\nfunction mkQuiz(id,items,labels){const el=$('#'+id);let sc=0;\n el.innerHTML=items.map((it,i)=>`\u003cdiv class=\"qrow\">\u003cdiv class=\"qt\">${it.t}\u003c/div>\u003cdiv>${labels.map((l,j)=>`\u003cbutton class=\"btn alt\" data-i=\"${i}\" data-j=\"${j}\">${l}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"qw\" id=\"${id}w${i}\">\u003c/div>\u003c/div>`).join('')+`\u003cdiv class=\"explain\" id=\"${id}s\">Score: 0/${items.length}\u003c/div>`;\n el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,row=b.closest('.qrow');if(row.dataset.d)return;row.dataset.d=1;const ok=j===items[i].a;if(ok)sc++;row.classList.add(ok?'right':'wrong');$('#'+id+'w'+i).innerHTML=(ok?'✔ ':'✖ ')+items[i].w;$('#'+id+'s').innerHTML=`Score: \u003cb>${sc}/${items.length}\u003c/b>`}}\n\n/* ===== Wi-Fi ===== */\nconst WP=[[\"Open\",0,\"No encryption. Anyone nearby can read your traffic.\"],[\"WEP\",8,\"Broken for years. Never use.\"],[\"WPA (TKIP)\",25,\"Old and deprecated.\"],[\"WPA2-PSK (AES)\",65,\"Good with a long unique passphrase. Disable WPS.\"],[\"WPA3-Personal\",90,\"Uses SAE: much stronger against password guessing; best choice for home.\"],[\"WPA2/3-Enterprise\",96,\"802.1X login per user with certificates. Best for organizations.\"]];\n$('#wchips').innerHTML=WP.map((w,i)=>`\u003cbutton class=\"btn alt\" data-i=\"${i}\">${w[0]}\u003c/button>`).join('');\n$$('#wchips button').forEach(b=>b.onclick=()=>{$$('#wchips button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const w=WP[+b.dataset.i];$('#wbar').style.width=Math.max(w[1],3)+'%';$('#wtxt').innerHTML=`\u003cb>${w[0]}\u003c/b>: ${w[2]}`});\nfunction rtc(){const a=$$('.rt'),n=a.filter(x=>x.checked).length;$('#rbar').style.width=n/a.length*100+'%';$('#rtxt').textContent=n===a.length?'🏆 Router hardened!':n+' of '+a.length+' done'}\n$$('.rt').forEach(x=>x.onchange=rtc);rtc();\n\n/* ===== evil twin ===== */\nlet def=false;\nfunction toggleDef(){def=!def;$('#defbtn').textContent=def?'🛡️ Defences ON (click to turn off)':'🛡️ Turn defences ON';$('#montxt').textContent=def?'WIPS: ALERT!':'WIPS: off';$('#ap2').style.opacity=def?.35:1;$('#ap2').style.filter=def?'grayscale(1)':'none';$('#ap1').style.filter=def?'drop-shadow(0 0 10px var(--good))':'none';$('#twintxt').innerHTML=def?'✅ The phone checks the network certificate (WPA3/802.1X) and WIPS flags the unknown AP using the same name. The fake AP is blocked/ignored.':'Both networks have the same name. A phone may pick the stronger signal, which could be the fake one.'}\n\n/* ===== shared responsibility ===== */\nconst LAY=[\"Data & content\",\"Identity & access (IAM)\",\"Application\",\"Operating system\",\"Network controls\",\"Virtualization / hardware / data center\"];\nconst MY={IaaS:[1,1,1,1,1,0],PaaS:[1,1,1,0,0,0],SaaS:[1,1,0,0,0,0]};\nfunction srm(k,b){if(b){$$('.card .btn.alt').forEach(x=>{if(x.parentElement===b.parentElement)x.classList.remove('sel')});b.classList.add('sel')}$('#srm').innerHTML=LAY.map((l,i)=>`\u003cdiv class=\"layer ${MY[k][i]?'me':'prov'}\">\u003cspan>${l}\u003c/span>\u003cspan>${MY[k][i]?'YOU':'Provider'}\u003c/span>\u003c/div>`).join('')}\nsrm('IaaS');\n\n/* ===== cloud quiz ===== */\nmkQuiz('q_cloud',[\n {t:'storage_bucket \"reports\": access = public-read, listing = enabled',a:0,w:'Public storage can leak data. Make it private.'},\n {t:'iam_policy \"dev-user\": actions = \"*\", resources = \"*\"',a:0,w:'Wildcard admin rights break least privilege.'},\n {t:'security_group \"web\": inbound 22/tcp from 0.0.0.0/0',a:0,w:'SSH open to the whole internet. Restrict to admin IPs.'},\n {t:'root_account: MFA = disabled',a:0,w:'Root/admin must have MFA.'},\n {t:'audit_logging: disabled',a:0,w:'Without logs you cannot investigate incidents.'},
