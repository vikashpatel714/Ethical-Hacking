n-right:8px}\n.dot.up{background:var(--good);box-shadow:0 0 10px var(--good)}\n.tog{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font:600 12px var(--f-mono)}\n\n/* apt / env */\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.stepbox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--code);font:600 13px var(--f-mono);transition:.3s}\n.stepbox.on{border-color:var(--accent2);background:var(--accent);color:var(--on-accent)}\n.arrow{color:var(--accent2)}\n\n/* compare */\n.vs{display:grid;gap:10px}\n.vsrow{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:center;font-size:14px}\n.vsrow>div{min-width:0}\n.vsh{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.vsbar{height:22px;border-radius:6px;background:var(--code);overflow:hidden;position:relative;border:1px solid var(--line)}\n.vsbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width 1s}\n.vsbar.k i{background:var(--accent2)}\n.vsbar span{position:relative;font:600 11px var(--f-mono);padding-left:8px;line-height:20px;color:var(--fg)}\n\n/* terminal */\n.term{background:var(--code);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}\n.term-top{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}\n.term-top i{width:10px;height:10px;border-radius:50%;display:block}\n.term-top span{margin-left:8px;font:12px var(--f-mono);color:var(--muted)}\n#out{height:300px;overflow:auto;padding:12px;font:13px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}\n#out .p{color:var(--accent2)}#out .c{color:var(--fg);font-weight:600}\n.inputline{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}\n.inputline span{font:13px var(--f-mono);color:var(--accent2);white-space:nowrap}\n.inputline input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:14px var(--f-mono);outline:none}\n.steps{display:grid;gap:6px;max-height:340px;overflow:auto}\n.stp{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--code);font:13px var(--f-mono);text-align:left;width:100%}\n.stp.done{opacity:.55}.stp.cur{border-color:var(--accent2);box-shadow:0 0 12px -4px var(--accent2)}\n.stp b{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;flex:none}\n.explain{margin-top:10px;font-size:14px;color:var(--muted);min-height:44px}\n\n/* cheat + footer */\n.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}\n.cheat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--code);font-size:14px;min-width:0}\n.cheat code{color:var(--accent2);font-weight:600;display:block;margin-bottom:2px}\n.check{display:grid;gap:8px}\n.check label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--code);cursor:pointer}\n.check input{accent-color:var(--accent);margin-top:4px}\n.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:12px}\n.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .4s}\nfooter{padding-block:30px 60px;color:var(--muted);font-size:14px;text-align:center}\n\n@media (max-width:760px){\n  .hero,.grid2,.grid3,.permrow,.matrix{grid-template-columns:1fr}\n  .hero{padding-block:36px 10px}\n  .vsrow{grid-template-columns:1fr}\n  .bar b{display:none}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\u003c/style>\n\u003cstyle>\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}\n.tab[aria-selected=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.pbar{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px;min-height:76px}\n.seg{border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--code);font:600 13px var(--f-mono);text-align:center;transition:all .5s;opacity:0;transform:scale(.6);flex:none;cursor:pointer;color:var(--fg)}\n.seg.in{opacity:1;transform:none}\n.seg.sel{box-shadow:0 0 0 2px var(--accent2),0 0 18px -4px var(--accent2)}\n.seg small{display:block;font:500 11px var(--f-body);color:var(--muted)}\n.seg[data-k=eth]{border-color:var(--accent)}.seg[data-k=ip]{border-color:var(--accent2)}.seg[data-k=tcp]{border-color:var(--good)}.seg[data-k=pay]{border-color:var(--warn)}\n.fields{display:grid;gap:6px;font:13px var(--f-mono)}\n.fields div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:4px;flex-wrap:wrap}\n.fields span:first-child{color:var(--muted)}\n.hosts{display:grid;grid-template-columns:1fr minmax(70px,1.1fr) 1fr;gap:10px;align-items:center}\n.host{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);min-width:0;font:13px var(--f-mono)}\n.host b{display:block;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}\n.host.src{border-color:var(--good)}.host.dst{border-color:var(--warn)}\n.wire{position:relative;height:34px;border-bottom:2px dashed var(--line)}\n.dot{position:absolute;top:6px;left:0;width:22px;height:22px;border-radius:50%;background:var(--accent2);transition:left 1.1s ease-in-out;box-shadow:0 0 14px var(--accent2)}\n.wire .lbl{position:absolute;inset:auto 0 -22px 0;text-align:center;font:600 12px var(--f-mono);color:var(--muted)}\n.ports{display:flex;flex-wrap:wrap;gap:8px}\n.ports span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:13px var(--f-mono);background:var(--code)}\n.ports b{color:var(--accent2)}\n.seq{width:100%;height:auto;display:block}\n.seq .arr{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s}\n.seq .arr.show{stroke-dashoffset:0}\n.seq .lab{opacity:0;transition:opacity .5s .5s}.seq .lab.show{opacity:1}\n.pk{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);min-width:0;opacity:.35;transition:.5s}\n.pk.on{opacity:1;border-color:var(--accent2)}\n.pk h4{margin:0 0 6px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}\n.cap{font:12.5px var(--f-mono);color:var(--fg);word-break:break-word}\n.fbar{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--code);transition:border-color .2s}\n.fbar.ok{border-color:var(--good)}.fbar.bad{border-color:var(--bad)}\n.fbar input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:14px var(--f-mono);outline:none}\n.fbar span{font:600 12px var(--f-mono);color:var(--muted);white-space:nowrap}\n.plist{width:100%;border-collapse:collapse;font:12.5px var(--f-mono)}\n.plist th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--code)}\n.plist td{padding:4px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}\n.plist tr{cursor:pointer;--pc:var(--line)}\n.plist tr td:first-child{border-left:5px solid var(--pc)}\n.plist tr:hover td{background:var(--panel)}\n.plist tr.sel td{background:var(--accent);color:var(--on-accent)}\n.plist td.info{white-space:normal;min-width:220px}\n.p-dns{--pc:#4aa3ff}.p-icmp{--pc:#ff6fae}.p-tcp{--pc:#a78bfa}.p-http{--pc:#3ddc97}.p-tls{--pc:#ffb454}.p-arp{--pc:#9aa0aa}\n.pwrap{max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--code)}\n.dtree details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--code)}\n.dtree summary{padding:6px 10px;cursor:pointer;font:600 13px var(--f-mono)}\n.dtree .fields{padding:6px 12px 10px}\n.hex{font:12px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-all;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}\n.cmpcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.cmpcols h3{font-size:16px;margin-bottom:8px;color:var(--accent)}\n.cmpcols code{display:block;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-top:6px;font-size:13px}\n.sniff{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-all;min-height:150px}\n.cred{background:var(--bad);color:var(--on-accent);border-radius:4px;padding:0 4px}\n.chips2{display:flex;flex-wrap:wrap;gap:6px}\n.vis,.hid{border-radius:999px;padding:3px 10px;font:600 12px var(--f-mono);border:1px solid}\n.vis{border-color:var(--warn);color:var(--warn)}.hid{border-color:var(--good);color:var(--good)}\n.tl{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}\n.tl .arrow{align-self:center;font-size:22px}\n.tlc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);min-width:0;font-size:14px}\n.tlc h4{margin:0 0 6px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}\n.tlc textarea{width:100%;min-height:90px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px var(--f-body);resize:vertical}\n.sheet{width:100%;border-collapse:collapse;font:12px var(--f-mono)}\n.sheet th{text-align:left;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}\n.sheet td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}\n.sheet input{width:100%;min-width:170px;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 6px;font:12px var(--f-mono)}\n.cmd{display:block;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:13px var(--f-mono);margin-top:6px;overflow-x:auto;white-space:nowrap}\n.pstep{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--code);min-width:0}\n.pstep h4{margin:0 0 6px;font:700 13px var(--f-mono);color:var(--accent2);letter-spacing:.06em;text-transform:uppercase}\n.pstep ol{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}\n@media (max-width:760px){.cmpcols{grid-template-columns:1fr}.tl{grid-template-columns:1fr}.tl .arrow{transform:rotate(90deg);justify-self:center}.hosts{grid-template-columns:1fr}}\n\u003c/style>\n\u003ccanvas id=\"bg\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"bar\" role=\"toolbar\" aria-label=\"Choose theme\">\n  \u003cb>Theme\u003c/b>\n  \u003cdiv class=\"skins\" id=\"skins\">\n    \u003cbutton class=\"skin\" data-skin=\"galaxy\" aria-pressed=\"true\">\u003ci style=\"background:linear-gradient(135deg,#9d7bff,#4fc3ff)\">\u003c/i>Galaxy\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"blackhole\" aria-pressed=\"false\">\u003ci style=\"background:radial-gradient(#000 35%,#ff9a3c)\">\u003c/i>Black Hole\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"supernova\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff3b1f,#ffd23f)\">\u003c/i>Supernova\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"aurora\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#3df5b0,#1a8f9c)\">\u003c/i>Aurora\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"cyber\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff2fb3,#19f0ff)\">\u003c/i>Cyberpunk\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"ocean\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#26c6ff,#0a3a7a)\">\u003c/i>Deep Ocean\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"sunset\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff9448,#ff6fae,#6a2c8a)\">\u003c/i>Sunset Retro\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"paper\" aria-pressed=\"false\">\u003ci style=\"background:#fff;border:1px solid #bbb\">\u003c/i>Light Paper\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cheader class=\"hero\">\n  \u003cdiv>\n    \u003cdiv class=\"eyebrow\">Day 7 · Network traffic, step by step\u003c/div>\n    \u003ch1>Wireshark &amp; \u003cspan>Network Traffic Analysis\u003c/span>\u003c/h1>\n    \u003cp>See what travels on a network. Build a packet, watch a handshake, filter a live capture and compare readable HTTP with encrypted TLS. Everything here is a simulation of your own lab.\u003c/p>\n    \u003cdiv class=\"chips\">\n      \u003ca class=\"chip\" href=\"#s1\">1 · Packet anatomy\u003c/a>\u003ca class=\"chip\" href=\"#s2\">2 · IPs &amp; ports\u003c/a>\n      \u003ca class=\"chip\" href=\"#s3\">3 · TCP handshake\u003c/a>\u003ca class=\"chip\" href=\"#s4\">4 · DNS, ICMP, HTTP\u003c/a>\n      \u003ca class=\"chip\" href=\"#s5\">5 · Filters\u003c/a>\u003ca class=\"chip\" href=\"#s6\">6 · Cleartext vs TLS\u003c/a>\n      \u003ca class=\"chip\" href=\"#s7\">7 · Timeline &amp; sheet\u003c/a>\u003ca class=\"chip\" href=\"#s8\">8 · Lab steps\u003c/a>\n      \u003ca class=\"chip\" href=\"#s9\">9 · Revision\u003c/a>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv>\n    \u003csvg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Two computers exchanging packets while a magnifier inspects them\" style=\"width:100%;height:auto\">\n      \u003crect x=\"20\" y=\"90\" width=\"70\" height=\"52\" rx=\"8\" fill=\"var(--code)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\u003ctext x=\"55\" y=\"122\" text-anchor=\"middle\" font-size=\"13\" font-family=\"JetBrains Mono,monospace\">client\u003c/text>\n      \u003crect x=\"270\" y=\"90\" width=\"70\" height=\"52\" rx=\"8\" fill=\"var(--code)\" stroke=\"var(--accent2)\" stroke-width=\"2\"/>\u003ctext x=\"305\" y=\"122\" text-anchor=\"middle\" font-size=\"13\" font-family=\"JetBrains Mono,monospace\">server\u003c/text>\n      \u003cpath id=\"wirep\" d=\"M90 116H270\" stroke=\"var(--line)\" stroke-width=\"3\" stroke-dasharray=\"5 6\"/>\n      \u003cg>\u003crect width=\"16\" height=\"11\" rx=\"2\" x=\"-8\" y=\"-5\" fill=\"var(--accent2)\">\u003canimateMotion dur=\"2.6s\" repeatCount=\"indefinite\" path=\"M90,116 L270,116\"/>\u003c/rect>\n         \u003crect width=\"16\" height=\"11\" rx=\"2\" x=\"-8\" y=\"-5\" fill=\"var(--good)\">\u003canimateMotion dur=\"2.6s\" begin=\"1.3s\" repeatCount=\"indefinite\" path=\"M270,125 L90,125\"/>\u003c/rect>\u003c/g>\n      \u003ccircle cx=\"180\" cy=\"116\" r=\"38\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"4\"/>\u003cpath d=\"M207 143L232 170\" stroke=\"var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      \u003ctext x=\"180\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--muted)\">Wireshark watches the wire\u003c/text>\n      \u003ctext x=\"180\" y=\"210\" text-anchor=\"middle\" font-size=\"12\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--muted)\">only on networks you are allowed to monitor\u003c/text>\n    \u003c/svg>\n  \u003c/div>\n\u003c/header>\n\n\u003c!-- 1 -->\n\u003csection id=\"s1\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 1\u003c/span>\u003ch2>Packet, frame, header, payload\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Data is wrapped like a letter inside envelopes. Press the button to wrap it, then click each part.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"wrap\">Wrap the data ▶\u003c/button>\u003cbutton class=\"btn ghost\" id=\"unwrap\">Reset\u003c/button>\u003c/div>\n      \u003cdiv class=\"pbar\" id=\"pbar\">\n        \u003cbutton class=\"seg\" data-k=\"eth\">Ethernet\u003csmall>header\u003c/small>\u003c/button>\n        \u003cbutton class=\"seg\" data-k=\"ip\">IP\u003csmall>header\u003c/small>\u003c/button>\n        \u003cbutton class=\"seg\" data-k=\"tcp\">TCP\u003csmall>header\u003c/small>\u003c/button>\n        \u003cbutton class=\"seg\" data-k=\"pay\">Payload\u003csmall>your data\u003c/small>\u003c/button>\n        \u003cbutton class=\"seg\" data-k=\"fcs\">FCS\u003csmall>trailer\u003c/small>\u003c/button>\n      \u003c/div>\n      \u003cp style=\"font-size:14px;color:var(--muted)\">\u003cb style=\"color:var(--fg)\">Frame\u003c/b> = the whole thing on the wire. \u003cb style=\"color:var(--fg)\">Packet\u003c/b> = from the IP header onward. \u003cb style=\"color:var(--fg)\">Header\u003c/b> = addressing info. \u003cb style=\"color:var(--fg)\">Payload\u003c/b> = the actual data.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003ch3 id=\"segT\" style=\"font-size:17px;color:var(--accent);margin-bottom:8px\">Click a part\u003c/h3>\u003cdiv class=\"fields\" id=\"segF\">\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection id=\"s2\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 2\u003c/span>\u003ch2>Source and destination: IP and port\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">The IP finds the computer. The port finds the program on it. In the reply, source and destination swap.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"row\" style=\"margin-bottom:14px\">\u003cbutton class=\"btn\" id=\"goReq\">Send request →\u003c/button>\u003cbutton class=\"btn ghost\" id=\"goRep\">← Server replies\u003c/button>\u003c/div>\n    \u003cdiv class=\"hosts\">\n      \u003cdiv class=\"host\" id=\"hA\">\u003cb id=\"hAt\">Source\u003c/b>\u003cdiv id=\"hAv\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"wire\">\u003cdiv class=\"dot\" id=\"wdot\">\u003c/div>\u003cdiv class=\"lbl\" id=\"wlbl\">press a button\u003c/div>\u003c/div>\n      \u003cdiv class=\"host\" id=\"hB\">\u003cb id=\"hBt\">Destination\u003c/b>\u003cdiv id=\"hBv\">\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ports\" style=\"margin-top:36px\">\u003cspan>\u003cb>53\u003c/b> DNS\u003c/span>\u003cspan>\u003cb>80\u003c/b> HTTP\u003c/span>\u003cspan>\u003cb>443\u003c/b> HTTPS\u003c/span>\u003cspan>\u003cb>22\u003c/b> SSH\u003c/span>\u003cspan>\u003cb>51514\u003c/b> random client port\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection id=\"s3\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 3\u003c/span>\u003ch2>The TCP handshake\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Before any data moves, the two sides agree in three steps. Then data flows, then they say goodbye.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003cbutton class=\"btn\" id=\"hsNext\">Next step ▶\u003c/button>\u003cbutton class=\"btn ghost\" id=\"hsAuto\">Auto play\u003c/button>\u003cbutton class=\"btn ghost\" id=\"hsReset\">Reset\u003c/button>\u003c/div>\n    \u003cdiv class=\"scroll\">\u003csvg class=\"seq\" id=\"seq\" viewBox=\"0 0 600 330\" style=\"min-width:520px\" role=\"img\" aria-label=\"TCP handshake sequence diagram\">\u003c/svg>\u003c/div>\n    \u003cdiv class=\"pkt\" id=\"hsInfo\" style=\"margin-top:10px\" aria-live=\"polite\">Press Next step.\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection id=\"s4\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 4 · Practical 3\u003c/span>\u003ch2>DNS, ICMP and HTTP\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"tabs\" role=\"tablist\" id=\"ptabs\">\n      \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"true\" data-t=\"dns\">DNS lookup\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-t=\"icmp\">Ping (ICMP)\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-t=\"http\">HTTP request\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"pk\" id=\"pkq\">\u003ch4>Request\u003c/h4>\u003cdiv class=\"cap\" id=\"pkqT\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"pk\" id=\"pkr\">\u003ch4>Response\u003c/h4>\u003cdiv class=\"cap\" id=\"pkrT\">\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" id=\"ppPlay\">Play ▶\u003c/button>\u003cspan class=\"chip\" id=\"ppFilter\">\u003c/span>\u003cspan style=\"font-size:14px;color:var(--muted)\" id=\"ppWhy\">\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection id=\"s5\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 5 · Practical 2\u003c/span>\u003ch2>Display filters on a sample capture\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">This is a small pretend capture. Type a filter or press a preset. Click a row to open it.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"row\" style=\"margin-bottom:10px\" id=\"presets\">\n      \u003cbutton class=\"btn ghost\" data-f=\"dns\">dns\u003c/button>\u003cbutton class=\"btn ghost\" data-f=\"icmp\">icmp\u003c/button>\u003cbutton class=\"btn ghost\" data-f=\"tcp\">tcp\u003c/button>\u003cbutton class=\"btn ghost\" data-f=\"http\">http\u003c/button>\u003cbutton class=\"btn ghost\" data-f=\"tcp.port == 443\">tcp.port == 443\u003c/button>\u003cbutton class=\"btn ghost\" data-f=\"\">clear\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"fbar\" id=\"fbar\">\u003cspan>Filter\u003c/span>\u003cinput id=\"fin\" aria-label=\"Display filter\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"try: ip.addr == 192.168.56.20 && tcp\">\u003cspan id=\"fcount\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"pwrap\" style=\"margin-top:10px\">\u003ctable class=\"plist\">\u003cthead>\u003ctr>\u003cth>No.\u003c/th>\u003cth>Time\u003c/th>\u003cth>Source\u003c/th>\u003cth>Destination\u003c/th>\u003cth>Proto\u003c/th>\u003cth>Len\u003c/th>\u003cth>Info\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"pl\">\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"grid2\" style=\"margin-top:14px\">\n      \u003cdiv class=\"dtree\" id=\"dtree\">\u003cdiv class=\"pkt\">Click a packet row to see its layers.\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"vsh\" style=\"margin-bottom:6px\">Bytes of the selected packet\u003c/div>\u003cdiv class=\"hex\" id=\"hex\">-\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003cdiv class=\"cmpcols\">\n      \u003cdiv>\u003ch3>Capture filter\u003c/h3>\u003cp style=\"font-size:14px;color:var(--muted)\">Set \u003cb style=\"color:var(--fg)\">before\u003c/b> you start. Packets that do not match are never saved. Uses BPF syntax.\u003c/p>\u003ccode>port 53\u003c/code>\u003ccode>host 192.168.56.20\u003c/code>\u003ccode>tcp port 80\u003c/code>\u003ccode>icmp\u003c/code>\u003c/div>\n      \u003cdiv>\u003ch3>Display filter\u003c/h3>\u003cp style=\"font-size:14px;color:var(--muted)\">Applied \u003cb style=\"color:var(--fg)\">after\u003c/b> capture. Nothing is lost, you only hide rows. Uses Wireshark syntax.\u003c/p>\u003ccode>dns\u003c/code>\u003ccode>ip.addr == 192.168.56.20\u003c/code>\u003ccode>tcp.port == 80\u003c/code>\u003ccode>icmp\u003c/code>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection id=\"s6\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 6\u003c/span>\u003ch2>Cleartext traffic vs TLS\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Same login, two ways. The data below is made-up lab data.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"tabs\" id=\"ctabs\">\u003cbutton class=\"tab\" aria-selected=\"true\" data-m=\"http\">HTTP (port 80)\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-m=\"tls\">HTTPS (port 443)\u003c/button>\u003c/div>\n      \u003cdiv class=\"sniff\" id=\"sniff\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:8px\">What an observer sees\u003c/h3>\n      \u003cdiv class=\"vsh\">Visible\u003c/div>\u003cdiv class=\"chips2\" id=\"visC\" style=\"margin-bottom:10px\">\u003c/div>\n      \u003cdiv class=\"vsh\">Hidden\u003c/div>\u003cdiv class=\"chips2\" id=\"hidC\">\u003c/div>\n      \u003cp class=\"note\" style=\"margin-top:14px\">Cleartext can be read or changed by anyone on the path. TLS protects the content, not the fact that you connected. Monitor only networks you own or are authorized to test.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection id=\"s7\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 7 · Practical 4\u003c/span>\u003ch2>Packet timeline and analysis sheet\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"tabs\" id=\"stabs\">\u003cbutton class=\"tab\" aria-selected=\"true\" data-s=\"dns\">DNS lookup\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-s=\"ping\">Ping x4\u003c/button>\u003c/div>\n    \u003cdiv class=\"tl\" id=\"tl\">\u003c/div>\n    \u003ch3 style=\"font-size:16px;margin:18px 0 8px;color:var(--accent)\">Analysis sheet (edit the Observation column)\u003c/h3>\n    \u003cdiv class=\"scroll\">\u003ctable class=\"sheet\">\u003cthead>\u003ctr>\u003cth>No.\u003c/th>\u003cth>Time\u003c/th>\u003cth>Source\u003c/th>\u003cth>Destination\u003c/th>\u003cth>Proto\u003c/th>\u003cth>Info\u003c/th>\u003cth>Observation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"sheet\">\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" id=\"copySheet\">Copy sheet as text\u003c/button>\u003cspan id=\"copyMsg\" style=\"font-size:14px;color:var(--good)\">\u003c/span>\u003c/div>\n    \u003ctextarea id=\"copyArea\" aria-label=\"Sheet text\" style=\"display:none;width:100%;min-height:120px;margin-top:10px;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px var(--f-mono)\">\u003c/textarea>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection id=\"s8\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 8 · Practical 1-4\u003c/span>\u003ch2>Lab steps in Wireshark\u003c/h2>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-bottom:14px\">Capture only on loopback or an interface in a lab you are authorized to monitor.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 1 · Capture\u003c/h4>\u003col>\u003cli>Open Wireshark. Pick \u003cb>lo\u003c/b> (loopback) or your lab interface.\u003c/li>\u003cli>Optional: type a capture filter, then double-click the interface.\u003c/li>\u003cli>Generate traffic (steps below), then press the red stop square.\u003c/li>\u003cli>File → Save As → \u003ccode>.pcapng\u003c/code>.\u003c/li>\u003c/ol>\u003c/div>\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 2 · Filters\u003c/h4>\u003col>\u003cli>Type each filter in the green bar and press Enter.\u003c/li>\u003cli>Try: \u003ccode>dns\u003c/code>, \u003ccode>icmp\u003c/code>, \u003ccode>tcp\u003c/code>, \u003ccode>http\u003c/code>, \u003ccode>tcp.port == 443\u003c/code>.\u003c/li>\u003cli>Screenshot each result with the filter visible.\u003c/li>\u003c/ol>\u003c/div>\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 3 · DNS and ping\u003c/h4>\u003col>\u003cli>In a terminal run the commands below.\u003c/li>\u003cli>Filter \u003ccode>dns\u003c/code> and find the query and the response.\u003c/li>\u003cli>Filter \u003ccode>icmp\u003c/code> and find echo request and reply pairs.\u003c/li>\u003c/ol>\u003ccode class=\"cmd\">nslookup portal.lab.test\u003c/code>\u003ccode class=\"cmd\">ping -c 4 127.0.0.1\u003c/code>\u003cspan style=\"font-size:12px;color:var(--muted)\">Windows uses \u003ccode>ping -n 4\u003c/code>. Use your own lab hostname.\u003c/span>\u003c/div>\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 4 · Annotate\u003c/h4>\u003col>\u003cli>Right-click a packet → Packet Comment → write what it shows.\u003c/li>\u003cli>Order them: request → response → conclusion.\u003c/li>\u003cli>Save the annotated \u003ccode>.pcapng\u003c/code> and fill the sheet in Station 7.\u003c/li>\u003c/ol>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection id=\"s9\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 9\u003c/span>\u003ch2>Quick revision\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:16px\">\u003cdiv class=\"cheat\" id=\"cheat\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Lab checklist\u003c/h3>\u003cdiv class=\"prog\">\u003ci id=\"prog\">\u003c/i>\u003c/div>\u003cdiv class=\"check\" id=\"check\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Expected output\u003c/h3>\n      \u003cdiv class=\"check\" style=\"gap:6px\">\u003cdiv class=\"stepbox\">Annotated \u003ccode>.pcapng\u003c/code> file\u003c/div>\u003cdiv class=\"stepbox\">Screenshots of each filter\u003c/div>\u003cdiv class=\"stepbox\">Packet analysis sheet\u003c/div>\u003cdiv class=\"stepbox\">Timeline: request → response → conclusion\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter>Day 7 · Wireshark and Network Traffic Analysis · Capture only where you are authorized.\u003c/footer>\n\u003c/div>\n\u003cscript>\n/* ===== Animated backgrounds + theme switcher ===== */\n(function(){\n  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');\n  var W=0,H=0,dpr=1,skin='galaxy';\n  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var stars=[],disk=[],bubbles=[],glows=[],parts=[],rings=[],burstT=0,sprites={};\n  var R=Math.random;\n\n  function resize(){\n    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;\n    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init();\n    if(rm)staticDraw();\n  }\n  function newBubble(first){return{x:R()*W,y:first?R()*H:H+30,r:2+Math.pow(R(),2)*14,sp:.02+R()*.05,ph:R()*6.28}}\n  function init(){\n    stars=[];var n=Math.round(W*H/9000);\n    for(var i=0;i\u003cn;i++)stars.push({x:R()*W,y:R()*H,r:R()*1.3+.3,p:R()*6.28,s:R()*2+.5});\n    disk=[];for(i=0;i\u003c700;i++)disk.push({a:R()*6.28,r:Math.pow(R(),.75),sz:R()*1.6+.5});\n    bubbles=[];for(i=0;i\u003c45;i++)bubbles.push(newBubble(true));\n    glows=[];for(i=0;i\u003c22;i++)glows.push({x:R()*W,y:R()*H,r:10+R()*30,ph:R()*6.28,vx:(R()-.5)*.01,vy:(R()-.5)*.01,c:R()\u003c.5?'60,230,255':'90,255,200'});\n    parts=[];rings=[];burstT=0;\n  }\n  function drawStars(t,rgb,mul){\n    for(var i=0;i\u003cstars.length;i++){var s=stars[i];\n      var a=(.25+.75*(.5+.5*Math.sin(t*.002*s.s+s.p)))*(mul||1);\n      ctx.fillStyle='rgba('+rgb+','+a.toFixed(3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}\n  }\n  function sprite(rgb){\n    if(sprites[rgb])return sprites[rgb];\n    var c=document.createElement('canvas');c.width=1;c.height=256;var g=c.getContext('2d');\n    var gr=g.createLinearGradient(0,0,0,256);\n    gr.addColorStop(0,'rgba('+rgb+',0)');gr.addColorStop(.12,'rgba('+rgb+',.95)');gr.addColorStop(.5,'rgba('+rgb+',.32)');gr.addColorStop(1,'rgba('+rgb+',0)');\n    g.fillStyle=gr;g.fillRect(0,0,1,256);return(sprites[rgb]=c);\n  }\n\n  function galaxy(t){\n    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b0820');g.addColorStop(.5,'#1a1040');g.addColorStop(1,'#07142e');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    var b=[[.2,.25,'157,123,255'],[.8,.35,'79,195,255'],[.5,.8,'255,100,200'],[.9,.9,'120,90,255']];\n    for(var i=0;i\u003cb.length;i++){\n      var x=W*(b[i][0]+Math.sin(t*.00008*(i+1)+i)*.06),y=H*(b[i][1]+Math.cos(t*.00007*(i+2))*.06),r=Math.max(W,H)*.45;\n      var rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba('+b[i][2]+',.26)');rg.addColorStop(1,'rgba('+b[i][2]+',0)');\n      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    }\n    drawStars(t,'255,255,255');\n    var k=(t%7000)/7000;\n    if(k\u003c.12){var p=k/.12;var x0=W*.15+W*.6*p,y0=H*.05+H*.25*p;\n      var sg=ctx.createLinearGradient(x0,y0,x0-90,y0-45);sg.addColorStop(0,'rgba(255,255,255,'+(1-p)+')');sg.addColorStop(1,'rgba(255,255,255,0)');\n      ctx.strokeStyle=sg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0-90,y0-45);ctx.stroke();}\n  }\n\n  function blackhole(t){\n    ctx.fillStyle='#050404';ctx.fillRect(0,0,W,H);drawStars(t,'255,235,210',.8);\n    var cx=W*.5,cy=H*.46,Rh=Math.min(W,H)*.11;\n    var rg=ctx.createRadialGradient(cx,cy,Rh*.8,cx,cy,Rh*5);rg.addColorStop(0,'rgba(255,170,80,.42)');rg.addColorStop(.4,'rgba(255,110,30,.14)');rg.addColorStop(1,'rgba(255,100,20,0)');\n    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    ctx.save();ctx.translate(cx,cy);ctx.rotate(-.35);\n    function pass(front){\n      for(var i=0;i\u003cdisk.length;i++){var d=disk[i];var rr=Rh*1.35+d.r*Rh*3.4;\n        var a=d.a+t*.0036*Math.pow(Rh*1.35/rr,1.5);var s=Math.sin(a);if((s>0)!==front)continue;\n        var heat=1-d.r;var col=heat>.7?'255,245,225':(heat>.35?'255,190,110':'255,120,40');\n        ctx.fillStyle='rgba('+col+','+(.3+heat*.65).toFixed(2)+')';var z=d.sz*(1+heat);\n        ctx.fillRect(Math.cos(a)*rr,s*rr*.26,z,z*.9);}\n    }\n    pass(false);\n    ctx.strokeStyle='rgba(255,190,110,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,Rh*1.7,Rh*1.45,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();\n    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,Rh,0,6.283);ctx.fill();\n    ctx.strokeStyle='rgba(255,220,170,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,Rh*1.02,0,6.283);ctx.stroke();\n    pass(true);ctx.restore();\n  }\n\n  function burst(x,y){\n    for(var i=0;i\u003c170;i++){var a=R()*6.283,sp=Math.sqrt(R())*6;\n      var life=2400+R()*2200;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,max:life,r:1+R()*2.6});}\n    rings.push({x:x,y:y,age:0});\n    if(parts.length>1200)parts.splice(0,parts.length-1200);\n  }\n  function supernova(t,dt){\n    var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#3a0a05');g.addColorStop(1,'#110202');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    burstT-=dt;if(burstT\u003c=0){burstT=3800;burst(W*(.3+R()*.4),H*(.25+R()*.4));}\n    ctx.globalCompositeOperation='lighter';\n    var i,p;\n    for(i=rings.length-1;i>=0;i--){var r=rings[i];r.age+=dt;\n      if(r.age>2600){rings.splice(i,1);continue;}\n      var al=1-r.age/2600;ctx.strokeStyle='rgba(255,150,60,'+(al*.5).toFixed(3)+')';ctx.lineWidth=3+al*5;\n      ctx.beginPath();ctx.arc(r.x,r.y,r.age*.22,0,6.283);ctx.stroke();\n      var fl=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,90);fl.addColorStop(0,'rgba(255,240,200,'+(Math.max(0,1-r.age/500)).toFixed(3)+')');fl.addColorStop(1,'rgba(255,120,30,0)');\n      ctx.fillStyle=fl;ctx.fillRect(r.x-90,r.y-90,180,180);}\n    for(i=parts.length-1;i>=0;i--){p=parts[i];p.life-=dt;\n      if(p.life\u003c=0){parts.splice(i,1);continue;}\n      p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.vx*=.993;p.vy*=.993;p.vy+=.0004*dt;\n      var a=p.life/p.max;ctx.fillStyle='hsla('+(8+a*52)+',100%,'+(45+a*35)+'%,'+a.toFixed(3)+')';\n      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.5+a),0,6.283);ctx.fill();}\n    ctx.globalCompositeOperation='source-over';\n  }\n\n  function aurora(t){\n    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02121a');g.addColorStop(1,'#04242b');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t,'220,255,245',.6);\n    var bands=[{c:'61,245,176',y:.26,h:.34,s:1},{c:'90,212,255',y:.34,h:.28,s:1.3},{c:'150,120,255',y:.2,h:.24,s:.8}];\n    ctx.globalCompositeOperation='lighter';\n    for(var i=0;i\u003cbands.length;i++){var b=bands[i],sp=sprite(b.c);\n      for(var x=0;x\u003c=W;x+=7){var nx=x/W;\n        var wave=Math.sin(nx*5+t*.0004*b.s+i*2)*.06+Math.sin(nx*11-t*.0006*b.s)*.025;\n        var top=H*(b.y+wave),len=H*b.h*(.6+.4*Math.sin(nx*8+t*.0009*b.s+i));\n        ctx.globalAlpha=.3+.25*Math.sin(nx*14+t*.0012*b.s+i);\n        ctx.drawImage(sp,0,0,1,256,x,top,7,len);}\n    }\n    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n    ctx.fillStyle='#02090c';ctx.beginPath();ctx.moveTo(0,H);\n    for(x=0;x\u003c=W;x+=20)ctx.lineTo(x,H*.9-Math.abs(Math.sin(x*.004+1))*H*.07-Math.sin(x*.011)*H*.015);\n    ctx.lineTo(W,H);ctx.closePath();ctx.fill();\n  }\n\n  function cyber(t){\n    var hy=H*.55;\n    var g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#0a0614');g.addColorStop(1,'#34093f');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);\n    drawStars(t,'255,200,255',.5);\n    var Rs=Math.min(W,H)*.2,cx=W/2,cy=hy-Rs*.15;\n    var sg=ctx.createLinearGradient(0,cy-Rs,0,cy+Rs);sg.addColorStop(0,'#ffe14d');sg.addColorStop(.55,'#ff2fb3');sg.addColorStop(1,'#7a1fd6');\n    ctx.save();ctx.beginPath();ctx.arc(cx,cy,Rs,0,6.283);ctx.clip();ctx.fillStyle=sg;ctx.fillRect(cx-Rs,cy-Rs,Rs*2,Rs*2);\n    ctx.fillStyle='#34093f';for(var k=0;k\u003c7;k++){var yy=cy+Rs*(.05+k*.14)+((t*.01)%(Rs*.14))*0;ctx.fillRect(cx-Rs,yy,Rs*2,2+k*1.6);}\n    ctx.restore();\n    var fg=ctx.createLinearGradient(0,hy,0,H);fg.addColorStop(0,'#1a0630');fg.addColorStop(1,'#07030f');ctx.fillStyle=fg;ctx.fillRect(0,hy,W,H-hy);\n    ctx.lineWidth=1;\n    var i;\n    for(i=-24;i\u003c=24;i++){var x1=W/2+i*W*.12;\n      ctx.strokeStyle='rgba(255,47,179,.55)';ctx.beginPath();ctx.moveTo(W/2+i*6,hy);ctx.lineTo(x1,H);ctx.stroke();}\n    var off=(t*.0004)%1;\n    for(i=0;i\u003c14;i++){var p=(i+off)/14,y=hy+(H-hy)*p*p;\n      ctx.strokeStyle='rgba(25,240,255,'+(.2+.5*p).toFixed(2)+')';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}\n    ctx.strokeStyle='rgba(25,240,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,hy);ctx.lineTo(W,hy);ctx.stroke();\n  }\n\n  function ocean(t,dt){\n    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a4a7a');g.addColorStop(.45,'#04223f');g.addColorStop(1,'#010811');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    ctx.globalCompositeOperation='lighter';\n    for(var i=0;i\u003c5;i++){var x=W*(.1+i*.2)+Math.sin(t*.0003+i)*60,w=60+i*14;\n      var rg=ctx.createLinearGradient(0,0,0,H*.8);rg.addColorStop(0,'rgba(120,220,255,.12)');rg.addColorStop(1,'rgba(120,220,255,0)');\n      ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+w,0);ctx.lineTo(x+w*3+Math.sin(t*.0004+i)*40,H*.8);ctx.lineTo(x-w,H*.8);ctx.closePath();ctx.fill();}\n    for(i=0;i\u003cglows.length;i++){var o=glows[i];o.x+=o.vx*dt;o.y+=o.vy*dt;\n      if(o.x\u003c-50)o.x=W+50;if(o.x>W+50)o.x=-50;if(o.y\u003c-50)o.y=H+50;if(o.y>H+50)o.y=-50;\n      var pu=.5+.5*Math.sin(t*.0012+o.ph),gr=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*(1+pu));\n      gr.addColorStop(0,'rgba('+o.c+','+(.35+pu*.35).toFixed(2)+')');gr.addColorStop(1,'rgba('+o.c+',0)');\n      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(o.x,o.y,o.r*(1+pu),0,6.283);ctx.fill();}\n    ctx.globalCompositeOperation='source-over';\n    for(i=0;i\u003cbubbles.length;i++){var b=bubbles[i];b.y-=b.sp*dt;var bx=b.x+Math.sin(t*.001+b.ph)*10;\n      if(b.y\u003c-30)bubbles[i]=newBubble(false);\n      ctx.strokeStyle='rgba(170,235,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,6.283);ctx.stroke();\n      ctx.fillStyle='rgba(220,250,255,.35)';ctx.beginPath();ctx.arc(bx-b.r*.3,b.y-b.r*.3,b.r*.22,0,6.283);ctx.fill();}\n  }\n\n  function sunset(t){\n    var g=ctx.createLinearGradient(0,0,0,H);\n    g.addColorStop(0,'#2a0f3a');g.addColorStop(.4,'#7a1f5c');g.addColorStop(.6,'#ff6a3d');g.addColorStop(.74,'#ffb347');g.addColorStop(1,'#3a1058');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t,'255,230,240',.35);\n    var cx=W/2,cy=H*.
