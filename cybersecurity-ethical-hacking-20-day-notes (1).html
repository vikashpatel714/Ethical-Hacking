ter;opacity:0;z-index:3}\n/* matrix */\n.mx{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:360px;margin:auto}.mx div{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12px;font-weight:700;color:#111;cursor:pointer;transition:.2s}.mx div.sel{outline:4px solid var(--text);transform:scale(1.12)}\n/* timer */\n.seg{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}.seg div{display:grid;place-items:center;font-size:11px;color:#000;font-weight:700;transition:.3s;opacity:.5}.seg div.on{opacity:1;filter:brightness(1.2);box-shadow:inset 0 0 0 3px var(--text)}\n.sc{background:#fff;color:#1b1f2a;border-radius:12px;padding:16px;font-size:14px;border-top:6px solid var(--accent)}.sc h4{margin:0 0 6px}.sc dt{font-weight:700;color:#444;margin-top:6px}.sc dd{margin:0}\n.st{cursor:pointer;display:inline-block;padding:4px 14px;border-radius:14px;font-weight:800;font-size:13px;min-width:120px;text-align:center}\n\u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cdiv id=\"themebar\">\u003c/div>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"hero\">\n  \u003ch1>🏁 Cyber Notes: Day 19 &amp; Day 20\u003c/h1>\n  \u003cp>Day 19 = a full, safe \u003cb>security assessment project\u003c/b> from scope to retest. Day 20 = how to \u003cb>teach, grade and evaluate\u003c/b> it as faculty. Everything is interactive.\u003c/p>\n  \u003cdiv class=\"warnbox danger\" style=\"max-width:720px;margin:auto;text-align:left\">⚠️ \u003cb>Rule:\u003c/b> assess ONLY the isolated lab application and VM given to you, with written authorization. Never test any other system.\u003c/div>\n\u003c/div>\n\n\u003cnav>\n \u003ca href=\"#d19\">Day 19\u003c/a>\u003ca href=\"#wf\">Workflow\u003c/a>\u003ca href=\"#scope\">Scope\u003c/a>\u003ca href=\"#lab\">Lab map\u003c/a>\u003ca href=\"#disc\">Discovery\u003c/a>\u003ca href=\"#burp\">Burp\u003c/a>\u003ca href=\"#owasp\">OWASP\u003c/a>\u003ca href=\"#tc\">Test cases\u003c/a>\u003ca href=\"#risk\">Severity\u003c/a>\u003ca href=\"#fix\">Fix\u003c/a>\u003ca href=\"#retest\">Retest\u003c/a>\u003ca href=\"#pres\">5-min talk\u003c/a>\n \u003ca href=\"#d20\">Day 20\u003c/a>\u003ca href=\"#obj\">Objectives\u003c/a>\u003ca href=\"#grad\">Demo→Practice\u003c/a>\u003ca href=\"#safety\">Safety\u003c/a>\u003ca href=\"#rubric\">Rubric\u003c/a>\u003ca href=\"#rec\">Records\u003c/a>\u003ca href=\"#integ\">Integrity\u003c/a>\u003ca href=\"#micro\">Micro-teaching\u003c/a>\u003ca href=\"#peer\">Peer repro\u003c/a>\u003ca href=\"#viva\">Viva\u003c/a>\u003ca href=\"#port\">Portfolio\u003c/a>\n\u003c/nav>\n\n\u003c!-- ============ DAY 19 ============ -->\n\u003cdiv style=\"text-align:center\">\u003cspan class=\"daytag\" id=\"d19\">DAY 19\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Capstone: End-to-End Security Assessment\u003c/h2>\n\n\u003ch2 id=\"wf\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>The 10-Step Workflow (animated roadmap)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"flow\" id=\"wfflow\">\u003c/div>\u003cdiv class=\"explain\" id=\"wftxt\">Press ▶ Play or click any step.\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn\" onclick=\"playWf()\">▶ Play\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"clearInterval(wt)\">⏹ Stop\u003c/button>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"scope\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>Step 1: Scope &amp; Written Authorization (live builder)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"two\">\u003cdiv>\n \u003cp>Project name \u003cinput type=\"text\" id=\"s_n\" value=\"Capstone Assessment: Lab Web App\">\u003c/p>\n \u003cp>Target web app URL \u003cinput type=\"text\" id=\"s_u\" value=\"http://192.168.56.101/app\">\u003c/p>\n \u003cp>Lab VM IP \u003cinput type=\"text\" id=\"s_ip\" value=\"192.168.56.101\">\u003c/p>\n \u003cp>Test window \u003cinput type=\"text\" id=\"s_w\" value=\"12 Oct 2026, 10:00–13:00 IST\">\u003c/p>\n \u003cp>Allowed activities \u003ctextarea id=\"s_a\" rows=\"2\">Host/service discovery, web app inspection with Burp Suite, guided OWASP challenges, non-destructive validation\u003c/textarea>\u003c/p>\n \u003cp>Forbidden \u003ctextarea id=\"s_f\" rows=\"2\">Any other IP/host, denial of service, real user data, social engineering, leaving the lab network\u003c/textarea>\u003c/p>\n \u003c/div>\u003cdiv>\u003cdiv class=\"sc\" id=\"s_prev\">\u003c/div>\u003cdiv class=\"explain\" id=\"s_chk\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"lab\" class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>Step 2: Lab Architecture &amp; IP Documentation\u003c/h2>\n\u003cdiv class=\"card reveal\">\n \u003cdiv class=\"arch3\">\u003cdiv class=\"nb\">\u003cspan class=\"big\">🧑‍💻\u003c/span>\u003cb>Tester VM\u003c/b>\u003csmall>192.168.56.10\u003c/small>\u003c/div>\u003cdiv class=\"link\">\u003c/div>\u003cdiv class=\"nb vuln\">\u003cspan class=\"big\">🎯\u003c/span>\u003cb>Vulnerable app VM\u003c/b>\u003csmall>192.168.56.101\u003c/small>\u003c/div>\u003c/div>\n \u003cdiv style=\"text-align:center;margin-top:10px\">\u003cspan class=\"pill ok\">Host-only network 192.168.56.0/24\u003c/span> \u003cspan class=\"pill ok\" id=\"isopill\">No internet access ✔\u003c/span>\u003c/div>\n \u003cdiv style=\"text-align:center\">\u003clabel class=\"chk\" style=\"display:inline-flex\">\u003cinput type=\"checkbox\" id=\"neton\"> Simulate: someone enabled internet/NAT on the vulnerable VM\u003c/label>\u003c/div>\n \u003cdiv class=\"explain\" id=\"isotxt\">Isolated lab: safe.\u003c/div>\n \u003ctable>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Value to document\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Tester VM\u003c/td>\u003ctd>OS, tools (Burp, browser), IP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Target VM\u003c/td>\u003ctd>OS, web server, app URL, IP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Type (host-only), subnet, gateway, isolation proof\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Snapshot\u003c/td>\u003ctd>Name and time of clean state\u003c/td>\u003c/tr>\u003c/table>\n\u003c/div>\n\n\u003ch2 id=\"disc\" class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Step 3: Host &amp; Service Discovery (sample run)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Discovery answers: \u003cb>Which hosts are alive? Which ports/services/versions run?\u003c/b> Only on the in-scope lab IP. Output below is a \u003cb>sample\u003c/b>.\u003c/p>\n\u003cdiv class=\"term\" id=\"term\">Press \"Run sample discovery\"…\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn\" onclick=\"runTerm()\">▶ Run sample discovery\u003c/button>\u003c/div>\n\u003ctable style=\"margin-top:10px\">\u003ctr>\u003cth>Command idea\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nmap -sn 192.168.56.0/24\u003c/code>\u003c/td>\u003ctd>Which hosts are up (no port scan)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nmap -sV 192.168.56.101\u003c/code>\u003c/td>\u003ctd>Open ports + service versions\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003ch2 id=\"burp\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>Step 4: Inspect the Web App with Burp Suite\u003c/h2>\n\u003cdiv class=\"card reveal\">\n \u003cp class=\"sub\">Burp Suite is a \u003cb>proxy\u003c/b>: it sits between your browser and the app so you can see and study every request/response. Try the simulator.\u003c/p>\n \u003cdiv class=\"burp\">\u003cdiv class=\"bn\" style=\"left:2%\">\u003cspan>🌐\u003c/span>Browser\u003c/div>\u003cdiv class=\"bn\" style=\"left:calc(50% - 60px)\">\u003cspan>🔎\u003c/span>Burp Proxy\u003c/div>\u003cdiv class=\"bn\" style=\"right:2%\">\u003cspan>🎯\u003c/span>Lab web app\u003c/div>\u003cdiv class=\"pk\" id=\"bpk\">REQ\u003c/div>\u003c/div>\n \u003cdiv style=\"text-align:center\">\u003clabel class=\"chk\" style=\"display:inline-flex\">\u003cinput type=\"checkbox\" id=\"icpt\"> Intercept ON\u003c/label>\u003cbutton class=\"btn\" onclick=\"bSend()\">📤 Browser sends a request\u003c/button>\u003c/div>\n \u003cpre class=\"cb\" id=\"breq\" style=\"display:none\">GET /app/profile?id=7 HTTP/1.1\nHost: 192.168.56.101\nCookie: session=********\u003c/pre>\n \u003cdiv style=\"text-align:center;display:none\" id=\"bbtns\">\u003cbutton class=\"btn\" onclick=\"bFwd()\">➡ Forward\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"bDrop()\">🗑 Drop\u003c/button>\u003c/div>\n \u003cdiv class=\"explain\" id=\"btxt\">Turn Intercept ON to pause requests inside Burp.\u003c/div>\n \u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cb>🔭 Target / Site map\u003c/b>\u003cbr>All pages and parameters discovered.\u003c/div>\u003cdiv class=\"card\">\u003cb>📜 Proxy history\u003c/b>\u003cbr>Every request/response log (your evidence!).\u003c/div>\u003cdiv class=\"card\">\u003cb>🔁 Repeater\u003c/b>\u003cbr>Resend one request again and again to study behaviour.\u003c/div>\u003cdiv class=\"card\">\u003cb>🧩 Decoder / Comparer\u003c/b>\u003cbr>Decode values; compare two responses.\u003c/div>\u003c/div>\n \u003ch3>Setup steps\u003c/h3>\u003cdiv class=\"flow\" id=\"bsetup\">\u003c/div>\n \u003cdiv class=\"warnbox\">Automated Scanner/Intruder features: use only if the lab sheet and RoE allow them, and only on the lab target.\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"owasp\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>Step 5: OWASP-related Weaknesses (guided challenges)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Click a category (OWASP Top 10, 2021 list; newer editions exist, check owasp.org). Each shows what it is, how you \u003cb>safely look for it in the lab\u003c/b>, and the fix.\u003c/p>\u003cdiv id=\"oc\" style=\"text-align:center\">\u003c/div>\u003cdiv class=\"card\" id=\"oinfo\" style=\"margin-top:10px\">Pick a category 👆\u003c/div>\u003c/div>\n\n\u003ch2 id=\"tc\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>Step 6: Validate Each Finding with Evidence (test cases)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003ctable>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Objective\u003c/th>\u003cth>Steps\u003c/th>\u003cth>Expected\u003c/th>\u003cth>Actual\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>TC-01\u003c/td>\u003ctd>Check access control on profile page\u003c/td>\u003ctd>Log in as user A; request profile of user B in Burp Repeater\u003c/td>\u003ctd>Access denied\u003c/td>\u003ctd>B's profile shown\u003c/td>\u003ctd>\u003cspan class=\"pill no\">Fail → Finding\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>TC-02\u003c/td>\u003ctd>Check output encoding in search box\u003c/td>\u003ctd>Enter harmless test text with special characters; view page source\u003c/td>\u003ctd>Characters encoded\u003c/td>\u003ctd>Encoded\u003c/td>\u003ctd>\u003cspan class=\"pill ok\">Pass\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>TC-03\u003c/td>\u003ctd>Check error messages\u003c/td>\u003ctd>Request a missing page\u003c/td>\u003ctd>Generic error\u003c/td>\u003ctd>Stack trace shown\u003c/td>\u003ctd>\u003cspan class=\"pill no\">Fail → Finding\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"grid\" style=\"margin-top:12px\">\u003cdiv class=\"card\">\u003cb>📸 Evidence rules\u003c/b>\u003cbr>Timestamp, URL/IP, request + response, mask sensitive values, name files like \u003ccode>F01_request.png\u003c/code>.\u003c/div>\u003cdiv class=\"card\">\u003cb>🔁 Repeatable\u003c/b>\u003cbr>Another person must get the same result from your steps.\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"risk\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Step 7: Severity &amp; Business Impact (risk matrix)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Click a cell. Rows = \u003cb>Impact\u003c/b> (up = bigger), columns = \u003cb>Likelihood\u003c/b> (right = more likely). Score = Likelihood × Impact.\u003c/p>\n\u003cdiv class=\"mx\" id=\"mx\">\u003c/div>\u003cdiv class=\"explain\" id=\"mxtxt\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"fix\" class=\"reveal\">\u003cspan class=\"n\">9\u003c/span>Step 8: Fix or Recommend Mitigation\u003c/h2>\n\u003cdiv class=\"two reveal\">\n\u003cdiv class=\"card\">\u003ch3>Injection → parameterized queries\u003c/h3>\u003cpre class=\"cb\">// ❌ Risky pattern\nquery = \"SELECT * FROM users WHERE id = '\" + user_id + \"'\"\n\n// ✅ Safe pattern\ncur.execute(\"SELECT * FROM users WHERE id = %s\", (user_id,))\u003c/pre>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>XSS → encode output + CSP\u003c/h3>\u003cpre class=\"cb\">// ❌ Risky: inserting user text as HTML\nel.innerHTML = userText\n\n// ✅ Safe: insert as plain text\nel.textContent = userText\u003c/pre>\u003c/div>\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\u003ctable>\u003ctr>\u003cth>Finding type\u003c/th>\u003cth>Practical remediation\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Broken access control\u003c/td>\u003ctd>Check authorization on the \u003cb>server\u003c/b> for every request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weak authentication\u003c/td>\u003ctd>Strong password policy, lockout, MFA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Misconfiguration / verbose errors\u003c/td>\u003ctd>Remove defaults, generic errors, security headers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outdated components\u003c/td>\u003ctd>Patch/upgrade; keep an inventory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No logging\u003c/td>\u003ctd>Log logins and access failures; review alerts\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003ch2 id=\"retest\" class=\"reveal\">\u003cspan class=\"n\">10\u003c/span>Step 9: Retest Tracker\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Click a status badge to cycle \u003cb>Open → Fixed → Accepted Risk\u003c/b>. Retest before marking Fixed!\u003c/p>\u003cdiv id=\"rtrack\">\u003c/div>\n\u003cdiv class=\"bar\" style=\"margin-top:10px\">\u003ci id=\"rtbar\">\u003c/i>\u003c/div>\u003cdiv class=\"explain\" id=\"rttxt\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"pres\" class=\"reveal\">\u003cspan class=\"n\">11\u003c/span>Step 10: Final Report &amp; 5-Minute Presentation\u003c/h2>\n\u003cdiv class=\"card reveal\">\n \u003cdiv class=\"seg\" id=\"seg\">\u003c/div>\n \u003cdiv style=\"text-align:center\">\u003cdiv class=\"bigtxt\" id=\"clock\">0:00\u003c/div>\n \u003cbutton class=\"btn\" onclick=\"startClock()\">▶ Start talk timer\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"stopClock()\">⏹ Reset\u003c/button>\n \u003clabel style=\"margin-left:10px\">\u003cinput type=\"checkbox\" id=\"fast\" checked> demo speed ×10\u003c/label>\u003c/div>\n \u003cdiv class=\"explain\" id=\"clocktxt\">Practise the 5-minute story.\u003c/div>\n \u003ch3>Report outline\u003c/h3>\u003cdiv class=\"flow\" id=\"repflow\">\u003c/div>\n\u003c/div>\n\n\u003ch3 class=\"reveal\">📦 Deliverables &amp; Success Criteria\u003c/h3>\n\u003cdiv class=\"two reveal\">\u003cdiv class=\"card\" id=\"dlv\">\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Success criteria\u003c/h3>\u003cul>\u003cli>\u003cb>Repeatable:\u003c/b> steps reproduce the finding\u003c/li>\u003cli>\u003cb>Sufficient evidence:\u003c/b> screenshots/logs, masked\u003c/li>\u003cli>\u003cb>Practical remediation\u003c/b> for every finding\u003c/li>\u003c/ul>\u003cdiv class=\"bar\">\u003ci id=\"dbar\">\u003c/i>\u003c/div>\u003cdiv class=\"explain\" id=\"dtxt\">\u003c/div>\u003c/div>\u003c/div>\n\n\u003c!-- ============ DAY 20 ============ -->\n\u003cdiv style=\"text-align:center;margin-top:60px\">\u003cspan class=\"daytag\" id=\"d20\">DAY 20\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Faculty Teaching Demonstration, Viva &amp; Evaluation\u003c/h2>\n\n\u003ch2 id=\"obj\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>Writing Lab Objectives &amp; Prerequisites\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">A good objective uses an \u003cb>action verb you can observe\u003c/b>. Avoid \"understand/know\". Edit the boxes:\u003c/p>\n\u003cdiv class=\"two\">\u003cdiv>\u003cp>Verb \u003cinput type=\"text\" id=\"o_v\" value=\"classify\">\u003c/p>\u003cp>What \u003cinput type=\"text\" id=\"o_w\" value=\"web vulnerabilities by OWASP category\">\u003c/p>\u003cp>Condition \u003cinput type=\"text\" id=\"o_c\" value=\"in an isolated lab using the provided checklist\">\u003c/p>\u003c/div>\n\u003cdiv class=\"sc\" id=\"o_out\" style=\"border-top-color:var(--good)\">\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\" style=\"margin-top:12px\">\u003cdiv class=\"card\">\u003cb>Prerequisites\u003c/b>\u003cbr>Networking basics, Linux commands, lab VM access, signed lab rules.\u003c/div>\u003cdiv class=\"card\">\u003cb>Bloom verbs\u003c/b>\u003cbr>list · describe · perform · compare · assess · design\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"grad\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>Demonstration → Guided Practice → Independent Assessment\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cinput type=\"range\" id=\"gr\" min=\"0\" max=\"100\" value=\"10\">\u003cdiv class=\"seg\" style=\"height:44px;margin-top:8px\">\u003cdiv id=\"g1\" style=\"background:var(--accent);flex:90;opacity:1\">Teacher\u003c/div>\u003cdiv id=\"g2\" style=\"background:var(--accent2);flex:10;opacity:1\">Student\u003c/div>\u003c/div>\n\u003cdiv class=\"explain\" id=\"grtxt\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"safety\" class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>Student Safety &amp; Lab Isolation\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"two\">\u003cdiv>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"sf\"> Lab network is isolated (no internet/college LAN)\u003c/label>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"sf\"> Snapshots taken for every VM\u003c/label>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"sf\"> Written authorization / lab rules signed\u003c/label>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"sf\"> Only dummy data in the lab\u003c/label>\n\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"sf\"> Instructor has a stop/reset procedure\u003c/label>\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cdiv class=\"light\" id=\"slight\">\u003c/div>\u003ch3 id=\"stxt\">NOT READY\u003c/h3>\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"rubric\" class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Rubric-based Grading (live calculator)\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Slide each criterion: 1 = Beginning, 2 = Developing, 3 = Proficient, 4 = Excellent.\u003c/p>\u003cdiv id=\"rb\">\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cdiv class=\"bigtxt\" id=\"rbs\">0\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"rbb\">\u003c/i>\u003c/div>\u003cdiv class=\"explain\" id=\"rbt\">\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"rec\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>Practical Records, Screenshots &amp; Reproducible Steps\u003c/h2>\n\u003cdiv class=\"two reveal\">\u003cdiv class=\"card\">\u003ch3>📘 A good practical record has\u003c/h3>\u003cul>\u003cli>Aim, date, lab/VM, IPs\u003c/li>\u003cli>Numbered steps with exact commands\u003c/li>\u003cli>Screenshot per key step\u003c/li>\u003cli>Observed result and conclusion\u003c/li>\u003cli>Cleanup/restore note\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>🗂️ Naming &amp; folders\u003c/h3>\u003cpre class=\"cb\">FDP_Portfolio/\n ├─ 01_Notes/\n ├─ 02_Lab_Manuals/\n ├─ 03_Screenshots/  D19_F01_request_2026-10-12.png\n ├─ 04_Quizzes/\n ├─ 05_Risk_Reports/\n └─ 06_Capstone_Evaluation/\u003c/pre>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"integ\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>Academic Integrity, Authorization &amp; Responsible Disclosure\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"flow\" id=\"disc2\">\u003c/div>\u003cdiv class=\"explain\" id=\"disctxt\">Click a step.\u003c/div>\n\u003cdiv class=\"two\">\u003cdiv class=\"card\">\u003cb>✅ Integrity\u003c/b>\u003cbr>Own work, cite sources, honest evidence, no copied reports.\u003c/div>\u003cdiv class=\"card\">\u003cb>❌ Never\u003c/b>\u003cbr>Test without permission, fake screenshots, share real vulnerabilities publicly before the owner can fix them.\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"micro\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>Practical 1: 15–20 Minute Micro-teaching Planner\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Set minutes for each part. Total must be 15–20.\u003c/p>\u003cdiv class=\"grid\" id=\"mt\">\u003c/div>\n\u003cdiv class=\"seg\" id=\"mseg\" style=\"margin-top:10px\">\u003c/div>\u003cdiv class=\"explain\" id=\"mtxt\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"peer\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Practical 2: Reproduce a Colleague's Practical\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cp class=\"sub\">Follow their steps exactly. For each step mark what you got.\u003c/p>\u003cdiv id=\"pr\">\u003c/div>\u003cdiv style=\"text-align:center\">\u003cdiv class=\"bigtxt\" id=\"prs\">100%\u003c/div>\u003cdiv class=\"explain\" id=\"prt\">\u003c/div>\u003c/div>\u003c/div>\n\n\u003ch2 id=\"viva\" class=\"reveal\">\u003cspan class=\"n\">9\u003c/span>Practical 3: Viva &amp; Capstone Report Evaluation\u003c/h2>\n\u003cp class=\"sub reveal\">Flip the cards to practise viva answers.\u003c/p>\n\u003cdiv class=\"grid reveal\" id=\"vcards\">\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\u003ch3>Quick quiz sample (for your portfolio)\u003c/h3>\u003cdiv id=\"q_t\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"port\" class=\"reveal\">\u003cspan class=\"n\">10\u003c/span>Final FDP Portfolio Checklist\u003c/h2>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"two\">\u003cdiv id=\"pf\">\u003c/div>\u003cdiv style=\"text-align:center\">\u003cdiv class=\"bigtxt\" id=\"pfs\">0%\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"pfb\">\u003c/i>\u003c/div>\u003cdiv class=\"explain\" id=\"pft\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cp style=\"text-align:center;color:var(--muted);margin-top:50px\">Scope first · Evidence always · Fix and retest · Teach safely 🛡️\u003c/p>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nfunction esc(s){return String(s).replace(/[&\u003c>]/g,m=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;'}[m]))}\n/* ===== themes + canvas ===== */\nconst THEMES=[[\"galaxy\",\"🌌 Galaxy\"],[\"blackhole\",\"🕳️ Black Hole\"],[\"supernova\",\"💥 Supernova\"],[\"aurora\",\"🌿 Aurora\"],[\"cyber\",\"🌆 Cyberpunk\"],[\"ocean\",\"🌊 Deep Ocean\"],[\"sunset\",\"🌇 Sunset Retro\"],[\"paper\",\"📄 Light Paper\"]];\nTHEMES.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>setTheme(k);b.dataset.k=k;$('#themebar').appendChild(b)});\nfunction setTheme(k){document.body.dataset.theme=k;theme=k;$$('#themebar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));init();try{localStorage.setItem('th',k)}catch(e){}}\nconst cv=$('#bg'),c=cv.getContext('2d');let W,H,t=0,theme='galaxy',P=[];\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}\nfunction R(a,b){return a+Math.random()*(b-a)}\nfunction sp(){const a=R(0,6.28),v=R(.5,4);return{x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(60,200),m:200}}\nfunction init(){P=[];\n if(theme==='galaxy')for(let i=0;i\u003c160;i++)P.push({x:R(0,W),y:R(0,H),r:R(.4,2),ph:R(0,6)});\n if(theme==='blackhole')for(let i=0;i\u003c450;i++)P.push({a:R(0,6.28),r:R(70,Math.min(W,H)*.5),o:R(.2,.9)});\n if(theme==='supernova')for(let i=0;i\u003c170;i++)P.push(sp());\n if(theme==='ocean')for(let i=0;i\u003c55;i++)P.push({x:R(0,W),y:R(0,H),r:R(2,12),s:R(.3,1.3),ph:R(0,6)});\n if(theme==='sunset'||theme==='paper')for(let i=0;i\u003c40;i++)P.push({x:R(0,W),y:R(0,H),r:R(4,26),s:R(.1,.5),ph:R(0,6)})}\nfunction draw(){t++;c.clearRect(0,0,W,H);\n if(theme==='galaxy'){[[.2,.3,'rgba(120,80,255,.22)'],[.8,.6,'rgba(60,140,255,.2)'],[.5,.9,'rgba(200,80,255,.15)']].forEach(([x,y,col],i)=>{const g=c.createRadialGradient(W*x+Math.sin(t/200+i)*40,H*y,0,W*x,H*y,W*.4);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H)});P.forEach(p=>{c.globalAlpha=.4+.6*Math.abs(Math.sin(t*.03+p.ph));c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()});c.globalAlpha=1}\n else if(theme==='blackhole'){const cx=W*.5,cy=H*.45;P.forEach(p=>{p.a+=.9/Math.sqrt(p.r)*.12;const x=cx+Math.cos(p.a)*p.r*1.6,y=cy+Math.sin(p.a)*p.r*.38;c.globalAlpha=Math.max(0,p.o*(1-p.r/(Math.min(W,H)*.6)));c.fillStyle=p.r\u003c150?'#fff3d0':'#ff8a2a';c.fillRect(x,y,2,2)});c.globalAlpha=1;const g=c.createRadialGradient(cx,cy,30,cx,cy,140);g.addColorStop(0,'#000');g.addColorStop(.45,'#000');g.addColorStop(.6,'rgba(255,160,60,.4)');g.addColorStop(1,'transparent');c.fillStyle=g;c.beginPath();c.arc(cx,cy,140,0,6.28);c.fill()}\n else if(theme==='supernova'){const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,260);g.addColorStop(0,'rgba(255,220,100,.25)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.l--;const a=Math.max(p.l/p.m,0);c.fillStyle=`hsla(${15+a*40},100%,${50+a*20}%,${a})`;c.beginPath();c.arc(p.x,p.y,2.2,0,6.28);c.fill();if(p.l\u003c=0)P[i]=sp()})}\n else if(theme==='aurora'){for(let i=0;i\u003c4;i++){const base=H*(.2+i*.1);const g=c.createLinearGradient(0,base-90,0,base+170);const col=['61,245,176','79,216,255','140,120,255','60,255,120'][i];g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.5,`rgba(${col},.28)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.moveTo(0,H);for(let x=0;x\u003c=W;x+=10)c.lineTo(x,base+Math.sin(x*.004+t*.012+i*1.7)*70+Math.sin(x*.011+t*.02)*20);c.lineTo(W,H);c.fill()}}\n else if(theme==='cyber'){const hz=H*.55;c.lineWidth=1;c.strokeStyle='rgba(255,47,208,.55)';for(let i=0;i\u003c22;i++){const z=((i+(t*.04)%1)/22);const y=hz+z*z*(H-hz);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.strokeStyle='rgba(0,240,255,.45)';for(let i=-16;i\u003c=16;i++){c.beginPath();c.moveTo(W/2+i*20,hz);c.lineTo(W/2+i*W*.14,H);c.stroke()}const g=c.createLinearGradient(0,hz-80,0,hz);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(255,47,208,.3)');c.fillStyle=g;c.fillRect(0,hz-80,W,80)}\n else if(theme==='ocean'){P.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t*.02+p.ph)*.4;if(p.y\u003c-20){p.y=H+20;p.x=R(0,W)}c.strokeStyle='rgba(92,255,217,.55)';c.fillStyle='rgba(47,184,255,.12)';c.shadowColor='#5cffd9';c.shadowBlur=10;c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill();c.stroke();c.shadowBlur=0})}\n else if(theme==='sunset'){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(60,20,110,.45)');g.addColorStop(.6,'rgba(255,95,162,.3)');g.addColorStop(1,'rgba(255,160,60,.45)');c.fillStyle=g;c.fillRect(0,0,W,H);const sy=H*.72+Math.sin(t*.01)*6;const sg=c.createRadialGradient(W*.5,sy,10,W*.5,sy,170);sg.addColorStop(0,'rgba(255,230,140,.95)');sg.addColorStop(.5,'rgba(255,120,60,.55)');sg.addColorStop(1,'transparent');c.fillStyle=sg;c.beginPath();c.arc(W*.5,sy,170,0,6.28);c.fill();P.forEach(p=>{p.x+=p.s;if(p.x>W+30)p.x=-30;c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n else if(theme==='paper'){P.forEach(p=>{p.y-=p.s*.5;p.x+=Math.sin(t*.01+p.ph)*.3;if(p.y\u003c-30)p.y=H+30;c.fillStyle='rgba(74,69,224,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n requestAnimationFrame(draw)}\naddEventListener('resize',rs);\n\n/* ===== helpers ===== */\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.08});\nfunction mkFlow(el,items,cb){el.innerHTML=items.map((i,k)=>`\u003cdiv class=\"node\" data-k=\"${k}\" style=\"${cb?'cursor:pointer':''}\">\u003cspan class=\"big\">${i[0]}\u003c/span>\u003cb>${i[1]}\u003c/b>\u003c/div>`).join('');if(cb)el.querySelectorAll('.node').forEach(n=>n.onclick=()=>cb(+n.dataset.k,n))}\nfunction mkQuiz(id,items,labels){const el=$('#'+id);let sc=0;\n el.innerHTML=items.map((it,i)=>`\u003cdiv class=\"qrow\">\u003cdiv class=\"qt\">${it.t}\u003c/div>\u003cdiv>${labels.map((l,j)=>`\u003cbutton class=\"btn alt\" data-i=\"${i}\" data-j=\"${j}\">${l}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"qw\" id=\"${id}w${i}\">\u003c/div>\u003c/div>`).join('')+`\u003cdiv class=\"explain\" id=\"${id}s\">Score: 0/${items.length}\u003c/div>`;\n el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,row=b.closest('.qrow');if(row.dataset.d)return;row.dataset.d=1;const ok=j===items[i].a;if(ok)sc++;row.classList.add(ok?'right':'wrong');$('#'+id+'w'+i).innerHTML=(ok?'✔ ':'✖ ')+items[i].w;$('#'+id+'s').innerHTML=`Score: \u003cb>${sc}/${items.length}\u003c/b>`}}\nfunction checklist(box,items,barId,scoreId,txtId,msgs){$(box).innerHTML=items.map(x=>`\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"ck_${box.slice(1)}\"> ${x}\u003c/label>`).join('');const u=()=>{const a=$$('.ck_'+box.slice(1)),n=a.filter(x=>x.checked).length,p=Math.round(n/a.length*100);if(scoreId)$(scoreId).textContent=p+'%';$(barId).style.width=p+'%';$(txtId).textContent=p===100?msgs[1]:msgs[0].replace('{n}',n).replace('{t}',a.length)};$$('.ck_'+box.slice(1)).forEach(x=>x.onchange=u);u()}\n\n/* ===== 10-step workflow ===== */\nconst WF=[[\"📄\",\"1 Scope & authorization\",\"Signed scope, RoE, test window. Deliverable: Scope document.\"],[\"🗺️\",\"2 Lab architecture\",\"Document tester/target IPs, network type, isolation, snapshot.\"],[\"🔎\",\"3 Discovery\",\"Find live hosts, open ports, services, versions (in-scope only).\"],[\"🔬\",\"4 Burp inspection\",\"Proxy the app; map pages, parameters, sessions, headers.\"],[\"🎯\",\"5 OWASP weaknesses\",\"Use guided challenges to identify OWASP-type issues.\"],[\"✅\",\"6 Validate\",\"Confirm each finding with repeatable test cases and evidence.\"],[\"⚖️\",\"7 Severity & impact\",\"Assign severity (likelihood × impact / CVSS) and business impact.\"],[\"🔧\",\"8 Fix / mitigate\",\"Implement the fix or write a practical mitigation.\"],[\"🔁\",\"9 Retest\",\"Repeat the same steps; set Open / Fixed / Accepted Risk.\"],[\"📊\",\"10 Report & talk\",\"Final report + 5-minute presentation.\"]];\nmkFlow($('#wfflow'),WF.map(x=>[x[0],x[1]]),(k)=>{clearInterval(wt);showWf(k)});\nlet wi=-1,wt;function showWf(k){wi=k;$$('#wfflow .node').forEach((n,i)=>n.classList.toggle('act',i===k));$('#wftxt').innerHTML=`\u003cb>${WF[k][1]}:\u003c/b> ${WF[k][2]}`}\nfunction playWf(){clearInterval(wt);wi=-1;const s=()=>showWf((wi+1)%WF.length);s();wt=setInterval(s,2200)}\n\n/* ===== scope builder ===== */\nfunction scope(){const v=id=>$('#s_'+id).value;$('#s_prev').innerHTML=`\u003ch4>Scope &amp; Authorization\u003c/h4>\u003cdl>\u003cdt>Project\u003c/dt>\u003cdd>${esc(v('n'))}\u003c/dd>\u003cdt>Target application\u003c/dt>\u003cdd>${esc(v('u'))}\u003c/dd>\u003cdt>Lab VM IP\u003c/dt>\u003cdd>${esc(v('ip'))}\u003c/dd>\u003cdt>Test window\u003c/dt>\u003cdd>${esc(v('w'))}\u003c/dd>\u003cdt>Allowed\u003c/dt>\u003cdd>${esc(v('a'))}\u003c/dd>\u003cdt>Forbidden\u003c/dt>\u003cdd>${esc(v('f'))}\u003c/dd>\u003c/dl>\u003cp style=\"margin-top:14px\">Authorized by: ____________ (Instructor) &nbsp; Tester: ____________\u003c/p>`;\n const ipok=/^192\\.168\\.56\\.\\d{1,3}$/.test(v('ip').trim()),urlok=v('u').indexOf(v('ip').trim())>-1;$('#s_chk').innerHTML=(ipok?'\u003cspan class=\"pill ok\">✔ IP inside lab network\u003c/span> ':'\u003cspan class=\"pill no\">✖ IP is not in the lab range\u003c/span> ')+(urlok?'\u003cspan class=\"pill ok\">✔ URL matches the IP\u003c/span>':'\u003cspan class=\"pill wn\">URL and IP do not match\u003c/span>')}\n['n','u','ip','w','a','f'].forEach(k=>$('#s_'+k).oninput=scope);scope();\n\n/* ===== lab isolation ===== */\n$('#neton').onchange=()=>{const v=$('#neton').checked;$('#isopill').className='pill '+(v?'no':'ok');$('#isopill').textContent=v?'Internet access ✖':'No internet access ✔';$('#isotxt').innerHTML=v?'❌ Isolation broken! A vulnerable VM exposed to the internet is dangerous. Disable NAT/bridged networking immediately.':'Isolated lab: safe.'};\n\n/* ===== terminal ===== */\nlet tt;function runTerm(){clearInterval(tt);const L=['$ nmap -sn 192.168.56.0/24','Host 192.168.56.101 is up','Nmap done: 1 host up','','$ nmap -sV 192.168.56.101','PORT     STATE  SERVICE  VERSION','22/tcp   open   ssh      (sample) OpenSSH','80/tcp   open   http     (sample) Apache httpd','3306/tcp closed mysql','','→ Note: web app on port 80. Record in the findings sheet.'];const el=$('#term');el.textContent='';let i=0;tt=setInterval(()=>{if(i>=L.length){clearInterval(tt);return}el.textContent+=L[i++]+'\\n'},450)}\n\n/* ===== Burp demo ===== */\nlet bwait=false;\nfunction bSend(){if(bwait)return;const p=$('#bpk');p.textContent='REQ';p.style.transition='none';p.style.left='16%';p.style.opacity=1;\n requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition='left .8s linear';p.style.left='calc(50% - 22px)';setTimeout(()=>{if($('#icpt').checked){bwait=true;$('#breq').style.display='block';$('#bbtns').style.display='block';$('#btxt').textContent='⏸ Request paused inside Burp. Inspect it, then Forward or Drop.'}else{bGo()}},850)}))}\nfunction bGo(){const p=$('#bpk');$('#btxt').textContent='Request reaches the app, response comes back. Burp logged both in Proxy history.';p.style.left='80%';setTimeout(()=>{p.textContent='RES';p.style.left='16%'},1000);setTimeout(()=>{p.style.opacity=0},1900)}\nfunction bFwd(){bwait=false;$('#breq').style.display='none';$('#bbtns').style.display='none';bGo()}\nfunction bDrop(){bwait=false;$('#breq').style.display='none';$('#bbtns').style.display='none';$('#bpk').style.opacity=0;$('#btxt').textContent='Dropped: the app never saw this request.'}\nmkFlow($('#bsetup'),[[\"⚙️\",\"Start Burp, Proxy on 127.0.0.1:8080\"],[\"🌐\",\"Set browser proxy to it\"],[\"🔒\",\"Install Burp CA cert (for HTTPS)\"],[\"🎯\",\"Add lab target to Target scope\"],[\"📜\",\"Browse app; read Proxy history\"]]);\n\n/* ===== OWASP ===== */\nconst OW=[[\"A01\",\"Broken Access Control\",\"Users can reach data/functions they shouldn't.\",\"Log in as two users; check whether one can open the other's page by changing an ID, using Burp Repeater.\",\"Enforce authorization on the server for every request; deny by default.\"],\n[\"A02\",\"Cryptographic Failures\",\"Sensitive data not protected in transit/at rest.\",\"Check for HTTP instead of HTTPS, weak TLS, readable stored secrets (in lab).\",\"Use TLS, strong hashing for passwords, protect keys.\"],\n[\"A03\",\"Injection\",\"Untrusted input is treated as code/commands (SQL, XSS, etc.).\",\"Use the guided lab challenge with the harmless test inputs from the lab sheet; observe responses.\",\"Parameterized queries, input validation, output encoding.\"],\n[\"A04\",\"Insecure Design\",\"Flaws in the design itself, not just code bugs.\",\"Review workflows for missing limits or checks.\",\"Threat model early; secure design patterns.\"],\n[\"A05\",\"Security Misconfiguration\",\"Defaults, debug pages, verbose errors, missing headers.\",\"Look at error pages, default files, headers in Proxy history.\",\"Harden config, remove defaults, add security headers.\"],\n[\"A06\",\"Vulnerable & Outdated Components\",\"Old libraries/servers with known flaws.\",\"Compare discovered versions with advisories.\",\"Patch/upgrade; keep inventory of components.\"],\n[\"A07\",\"Identification & Authentication Failures\",\"Weak login, passwords, sessions.\",\"Review password rules, lockout, session cookie flags.\",\"MFA, lockout, secure session handling.\"],\n[\"A08\",\"Software & Data Integrity Failures\",\"Trusting unsigned updates/data.\",\"Check how updates and serialized data are verified.\",\"Signatures, integrity checks, trusted pipelines.\"],\n[\"A09\",\"Logging & Monitoring Failures\",\"Attacks go unnoticed.\",\"Chec
