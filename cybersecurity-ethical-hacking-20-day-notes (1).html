t-size:16px}\n/* architecture */\n.arch{display:flex;flex-direction:column;align-items:center;gap:8px}\n.box{padding:10px 18px;border:2px solid var(--border);border-radius:12px;background:var(--panel);text-align:center}\n.arrow{font-size:22px;animation:bob 1.2s infinite;color:var(--accent2)}@keyframes bob{50%{transform:translateY(5px)}}\n.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}\n.chip{cursor:pointer;padding:8px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--panel);transition:.25s}\n.chip:hover,.chip.on{background:var(--accent);color:#000;transform:translateY(-3px)}\n.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}\n.step{padding:6px 11px;border-radius:8px;border:1px solid var(--border);font-family:Consolas,monospace;font-size:13px;transition:.3s}\n.step.act{background:var(--accent2);color:#000;transform:scale(1.12)}\n/* ladder */\n.ladder .rung{padding:10px 14px;margin:6px 0;border-radius:10px;border:1px solid var(--border);background:var(--panel);transition:.4s;display:flex;gap:10px;align-items:center}\n.rung.stop{opacity:.35;border-color:var(--bad);filter:grayscale(.7)}.rung.cur{border:2px solid var(--good);box-shadow:0 0 14px var(--good)}\ninput[type=range]{width:100%;accent-color:var(--accent)}\ninput[type=text],select{background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:15px}\n/* vm */\n.vm{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}\n.vmbox{width:190px;height:130px;border:3px solid var(--good);border-radius:14px;display:grid;place-items:center;text-align:center;transition:.5s;background:var(--panel)}\n.vmbox.bad{border-color:var(--bad);animation:shake .4s 2}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\ntable{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--panel);color:var(--accent2)}\ntd.ph{color:var(--muted);font-style:italic}\n/* perm */\n.pg{display:grid;grid-template-columns:90px repeat(3,70px);gap:6px;align-items:center;justify-content:center}\n.pg label{cursor:pointer;display:grid;place-items:center;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--panel);transition:.2s;font-weight:700}\n.pg input{display:none}.pg input:checked+span{color:#000}.pg label:has(input:checked){background:var(--accent);color:#000;transform:scale(1.07)}\n.bigtxt{font-family:Consolas,monospace;font-size:30px;text-align:center;letter-spacing:4px;color:var(--accent2)}\n/* fw */\n.fw{display:flex;align-items:center;gap:0;position:relative;height:150px;justify-content:space-between;margin:10px 0}\n.endp{width:110px;height:110px;border-radius:14px;border:2px solid var(--border);background:var(--panel);display:grid;place-items:center;text-align:center;z-index:2}\n.wall{width:26px;height:140px;background:repeating-linear-gradient(0deg,var(--bad) 0 12px,#ff9a3c 12px 24px);border-radius:6px;z-index:2;box-shadow:0 0 18px var(--bad)}\n.pkt{position:absolute;top:62px;left:100px;width:30px;height:30px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-size:11px;color:#000;font-weight:800;opacity:0;z-index:3}\n.rules .r{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:8px;margin:4px 0;background:var(--panel)}\n.bar{height:14px;border-radius:8px;background:var(--code);overflow:hidden;border:1px solid var(--border)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));transition:.5s}\n.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin:5px 0;background:var(--panel);cursor:pointer}\n.chk input{width:18px;height:18px;accent-color:var(--accent)}\n.light{width:54px;height:54px;border-radius:50%;background:var(--bad);box-shadow:0 0 24px var(--bad);transition:.4s;margin:auto}.light.go{background:var(--good);box-shadow:0 0 28px var(--good)}\n.fc{perspective:700px;height:120px;cursor:pointer}.fc div{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}.fc.flip div{transform:rotateY(180deg)}\n.fc span{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:10px;border-radius:14px;border:1px solid var(--border);background:var(--panel)}\n.fc span+span{transform:rotateY(180deg);background:var(--accent);color:#000;font-weight:600}\ndetails{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--accent2)}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n.key{display:flex;align-items:center;gap:10px}\n@media(max-width:600px){.pg{grid-template-columns:70px repeat(3,56px)}.endp{width:80px;height:90px;font-size:12px}}\n\u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cdiv id=\"themebar\">\u003c/div>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"hero\">\n  \u003ch1>🛡️ Cyber Lab Notes: Day 14 &amp; Day 15\u003c/h1>\n  \u003cp>Zero-level, visual-first notes. Click, drag and play with every box. Day 14 = Metasploit and the exploitation lifecycle in a \u003cb>controlled lab\u003c/b>. Day 15 = \u003cb>hardening\u003c/b> Linux and Windows.\u003c/p>\n  \u003cdiv class=\"warnbox danger\" style=\"max-width:700px;margin:auto;text-align:left\">⚠️ \u003cb>Golden rule of both days:\u003c/b> practise ONLY on machines you own or that your instructor gave you in writing. Every action needs \u003cb>authorization + correct target IP\u003c/b> first.\u003c/div>\n\u003c/div>\n\n\u003cnav>\n  \u003ca href=\"#d14\">Day 14\u003c/a>\u003ca href=\"#words\">Key words\u003c/a>\u003ca href=\"#life\">Lifecycle\u003c/a>\u003ca href=\"#validate\">Validate vs Exploit\u003c/a>\u003ca href=\"#msf\">Metasploit\u003c/a>\u003ca href=\"#compat\">Compatibility\u003c/a>\u003ca href=\"#preflight\">Pre-flight\u003c/a>\u003ca href=\"#snap\">Snapshots\u003c/a>\u003ca href=\"#p14\">Practicals 14\u003c/a>\n  \u003ca href=\"#d15\">Day 15\u003c/a>\u003ca href=\"#priv\">Least privilege\u003c/a>\u003ca href=\"#perm\">Permissions\u003c/a>\u003ca href=\"#ssh\">SSH\u003c/a>\u003ca href=\"#ufw\">Firewall\u003c/a>\u003ca href=\"#win\">Windows\u003c/a>\u003ca href=\"#maint\">Patch/Backup\u003c/a>\u003ca href=\"#cis\">CIS\u003c/a>\u003ca href=\"#p15\">Practicals 15\u003c/a>\u003ca href=\"#rev\">Revision\u003c/a>\n\u003c/nav>\n\n\u003c!-- ================= DAY 14 ================= -->\n\u003cdiv style=\"text-align:center\">\u003cspan class=\"daytag\" id=\"d14\">DAY 14\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Metasploit &amp; Exploitation Lifecycle: Controlled Lab\u003c/h2>\n\n\u003ch2 id=\"words\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>The 5 Key Words (analogy: a house)\u003c/h2>\n\u003cp class=\"sub\">Click a card to see the one-line meaning.\u003c/p>\n\u003cdiv class=\"grid reveal\" id=\"wordcards\">\u003c/div>\n\n\u003ch2 id=\"life\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>The Exploitation Lifecycle (animated)\u003c/h2>\n\u003cp class=\"sub\">Press Play. Notice that \u003cb>Cleanup + Report\u003c/b> are part of the job, not an afterthought.\u003c/p>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv class=\"flow\" id=\"flow\">\u003c/div>\n  \u003cdiv class=\"explain\" id=\"flowtxt\">Press ▶ Play to walk through the stages.\u003c/div>\n  \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn\" onclick=\"playFlow()\">▶ Play\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"stopFlow()\">⏹ Stop\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"validate\" class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>Vulnerability Validation vs Exploitation\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>🔎 Validation\u003c/h3>\u003cp>\"\u003cb>Is the door really unlocked?\u003c/b>\" You only \u003ci>check\u003c/i>: version, banner, safe scanner or \u003ccode>check\u003c/code> command. Nothing is changed on the target.\u003c/p>\u003cspan class=\"pill ok\">Low risk\u003c/span> \u003cspan class=\"pill ok\">Usually enough for a report\u003c/span>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>💥 Exploitation\u003c/h3>\u003cp>\"\u003cb>Walk in through the door.\u003c/b>\" You actually run code against the service. It can crash services, change files or leave traces.\u003c/p>\u003cspan class=\"pill no\">Higher risk\u003c/span> \u003cspan class=\"pill wn\">Only if scope allows\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\n  \u003ch3>🪜 Evidence ladder: how far do I go? (Practical 3)\u003c/h3>\n  \u003cp class=\"sub\">Drag the slider. Everything ABOVE the green rung is \u003cu>unnecessary\u003c/u> once evidence is sufficient.\u003c/p>\n  \u003cinput type=\"range\" min=\"1\" max=\"5\" value=\"2\" id=\"ladder\">\n  \u003cdiv class=\"ladder\" id=\"ladderbox\">\u003c/div>\n  \u003cdiv class=\"explain\" id=\"laddertxt\">\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"msf\" class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Metasploit Framework Architecture\u003c/h2>\n\u003cp class=\"sub\">Metasploit = a toolbox of \u003cb>modules\u003c/b> driven from one console. Click each module type.\u003c/p>\n\u003cdiv class=\"card reveal\">\n  \u003cdiv class=\"arch\">\n    \u003cdiv class=\"box\">👤 \u003cb>You\u003c/b>, typing in \u003ccode>msfconsole\u003c/code>\u003c/div>\u003cdiv class=\"arrow\">⬇\u003c/div>\n    \u003cdiv class=\"box\">⚙️ \u003cb>Framework core\u003c/b>: loads modules, keeps settings (\u003ci>datastore\u003c/i>), manages sessions\u003c/div>\u003cdiv class=\"arrow\">⬇\u003c/div>\n    \u003cdiv class=\"chips\" id=\"modchips\">\u003c/div>\n    \u003cdiv class=\"card\" id=\"modinfo\" style=\"margin-top:10px;width:100%;text-align:center\">Click a module type 👆\u003c/div>\n  \u003c/div>\n  \u003ch3>Everyday command flow (auto-animated)\u003c/h3>\n  \u003cdiv class=\"steps\" id=\"msfsteps\">\u003c/div>\n  \u003cdiv class=\"explain\" id=\"msfstepstxt\">\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"compat\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>Compatibility, Prerequisites &amp; Risk\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\n    \u003ch3>🧩 Does it fit? (mini simulator)\u003c/h3>\n    \u003cp class=\"sub\">An exploit works only when target, service version and payload match.\u003c/p>\n    \u003cp>Target OS: \u003cselect id=\"tOS\">\u003coption>Linux x64\u003c/option>\u003coption>Windows x64\u003c/option>\u003coption>Linux x86\u003c/option>\u003c/select>\u003c/p>\n    \u003cp>Payload built for: \u003cselect id=\"pOS\">\u003coption>Linux x64\u003c/option>\u003coption>Windows x64\u003c/option>\u003coption>Linux x86\u003c/option>\u003c/select>\u003c/p>\n    \u003cp>Service version in exploit range? \u003cselect id=\"vOK\">\u003coption value=\"1\">Yes (confirmed)\u003c/option>\u003coption value=\"0\">Unknown / No\u003c/option>\u003c/select>\u003c/p>\n    \u003cdiv id=\"fit\" class=\"bigtxt\" style=\"font-size:22px;letter-spacing:0\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch3>📋 Prerequisites checklist\u003c/h3>\n    \u003cul>\u003cli>Written authorization + scope\u003c/li>\u003cli>Target OS / architecture known\u003c/li>\u003cli>Service + version identified\u003c/li>\u003cli>Network path reachable (lab only)\u003c/li>\u003cli>Snapshot taken ✅\u003c/li>\u003cli>Module documentation read (\u003ccode>info\u003c/code>)\u003c/li>\u003c/ul>\n    \u003ch3>⚠️ Risk meter\u003c/h3>\n    \u003cdiv class=\"key\">\u003cspan class=\"pill ok\">Check only\u003c/span> \u003cdiv class=\"bar\" style=\"flex:1\">\u003ci style=\"width:15%;background:var(--good)\">\u003c/i>\u003c/div>\u003c/div>\u003cbr>\n    \u003cdiv class=\"key\">\u003cspan class=\"pill wn\">Exploit\u003c/span> \u003cdiv class=\"bar\" style=\"flex:1\">\u003ci style=\"width:60%;background:var(--warn)\">\u003c/i>\u003c/div>\u003c/div>\u003cbr>\n    \u003cdiv class=\"key\">\u003cspan class=\"pill no\">Persistence + data\u003c/span> \u003cdiv class=\"bar\" style=\"flex:1\">\u003ci style=\"width:95%;background:var(--bad)\">\u003c/i>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"poc\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>Proof of Concept (PoC) &amp; Safe Validation\u003c/h2>\n\u003cdiv class=\"grid reveal\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">📸\u003c/span>\u003ch3>PoC = proof\u003c/h3>\u003cp>The \u003cb>smallest\u003c/b> evidence that the problem is real: a version screenshot, a \u003ccode>check\u003c/code> result, a harmless identity line.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🧪\u003c/span>\u003ch3>Safe PoC\u003c/h3>\u003cp>Non-destructive, repeatable, logged with time and target IP. No real user data touched.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🚫\u003c/span>\u003ch3>Not needed\u003c/h3>\u003cp>Persistence, extra payloads, copying files or passwords. They add risk without adding proof.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"preflight\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>Pre-flight Check: Authorization &amp; Target IP\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Practical 2 rule: verify BEFORE every action. Pretend your instructor's scope is \u003ccode>192.168.56.0/24\u003c/code> (a typical host-only lab network).\u003c/p>\n  \u003cdiv class=\"two\">\n    \u003cdiv>\n      \u003cp>Type the target IP you plan to use:\u003c/p>\n      \u003cinput type=\"text\" id=\"ipin\" value=\"192.168.56.101\" style=\"width:100%\">\n      \u003cdiv id=\"ipres\" style=\"margin:8px 0\">\u003c/div>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"pf\"> Instructor authorization received\u003c/label>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"pf\"> VM is intentionally vulnerable &amp; isolated\u003c/label>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"pf\"> Snapshot taken\u003c/label>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"pf\"> Allowed actions read from lab sheet\u003c/label>\n    \u003c/div>\n    \u003cdiv style=\"text-align:center\">\u003cdiv class=\"light\" id=\"light\">\u003c/div>\u003ch3 id=\"lighttxt\">NO-GO\u003c/h3>\u003cp class=\"sub\">Light turns green only when the IP is in scope and every box is ticked.\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"snap\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Lab Isolation, Snapshots, Rollback &amp; Data Protection\u003c/h2>\n\u003cdiv class=\"grid reveal\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🏝️\u003c/span>\u003ch3>Isolation\u003c/h3>\u003cp>Host-only / internal network. The vulnerable VM must never reach the internet or your college LAN.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">📷\u003c/span>\u003ch3>Snapshot\u003c/h3>\u003cp>A saved \"photo\" of the VM state. You can go back to it any time.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">⏪\u003c/span>\u003ch3>Rollback\u003c/h3>\u003cp>Restore the snapshot after testing, so the VM is clean again.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🔐\u003c/span>\u003ch3>Data protection\u003c/h3>\u003cp>Use dummy data only. Never keep real credentials or personal files in the lab.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\n  \u003ch3>🎮 Snapshot simulator (Practical 4)\u003c/h3>\n  \u003cdiv class=\"vm\">\n    \u003cdiv class=\"vmbox\" id=\"vm\">\u003cdiv>\u003cdiv class=\"big\" id=\"vmico\">🖥️\u003c/div>\u003cb id=\"vmstate\">CLEAN\u003c/b>\u003c/div>\u003c/div>\n    \u003cdiv>\n      \u003cbutton class=\"btn\" onclick=\"vmSnap()\">📷 Take snapshot\u003c/button>\u003cbr>\n      \u003cbutton class=\"btn alt\" onclick=\"vmTest()\">🧪 Run lab test (changes things)\u003c/button>\u003cbr>\n      \u003cbutton class=\"btn\" onclick=\"vmRestore()\">⏪ Restore snapshot\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003ctable style=\"margin-top:12px\">\u003ctr>\u003cth>Item\u003c/th>\u003cth>Before\u003c/th>\u003cth>After test\u003c/th>\u003cth>After restore\u003c/th>\u003c/tr>\n  \u003ctr>\u003ctd>Running services\u003c/td>\u003ctd id=\"s1\">–\u003c/td>\u003ctd id=\"s2\">–\u003c/td>\u003ctd id=\"s3\">–\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>New files / logs\u003c/td>\u003ctd id=\"f1\">–\u003c/td>\u003ctd id=\"f2\">–\u003c/td>\u003ctd id=\"f3\">–\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>State\u003c/td>\u003ctd id=\"t1\">–\u003c/td>\u003ctd id=\"t2\">–\u003c/td>\u003ctd id=\"t3\">–\u003c/td>\u003c/tr>\u003c/table>\n  \u003cdiv class=\"explain\" id=\"vmtxt\">Step 1: take a snapshot first.\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"p14\" class=\"reveal\">\u003cspan class=\"n\">9\u003c/span>Day 14 Practicals, Step by Step\u003c/h2>\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 1: Explore the Metasploit interface &amp; module docs\u003c/summary>\n\u003cp>Goal: learn to \u003cb>read\u003c/b> before you \u003cb>run\u003c/b>. Click a command to copy.\u003c/p>\n\u003ccode class=\"cmd\">msfconsole -q\u003c/code>\n\u003ccode class=\"cmd\">help\u003c/code>\n\u003ccode class=\"cmd\">search type:auxiliary name:ssh\u003c/code>\n\u003ccode class=\"cmd\">use &lt;module path from search&gt;\u003c/code>\n\u003ccode class=\"cmd\">info\u003c/code>\n\u003ccode class=\"cmd\">show options\u003c/code>\n\u003ccode class=\"cmd\">back\u003c/code>\n\u003ctable>\u003ctr>\u003cth>Command\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>search\u003c/td>\u003ctd>find modules by name, type or platform\u003c/td>\u003c/tr>\u003ctr>\u003ctd>use\u003c/td>\u003ctd>select a module\u003c/td>\u003c/tr>\u003ctr>\u003ctd>info\u003c/td>\u003ctd>read description, author, references, targets, risk notes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>show options\u003c/td>\u003ctd>list settings; \"Required = yes\" must be filled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>back\u003c/td>\u003ctd>leave the module\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sub\">Tip: in \u003ccode>info\u003c/code>, look for the platform, the reference (CVE) and the \"Description\". That is your documentation.\u003c/p>\u003c/details>\n\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 2: Guided lab on the instructor's vulnerable VM\u003c/summary>\n\u003cdiv class=\"flow\" id=\"p2flow\">\u003c/div>\n\u003cp class=\"sub\">Follow the instructor's lab guide exactly for the module and settings. Typical shape:\u003c/p>\n\u003ccode class=\"cmd\">nmap -sV &lt;lab-target-ip&gt;       # identify service + version (lab IP only)\u003c/code>\n\u003ccode class=\"cmd\">use &lt;module given in the lab guide&gt;\u003c/code>\n\u003ccode class=\"cmd\">set RHOSTS &lt;lab-target-ip&gt;     # re-check the IP before pressing Enter\u003c/code>\n\u003ccode class=\"cmd\">check                           # non-destructive check, when the module supports it\u003c/code>\n\u003cdiv class=\"warnbox\">If \u003ccode>check\u003c/code> already confirms the issue, \u003cb>stop and document it\u003c/b>. Run the actual module only if the lab sheet explicitly says so.\u003c/div>\u003c/details>\n\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 3: When is a non-destructive check enough?\u003c/summary>\n\u003cul>\u003cli>✅ Version/banner matches a known vulnerable release\u003c/li>\u003cli>✅ \u003ccode>check\u003c/code> says the target \"appears vulnerable\"\u003c/li>\u003cli>✅ The report needs only \u003ci>proof of existence\u003c/i>\u003c/li>\u003cli>❌ Don't add persistence, extra payloads or open sensitive files\u003c/li>\u003c/ul>\n\u003cp class=\"sub\">Use the evidence ladder in section 3 to demonstrate this to your instructor.\u003c/p>\u003c/details>\n\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 4: Restore VM and document before/after\u003c/summary>\n\u003cp>Use your hypervisor (VirtualBox/VMware): \u003cb>Snapshots → select clean snapshot → Restore\u003c/b>. Then record services, files and state exactly like the simulator table above.\u003c/p>\u003c/details>\n\n\u003ch3 class=\"reveal\">📝 Expected Output: Controlled-Lab Exercise Sheet (template)\u003c/h3>\n\u003cdiv class=\"card reveal\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>What to write\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Lab info\u003c/td>\u003ctd class=\"ph\">Date, VM name, target IP, authorization reference\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Prerequisites\u003c/td>\u003ctd class=\"ph\">OS, service/version, snapshot name, tools, scope\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Findings\u003c/td>\u003ctd class=\"ph\">Vulnerability name/CVE, how validated, evidence (screenshot/log), severity\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Actions taken\u003c/td>\u003ctd class=\"ph\">Exact commands, time, result (check only or run)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cleanup\u003c/td>\u003ctd class=\"ph\">Sessions closed, snapshot restored, before/after state\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mitigation\u003c/td>\u003ctd class=\"ph\">Patch/upgrade, disable service, firewall rule, least privilege, monitoring\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003c!-- ================= DAY 15 ================= -->\n\u003cdiv style=\"text-align:center;margin-top:60px\">\u003cspan class=\"daytag\" id=\"d15\">DAY 15\u003c/span>\u003c/div>\n\u003ch2 style=\"justify-content:center;text-align:center;flex-direction:column\">Operating System Hardening &amp; System Security\u003c/h2>\n\u003cp class=\"sub\" style=\"text-align:center\">Hardening = \u003cb>shrink the attack surface\u003c/b>: fewer users, fewer doors, fewer open ports, more updates.\u003c/p>\n\u003cdiv class=\"card reveal\">\u003cdiv class=\"flow\" id=\"hardflow\">\u003c/div>\u003c/div>\n\n\u003ch2 id=\"priv\" class=\"reveal\">\u003cspan class=\"n\">1\u003c/span>Linux Users, sudo &amp; Least Privilege\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>🔑 Least privilege (analogy)\u003c/h3>\u003cp>A guest gets a room key, not the master key. Give each user only the access needed for their job.\u003c/p>\n    \u003cdiv style=\"text-align:center;font-size:34px\" id=\"keys\">🙂🔑 normal user\u003c/div>\n    \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn\" onclick=\"keyToggle()\">Switch role\u003c/button>\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Who am I?\u003c/h3>\n  \u003ccode class=\"cmd\">whoami\u003c/code>\u003cp class=\"sub\">Prints your username.\u003c/p>\n  \u003ccode class=\"cmd\">id\u003c/code>\u003cp class=\"sub\">Shows your user ID, group IDs and groups (e.g. is \u003ccode>sudo\u003c/code> listed?).\u003c/p>\n  \u003ccode class=\"cmd\">sudo -l\u003c/code>\u003cp class=\"sub\">Lists what you are allowed to run as admin.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cul class=\"reveal\">\u003cli>\u003cb>root\u003c/b> = all-powerful account. Don't log in as root daily.\u003c/li>\u003cli>\u003cb>sudo\u003c/b> = run ONE command as admin, and it is logged.\u003c/li>\u003cli>Edit sudo rules only with \u003ccode>sudo visudo\u003c/code> (checks syntax so you don't lock yourself out).\u003c/li>\u003c/ul>\n\n\u003ch2 id=\"perm\" class=\"reveal\">\u003cspan class=\"n\">2\u003c/span>File Permissions (interactive)\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Tick boxes: r = read (4), w = write (2), x = execute (1). The number is the sum for each group.\u003c/p>\n  \u003cdiv class=\"pg\" id=\"pg\">\u003c/div>\n  \u003cdiv class=\"bigtxt\" id=\"permtxt\">\u003c/div>\u003cdiv style=\"text-align:center\" id=\"permcmd\">\u003c/div>\n  \u003cdiv style=\"text-align:center\">\u003cbutton class=\"btn alt\" onclick=\"setPerm('644')\">644 file\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"setPerm('755')\">755 script\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"setPerm('600')\">600 secret\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"setPerm('777')\">777 ⚠️\u003c/button>\u003c/div>\n  \u003cdiv class=\"explain\" id=\"permwarn\">\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"ssh\" class=\"reveal\">\u003cspan class=\"n\">3\u003c/span>SSH Security\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>🚪 SSH = remote door to Linux\u003c/h3>\u003cp>Attackers try thousands of passwords on it. Lock it down in \u003ccode>/etc/ssh/sshd_config\u003c/code>.\u003c/p>\n  \u003ctable>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Safer value\u003c/th>\u003c/tr>\u003ctr>\u003ctd>PermitRootLogin\u003c/td>\u003ctd>no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PasswordAuthentication\u003c/td>\u003ctd>no (after keys work)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PubkeyAuthentication\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MaxAuthTries\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AllowUsers\u003c/td>\u003ctd>only needed users\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Safe change routine\u003c/h3>\n  \u003cdiv class=\"flow\" id=\"sshflow\" style=\"gap:4px\">\u003c/div>\n  \u003ccode class=\"cmd\">sudo sshd -t\u003c/code>\u003cp class=\"sub\">Tests config syntax before restart.\u003c/p>\n  \u003cdiv class=\"warnbox\">Keep a second SSH session open while testing, so you can't lock yourself out.\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"ufw\" class=\"reveal\">\u003cspan class=\"n\">4\u003c/span>Firewall Basics: UFW Simulator\u003c/h2>\n\u003cdiv class=\"card reveal\">\n  \u003cp class=\"sub\">Default policy: \u003cb>deny incoming\u003c/b>, allow outgoing. Add rules for only what's needed. Click a port to send a packet.\u003c/p>\n  \u003cdiv class=\"fw\">\u003cdiv class=\"endp\">🌐\u003cbr>Outside\u003c/div>\u003cdiv class=\"pkt\" id=\"pkt\">TCP\u003c/div>\u003cdiv class=\"wall\">\u003c/div>\u003cdiv class=\"endp\">🖥️\u003cbr>Your server\u003c/div>\u003c/div>\n  \u003cdiv id=\"fwres\" class=\"explain\">Pick a port to test 👇\u003c/div>\n  \u003cdiv style=\"text-align:center\" id=\"portbtns\">\u003c/div>\n  \u003cdiv class=\"two\" style=\"margin-top:12px\">\n    \u003cdiv class=\"rules\">\u003ch3>Rules (toggle allow)\u003c/h3>\u003cdiv id=\"rules\">\u003c/div>\u003c/div>\n    \u003cdiv>\u003ch3>What \u003ccode>ufw status verbose\u003c/code> would show\u003c/h3>\u003cpre class=\"cmd\" id=\"ufwout\" style=\"white-space:pre-wrap;cursor:default\">\u003c/pre>\u003c/div>\n  \u003c/div>\n  \u003ccode class=\"cmd\">sudo ufw status verbose\u003c/code>\n  \u003ccode class=\"cmd\">sudo ufw allow 22/tcp\u003c/code>\n  \u003ccode class=\"cmd\">sudo ufw delete allow 22/tcp\u003c/code>\n  \u003cdiv class=\"warnbox\">Allow SSH \u003cb>before\u003c/b> enabling UFW on a remote machine, otherwise you cut your own connection. Only in the lab VM: add a rule, verify, remove it, verify again.\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"win\" class=\"reveal\">\u003cspan class=\"n\">5\u003c/span>Windows Hardening\u003c/h2>\n\u003cdiv class=\"grid reveal\" id=\"wingrid\">\u003c/div>\n\u003cdiv class=\"card reveal\" style=\"margin-top:14px\">\u003ch3>Audit-log event IDs to know (Event Viewer → Windows Logs → Security)\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>4624\u003c/td>\u003ctd>Successful logon\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4625\u003c/td>\u003ctd>Failed logon (many in a row = guessing attack)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4720\u003c/td>\u003ctd>User account created\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003ch2 id=\"maint\" class=\"reveal\">\u003cspan class=\"n\">6\u003c/span>Services, Patching, Backups &amp; Endpoint Protection\u003c/h2>\n\u003cdiv class=\"grid reveal\">\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🔌\u003c/span>\u003ch3>Services\u003c/h3>\u003cp>Every running service is a door. Disable it only after you confirm nothing depends on it.\u003c/p>\u003ccode class=\"cmd\">systemctl --type=service --state=running\u003c/code>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🩹\u003c/span>\u003ch3>Patching\u003c/h3>\u003cp>Most attacks use known, already-fixed bugs. Update regularly.\u003c/p>\u003ccode class=\"cmd\">sudo apt update &amp;&amp; sudo apt upgrade\u003c/code>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">💾\u003c/span>\u003ch3>Backups: 3-2-1\u003c/h3>\u003cp>\u003cb>3\u003c/b> copies, \u003cb>2\u003c/b> different media, \u003cb>1\u003c/b> off-site. Test restores!\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003cspan class=\"big\">🦠\u003c/span>\u003ch3>Endpoint protection\u003c/h3>\u003cp>Antivirus/EDR (e.g. Windows Defender) catches known malware and suspicious behaviour.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"cis\" class=\"reveal\">\u003cspan class=\"n\">7\u003c/span>Secure Baselines &amp; CIS Benchmarks\u003c/h2>\n\u003cdiv class=\"two reveal\">\n  \u003cdiv class=\"card\">\u003ch3>📐 Baseline\u003c/h3>\u003cp>A written \"this is how every machine must be configured\" standard. Measure each system against it.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>📚 CIS Benchmarks\u003c/h3>\u003cp>Free, community-written, step-by-step hardening guides per OS. \u003cb>Level 1\u003c/b> = basic, low impact. \u003cb>Level 2\u003c/b> = stricter, may affect usability.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"p15\" class=\"reveal\">\u003cspan class=\"n\">8\u003c/span>Day 15 Practicals, Step by Step\u003c/h2>\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 1: Audit users, permissions &amp; listening services\u003c/summary>\n\u003ccode class=\"cmd\">whoami\u003c/code>\u003ccode class=\"cmd\">id\u003c/code>\u003ccode class=\"cmd\">ss -tuln\u003c/code>\u003ccode class=\"cmd\">systemctl --type=service --state=running\u003c/code>\n\u003ch3>How to read \u003ccode>ss -tuln\u003c/code>\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Flag\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>t / u\u003c/td>\u003ctd>TCP / UDP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>l\u003c/td>\u003ctd>only listening sockets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>n\u003c/td>\u003ctd>show numbers, not names\u003c/td>\u003c/tr>\u003c/table>\n\u003cpre class=\"cmd\" style=\"cursor:default;white-space:pre\">Netid State  Local Address:Port\ntcp   LISTEN 0.0.0.0:22        ← SSH open to everyone\ntcp   LISTEN 127.0.0.1:3306    ← database, local only (good)\nudp   UNCONN 0.0.0.0:68        ← DHCP client\u003c/pre>\n\u003cp class=\"sub\">\u003ccode>0.0.0.0\u003c/code> = reachable from the network. \u003ccode>127.0.0.1\u003c/code> = this machine only. Ask for each listener: \u003ci>Do I need this?\u003c/i>\u003c/p>\u003c/details>\n\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 2: Inspect UFW; add/remove an approved rule in the lab VM\u003c/summary>\n\u003ccode class=\"cmd\">sudo ufw status verbose\u003c/code>\n\u003cp>Then: add the approved rule → check status → remove it → check status again. Use the simulator above to practise first.\u003c/p>\u003c/details>\n\n\u003cdetails open class=\"reveal\">\u003csummary>Practical 3: Before/after hardening checklist (interactive)\u003c/summary>\n\u003cdiv class=\"two\">\u003cdiv id=\"hchk\">\u003c/div>\n\u003cdiv class=\"card\" style=\"text-align:center\">\u003ch3>Hardening score\u003c/h3>\u003cdiv class=\"bigtxt\" id=\"hscore\">0%\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"hbar\">\u003c/i>\u003c/div>\u003cp class=\"sub\" id=\"hmsg\">\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"warnbox\">Disable a service only after confirming dependency (\u003ccode>systemctl list-dependencies\u003c/code>, check what uses the port).\u003c/div>\u003c/details>\n\n\u003ch3 class=\"reveal\">📝 Expected Output: Hardening Report (template)\u003c/h3>\n\u003cdiv class=\"card reveal\">\u003ctable>\n\u003ctr>\u003cth>Section\u003c/th>\u003cth>What to write\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>System\u003c/td>\u003ctd class=\"ph\">OS, version, hostname, date\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Before state\u003c/td>\u003ctd class=\"ph\">Users, sudo users, open ports, running services, firewall status\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Changes made\u003c/td>\u003ctd class=\"ph\">Each change + reason + command used\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>After state\u003c/td>\u003ctd class=\"ph\">Same checks repeated\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Verification\u003c/td>\u003ctd class=\"ph\">Commands proving it works (\u003ccode>ss -tuln\u003c/code>, \u003ccode>ufw status\u003c/code>), services still OK\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Remaining risks\u003c/td>\u003ctd class=\"ph\">What is not fixed yet and why\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003ch2 id=\"rev\" class=\"reveal\">\u003cspan class=\"n\">★\u003c/span>Quick Revision Flashcards (click to flip)\u003c/h2>\n\u003cdiv class=\"grid reveal\" id=\"cards\">\u003c/div>\n\n\u003cp style=\"text-align:center;color:var(--muted);margin-top:50px\">Practise only in authorized labs · Check first, exploit last · Always clean up 🧹\u003c/p>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\n/* ===== THEMES ===== */\nconst THEMES=[[\"galaxy\",\"🌌 Galaxy\"],[\"blackhole\",\"🕳️ Black Hole\"],[\"supernova\",\"💥 Supernova\"],[\"aurora\",\"🌿 Aurora\"],[\"cyber\",\"🌆 Cyberpunk\"],[\"ocean\",\"🌊 Deep Ocean\"],[\"sunset\",\"🌇 Sunset Retro\"],[\"paper\",\"📄 Light Paper\"]];\nconst tb=$('#themebar');\nTHEMES.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>setTheme(k);b.dataset.k=k;tb.appendChild(b)});\nfunction setTheme(k){document.body.dataset.theme=k;theme=k;$$('#themebar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));init();try{localStorage.setItem('th',k)}catch(e){}}\n/* ===== BACKGROUND CANVAS ===== */\nconst cv=$('#bg'),c=cv.getContext('2d');let W,H,t=0,theme='galaxy',P=[];\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}\nfunction R(a,b){return a+Math.random()*(b-a)}\nfunction init(){P=[];\n if(theme==='galaxy')for(let i=0;i\u003c160;i++)P.push({x:R(0,W),y:R(0,H),r:R(.4,2),ph:R(0,6)});\n if(theme==='blackhole')for(let i=0;i\u003c450;i++)P.push({a:R(0,6.28),r:R(70,Math.min(W,H)*.5),s:0,o:R(.2,.9)});\n if(theme==='supernova')for(let i=0;i\u003c170;i++)P.push(sp());\n if(theme==='ocean')for(let i=0;i\u003c55;i++)P.push({x:R(0,W),y:R(0,H),r:R(2,12),s:R(.3,1.3),ph:R(0,6)});\n if(theme==='sunset'||theme==='paper')for(let i=0;i\u003c40;i++)P.push({x:R(0,W),y:R(0,H),r:R(4,26),s:R(.1,.5),ph:R(0,6)});\n}\nfunction sp(){const a=R(0,6.28),v=R(.5,4);return{x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(60,200),m:200}}\nfunction draw(){t++;c.clearRect(0,0,W,H);\n if(theme==='galaxy'){\n  [[.2,.3,'rgba(120,80,255,.22)'],[.8,.6,'rgba(60,140,255,.2)'],[.5,.9,'rgba(200,80,255,.15)']].forEach(([x,y,col],i)=>{const g=c.createRadialGradient(W*x+Math.sin(t/200+i)*40,H*y,0,W*x,H*y,W*.4);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H)});\n  P.forEach(p=>{c.globalAlpha=.4+.6*Math.abs(Math.sin(t*.03+p.ph));c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()});c.globalAlpha=1}\n else if(theme==='blackhole'){const cx=W*.5,cy=H*.45;\n  P.forEach(p=>{p.a+=.9/Math.sqrt(p.r)*.12;const x=cx+Math.cos(p.a)*p.r*1.6,y=cy+Math.sin(p.a)*p.r*.38;c.globalAlpha=p.o*(1-p.r/(Math.min(W,H)*.6));c.fillStyle=p.r\u003c150?'#fff3d0':'#ff8a2a';c.fillRect(x,y,2,2)});c.globalAlpha=1;\n  const g=c.createRadialGradient(cx,cy,30,cx,cy,140);g.addColorStop(0,'#000');g.addColorStop(.45,'#000');g.addColorStop(.6,'rgba(255,160,60,.4)');g.addColorStop(1,'transparent');c.fillStyle=g;c.beginPath();c.arc(cx,cy,140,0,6.28);c.fill()}\n else if(theme==='supernova'){const g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,260);g.addColorStop(0,'rgba(255,220,100,.25)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);\n  P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.l--;const a=Math.max(p.l/p.m,0);c.fillStyle=`hsla(${15+a*40},100%,${50+a*20}%,${a})`;c.beginPath();c.arc(p.x,p.y,2.2,0,6.28);c.fill();if(p.l\u003c=0)P[i]=sp()})}\n else if(theme==='aurora'){for(let i=0;i\u003c4;i++){const base=H*(.2+i*.1);const g=c.createLinearGradient(0,base-90,0,base+170);const col=['61,245,176','79,216,255','140,120,255','60,255,120'][i];g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.5,`rgba(${col},.28)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.moveTo(0,H);for(let x=0;x\u003c=W;x+=10)c.lineTo(x,base+Math.sin(x*.004+t*.012+i*1.7)*70+Math.sin(x*.011+t*.02)*20);c.lineTo(W,H);c.fill()}}\n else if(theme==='cyber'){const hz=H*.55;c.lineWidth=1;c.strokeStyle='rgba(255,47,208,.55)';\n  for(let i=0;i\u003c22;i++){const z=((i+(t*.04)%1)/22);const y=hz+z*z*(H-hz);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}\n  c.strokeStyle='rgba(0,240,255,.45)';for(let i=-16;i\u003c=16;i++){c.beginPath();c.moveTo(W/2+i*20,hz);c.lineTo(W/2+i*W*.14,H);c.stroke()}\n  const g=c.createLinearGradient(0,hz-80,0,hz);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(255,47,208,.3)');c.fillStyle=g;c.fillRect(0,hz-80,W,80)}\n else if(theme==='ocean'){P.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t*.02+p.ph)*.4;if(p.y\u003c-20){p.y=H+20;p.x=R(0,W)}c.strokeStyle='rgba(92,255,217,.55)';c.fillStyle='rgba(47,184,255,.12)';c.shadowColor='#5cffd9';c.shadowBlur=10;c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill();c.stroke();c.shadowBlur=0})}\n else if(theme==='sunset'){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(60,20,110,.45)');g.addColorStop(.6,'rgba(255,95,162,.3)');g.addColorStop(1,'rgba(255,160,60,.45)');c.fillStyle=g;c.fillRect(0,0,W,H);\n  const sy=H*.72+Math.sin(t*.01)*6;const sg=c.createRadialGradient(W*.5,sy,10,W*.5,sy,170);sg.addColorStop(0,'rgba(255,230,140,.95)');sg.addColorStop(.5,'rgba(255,120,60,.55)');sg.addColorStop(1,'transparent');c.fillStyle=sg;c.beginPath();c.arc(W*.5,sy,170,0,6.28);c.fill();\n  P.forEach(p=>{p.x+=p.s;if(p.x>W+30)p.x=-30;c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n else if(theme==='paper'){P.forEach(p=>{p.y-=p.s*.5;p.x+=Math.sin(t*.01+p.ph)*.3;if(p.y\u003c-30)p.y=H+30;c.fillStyle='rgba(74,69,224,.07)';c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()})}\n requestAnimationFrame(draw)}\naddEventListener('resize',rs);\n\n/* ===== helpers ===== */\ndocument.addEventListener('click',e=>{const m=e.target.closest('.cmd');if(m&&!m.id){navigator.clipboard&&navigator.clipboard.writeText(m.textContent.replace(/\\s+#.*$/,'').trim());m.classList.add('done');setTimeout(()=>m.classList.remove('done'),1200)}});\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.08});\nfunction mkFlow(el,items){el.innerHTML=items.map(i=>`\u003cdiv class=\"node\">\u003cspan class=\"big\">${i[0]}\u003c/span>\u003cb>${i[1]}\u003c/b>\u003c/div>`).join('')}\n\n/* ===== key word cards ===== */\nconst WORDS=[[\"🪟\",\"Vulnerability\",\"A weakness: the unlocked window.\",\"A flaw in software or configuration that could be abused.\"],[\"🗝️\",\"Exploit\",\"The trick that uses the weakness.\",\"Code or technique that takes advantage of a vulnerability.\"],[\"📦\",\"Payload\",\"What runs after the exploit works.\",\"The action delivered. In the lab, keep it harmless and minimal.\"],[\"📞\",\"Session\",\"An open phone line to the target.\",\"A live connection (e.g. Meterpreter/shell) that must be closed at the end.\"],[\"🔍\",\"Post-exploitation\",\"What you do once inside.\",\"In a lab: confirm impact and document. No persistence, no real data.\"]];\n$('#wordcards').innerHTML=WORDS.map(w=>`\u003cdiv class=\"card fc\" style=\"padding:0;height:150px\" onclick=\"this.classList.toggle('flip')\">\u003cdiv>\u003cspan>\u003cb class=\"big\">${w[0]}\u003c/b>\u003cb>${w[1]}\u003c/b>\u003csmall>${w[2]}\u003c/small>\u003c/span>\u003cspan>${w[3]}\u003c/span>\u003c/div>\u003c/div>`).join('');\n$$('#wordcards .fc').forEach(f=>f.style.height='170px');\n\n/* ===== lifecycle ===== */\nconst LC=[[\"📋\",\"1 Scope & Authorize\",\"Get written permission, scope and target IP. No permission = no test.\"],[\"🔎\",\"2 Recon\",\"Identify OS, services and versions on the lab target.\"],[\"✅\",\"3 Validate\",\"Confirm the weakness with a non-destructive check.\"],[\"💥\",\"4 Exploit (if allowed)\",\"Run the module only when the lab sheet says so. Check options first.\"],[\"📞\",\"5 Session / Post\",\"Prove impact minimally, then close the session. No persistence.\"],[\"🧹\",\"6 Cleanup & Report\",\"Restore snapshot, document before/after, write mitigation.\"]];\nmkFlow($('#flow'),LC.map(x=>[x[0],x[1]]));\nlet fi=-1,ft;function playFlow(){stopFlow();fi=-1;step();ft=setInterval(step,2200)}\nfunction step(){fi=(fi+1)%LC.length;$$('#flow .node').forEach((n,i)=>n.classList.toggle('act',i===fi));$('#flowtxt').innerHTML=`\u003cb>${LC[fi][1]}:\u003c/b> ${LC[fi][2]}`}\nfunction stopFlow(){clearInterval(ft)}\n\n/* ===== ladder ===== */\nconst LAD=[[\"Check version/banner\",\"Read-only. Safest.\"],[\"Run safe `check` / scanner\",\"Non-destructive confirmation.\"],[\"Controlled exploit (lab sheet only)\",\"Changes target state.\"],[\"Extra payloads / more access\",\"Unnecessary for proof.\"],[\"Persistence / sensitive data\",\"Never needed for validation.\"]];\nfunction ladder(){const v=+$('#ladder').value;$('#ladderbox').innerHTML=LAD.map((r,i)=>`\u003cdiv class=\"rung ${i+1>v?'stop':''} ${i+1===v?'cur':''}\">\u003cspan class=\"big\" style=\"font-size:22px\">${i+1}\u003c/span>\u003cdiv>\u003cb>${r[0]}\u003c/b>\u003cbr>\u003csmall>${r[1]}\u003c/small>\u003c/div>\u003c/div>`).join('');\n $('#laddertxt').innerHTML=v\u003c=2?'✅ Great: evidence is gathered without touching the target. Document and stop.':v===3?'⚠️ Only if scope allows it. Snapshot ready? Authorization confirmed?':'🚫 Beyond what is needed. Extra risk, no extra proof.'}\n$('#ladder').oninput=ladder;ladder();\n\n/* ===== msf ===== */\nconst MODS={Exploits:[\"💥\",\"exploit/\",\"Code that uses a vulnerability. Needs a matching target and payload.\"],Payloads:[\"📦\",\"payload/\",\"What runs after an exploit succeeds (shell, session handler).\"],Auxiliary:[\"🔭\",\"auxiliary/\",\"Scanners, fuzzers, checks. No payload needed. Great for validation.\"],Post:[\"🧰\",\"post/\",\"Tasks run on an already open session. Use minimally in labs.\"],Encoders:[\"🔀\",\"encoder/\",\"Re-format payload bytes to fit constraints.\"],Nops:[\"⬜\",\"nop/\",\"Filler instructions used in some memory-corruption modules.\"]};\n$('#modchips').innerHTML=Object.keys(MODS).map(k=>`\u003cspan class=\"chip\" data-k=\"${k}\">${MODS[k][0]} ${k}\u003c/span>`).join('');\n$$('#modchips .chip').forEach(ch=>ch.onclick=()=>{$$('#modchips .chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');const m=MODS[ch.dataset.k];$('#modinfo').innerHTML=`\u003cb>${ch.dataset.k}\u003c/b> · folder \u003ccode>${m[1]}\u003c/code>\u003cbr>${m[2]}`});\nconst MS=[[\"search\",\"Find a module\"],[\"use\",\"Select it\"],[\"info\",\"Read the docs\"],[\"show options\",\"See settings\"],[\"set RHOSTS\",\"Set lab target IP\"],[\"check\",\"Non-destructive test\"],[\"run / exploit\",\"Only if allowed\"],[\"sessions -K\",\"Close sessions\"]];\n$('#msfsteps').innerHTML=MS.map(s=>`\u003cspan class=\"step\">${s[0]}\u003c/span>`).join('');let mi=0;setInterval(()=>{mi=(mi+1)%MS.length;$$('#msfsteps .step').forEach((s,i)=>s.classList.toggle('act',i===mi));$('#msfstepstxt').textContent=MS[mi][1]},1500);\n\n/* ===== compat ===== */\nfunction fit(){const a=$('#tOS').value,b=$('#pOS').value,v=$('#vOK').value==='1';const ok=a===b&&v;$('#fit').innerHTML=ok?'\u003cspan style=\"color:var(--good)\">✔ Compatible: validate/run per lab sheet\u003c/span>':`\u003cspan style=\"color:var(--bad)\">✖ Mismatch: ${a!==b?'payload does not match target OS/arch':'version not confirmed'}. It will fail or crash.\u003c/span>`}\n['#tOS','#pOS','#vOK'].forEach(s=>$(s).onchange=fit);fit();\n\n/* ===== preflight ===== */\nfunction pf(){const ip=$('#ipin').value.trim();const m=ip.match(/^192\\.168\\.56\\.(\\d{1,3})$/);const inScope=m&&+m[1]\u003c=255;$('#ipres').innerHTML=inScope?'\u003cspan class=\"pill ok\">✔ IP is inside lab scope\u003c/span>':'\u003cspan class=\"pill no\">✖ IP is OUTSIDE scope: do not touch\u003c/span>';\n const all=$$('.pf').every(x=>x.checked)&&inScope;$('#light').classList.toggle('go',all);$('#lighttxt').textContent=all?'GO (lab only)':'NO-GO'}\n$('#ipin').oninput=pf;$$('.pf').forEach(x=>x.onchange=pf);pf();\n\n/* ===== VM simulator ===== */\nlet snap=false,tested=false;\nfunction vmSnap(){snap=true;tested=false;$('#s1').textContent='5 services';$('#f1').textContent='0';$('#t1').textContent='Clean';['s2','s3','f2','f3','t2','t3'].forEach(i=>$('#'+i).textContent='–');$('#vmtxt').textContent='Snapshot saved ✔. Now run the lab test.'}\nfunction vmTest(){if(!snap){$('#vmtxt').textContent='⚠️ Take a snapshot FIRST.';return}tested=true;$('#vm').classList.add('bad');$('#vmstate').textContent='CHANGED';$('#vmico').textContent='⚠️';$('#s2').textContent='6 (one crashed/new)';$('#f2').textContent='14 logs/files';$('#t2').textContent='Modified';$('#vmtxt').textContent='The test changed the VM. Restore to clean.'}\nfunction vmRestore(){if(!snap){$('#vmtxt').textContent='No snapshot to restore.';return}$('#vm').classList.remove('bad');$('#vmstate').textContent='CLEAN';$('#vmico').textContent='🖥️';$('#s3').textContent='5 services';$('#f3').textContent='0';$('#t3').textContent='Clean (matches before)';$('#vmtxt').textContent=tested?'Restored ✔ After state matches Before. Document this table.':'Restored (nothing had changed).'}\n\n/* ===== Practical 2 flow ===== */\nmkFlow($('#p2flow'),[[\"🆔\",\"Verify IP\"],[\"📷\",\"Snapshot\"],[\"🔎\",\"Identify\"],[\"📖\",\"Read info\"],[\"✅\",\"Check\"],[\"🧹\",\"Restore\"]]);\nmkFlow($('#hardflow'),[[\"👥\",\"Users\"],[\"🔐\",\"Permissions\"],[\"🚪\",\"SSH\"],[\"🧱\",\"Firewall\"],[\"🔌\",\"Services\"],[\"🩹\",\"Patches\"],[\"💾\",\"Backups\"]]);\nmkFlow($('#sshflow'),[[\"💾\",\"Backup file\"],[\"✏️\",\"Edit\"],[\"🧪\",\"sshd -t\"],[\"🔄\",\"Restart\"],[\"🔓\",\"Test 2nd login\"]]);\n$$('.flow:not(#flow) .node').forEach((n,i)=>{n.style.animation=`bob 2s ${i*.2}s infinite`});\n\n/* ===== keys ===== */\nlet isRoot=false;function keyToggle(){isRoot=!isRoot;$('#keys').innerHTML=isRoot?'😈🗝️ root: can change EVERYTHING (risky!)':'🙂🔑 normal user: limited, safe'}\n\n/* ===== permissions ===== */\nconst pg=$('#pg');let html='\u003cdiv>\u003c/div>\u003cb style=\"text-align:center\">r 4\u003c/b>\u003cb style=\"text-align:center\">w 2\u003c/b>\u003cb style=\"text-align:center\">x 1\u003c/b>';\n['Owner','Group','Others'].forEach((o,i)=>{html+=`\u003cb>${o}\u003c/b>`;['r','w','x'].forEach((l,j)=>html+=`\u003clabel>\u003cinput type=\"checkbox\" data-i=\"${i}\" data-j=\"${j}\">\u003cspan>${l}\u003c/span>\u003c/label>`)});pg.innerHTML=html;\nfunction permCalc(){const n=[0,0,0];let s=['','',''];$$('#pg input').forEach(x=>{const i=+x.dataset.i,j=+x.dataset.j,v=[4,2,1][j];if(x.checked){n[i]+=v;s[i]+='rwx'[j]}else s[i]+='-'});$('#permtxt').textContent='-'+s.join('');const o=n.join('');$('#permcmd').innerHTML=`\u003ccode class=\"cmd\" style=\"display:inline-block\">chmod ${o} file.txt\u003c/code>`;$('#permwarn').innerHTML=o==='777'?'\u003cspan class=\"pill no\">⚠️ Everyone can modify: avoid!\u003c/span>':o[2]>=2?'\u003cspan class=\"pill wn\">Others can write: risky\u003c/span>':o==='600'?'\u003cspan class=\"pill ok\">Private to owner: good for secrets/keys\u003c/span>':'\u003cspan class=\"pill ok\">Reasonable\u003c/span>'}\nfunction setPerm(o){$$('#pg input').forEach(x=>{x.checked=!!(+o[+x.dataset.i]&[4,2,1][+x.dataset.j])});permCalc()}\n$$('#pg input').forEach(x=>x.onchange=permCalc);setPerm('644');\n\n/* ===== UFW simulator ===== */\nconst PORTS=[[22,'SSH'],[80,'HTTP'],[443,'HTTPS'],[3306,'MySQL'],[23,'Telnet']];const allow={22:true,80:true,443:false,3306:false,23:false};\n$('#portbtns').innerHTML=PORTS.map(p=>`\u003cbutton class=\"btn alt\" onclick=\"sendPkt(${p[0]})\">${p[0]} ${p[1]}\u003c/button>`).join('');\nfunction ufw(){$('#rules').innerHTML=PORTS.map(p=>`\u003cdiv class=\"r\">\u003cspan>${p[0]}/tcp ${p[1]}\u003c/span>\u003cbutton class=\"btn ${allow[p[0]]?'':'alt'}\" onclick=\"allow[${p[0]}]=!allow[${p[0]}];ufw()\">${allow[p[0]]?'ALLOW ✔':'DENY (default)'}\u003c/button>\u003c/div>`).join('');\n $('#ufwout').textContent='Status: active\\nDefault: deny (incoming), allow (outgoing)\\n\\nTo          Action  From\\n--          ------  ----\\n'+(PORTS.filter(p=>allow[p[0]]).map(p=>(p[0]+'/tcp').padEnd(12)+'ALLOW IN  Anywhere').join('\\n')||'(no allow rules)')}\nfunction sendPkt(p){const k=$('#pkt'),ok=allow[p],box=$('.fw'),w=box.clientWidth;k.textContent=p>999?'DB':p;k.style.transition='none';k.style.left='100px';k.style.opacity=1;k.style.background='var(--accent2)';\n requestAnimationFrame(()=>requestAnimationFrame(()=>{k.style.transition='left .8s linear';k.style.left=(w/2-34)+'px';setTimeout(()=>{if(ok){k.style.left=(w-140)+'px';$('#fwres').innerHTML=`\u003cspan class=\"pill ok\">PASSED\u003c/span> Port ${p} is allowed by a rule.`;setTimeout(()=>k.style.opacity=0,900)}else{k.style.background='var(--bad)';k.textContent='✖';$('#fwres').innerHTML=`\u003cspan class=\"pill no\">BLOCKED\u003c/span> Port ${p} hit the default deny.`;setTimeout(()=>k.style.opacity=0,700)}},850)}))}\nufw();\n\n/* ===== Windows ===== */\nconst WIN=[[\"🧱\",\"Defender Firewall\",\"Keep all 3 profiles (Domain/Private/Public) ON.\",\"Get-NetFirewallProfile\"],[\"🔄\",\"Updates\",\"Enable Windows Update; reboot to finish patches.\",\"Settings → Windows Update\"],[\"👤\",\"Account security\",\"Standard user for daily work, strong password, MFA, account lockout.\",\"net accounts\"],[\"📜\",\"Audit logs\",\"Log logons and account changes; review Event Viewer.\",\"eventvwr.msc\"],[\"🛡️\",\"Defender antivirus\",\"Real-time protection ON, signatures updated.\",\"Get-MpComputerStatus\"]];\n$('#wingrid').innerHTML=WIN.map(w=>`\u003cdiv class=\"card\">\u003cspan class=\"big\">${w[0]}\u003c/span>\u003ch3>${w[1]}\u003c/h3>\u003cp>${w[2]}\u003c/p>\u003ccode>${w[3]}\u003c/code>\u003c/div>`).join('');\n\n/* ===== hardening checklist ===== */\nconst HC=[\"Only needed users exist; no shared accounts\",\"Daily user is not root; sudo rights reviewed\",\"Sensitive files have restrictive permissions (e.g. 600)\",\"SSH: root login disabled, key auth preferred\",\"UFW enabled: default deny incoming, minimal allows\",\"Unneeded services disabled (dependency confirmed)\",\"System fully patched\",\"Backups configured and restore tested\",\"Endpoint protection active\",\"Before/after evidence saved\"];\n$('#hchk').innerHTML=HC.map((h,i)=>`\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" class=\"hc\"> ${h}\u003c/label>`).join('');\nfunction hscore(){const a=$$('.hc'),n=a.filter(x=>x.checked).length,p=Math.round(n/a.length*100);$('#hscore').textContent=p+'%';$('#hbar').style.width=p+'%';$('#hmsg').textContent=p===100?'🏆 Baseline met!':p>50?'Good progress. Finish the rest.':'Lots of attack surface left.'}\n$$('.hc').forEach(x=>x.onchange=hscore);hscore();\n\n/* ===== flashcards ===== */\nconst FC=[[\"Exploit vs payload?\",\"Exploit uses the flaw; payload is what runs afterward.\"],[\"Validation vs exploitation?\",\"Validation confirms a flaw without changing the target; exploitation actively abuses it.\"],[\"Before any action?\",\"Verify authorization and the target IP.\"],[\"`check` command?\",\"Non-destructive test inside many Metasploit modules.\"],[\"Why snapshot?\",\"To roll the lab VM back to a clean state.\"],[\"PoC?\",\"Smallest safe evidence that the flaw is real.\"],[\"Least privilege?\",\"Give only the access needed, nothing more.\"],[\"`ss -tuln`?\",\"Lists listening TCP/UDP ports (numeric).\"],[\"UFW default?\",\"Deny incoming, allow outgoing; add minimal rules.\"],[\"Safe SSH edit?\",\"Test with `sshd -t`, keep a 2nd session open.\"],[\"3-2-1 backup?\",\"3 copies, 2 media types, 1 off-site.\"],[\"CIS Benchmark?\",\"Consensus hardening guide, Level 1 basic, Level 2 strict.\"]];\n$('#cards').innerHTML=FC.map(f=>`\u003cdiv class=\"fc\" onclick=\"this.classList.toggle('flip')\">\u003cdiv>\u003cspan>${f[0]}\u003c/span>\u003cspan>${f[1]}\u003c/span>\u003c/div>\u003c/div>`).join('');\n\n$$('.reveal').forEach(e=>io.observe(e));\nrs();try{const s=localStorage.getItem('th');setTheme(s||'galaxy')}catch(e){setTheme('galaxy')}draw();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!DOCTYPE html>\u003chtml lang=\"en\" data-theme=\"galaxy\">\u003chead>\u003cscript>(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true})}catch(x){}try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Logs, SIEM & Incident Response – Visual Notes\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--t:#f0eeff;--m:#b8b4e0;--c:rgba(15,12,45,.8);--a:#a78bfa;--b:#60a5fa;--bt:#000;--bd:rgba(255,255,255,.16);--bg:radial-gradient(ellipse at 30% 20%,#3a1c71,#0b0b2b 60%,#02020c)}\n[data-theme=blackhole]{--t:#fff3e6;--m:#d9bfa3;--c:rgba(10,8,6,.84);--a:#ff9a3c;--b:#ffd9a0;--bg:radial-gradient(circle at 50% 45%,#2a1405,#000 70%)}\n[data-theme=supernova]{--t:#fff1e0;--m:#f0c6a6;--c:rgba(40,6,4,.82);--a:#ff7a1a;--b:#ffd23f;--bg:radial-gradient(circle at 50% 45%,#5a1010,#140202 75%)}\n[data-theme=aurora]{--t:#e8fff6;--m:#9fd8c6;--c:rgba(4,28,30,.82);--a:#34d399;--b:#2dd4bf;--bg:linear-gradient(180deg,#02130f,#06293a)}\n[data-theme=neon]{--t:#f7f0ff;--m:#c9b3ee;--c:rgba(16,4,34,.84);--a:#ff2bd6;--b:#00f0ff;--bg:linear-gradient(180deg,#0a0014,#1a0036)}\n[data-theme=ocean]{--t:#e6f6ff;--m:#9ccbe6;--c:rgba(0,24,48,.82);--a:#38bdf8;--b:#5eead4;--bg:linear-gradient(180deg,#00264d,#00060f)}\n[data-theme=sunset]{--t:#fff0e6;--m:#f5c9bd;--c:rgba(45,15,60,.84);--a:#ff9e5e;--b:#ff6fb5;--bg:linear-gradient(160deg,#ff9966,#ff5e62 40%,#5b2a86)}\n[data-theme=paper]{--t:#1d2433;--m:#4d5870;--c:rgba(255,255,255,.93);--a:#4f46e5;--b:#0891b2;--bt:#fff;--bd:rgba(0,0,0,.14);--bg:#f6f3ec}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}\nbody{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}textarea{width:100%;font:12px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:12.5px;margin:6px 0;line-height:1.6}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}u.k{color:#ffd23f;cursor:pointer;text-decoration:underline dotted}code{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.pt{cursor:pointer;border-bottom:2px dotted var(--b)}.pt:hover{background:rgba(127,127,127,.3)}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:90px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}td[contenteditable]:focus{outline:2px solid var(--a)}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}.cr{background:#ff2e2e;color:#fff}.nw{background:#7dd3fc}\n.bar2{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ffc24b;background:rgba(255,194,75,.14);border-radius:12px;padding:12px}\n.tv{border-left:3px solid var(--a);margin:10px 0 10px 8px;padding-left:16px}.tv div{position:relative;margin:10px 0}.tv div:before{content:'';position:absolute;left:-25px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--dot)}\n.doc{background:#fff;color:#111;border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14px}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🚨 Logs, SIEM & Incident Response\u003c/h1>\u003cp class=\"m\">Day 16 · Blue-team skills: read the evidence systems leave behind, spot an attack early, and respond in a calm, repeatable way. All logs below are \u003cb>synthetic\u003c/b> (documentation IPs).\u003c/p>\n\u003cdiv class=\"warn\">⚠️ Inspect only your own lab machine or instructor-provided logs. Real logs contain personal data: handle them carefully and share only with authorised people.\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">1️⃣ Log types & anatomy\u003c/div>\u003cdiv class=\"b\">2️⃣ IoCs & attack patterns\u003c/div>\u003cdiv class=\"b\">3️⃣ Triage, severity, evidence\u003c/div>\u003cdiv class=\"b\">4️⃣ Incident response lifecycle\u003c/div>\u003cdiv class=\"b\">5️⃣ SIEM & Wazuh\u003c/div>\u003cdiv class=\"b\">6️⃣ Practicals 1–4\u003c/div>\u003cdiv class=\"b\">7️⃣ Worksheet + timeline\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Log Types (click the underlined parts)\u003c/h2>\u003cdiv class=\"st\" id=\"lt\">\u003c/div>\u003cpre class=\"term\" id=\"ll\" style=\"margin-top:8px\">\u003c/pre>\u003cdiv class=\"b\" id=\"ld\">\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>Where to look\u003c/th>\u003cth>Linux\u003c/th>\u003cth>Windows\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Authentication\u003c/td>\u003ctd>\u003ccode>/var/log/auth.log\u003c/code> (Debian/Ubuntu), \u003ccode>/var/log/secure\u003c/code> (RHEL), \u003ccode>journalctl\u003c/code>\u003c/td>\u003ctd>Event Viewer → Security: 4625 failed logon, 4624 success\u003c/td>\u003c/tr>\u003ctr>\u003ctd>System\u003c/td>\u003ctd>\u003ccode>/var/log/syslog\u003c/code>, \u003ccode>journalctl\u003c/code>\u003c/td>\u003ctd>Event Viewer → System\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"m\">Keep clocks synchronised (NTP) and note the timezone, otherwise timelines from different systems will not line up.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Indicators of Compromise & Attack Patterns\u003c/h2>\n\u003cp>\u003cb>IoC\u003c/b> = a clue that a system may be compromised (a bad IP, file hash, domain, new account). \u003cb>IoA\u003c/b> = suspicious \u003ci>behaviour\u003c/i> in progress (many failures, unusual access).\u003c/p>\n\u003ch3>🎮 Classify each IoC\u003c/h3>\u003cdiv id=\"iq\">\u003c/div>\u003cdiv class=\"fb\" id=\"is\">\u003c/div>\n\u003ch3>🔍 Brute-force & unusual-access patterns\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">🔨 \u003cb>Brute-force\u003c/b>\u003cbr>Many failures on ONE account from one IP.\u003c/div>\u003cdiv class=\"b\">🌫️ \u003cb>Spraying / dictionary\u003c/b>\u003cbr>Failures across MANY usernames from one IP.\u003c/div>\u003cdiv class=\"b\">🎒 \u003cb>Credential stuffing\u003c/b>\u003cbr>Many accounts, one attempt each, many IPs.\u003c/div>\u003cdiv class=\"b\">🚩 \u003cb>Success after failures\u003c/b>\u003cbr>A login succeeds right after a burst: likely compromise.\u003c/div>\u003cdiv class=\"b\">🌙 \u003cb>Unusual access\u003c/b>\u003cbr>Odd hours, new country, new device.\u003c/div>\u003cdiv class=\"b\">🕵️ \u003cb>Post-compromise\u003c/b>\u003cbr>sudo to read sensitive files, new users, new cron jobs.\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Alert Triage, Severity, Escalation & Evidence\u003c/h2>\n\u003cdiv class=\"row\" id=\"tf\">\u003c/div>\u003cp class=\"m\">Flow: Alert → Validate → Scope → Severity → Escalate/Contain → Document.\u003c/p>\n\u003ch3>🎚️ Severity calculator (illustrative)\u003c/h3>\n\u003cdiv class=\"row\">Asset importance \u003cinput type=\"range\" id=\"s1\" min=\"1\" max=\"3\" value=\"2\"> Evidence confidence \u003cinput type=\"range\" id=\"s2\" min=\"1\" max=\"3\" value=\"2\"> Spread/impact \u003cinput type=\"range\" id=\"s3\" min=\"1\" max=\"3\" value=\"2\">\u003c/div>\u003cdiv class=\"b\" id=\"sv\">\u003c/div>\n\u003ch3>🎮 Triage game\u003c/h3>\u003cdiv id=\"tg\">\u003c/div>\u003cdiv class=\"fb\" id=\"ts\">\u003c/div>\n\u003ch3>🧊 Evidence preservation: order of volatility\u003c/h3>\u003cdiv id=\"ov\">\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:8px\">\u003cdiv class=\"b\">📸 Capture first, change later: copy logs, don't power off needlessly.\u003c/div>\u003cdiv class=\"b\">🔐 Hash evidence (SHA-256) so you can prove it was not altered.\u003c/div>\u003cdiv class=\"b\">📝 Chain of custody: who handled it, when, why.\u003c/div>\u003cdiv class=\"b\">🕒 Record timestamps and timezone.\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Incident Response Lifecycle\u003c/h2>\u003cdiv id=\"irs\">\u003c/div>\u003cdiv class=\"st\" id=\"irb\">\u003c/div>\u003cdiv class=\"b\" id=\"ird\" style=\"margin-top:8px\">\u003c/div>\u003cdiv id=\"irq\">\u003c/div>\u003cdiv class=\"fb\" id=\"irf\">\u003c/div>\n\u003cp class=\"m\">NIST SP 800-61 groups these as: Preparation → Detection & Analysis → Containment, Eradication & Recovery → Post-incident activity.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. SIEM Concepts & Wazuh\u003c/h2>\u003cp>\u003cb>SIEM\u003c/b> = Security Information and Event Management: collects logs from everywhere, normalises them, correlates events with rules, raises alerts and gives analysts one place to search.\u003c/p>\n\u003cdiv class=\"st\" id=\"t5\">\u003c/div>\u003cdiv id=\"b5\">\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:8px\">\u003cdiv class=\"b\">🤖 \u003cb>Wazuh agent\u003c/b>\u003cbr>Runs on endpoints, collects logs, file-integrity and inventory data.\u003c/div>\u003cdiv class=\"b\">🧠 \u003cb>Server / manager\u003c/b>\u003cbr>Decodes logs and applies rules (levels 0–15).\u003c/div>\u003cdiv class=\"b\">🗄️ \u003cb>Indexer\u003c/b>\u003cbr>Stores and searches events.\u003c/div>\u003cdiv class=\"b\">📊 \u003cb>Dashboard\u003c/b>\u003cbr>Alerts, search, compliance views.\u003c/div>\u003c/div>\n\u003cpre class=\"term\">\u003cspan class=\"cm\">&lt;!-- Illustrative custom rule (IDs differ in your ruleset) --&gt;\u003c/span>\n&lt;rule id=\"100100\" level=\"10\" frequency=\"5\" timeframe=\"120\"&gt;\n  &lt;if_matched_sid&gt;5716&lt;/if_matched_sid&gt;\n  &lt;same_source_ip /&gt;\n  &lt;description&gt;Multiple SSH failed logins from same IP&lt;/description&gt;\n&lt;/rule&gt;\u003c/pre>\u003cp class=\"m\">Other tools: Elastic Security, Splunk, Graylog, Security Onion. Wazuh also offers file-integrity monitoring and active response (e.g. temporary IP block).\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Authentication logs on your lab machine\u003c/h3>\u003cdiv class=\"row\" id=\"cm\">\u003c/div>\u003cpre class=\"term\" id=\"tm\">$ choose a command…\u003c/pre>\u003cdiv class=\"b\" id=\"tn\">Outputs are synthetic. Click yellow text for explanations.\u003c/div>\n\u003ch3>Practical 2 · Find repeated failed logins in synthetic logs\u003c/h3>\u003ctextarea id=\"lg\" rows=\"9\">\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"an\">🔎 Analyse\u003c/button>Alert threshold: \u003cinput type=\"range\" id=\"th2\" min=\"3\" max=\"10\" value=\"5\"> \u003cb id=\"tv\">\u003c/b> failures\u003c/div>\u003cdiv id=\"ao\">\u003c/div>\n\u003ch3>Practical 3 · Build the timeline (editable)\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"tl1\">⬇ Add findings from analysis\u003c/button>\u003cbutton class=\"x off\" id=\"tl2\">+ Row\u003c/button>\u003cbutton class=\"x off\" id=\"tl3\">Sort by time\u003c/button>\u003cbutton class=\"x off\" id=\"tl4\">CSV\u003c/button>\u003c/div>\u003cdiv class=\"tbl\">\u003ctable id=\"tt\">\u003c/table>\u003c/div>\u003ctextarea id=\"tc\" rows=\"4\" style=\"display:none\">\u003c/textarea>\u003cdiv class=\"tv\" id=\"tvv\">\u003c/div>\n\u003ch3>Practical 4 · Incident-response mini-report\u003c/h3>\u003cdiv id=\"rf\">\u003c/div>\u003cbutton class=\"x\" id=\"rb\">📝 Build report\u003c/button>\u003cdiv class=\"doc\" id=\"rd\" style=\"margin-top:8px;display:none\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Expected Output\u003c/h2>\u003ch3>📒 Log-analysis worksheet (from Practical 2, editable)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"ws\">\u003c/table>\u003c/div>\u003cp class=\"m\">Incident timeline: see Practical 3 (table + visual). Ctrl+P prints this page.\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Logs: who, what, when, where, from where\u003c/div>\u003cdiv class=\"b\">Brute-force = many failures · Spraying = many users · Success after failures = red flag\u003c/div>\u003cdiv class=\"b\">Triage: validate → scope → severity → escalate\u003c/div>\u003cdiv class=\"b\">Preserve evidence: capture, hash, custody\u003c/div>\u003cdiv class=\"b\">IR: Prepare → Detect → Contain → Eradicate → Recover → Learn\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h,esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\nfunction FLOW(tid,bid,D,L,R){let k=Object.keys(D)[0],n=0,tm;const r=()=>{const S=D[k][1];H_(tid,Object.keys(D).map(q=>`\u003cbutton class=\"${q==k?'on':''}\" data-k=\"${q}\">${D[q][0]}\u003c/button>`).join(''));\nH_(bid,`\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cb>${L}\u003c/b>\u003cb>${R}\u003c/b>\u003c/div>`+S.map((s,i)=>`\u003cdiv class=\"fl\" style=\"justify-content:${s[0]?'flex-end':'flex-start'};opacity:${i\u003cn?1:.15}\">\u003cspan class=\"b2\">${s[0]?'⬅ ':''}${s[1]}${s[0]?'':' ➡'}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"b\">${n?S[n-1][2]:'Press Next ▶'}\u003c/div>\u003cbutton class=\"x\" data-a=\"n\">Next ▶\u003c/button>\u003cbutton class=\"x off\" data-a=\"r\">Reset\u003c/button>\u003cbutton class=\"x off\" data-a=\"a\">Auto\u003c/button>`);\ndocument.querySelectorAll('#'+tid+' button').forEach(b=>b.onclick=()=>{clearInterval(tm);k=b.dataset.k;n=0;r()});\ndocument.querySelectorAll('#'+bid+' button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;clearInterval(tm);if(a=='n'){if(n\u003cS.length)n++;r()}else if(a=='r'){n=0;r()}else{n=0;r();tm=setInterval(()=>{if(n\u003cS.length){n++;r()}else clearInterval(tm)},1100)}})};r()}\nFLOW('t5','b5',{pl:['🧠 SIEM pipeline',[[0,'Logs from endpoints, firewalls, apps','Agents forward auth.log, firewall and application logs'],[0,'Parse & normalise','Decoders turn text into fields: src IP, user, action'],[1,'Correlate with rules','e.g. ≥5 failed logins from one IP in 2 minutes'],[1,'Alert + enrich','Severity level, threat-intel match, MITRE ATT&CK mapping'],[0,'Analyst triages in the dashboard','Search, filter, pivot to related events'],[1,'Response','Ticket, active response (block IP), report']]]},'📡 Sources / agents','🧠 SIEM');\n\n/* 1 log types */\nconst LG=[['🖥️ System',[['Oct 11 02:00:01','Timestamp (use NTP, note timezone)'],['labhost','Host that wrote the entry'],['systemd[1]:','Program[PID]'],['Started Daily apt download activities.','Message: normal event. Look for unexpected restarts or new services']]],['🔑 Authentication',[['Oct 11 02:17:49','Timestamp'],['labhost','Host'],['sshd[2145]:','SSH daemon'],['Failed password for priya from 198.51.100.7 port 60110
