;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea,select{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}input[type=text]{width:100%;max-width:320px}textarea{width:100%;font:12px monospace}select option{color:#000}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}code{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:80px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}td[contenteditable]:focus{outline:2px solid var(--a)}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}.nw{background:#7dd3fc}\n.bar2{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ffc24b;background:rgba(255,194,75,.14);border-radius:12px;padding:12px}\n.view{background:#fff;color:#111;border-radius:10px;padding:10px;min-height:44px;font-family:system-ui}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🎭 XSS, CSRF & Access Control\u003c/h1>\u003cp class=\"m\">Day 12 · Three classic web flaws: running attacker-controlled script (XSS), forcing your browser to act (CSRF), and viewing data you shouldn't (broken access control). Learn how each works and, more importantly, how to fix it.\u003c/p>\n\u003cdiv class=\"warn\">⚠️ Test only in your own training app or the instructor's isolated lab. All demos below are safe simulations using harmless markers; nothing here runs real attacker code.\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">1️⃣ XSS types\u003c/div>\u003cdiv class=\"b\">2️⃣ Output encoding lab\u003c/div>\u003cdiv class=\"b\">3️⃣ CSRF & defences\u003c/div>\u003cdiv class=\"b\">4️⃣ AuthN vs AuthZ, IDOR lab\u003c/div>\u003cdiv class=\"b\">5️⃣ Cookies, MFA, sessions\u003c/div>\u003cdiv class=\"b\">6️⃣ Practicals 1–4\u003c/div>\u003cdiv class=\"b\">7️⃣ Test cases + secure demo\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Cross-Site Scripting (XSS)\u003c/h2>\u003cp>The site puts \u003cb>untrusted input into a page without encoding\u003c/b>, so the browser treats data as code. Impact: actions as the victim, page defacement, session abuse.\u003c/p>\n\u003cdiv class=\"st\" id=\"t1\">\u003c/div>\u003cdiv id=\"b1\">\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Where input is stored/used\u003c/th>\u003cth>Who is hit\u003c/th>\u003cth>Main fix\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Reflected\u003c/td>\u003ctd>In the request, echoed in response\u003c/td>\u003ctd>Victim who opens the crafted link\u003c/td>\u003ctd>Output encoding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stored\u003c/td>\u003ctd>Saved in DB, shown later\u003c/td>\u003ctd>Every visitor of that page\u003c/td>\u003ctd>Encoding on output + validation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DOM-based\u003c/td>\u003ctd>Handled only by browser JavaScript\u003c/td>\u003ctd>Victim of the crafted URL\u003c/td>\u003ctd>Safe DOM APIs (textContent)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Output Encoding & Context-Aware Sanitisation\u003c/h2>\n\u003cp>\u003cb>Encoding\u003c/b> turns special characters into harmless text (\u003ccode>&lt;\u003c/code> → \u003ccode>&amp;lt;\u003c/code>). The right encoding depends on \u003cb>where\u003c/b> the data lands (HTML body, attribute, JavaScript, URL). \u003cb>Sanitisation\u003c/b> (allow-list libraries) is for when you must allow some HTML.\u003c/p>\n\u003ch3>🧪 Lab: type input, choose context, switch encoding\u003c/h3>\n\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"xi\" value=\"&lt;b&gt;hello&lt;/b&gt;\">\u003cbutton class=\"x\" id=\"xe\">Encoding: OFF ❌\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" id=\"xp\">\u003c/div>\u003cdiv class=\"st\" id=\"xc\" style=\"margin:6px 0\">\u003c/div>\n\u003cpre class=\"term\" id=\"xs\">\u003c/pre>\u003cdiv class=\"view\" id=\"xv\">\u003c/div>\u003cdiv class=\"b\" id=\"xn\" style=\"margin-top:6px\">\u003c/div>\n\u003cp class=\"m\">Defence in depth: add a \u003cb>Content-Security-Policy\u003c/b>, use framework auto-escaping, avoid \u003ccode>innerHTML\u003c/code>.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. CSRF (Cross-Site Request Forgery)\u003c/h2>\u003cp>Your browser \u003cb>automatically attaches cookies\u003c/b>. A malicious page makes your browser send a state-changing request to a site where you're logged in. The site can't tell it wasn't you.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"x off\" data-d=\"ss\">SameSite cookie\u003c/button>\u003cbutton class=\"x off\" data-d=\"tk\">Anti-CSRF token\u003c/button>\u003cbutton class=\"x off\" data-d=\"or\">Origin/Referer check\u003c/button>\u003cbutton class=\"x\" id=\"cg\">▶ Victim visits evil.example\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"cd\">Choose defences, then press the button.\u003c/pre>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🎟️ \u003cb>Anti-CSRF token\u003c/b>\u003cbr>Random per-session value placed in forms; server rejects requests without it. Attacker's page cannot read it (same-origin policy).\u003c/div>\u003cdiv class=\"b\">🍪 \u003cb>SameSite\u003c/b>\u003cbr>Lax/Strict stops cookies on most cross-site requests.\u003c/div>\u003cdiv class=\"b\">🔄 \u003cb>Also\u003c/b>\u003cbr>Use POST/PUT/DELETE for changes (never GET), re-authenticate for critical actions.\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Authentication vs Authorisation & IDOR\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🛂 \u003cb>Authentication\u003c/b> = \u003ci>Who are you?\u003c/i>\u003cbr>Password, OTP. Failure → 401.\u003c/div>\u003cdiv class=\"b\">🎫 \u003cb>Authorisation\u003c/b> = \u003ci>What may you do?\u003c/i>\u003cbr>Roles, ownership checks. Failure → 403.\u003c/div>\u003c/div>\n\u003ch3>🎮 Classify\u003c/h3>\u003cdiv id=\"aq\">\u003c/div>\u003cdiv class=\"fb\" id=\"as\">\u003c/div>\n\u003ch3>🔓 IDOR / BOLA\u003c/h3>\u003cp class=\"m\">Insecure Direct Object Reference (also called Broken Object Level Authorisation): app uses an ID from the request without checking that \u003cb>you own it\u003c/b>.\u003c/p>\n\u003ch3>🧪 Lab: two dummy users, private notes (Practical 3)\u003c/h3>\n\u003cdiv class=\"row\">Logged in as \u003cselect id=\"lu\">\u003coption value=\"alice\">Alice\u003c/option>\u003coption value=\"bob\">Bob\u003c/option>\u003coption value=\"\">Nobody\u003c/option>\u003c/select> requests \u003cselect id=\"lt\">\u003coption value=\"a\">Alice's note\u003c/option>\u003coption value=\"b\">Bob's note\u003c/option>\u003c/select> ID style \u003cbutton class=\"x off\" id=\"li\">Sequential\u003c/button> Server \u003cbutton class=\"x\" id=\"lm\">Vulnerable ❌\u003c/button>\u003cbutton class=\"x off\" id=\"ls\">Send ▶\u003c/button>\u003c/div>\n\u003cpre class=\"term\" id=\"lo\">\u003c/pre>\n\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"la\">▶ Run all test cases\u003c/button>\u003c/div>\u003cdiv class=\"tbl\">\u003ctable id=\"lr\">\u003c/table>\u003c/div>\n\u003cpre class=\"term\">\u003cspan class=\"er\">// vulnerable\u003c/span>\nnote = db.get(id)\nreturn note\n\n\u003cspan class=\"o\">// fixed: server-side authorisation\u003c/span>\nnote = db.get(id)\nif note is None or note.owner != session.user:\n    return 403        \u003cspan class=\"cm\">// or 404 to hide existence\u003c/span>\nreturn note\u003c/pre>\u003cp class=\"m\">⚠️ Unpredictable IDs (UUIDs) only make guessing harder; they are \u003cb>not\u003c/b> a fix. Always check ownership.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. Session Cookies, MFA & Session Expiry\u003c/h2>\n\u003ch3>🍪 Cookie flag builder\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" data-f=\"h\">HttpOnly\u003c/button>\u003cbutton class=\"x\" data-f=\"s\">Secure\u003c/button>\u003cbutton class=\"x off\" data-s=\"None\">SameSite=None\u003c/button>\u003cbutton class=\"x\" data-s=\"Lax\">Lax\u003c/button>\u003cbutton class=\"x off\" data-s=\"Strict\">Strict\u003c/button>\u003c/div>\n\u003cpre class=\"term\" id=\"cf\">\u003c/pre>\u003cdiv class=\"bar2\">\u003ci id=\"cb\">\u003c/i>\u003c/div>\u003cdiv class=\"b\" id=\"cn\" style=\"margin-top:6px\">\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">📱 \u003cb>MFA\u003c/b>\u003cbr>Combine factors: something you \u003cb>know\u003c/b> (password), \u003cb>have\u003c/b> (phone/app), \u003cb>are\u003c/b> (fingerprint). Stolen password alone is not enough. Require it for login and sensitive actions.\u003c/div>\u003cdiv class=\"b\">⏱️ \u003cb>Session expiry\u003c/b>\u003cbr>Idle timeout: \u003cb id=\"sv\">\u003c/b> min \u003cinput type=\"range\" id=\"sl\" min=\"1\" max=\"60\" value=\"15\">\u003cbr>\u003cspan id=\"sx\" class=\"m\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Inspect output encoding in a harmless input field\u003c/h3>\u003cdiv id=\"p1\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"b1p\">\u003c/i>\u003c/div>\n\u003cdiv class=\"b\" style=\"margin-top:6px\">Use the lab in section 2 first, then repeat on your training app: if \u003ccode>&lt;b&gt;hello&lt;/b&gt;\u003c/code> appears \u003cb>bold\u003c/b> it is NOT encoded; if shown literally and DevTools shows \u003ccode>&amp;lt;b&amp;gt;\u003c/code>, encoding works.\u003c/div>\n\u003ch3>Practical 2 · Instructor-provided XSS challenge (lab scope only)\u003c/h3>\u003cdiv id=\"p2\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"b2p\">\u003c/i>\u003c/div>\n\u003ch3>Practical 3 · User A vs User B (see the lab in section 4)\u003c/h3>\u003cdiv class=\"b\">Create two dummy users in your training app, give each one private record, then run the 6 test cases. If User A can open B's record → add the server-side owner check → rerun until all pass.\u003c/div>\n\u003ch3>Practical 4 · Cookie flags & CSRF verification checklist\u003c/h3>\u003cdiv id=\"p4\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"b4p\">\u003c/i>\u003c/div>\u003cdiv class=\"fb\" id=\"s4\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Expected Output\u003c/h2>\n\u003ch3>✅ Web security test cases (click Status to mark)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"tc\">\u003c/table>\u003c/div>\u003cdiv class=\"fb\" id=\"ts\">\u003c/div>\n\u003ch3>🛡️ Secure access-control demonstration\u003c/h3>\u003cp>Use the lab in section 4: switch Server to \u003cb>Fixed ✅\u003c/b> and press \"Run all test cases\". Expected: own record 200, other user's 403, anonymous 401.\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">XSS fix = encode output for its context (+ CSP)\u003c/div>\u003cdiv class=\"b\">CSRF fix = token + SameSite + Origin check\u003c/div>\u003cdiv class=\"b\">401 = authentication · 403 = authorisation\u003c/div>\u003cdiv class=\"b\">IDOR fix = server-side owner check\u003c/div>\u003cdiv class=\"b\">Cookies: HttpOnly · Secure · SameSite\u003c/div>\u003cdiv class=\"b\">MFA + session expiry + server-side logout\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h,esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\n\nfunction FLOW(tid,bid,D,L,R){let k=Object.keys(D)[0],n=0,tm;const r=()=>{const S=D[k][1];H_(tid,Object.keys(D).map(q=>`\u003cbutton class=\"${q==k?'on':''}\" data-k=\"${q}\">${D[q][0]}\u003c/button>`).join(''));\nH_(bid,`\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cb>${L}\u003c/b>\u003cb>${R}\u003c/b>\u003c/div>`+S.map((s,i)=>`\u003cdiv class=\"fl\" style=\"justify-content:${s[0]?'flex-end':'flex-start'};opacity:${i\u003cn?1:.15}\">\u003cspan class=\"b2\">${s[0]?'⬅ ':''}${s[1]}${s[0]?'':' ➡'}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"b\">${n?S[n-1][2]:'Press Next ▶'}\u003c/div>\u003cbutton class=\"x\" data-a=\"n\">Next ▶\u003c/button>\u003cbutton class=\"x off\" data-a=\"r\">Reset\u003c/button>\u003cbutton class=\"x off\" data-a=\"a\">Auto\u003c/button>`);\ndocument.querySelectorAll('#'+tid+' button').forEach(b=>b.onclick=()=>{clearInterval(tm);k=b.dataset.k;n=0;r()});\ndocument.querySelectorAll('#'+bid+' button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;clearInterval(tm);if(a=='n'){if(n\u003cS.length)n++;r()}else if(a=='r'){n=0;r()}else{n=0;r();tm=setInterval(()=>{if(n\u003cS.length){n++;r()}else clearInterval(tm)},1100)}})};r()}\nFLOW('t1','b1',{re:['🔁 Reflected',[[0,'Victim opens crafted link /search?q=…','Attacker tricks the victim into opening a URL carrying script-like input'],[1,'Page echoes q inside the HTML','Server inserts the input without encoding'],[0,'Browser treats it as code','Runs with the victim\\'s privileges on that site'],[1,'Fix: encode output','Browser would show harmless text instead']]],st:['💾 Stored',[[0,'Attacker posts a comment with script-like input','Saved in the database'],[1,'Server stores it unchanged','No encoding on output'],[0,'Any visitor opens the page','Server sends the stored comment inside HTML'],[1,'Runs for every visitor','Larger impact than reflected. Fix: output encoding']]],dm:['🧩 DOM-based',[[0,'Victim opens page#\u003cinput>','The part after # is never sent to the server'],[1,'Page JavaScript reads location.hash','Entirely client-side'],[0,'JS writes it using innerHTML','A dangerous \"sink\"'],[1,'Fix: use textContent / safe APIs','Server logs show nothing, so server-side tools miss it']]]},'🌐 Browser','🖥️ Site');\n\n/* encoding lab */\nconst CX=[['html','HTML body','\u003cp>Hello, {V}\u003c/p>'],['attr','HTML attribute','\u003cinput value=\"{V}\">'],['js','JavaScript string','\u003cscript>var name = {V};\u003c\\/script>'],['url','URL parameter','\u003ca href=\"/search?q={V}\">']];let cx2='html',eo=0;\nconst PRE=['\u003cb>hello\u003c/b>','\u003cscript>alert(1)\u003c\\/script>','\" onmouseover=\"alert(1)',\"'; alert(1);//\",'a&b=c#'];\nH_('xp',PRE.map((p,i)=>`\u003cbutton class=\"x off\" data-i=\"${i}\">${esc(p).slice(0,22)}\u003c/button>`).join(''));H_('xc',CX.map(c=>`\u003cbutton class=\"${c[0]==cx2?'on':''}\" data-k=\"${c[0]}\">${c[1]}\u003c/button>`).join(''));\nfunction encv(s,c){if(c=='url')return encodeURIComponent(s);if(c=='js')return JSON.stringify(s).replace(/\u003c/g,'\\\\u003c');return esc(s).replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}\nfunction rx(){const s=$('xi').value,c=CX.find(q=>q[0]==cx2);$('xe').textContent=eo?'Encoding: ON ✅':'Encoding: OFF ❌';$('xe').className='x'+(eo?' off':'');document.querySelectorAll('#xc button').forEach(b=>b.classList.toggle('on',b.dataset.k==cx2));\nconst v=eo?encv(s,cx2):(cx2=='js'?\"'\"+s+\"'\":s);H_('xs',esc(c[2].replace('{V}',v)));let vw='',nt='';\nif(eo){vw=esc(s);nt='\u003cspan style=\"color:#060\">✅ Safe: the input stays plain data in this context.\u003c/span>'}\nelse if(cx2=='html'){if(/\u003c\\s*script|on\\w+\\s*=|\u003c\\s*(img|svg|iframe)|javascript:/i.test(s)){vw='🚨 \u003cb>Script-like input would EXECUTE here (simulated, nothing ran).\u003c/b>';nt='\u003cspan style=\"color:#b00\">❌ Data became code → XSS.\u003c/span>'}else{vw=esc(s).replace(/&lt;(\\/?)(b|i|u)&gt;/g,'\u003c$1$2>');nt=/\u003c\\/?(b|i|u)>/.test(s)?'\u003cspan style=\"color:#b60\">⚠ Formatting tags were interpreted as HTML (not encoded). Proof that output is unencoded.\u003c/span>':'Looks harmless, but the context is still unprotected.'}}\nelse if(cx2=='attr'){vw=/\"/.test(s)?'🚨 The quote closes the attribute; extra attributes (like event handlers) could be injected.':esc(s);nt=/\"/.test(s)?'\u003cspan style=\"color:#b00\">❌ Attribute breakout.\u003c/span>':'No quote used here, but still unsafe in general.'}\nelse if(cx2=='js'){vw=/'|\u003c\\/script/i.test(s)?'🚨 The quote or closing tag escapes the JS string, so attacker code could run.':esc(s);nt=/'|\u003c\\/script/i.test(s)?'\u003cspan style=\"color:#b00\">❌ JS string breakout.\u003c/span>':'Prefer passing data as JSON, not by string concatenation.'}\nelse{vw=/[&#=?]/.test(s)?'⚠ Special characters change the URL structure (extra parameters or fragment).':esc(s);nt=/[&#=?]/.test(s)?'\u003cspan style=\"color:#b60\">❌ Parameter manipulation. Use URL-encoding.\u003c/span>':''}\nH_('xv','Browser view: '+vw);H_('xn',nt+'\u003cbr>\u003cspan class=\"m\">Correct defence: '+({html:'HTML-encode & n:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}input[type=text]{width:100%;max-width:340px}textarea{width:100%;font:13px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6;white-space:pre-wrap;word-break:break-all}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}.df{background:#ff7b7b;color:#000;border-radius:3px}code{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:80px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}td[contenteditable]:focus{outline:2px solid var(--a)}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}\n.bar2{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ffc24b;background:rgba(255,194,75,.14);border-radius:12px;padding:12px}\n.mx{display:grid;grid-template-columns:70px repeat(6,1fr);gap:4px;max-width:480px;margin:8px 0;font-size:11px}.mx div{padding:6px 2px;text-align:center;border-radius:6px;background:rgba(127,127,127,.18);transition:.25s}.mx .hit{background:#ff6b6b;color:#000;transform:scale(1.08)}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🔐 Password Security & Cryptography\u003c/h1>\u003cp class=\"m\">Day 13 · Crypto is the maths that protects secrets, proves identity and detects tampering. Most demos on this page use your browser's real crypto engine (SHA-256, AES-GCM, RSA). Practice only on your own lab data.\u003c/p>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">1️⃣ Factors, policy, strength\u003c/div>\u003cdiv class=\"b\">2️⃣ Hash vs encrypt vs encode\u003c/div>\u003cdiv class=\"b\">3️⃣ Salt & password hashing\u003c/div>\u003cdiv class=\"b\">4️⃣ Symmetric vs asymmetric, signatures\u003c/div>\u003cdiv class=\"b\">5️⃣ TLS, certificates, PKI\u003c/div>\u003cdiv class=\"b\">6️⃣ Password attacks & defences\u003c/div>\u003cdiv class=\"b\">7️⃣ Practicals 1–4\u003c/div>\u003cdiv class=\"b\">8️⃣ Lab sheet + checklist\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Authentication Factors & Password Policy\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🧠 \u003cb>Know\u003c/b>\u003cbr>password, PIN\u003c/div>\u003cdiv class=\"b\">📱 \u003cb>Have\u003c/b>\u003cbr>phone, hardware key, OTP app\u003c/div>\u003cdiv class=\"b\">👆 \u003cb>Are\u003c/b>\u003cbr>fingerprint, face\u003c/div>\u003c/div>\n\u003cp>\u003cb>MFA\u003c/b> = two or more \u003ci>different\u003c/i> factors. Modern policy advice: \u003cb>length over complexity\u003c/b> (long passphrases), allow paste/password managers, \u003cb>block breached and common passwords\u003c/b>, no forced periodic changes without cause, and rate-limit attempts.\u003c/p>\n\u003ch3>🧪 Password strength estimator (rough, illustrative)\u003c/h3>\u003cinput type=\"text\" id=\"pw\" value=\"Summer2024!\" autocomplete=\"off\">\u003cdiv class=\"bar2\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\u003cdiv id=\"pe\" class=\"b\" style=\"margin-top:6px\">\u003c/div>\n\u003cp class=\"m\">Assumes random characters. Real passwords follow patterns (words, years), so attackers use wordlists first. Rates: online ≈ 10 guesses/s (throttled); fast hash on GPUs ≈ 10 billion/s; slow hash (bcrypt/Argon2id) ≈ 1,000/s.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Hashing vs Encryption vs Encoding\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Encoding\u003c/th>\u003cth>Hashing\u003c/th>\u003cth>Encryption\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Purpose\u003c/td>\u003ctd>Format data\u003c/td>\u003ctd>Integrity / fingerprint\u003c/td>\u003ctd>Confidentiality\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reversible?\u003c/td>\u003ctd>Yes (anyone)\u003c/td>\u003ctd>No (one-way)\u003c/td>\u003ctd>Yes, with the key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key?\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Example\u003c/td>\u003ctd>Base64, URL\u003c/td>\u003ctd>SHA-256\u003c/td>\u003ctd>AES-GCM\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>🧪 Live lab: one input, three transformations\u003c/h3>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"ei\" value=\"Hello Lab\">\u003cbutton class=\"x\" id=\"en\">Encrypt (AES-GCM, passphrase \"lab-key\")\u003c/button>\u003c/div>\n\u003cpre class=\"term\" id=\"eo\">\u003c/pre>\u003cdiv class=\"row\">\u003cbutton class=\"x off\" id=\"d1\">Decode Base64?\u003c/button>\u003cbutton class=\"x off\" id=\"d2\">Un-hash SHA-256?\u003c/button>\u003cbutton class=\"x off\" id=\"d3\">Decrypt with right key\u003c/button>\u003cbutton class=\"x off\" id=\"d4\">Decrypt with wrong key\u003c/button>\u003c/div>\u003cdiv class=\"b\" id=\"dr\">Try reversing each one.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Salt, Password Hashing & Key Management (Practical 3)\u003c/h2>\n\u003cp>Plain SHA-256 is \u003cb>fast\u003c/b>, which is great for files but terrible for passwords: attackers test billions of guesses per second. A \u003cb>salt\u003c/b> is a unique random value per password so identical passwords give different hashes and precomputed tables fail. \u003cb>Password-hashing functions\u003c/b> (Argon2id, scrypt, bcrypt) add salt automatically and are deliberately \u003cb>slow / memory-hard\u003c/b>.\u003c/p>\n\u003cdiv class=\"st\" id=\"sm\">\u003c/div>\u003cdiv class=\"tbl\">\u003ctable id=\"st\">\u003c/table>\u003c/div>\u003cdiv class=\"b\" id=\"sn\" style=\"margin-top:6px\">\u003c/div>\n\u003cpre class=\"term\">\u003cspan class=\"cm\"># Python (install: pip install argon2-cffi bcrypt)\u003c/span>\nfrom argon2 import PasswordHasher\nph = PasswordHasher()                 \u003cspan class=\"cm\"># Argon2id by default\u003c/span>\nstored = ph.hash(\"S#x9-kLm!2zQw\")   \u003cspan class=\"cm\"># salt + parameters are inside the string\u003c/span>\nph.verify(stored, \"S#x9-kLm!2zQw\")  \u003cspan class=\"cm\"># raises if wrong\u003c/span>\n\nimport bcrypt\nh = bcrypt.hashpw(b\"pw\", bcrypt.gensalt(rounds=12))\nbcrypt.checkpw(b\"pw\", h)\u003c/pre>\n\u003cp class=\"m\">Tune cost to your server and follow current OWASP guidance (e.g. Argon2id with at least ~19 MiB memory, 2 iterations; bcrypt cost ≥10). Re-hash on login when parameters improve.\u003c/p>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🗝️ \u003cb>Key management\u003c/b>\u003cbr>Generate keys with a secure random generator, never hard-code or commit them.\u003c/div>\u003cdiv class=\"b\">🏦 Store in a vault/KMS, separate from the data, least-privilege access.\u003c/div>\u003cdiv class=\"b\">🔄 Rotate regularly, revoke on leak, keep audited backups.\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Symmetric vs Asymmetric, AES, RSA & Signatures\u003c/h2>\n\u003cdiv class=\"st\" id=\"t4\">\u003c/div>\u003cdiv id=\"b4\">\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:8px\">\u003cdiv class=\"b\">⚡ \u003cb>AES\u003c/b> (symmetric)\u003cbr>One shared key, very fast, used for bulk data. Use authenticated modes like GCM.\u003c/div>\u003cdiv class=\"b\">🔑 \u003cb>RSA\u003c/b> (asymmetric)\u003cbr>Public/private key pair. Slower; used for key exchange and signatures.\u003c/div>\u003cdiv class=\"b\">✍️ \u003cb>Digital signature\u003c/b>\u003cbr>Sign with private key; anyone verifies with the public key: proves origin and integrity.\u003c/div>\u003c/div>\n\u003ch3>🧪 Signature lab (real RSA 2048)\u003c/h3>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"sg\" value=\"Pay Raj ₹500\">\u003cbutton class=\"x\" id=\"g1\">1 · Generate keys\u003c/button>\u003cbutton class=\"x off\" id=\"g2\">2 · Sign\u003c/button>\u003cbutton class=\"x off\" id=\"g3\">3 · Verify\u003c/button>\u003cbutton class=\"x off\" id=\"g4\">Tamper message\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"go\">Press \"Generate keys\".\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. TLS, Certificate Validation & PKI (Practical 4)\u003c/h2>\u003cdiv class=\"st\" id=\"t5\">\u003c/div>\u003cdiv id=\"b5\">\u003c/div>\n\u003ch3>🔗 Chain of trust\u003c/h3>\n\u003csvg viewBox=\"0 0 700 90\" width=\"100%\">\u003cg fill=\"rgba(127,127,127,.2)\" stroke=\"var(--a)\" stroke-width=\"2\">\u003crect x=\"5\" y=\"15\" width=\"170\" height=\"60\" rx=\"10\"/>\u003crect x=\"265\" y=\"15\" width=\"170\" height=\"60\" rx=\"10\"/>\u003crect x=\"525\" y=\"15\" width=\"170\" height=\"60\" rx=\"10\"/>\u003c/g>\u003cpath d=\"M175 45H265M435 45H525\" stroke=\"var(--b)\" stroke-width=\"3\"/>\u003cg fill=\"var(--t)\" font-size=\"12\" text-anchor=\"middle\">\u003ctext x=\"90\" y=\"40\">🏛️ Root CA\u003c/text>\u003ctext x=\"90\" y=\"58\">in your trust store\u003c/text>\u003ctext x=\"350\" y=\"40\">🏢 Intermediate CA\u003c/text>\u003ctext x=\"350\" y=\"58\">signed by Root\u003c/text>\u003ctext x=\"610\" y=\"40\">🌐 Leaf cert\u003c/text>\u003ctext x=\"610\" y=\"58\">lab.example.com\u003c/text>\u003c/g>\u003ccircle r=\"6\" fill=\"#ffd23f\">\u003canimateMotion dur=\"3s\" repeatCount=\"indefinite\" path=\"M90 45H610\"/>\u003c/circle>\u003c/svg>\n\u003ch3>📜 Demo certificate (illustrative)\u003c/h3>\u003cpre class=\"term\">Subject:   CN = lab.example.com\nIssuer:    CN = Demo Intermediate CA\nValid:     2026-09-01  →  2026-12-01\nSAN:       DNS:lab.example.com\nPublic key: RSA 2048   Signature: sha256WithRSAEncryption\u003c/pre>\n\u003cp class=\"m\">Create and inspect your own demo cert (lab only):\u003cbr>\u003ccode>openssl req -x509 -newkey rsa:2048 -nodes -keyout demo.key -out demo.crt -days 30 -subj \"/CN=lab.local\"\u003c/code>\u003cbr>\u003ccode>openssl x509 -in demo.crt -noout -text\u003c/code>\u003c/p>\n\u003ch3>🧪 What does the browser check?\u003c/h3>\u003cdiv class=\"st\" id=\"cs\">\u003c/div>\u003cpre class=\"term\" id=\"cr\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Password Attacks: Brute-force, Spraying, Credential Stuffing\u003c/h2>\n\u003cdiv class=\"st\" id=\"at\">\u003c/div>\u003cdiv class=\"mx\" id=\"mx\">\u003c/div>\u003cdiv class=\"b\" id=\"ad\">\u003c/div>\n\u003ch3>🛡️ Defence toggles (illustrative effect)\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x off\" data-d=\"mfa\">MFA\u003c/button>\u003cbutton class=\"x off\" data-d=\"rate\">Rate limit / throttling\u003c/button>\u003cbutton class=\"x off\" data-d=\"brk\">Breached-password check\u003c/button>\u003cbutton class=\"x off\" data-d=\"mon\">Monitoring & alerts\u003c/button>\u003c/div>\n\u003cdiv class=\"bar2\">\u003ci id=\"rk\" style=\"width:100%;background:linear-gradient(90deg,#ffc24b,#ff6b6b)\">\u003c/i>\u003c/div>\u003cdiv class=\"fb\" id=\"rt\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Practicals\u003c/h2>\n\u003ch3>Practical 1 · SHA-256 in Python & the avalanche effect\u003c/h3>\n\u003cpre class=\"term\">import hashlib\n\ndata = b\"ethical hacking lab\"\ndigest = hashlib.sha256(data).hexdigest()\nprint(\"SHA-256:\", digest)\u003c/pre>\n\u003cdiv class=\"row\">A \u003cinput type=\"text\" id=\"ha\" value=\"ethical hacking lab\"> B \u003cinput type=\"text\" id=\"hb\" value=\"ethical hacking lab!\">\u003c/div>\u003cpre class=\"term\" id=\"ho\">\u003c/pre>\n\u003ch3>Practical 2 · File integrity: hash before and after\u003c/h3>\n\u003ctextarea id=\"fc\" rows=\"3\">Ethical hacking lab: notes v1\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"f1\">💾 Save baseline hash\u003c/button>\u003cbutton class=\"x off\" id=\"f2\">🔎 Verify now\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"fo\">Save a baseline, edit the text above, then verify.\u003c/pre>\n\u003cdiv class=\"row\">Or pick a file (hashed locally in your browser): \u003cinput type=\"file\" id=\"ff\">\u003c/div>\u003cpre class=\"term\" id=\"fh\">\u003c/pre>\n\u003cpre class=\"term\">\u003cspan class=\"cm\"># Python: hash a whole file safely\u003c/span>\nimport hashlib\ndef sha256_file(path):\n    h = hashlib.sha256()\n    with open(path, \"rb\") as f:\n        for chunk in iter(lambda: f.read(8192), b\"\"):\n            h.update(chunk)\n    return h.hexdigest()\n\n\u003cspan class=\"cm\"># Shell\u003c/span>\nsha256sum notes.txt &gt; notes.sha256   \u003cspan class=\"cm\"># before\u003c/span>\nsha256sum -c notes.sha256            \u003cspan class=\"cm\"># after: OK or FAILED\u003c/span>\u003c/pre>\n\u003ch3>Practical 3 · Why not plain SHA-256 for passwords? → see Section 3 (switch modes).\u003c/h3>\n\u003ch3>Practical 4 · Inspect demo certificates & explain validation → see Section 5 (scenarios).\u003c/h3>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>8. Expected Output\u003c/h2>\n\u003ch3>📒 Cryptography lab sheet (editable)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"ls\">\u003c/table>\u003c/div>\u003cbutton class=\"x off\" id=\"lc\">Show as CSV\u003c/button>\u003ctextarea id=\"lv\" rows=\"5\" style=\"display:none\">\u003c/textarea>\n\u003ch3>✅ Hash verification record (filled from Practical 2)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"vr\">\u003ctr>\u003cth>#\u003c/th>\u003cth>Baseline (first 16)\u003c/th>\u003cth>Current (first 16)\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>🛡️ Authentication defence checklist\u003c/h3>\u003cdiv id=\"ck\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"cb\">\u003c/i>\u003c/div>\u003cdiv class=\"fb\" id=\"cm\">\u003c/div>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Encode ≠ hash ≠ encrypt\u003c/div>\u003cdiv class=\"b\">Passwords: Argon2id / scrypt / bcrypt + unique salt\u003c/div>\u003cdiv class=\"b\">Hash = integrity · Signature = origin + integrity\u003c/div>\u003cdiv class=\"b\">TLS: verify chain, dates, hostname\u003c/div>\u003cdiv class=\"b\">Defend: MFA, rate-limit, breached-list, monitoring\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h,esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\n\nfunction FLOW(tid,bid,D,L,R){let k=Object.keys(D)[0],n=0,tm;const r=()=>{const S=D[k][1];H_(tid,Object.keys(D).map(q=>`\u003cbutton class=\"${q==k?'on':''}\" data-k=\"${q}\">${D[q][0]}\u003c/button>`).join(''));\nH_(bid,`\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cb>${L}\u003c/b>\u003cb>${R}\u003c/b>\u003c/div>`+S.map((s,i)=>`\u003cdiv class=\"fl\" style=\"justify-content:${s[0]?'flex-end':'flex-start'};opacity:${i\u003cn?1:.15}\">\u003cspan class=\"b2\">${s[0]?'⬅ ':''}${s[1]}${s[0]?'':' ➡'}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"b\">${n?S[n-1][2]:'Press Next ▶'}\u003c/div>\u003cbutton class=\"x\" data-a=\"n\">Next ▶\u003c/button>\u003cbutton class=\"x off\" data-a=\"r\">Reset\u003c/button>\u003cbutton class=\"x off\" data-a=\"a\">Auto\u003c/button>`);\ndocument.querySelectorAll('#'+tid+' button').forEach(b=>b.onclick=()=>{clearInterval(tm);k=b.dataset.k;n=0;r()});\ndocument.querySelectorAll('#'+bid+' button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;clearInterval(tm);if(a=='n'){if(n\u003cS.length)n++;r()}else if(a=='r'){n=0;r()}else{n=0;r();tm=setInterval(()=>{if(n\u003cS.length){n++;r()}else clearInterval(tm)},1100)}})};r()}\nFLOW('t4','b4',{sy:['⚡ Symmetric (AES)',[[0,'🔑 Share ONE secret key','Both sides need the same key. Sharing it securely is the hard part'],[0,'🔒 Ciphertext = AES(key, message)','Alice encrypts quickly'],[1,'🔓 Bob decrypts with the same key','Fast, ideal for bulk data']]],as:['🔑 Asymmetric (RSA)',[[1,'📢 Bob publishes his PUBLIC key','Anyone may have it'],[0,'🔒 Encrypt with Bob\\'s public key','Only Bob\\'s PRIVATE key can open it'],[1,'🔓 Bob decrypts with his private key','Slower; used for key exchange and signatures']]],sg:['✍️ Signature',[[0,'✍️ Hash message + sign hash with PRIVATE key','Alice proves it is her'],[0,'Message + signature sent','Anyone can see them'],[1,'🔎 Bob verifies with Alice\\'s PUBLIC key','Valid = authentic and unmodified. Any change → invalid']]],hy:['🤝 Hybrid (TLS idea)',[[0,'Asymmetric: agree on a shared secret','Public-key crypto / key exchange'],[1,'Both derive the same session key','No key travelled in clear'],[0,'Symmetric AES from now on','Speed of AES + safety of public keys']]]},'👩 Alice','👨 Bob');\nFLOW('t5','b5',{tl:['🔒 TLS 1.3 (simplified)',[[0,'ClientHello + key share + server name','Browser says which site it wants'],[1,'ServerHello + key share','Both can now derive session keys'],[1,'Certificate + signature','Server proves identity'],[0,'Browser validates certificate','Chain to trusted root, dates, hostname, revocation'],[0,'Finished','Handshake confirmed'],[1,'Finished → encrypted HTTP','Traffic is now confidential and tamper-evident']]]},'🌐 Browser','🖥️ Server');\n\nconst hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join(''),enc=new TextEncoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ok=()=>window.crypto&&crypto.subtle;\nconst sha=async(s,salt='')=>hex(await crypto.subtle.digest('SHA-256',enc.encode(salt+s)));\nconst hs=h=>h.slice(0,16)+'…';\nfunction human(sec){if(sec\u003c1)return'instantly';const u=[[60,'seconds'],[3600,'minutes'],[86400,'hours'],[31536000,'days'],[1e9*31536000,'years']];if(sec\u003c60)return Math.round(sec)+' seconds';if(sec\u003c3600)return Math.round(sec/60)+' minutes';if(sec\u003c86400)return Math.round(sec/3600)+' hours';if(sec\u003c31536000)return Math.round(sec/86400)+' days';const y=sec/31536000;return y>1e9?'billions of years':Math.round(y).toLocaleString()+' years'}\nconst COM=['password','123456','12345678','qwerty','admin','letmein','welcome','iloveyou','password123','admin123'];\nfunction pwr(){const p=$('pw').value;let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\\d/.test(p))pool+=10;if(/[^a-zA-Z0-9]/.test(p))pool+=33;const bits=p?p.length*Math.log2(pool||1):0,g=Math.pow(2,bits)/2,cm=COM.includes(p.toLowerCase());\n$('pb').style.width=Math.min(100,bits/80*100)+'%';H_('pe',(cm?'\u003cspan class=\"p hi\">In common-password lists → cracked instantly\u003c/span>\u003cbr>':'')+`≈ ${bits.toFixed(0)} bits (random-chars estimate)\u003cbr>🌐 Online (10/s): \u003cb>${cm?'instantly':human(g/10)}\u003c/b>\u003cbr>💻 Fast hash (1e10/s): \u003cb>${cm?'instantly':human(g/1e10)}\u003c/b>\u003cbr>🐢 Slow hash (1e3/s): \u003cb>${cm?'instantly':human(g/1e3)}\u003c/b>`)}$('pw').oninput=pwr;pwr();\n\n/* enc lab */\nlet CT=null;const dec=new TextDecoder();\nasync function key(pass,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}\nasync function eo(doEnc){if(!ok()){H_('eo','Web Crypto is not available in this browser context.');return}const s=$('ei').value;if(doEnc||!CT){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key('lab-key',salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(s));CT={salt,iv,ct,s}}\nH_('eo',`\u003cb>Encoding\u003c/b> Base64:  ${esc(b64(enc.encode(s)))}\\n\u003cb>Hashing\u003c/b>  SHA-256:  ${await sha(s)}\\n\u003cb>Encryption\u003c/b> AES-GCM: ${esc(b64(CT.ct))}  \u003cspan class=\"m\">(random salt+IV → changes every time)\u003c/span>`)}\n$('ei').oninput=()=>{CT=null;eo(1)};$('en').onclick=()=>eo(1);\n$('d1').onclick=()=>H_('dr','✅ Base64 decodes with no key → \"'+esc(dec.decode(Uint8Array.from(atob(b64(enc.encode($('ei').value))),c=>c.charCodeAt(0))))+'\". Encoding is NOT security.');\n$('d2').onclick=()=>H_('dr','❌ A hash is one-way. Attackers can only guess inputs and compare hashes (that is why passwords need slow hashes).');\nasync function dd(pass){if(!CT)await eo(1);try{const k=await key(pass,CT.salt),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:CT.iv},k,CT.ct);H_('dr','✅ Decrypted with the right key → \"'+esc(dec.decode(pt))+'\"')}catch(e){H_('dr','❌ Wrong key or tampered data → decryption fails (GCM authenticates too).')}}\n$('d3').onclick=()=>dd('lab-key');$('d4').onclick=()=>dd('wrong-key');eo(1);\n\n/* salt lab */\nconst USERS=[['raj','password'],['amit','password'],['priya','Tr0ub4dor&3'],['neha','qwerty'],['ravi','S#x9-kLm!2zQw']],DICT=['123456','password','qwerty','letmein','welcome1','admin123','iloveyou','dragon','monkey','sunshine'];let sm=0;const SALTS=USERS.map(()=>hex(crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(4)):new Uint8Array(4)));\nconst SMD=['Plain SHA-256 ❌','Salted SHA-256 ⚠️','Argon2id / bcrypt ✅'];H_('sm',SMD.map((s,i)=>`\u003cbutton class=\"${i?'':'on'}\" data-i=\"${i}\">${s}\u003c/button>`).join(''));\nasync function rsm(){document.querySelectorAll('#sm button').forEach(b=>b.classList.toggle('on',b.dataset.i==sm));let rows='',cr=0;\nif(sm==2){const ex=['$argon2id$v=19$m=19456,t=2,p=1$c2FsdDEy…$k9L2…','$argon2id$v=19$m=19456,t=2,p=1$bW9yZXNh…$Zq81…','$argon2id$…$Pd3x…','$argon2id$…$A7mn…','$argon2id$…$Lw0e…'];rows=USERS.map((u,i)=>`\u003ctr>\u003ctd>${u[0]}\u003c/td>\u003ctd>\u003ccode>${ex[i]}\u003c/code>\u003c/td>\u003ctd>Each guess costs ~100 ms and lots of memory → millions of guesses become years\u003c/td>\u003c/tr>`).join('');H_('st','\u003ctr>\u003cth>User\u003c/th>\u003cth>Stored value (illustrative)\u003c/th>\u003cth>Attacker\u003c/th>\u003c/tr>'+rows);H_('sn','✅ Salt is built in, parameters are stored with the hash, same password → different hash, guessing is expensive. Weak passwords still fall first, so combine with a password policy and MFA.');return}\nif(!ok()){H_('st','');return}\nconst dh={};if(sm==0)for(const d of DICT)dh[await sha(d)]=d;\nfor(let i=0;i\u003cUSERS.length;i++){const salt=sm?SALTS[i]:'',h=await sha(USERS[i][1],salt);let found=null;if(sm==0)found=dh[h];else for(const d of DICT)if(await sha(d,salt)==h){found=d;break}if(found)cr++;rows+=`\u003ctr>\u003ctd>${USERS[i][0]}\u003c/td>\u003ctd>\u003ccode>${sm?salt+'$':''}${hs(h)}\u003c/code>\u003c/td>\u003ctd>${found?'\u003cspan class=\"p hi\">cracked: '+esc(found)+'\u003c/span>':'\u003cspan class=\"p lo\">not in wordlist\u003c/span>'}\u003c/td>\u003c/tr>`}\nH_('st','\u003ctr>\u003cth>User\u003c/th>\u003cth>Stored hash'+(sm?' (salt$hash)':'')+'\u003c/th>\u003cth>Dictionary attack\u003c/th>\u003c/tr>'+rows);\nH_('sn',sm==0?`❌ ${cr}/5 cracked with ONE precomputed table (10 hashes). Notice raj and amit share a hash, so the attacker sees who reuses passwords.`:`⚠️ Hashes differ even for the same password, and tables are useles
