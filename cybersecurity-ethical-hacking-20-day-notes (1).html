HTTP/1.1\\nHost: localhost:3000\\nContent-Type: application/x-www-form-urlencoded\\n\\nuser=raj&pass=1234','GET /profile?id=1 HTTP/1.1\\nHost: localhost:3000\\nCookie: session=abc123'];let ion=1,hn=0,pend=null;\nfunction rb(){$('ic').textContent='Intercept is '+(ion?'ON 🔴':'OFF 🟢');$('ic').className='x'+(ion?'':' off')}$('ic').onclick=()=>{ion^=1;rb()};rb();\nfunction hist(raw){const r=srv(raw),[m,p]=raw.split('\\n')[0].split(' ');hn++;$('hh').insertAdjacentHTML('beforeend',`\u003ctr>\u003ctd>${hn}\u003c/td>\u003ctd>${m}\u003c/td>\u003ctd>${esc(p)}\u003c/td>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r[2].length}\u003c/td>\u003c/tr>`);return r}\n$('sb').onclick=()=>{const raw=RQ[$('rs').selectedIndex];if(ion){pend=raw;$('ih').style.display='block';H_('ir',esc(raw)+'\\n\u003cspan class=\"er\">⏸ request is HELD by Burp\u003c/span>')}else hist(raw)};\n$('fw').onclick=()=>{if(pend){const r=hist(pend);H_('ir',esc(pend)+`\\n\u003cspan class=\"o\">▶ forwarded → ${r[0]} ${r[1]}\u003c/span>`);pend=null}};$('dr').onclick=()=>{if(pend){H_('ir',esc(pend)+'\\n\u003cspan class=\"er\">🗑 dropped: server never saw it\u003c/span>');pend=null}};\n\n/* practicals */\nconst ST=['Start your local training app (e.g. Juice Shop on http://localhost:3000). Local only!','Open Burp Suite → Temporary project → Start Burp.','Proxy tab → Intercept → click \"Open browser\" (embedded browser already uses 127.0.0.1:8080).','In that browser open http://localhost:3000. Keep Intercept OFF to browse, ON to pause requests.','Proxy → HTTP history: find your requests; right-click → Send to Repeater.'];let sd=ST.map(()=>0);\nfunction r1(){H_('p1',ST.map((s,i)=>`\u003cdiv class=\"b row\" style=\"margin:4px 0\">\u003cbutton class=\"x ${sd[i]?'':'off'}\" data-i=\"${i}\">${sd[i]?'✅':'⬜'} Step ${i+1}\u003c/button>\u003cspan style=\"flex:1\">${s}\u003c/span>\u003c/div>`).join(''));$('pb').style.width=sd.reduce((a,b)=>a+b)*20+'%';document.querySelectorAll('#p1 button').forEach(b=>b.onclick=()=>{sd[b.dataset.i]^=1;r1()})}r1();\ndocument.querySelectorAll('u.k').forEach(u=>u.onclick=()=>$('pn').textContent='🧠 '+u.dataset.e);\nconst PR=[['Change q to hello',RQ[0].replace('test','hello')],['Special chars in q',RQ[0].replace('test','\u003cb>hi\u003c/b>')],['Remove Cookie',RQ[2].replace('\\nCookie: session=abc123','')],['id=2',RQ[2].replace('id=1','id=2')],['id=999',RQ[2].replace('id=1','id=999')],['Change method to DELETE',RQ[2].replace('GET','DELETE')],['Wrong password',RQ[1].replace('1234','0000')]];\nH_('pr',PR.map((p,i)=>`\u003cbutton class=\"x off\" data-i=\"${i}\">${p[0]}\u003c/button>`).join(''));$('rp').value=RQ[2];let last=null;\ndocument.querySelectorAll('#pr button').forEach(b=>b.onclick=()=>$('rp').value=PR[b.dataset.i][1]);\n$('rs2').onclick=()=>{const r=srv($('rp').value);H_('ro',`HTTP/1.1 \u003cspan class=\"${r[0]\u003c300?'o':'er'}\">${r[0]} ${r[1]}\u003c/span>\\nContent-Type: text/html\\nContent-Length: ${r[2].length}\\n\\n${esc(r[2])}`);$('rd').textContent=last?(last[0]==r[0]&&last[2].length==r[2].length?'Δ Same status and length as the previous response.':`Δ Changed: ${last[0]}→${r[0]}, length ${last[2].length}→${r[2].length}. Why? Think: login, ownership, method, or input.`):'First response recorded. Change something and send again.';last=r};\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!DOCTYPE html>\u003chtml lang=\"en\" data-theme=\"galaxy\">\u003chead>\u003cscript>(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true})}catch(x){}try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>OWASP Top 10 & Web Security Risks – Visual Notes\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--t:#f0eeff;--m:#b8b4e0;--c:rgba(15,12,45,.8);--a:#a78bfa;--b:#60a5fa;--bt:#000;--bd:rgba(255,255,255,.16);--bg:radial-gradient(ellipse at 30% 20%,#3a1c71,#0b0b2b 60%,#02020c)}\n[data-theme=blackhole]{--t:#fff3e6;--m:#d9bfa3;--c:rgba(10,8,6,.84);--a:#ff9a3c;--b:#ffd9a0;--bg:radial-gradient(circle at 50% 45%,#2a1405,#000 70%)}\n[data-theme=supernova]{--t:#fff1e0;--m:#f0c6a6;--c:rgba(40,6,4,.82);--a:#ff7a1a;--b:#ffd23f;--bg:radial-gradient(circle at 50% 45%,#5a1010,#140202 75%)}\n[data-theme=aurora]{--t:#e8fff6;--m:#9fd8c6;--c:rgba(4,28,30,.82);--a:#34d399;--b:#2dd4bf;--bg:linear-gradient(180deg,#02130f,#06293a)}\n[data-theme=neon]{--t:#f7f0ff;--m:#c9b3ee;--c:rgba(16,4,34,.84);--a:#ff2bd6;--b:#00f0ff;--bg:linear-gradient(180deg,#0a0014,#1a0036)}\n[data-theme=ocean]{--t:#e6f6ff;--m:#9ccbe6;--c:rgba(0,24,48,.82);--a:#38bdf8;--b:#5eead4;--bg:linear-gradient(180deg,#00264d,#00060f)}\n[data-theme=sunset]{--t:#fff0e6;--m:#f5c9bd;--c:rgba(45,15,60,.84);--a:#ff9e5e;--b:#ff6fb5;--bg:linear-gradient(160deg,#ff9966,#ff5e62 40%,#5b2a86)}\n[data-theme=paper]{--t:#1d2433;--m:#4d5870;--c:rgba(255,255,255,.93);--a:#4f46e5;--b:#0891b2;--bt:#fff;--bd:rgba(0,0,0,.14);--bg:#f6f3ec}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}\nbody{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}input[type=text]{width:100%;max-width:240px}textarea{width:100%;font:12px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6}\n.o{color:#7cfc9a}.er{color:#ff7b7b}code{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.cg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}\n.cb{background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;text-align:left;transition:.3s}.cb:hover{transform:translateY(-3px)}.cb.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}td[contenteditable]:focus{outline:2px solid var(--a)}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}.nw{background:#7dd3fc}\n.bar2{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ffc24b;background:rgba(255,194,75,.14);border-radius:12px;padding:12px}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🛡️ OWASP Top 10 & Web Security Risks\u003c/h1>\u003cp class=\"m\">Day 10 · The OWASP Top 10 is an \u003ci>awareness list\u003c/i> of the most serious web app risk categories. Learn the 2021 edition as your foundation, then see how the 2025 edition changed it.\u003c/p>\n\u003cdiv class=\"warn\">⚠️ Practice only in intentionally vulnerable labs (OWASP Juice Shop, WebGoat) running on \u003cb>your own machine\u003c/b>. Never attack real websites. The labs below are safe simulations.\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">1️⃣ 2021 → 2025 map\u003c/div>\u003cdiv class=\"b\">2️⃣ The 10 categories (click each)\u003c/div>\u003cdiv class=\"b\">3️⃣ Labs: access control & injection\u003c/div>\u003cdiv class=\"b\">4️⃣ Practicals 1–3\u003c/div>\u003cdiv class=\"b\">5️⃣ Mapping sheet\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. OWASP Top 10: 2021 foundation vs 2025 current\u003c/h2>\n\u003cp class=\"m\">OWASP Top 10:2025 was released in November 2025 (first update since 2021). It keeps most ideas but merges SSRF into Broken Access Control and adds two new categories.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"v1\">2021 list\u003c/button>\u003cbutton class=\"x off\" id=\"v2\">2025 list\u003c/button>\u003c/div>\u003cdiv class=\"tbl\">\u003ctable id=\"mp\">\u003c/table>\u003c/div>\u003cdiv class=\"b\" id=\"mn\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. The 10 Categories (2021)\u003c/h2>\u003cp class=\"m\">Click a category, then toggle \"Apply fix\" to see before vs after.\u003c/p>\n\u003cdiv class=\"cg\" id=\"cl\">\u003c/div>\u003cdiv class=\"b\" id=\"cd\" style=\"margin-top:10px\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Mini Labs (safe simulations)\u003c/h2>\n\u003ch3>🚪 Lab 1 · Broken Access Control (IDOR)\u003c/h3>\u003cp class=\"m\">You are \u003cb>priya\u003c/b> and own order 101. Change the order ID in \u003ccode>GET /orders?id=…\u003c/code>\u003c/p>\n\u003cdiv class=\"row\">\u003cinput type=\"range\" id=\"id1\" min=\"101\" max=\"104\" value=\"101\">\u003cb id=\"iv\">\u003c/b>\u003cbutton class=\"x\" id=\"s1\">Server: vulnerable ❌\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"ob\">\u003c/pre>\n\u003ch3>💉 Lab 2 · Injection (SQL)\u003c/h3>\u003cp class=\"m\">Try \u003ccode>raj\u003c/code> / \u003ccode>1234\u003c/code>. Then try this classic textbook input as username: \u003ccode>' OR '1'='1\u003c/code>\u003c/p>\n\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"un\" value=\"raj\" style=\"max-width:150px\">\u003cinput type=\"text\" id=\"pw\" value=\"1234\" style=\"max-width:150px\">\u003cbutton class=\"x\" id=\"s2\">Code: string concat ❌\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"sq\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Guided beginner challenges (Juice Shop / WebGoat)\u003c/h3>\u003cdiv id=\"p1\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"b\" style=\"margin-top:8px\">🎯 Beginner ideas (1-star): find the hidden \u003cb>Score Board\u003c/b> · trigger an \u003cb>error message\u003c/b> and read what it reveals · find a \u003cb>confidential document\u003c/b> that is publicly reachable. Map each to an OWASP category.\u003c/div>\n\u003ch3>Practical 2 · Finding records (editable: click any cell)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"fi\">\u003c/table>\u003c/div>\u003cbutton class=\"x\" id=\"ar\">+ Add finding\u003c/button>\u003cbutton class=\"x off\" id=\"cc\">Show as CSV\u003c/button>\u003ctextarea id=\"cv2\" rows=\"5\" style=\"display:none\">\u003c/textarea>\n\u003ch3>Practical 3 · Secure coding checklist (tick what you do)\u003c/h3>\u003cdiv id=\"ck\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"cb2\">\u003c/i>\u003c/div>\u003cdiv class=\"fb\" id=\"cs\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. Expected Output · OWASP mapping sheet with mitigations\u003c/h2>\u003cdiv class=\"tbl\">\u003ctable id=\"ms\">\u003c/table>\u003c/div>\u003cp class=\"m\">Tip: Ctrl+P prints this sheet. Always check the official list at owasp.org/Top10 for updates.\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Access control: check ownership on the server, deny by default\u003c/div>\u003cdiv class=\"b\">Injection: parameterised queries, never concatenate\u003c/div>\u003cdiv class=\"b\">Misconfig: no defaults, no debug, generic errors\u003c/div>\u003cdiv class=\"b\">Components: inventory + update + scan\u003c/div>\u003cdiv class=\"b\">Logging: record & alert on security events\u003c/div>\u003cdiv class=\"b\">Finding = Cause + Evidence + Impact + Fix\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h,esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\n\nconst C=[['A01','Broken Access Control','A01 (SSRF merged in)','🚪','Hotel keycard that opens every room','Server does not check who owns a resource','Changing id=101 to 102 shows another user\\'s order','Data theft, unauthorised changes','Deny by default; check ownership & role on the server for every request','GET /orders?id=102 → 200 (priya sees amit\\'s order)','GET /orders?id=102 → 403 Forbidden'],\n['A02','Cryptographic Failures','A04','🔏','Postcard vs sealed letter','Plain HTTP, weak/no password hashing, hard-coded keys','Passwords readable in a leaked DB','Account takeover, privacy breach','HTTPS everywhere; bcrypt/argon2 with salt; keys in a secret vault','DB: raj | 1234','DB: raj | $2b$12$Q9x…(salted hash)'],\n['A03','Injection','A05','💉','Form text treated as commands','Untrusted input concatenated into queries/commands','Special characters change query behaviour','Data leak, login bypass, server compromise','Parameterised queries, input validation, least-privilege DB user','Input becomes part of the SQL code','Input is only data (parameter)'],\n['A04','Insecure Design','A06','🏗️','House plan with no locks','No threat modelling; flawed business logic','Coupon SAVE50 can be reused unlimited times','Fraud, abuse','Threat-model early, abuse-case tests, secure design patterns','SAVE50 applied 10 times → ₹0 cart','SAVE50 limited to once per account'],\n['A05','Security Misconfiguration','A02','⚙️','Factory default settings','Defaults, debug mode, directory listing, verbose errors','Error page shows stack trace and file paths','Info leak, easy entry','Hardening baseline, disable debug, remove defaults, generic errors','Error page with stack trace + DB path','\"Something went wrong\" + reference ID'],\n['A06','Vulnerable & Outdated Components','A03 (Supply Chain Failures)','🧱','Old lock with a publicly known flaw','Unpatched libraries/frameworks','jquery 1.6 with known issues in the page source','Known flaws can be reused','Inventory/SBOM, update regularly, software composition scan','jquery 1.6 (outdated, known issues)','jquery latest patched version'],\n['A07','Identification & Authentication Failures','A07 Authentication Failures','🔐','Weak door code','Weak passwords, no lockout/MFA, session IDs not rotated','Unlimited login attempts accepted','Account takeover','MFA, rate-limit/lockout, strong policy, rotate sessions','500 guesses accepted in a minute','Locked after 5 attempts + MFA'],\n['A08','Software & Data Integrity Failures','A08','📦','Package with a broken seal','Unsigned updates, untrusted CI/CD, insecure deserialisation','Auto-update installs without checking','Supply-chain compromise','Verify signatures/hashes, protect build pipeline','Installs update from any source','Signature verified before install'],\n['A09','Security Logging & Monitoring Failures','A09 Logging & Alerting Failures','📹','CCTV that is switched off','No logs/alerts for logins or access denials','300 failed logins left no trace','Attacks go unnoticed for months','Log security events, alert on patterns, protect logs','No record of 300 failed logins','Alert at 10 failures, logs retained'],\n['A10','Server-Side Request Forgery (SSRF)','Merged into A01','🤖','Messenger who fetches any address you give','Server fetches a user-supplied URL without validation','url=http://internal-admin/ is fetched by the server','Internal network / cloud metadata exposure','Allow-list destinations, block internal ranges, segment network','Server fetches internal admin URL','Blocked: destination not on allow-list']];\nconst N25=[['A01','Broken Access Control','=','2021 #1; SSRF merged in'],['A02','Security Misconfiguration','▲ from #5',''],['A03','Software Supply Chain Failures','NEW','Broader than 2021 \"Vulnerable & Outdated Components\"'],['A04','Cryptographic Failures','▼ from #2',''],['A05','Injection','▼ from #3',''],['A06','Insecure Design','▼ from #4',''],['A07','Authentication Failures','= (renamed)',''],['A08','Software or Data Integrity Failures','=',''],['A09','Security Logging & Alerting Failures','= (renamed)',''],['A10','Mishandling of Exceptional Conditions','NEW','Poor error handling, failing open']];\nfunction rv(v){$('v1').classList.toggle('off',v);$('v2').classList.toggle('off',!v);\nif(!v){H_('mp','\u003ctr>\u003cth>Rank\u003c/th>\u003cth>2021 category\u003c/th>\u003cth>Becomes in 2025\u003c/th>\u003c/tr>'+C.map(c=>`\u003ctr>\u003ctd>${c[0]}\u003c/td>\u003ctd>${c[1]}\u003c/td>\u003ctd>${c[2]}\u003c/td>\u003c/tr>`).join(''));H_('mn','📘 2021 is your foundation: most real-world training labs (Juice Shop, WebGoat) still map to these categories.')}\nelse{H_('mp','\u003ctr>\u003cth>Rank\u003c/th>\u003cth>2025 category\u003c/th>\u003cth>Change\u003c/th>\u003cth>Note\u003c/th>\u003c/tr>'+N25.map(c=>`\u003ctr>\u003ctd>${c[0]}\u003c/td>\u003ctd>${c[1]}\u003c/td>\u003ctd>\u003cspan class=\"p ${c[2]=='NEW'?'nw':c[2][0]=='▲'?'hi':c[2][0]=='▼'?'me':'lo'}\">${c[2]}\u003c/span>\u003c/td>\u003ctd>${c[3]}\u003c/td>\u003c/tr>`).join(''));H_('mn','🆕 2025 changes: two new categories (Supply Chain Failures, Mishandling of Exceptional Conditions) and SSRF folded into Broken Access Control. Verify details on owasp.org/Top10.')}}\n$('v1').onclick=()=>rv(0);$('v2').onclick=()=>rv(1);rv(0);\nH_('cl',C.map((c,i)=>`\u003cbutton class=\"cb\" data-i=\"${i}\">${c[3]} \u003cb>${c[0]}\u003c/b>\u003cbr>${c[1]}\u003c/button>`).join(''));let ci=0,cf=0;\nfunction rcd(){document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b.dataset.i==ci));const c=C[ci];H_('cd',`\u003cb>${c[3]} ${c[0]} · ${c[1]}\u003c/b> \u003cspan class=\"p nw\">2025: ${c[2]}\u003c/span>\u003cbr>🧠 \u003ci>${c[4]}\u003c/i>\u003cbr>🔎 \u003cb>Cause:\u003c/b> ${c[5]}\u003cbr>👀 \u003cb>Evidence:\u003c/b> ${c[6]}\u003cbr>💥 \u003cb>Impact:\u003c/b> ${c[7]}\u003cbr>🛠️ \u003cb>Fix:\u003c/b> ${c[8]}\u003cpre class=\"term\">${cf?'\u003cspan class=\"o\">✅ After fix: '+esc(c[10])+'\u003c/span>':'\u003cspan class=\"er\">❌ Before fix: '+esc(c[9])+'\u003c/span>'}\u003c/pre>\u003cbutton class=\"x ${cf?'':'off'}\" id=\"fx\">${cf?'Fix applied ✅':'Apply fix'}\u003c/button>`);$('fx').onclick=()=>{cf^=1;rcd()}}\ndocument.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{ci=+b.dataset.i;cf=0;rcd()});rcd();\n\nconst OR={101:'priya – ₹1,200 laptop',102:'amit – ₹800 shoes',103:'neha – ₹300 book',104:'ravi – ₹5,000 phone'};let vu=1;\nfunction rb(){const id=$('id1').value;$('iv').textContent='id='+id;$('s1').textContent=vu?'Server: vulnerable ❌':'Server: checks owner ✅';$('s1').className='x'+(vu?'':' off');const own=id==101;H_('ob',`GET /orders?id=${id}  (logged in as priya)\\n`+(vu||own?`\u003cspan class=\"${own?'o':'er'}\">200 OK → ${OR[id]}${own?'':'   ← someone else\\'s data!'}\u003c/span>`:'\u003cspan class=\"o\">403 Forbidden → access denied ✅\u003c/span>'))}\n$('id1').oninput=rb;$('s1').onclick=()=>{vu^=1;rb()};rb();\nlet cc=1;function rq(){const u=$('un').value,p=$('pw').value;$('s2').textContent=cc?'Code: string concat ❌':'Code: parameterised ✅';$('s2').className='x'+(cc?'':' off');let q,r;\nif(cc){q=`SELECT * FROM users WHERE name='${u}' AND pass='${p}'`;const inj=/'\\s*or\\s*'?1'?\\s*=\\s*'?1/i.test(u+p)||/'\\s*(--|#)/.test(u);r=inj?'\u003cspan class=\"er\">⚠ Condition is always true → logged in as FIRST user (admin)! ❌\u003c/span>':(u=='raj'&&p=='1234'?'\u003cspan class=\"o\">Logged in as raj\u003c/span>':'Login failed');}\nelse{q=`SELECT * FROM users WHERE name = ? AND pass = ?\\nparams: [\"${u}\", \"${p}\"]`;r=u=='raj'&&p=='1234'?'\u003cspan class=\"o\">Logged in as raj\u003c/span>':'\u003cspan class=\"o\">Input treated as plain text → login failed ✅\u003c/span>'}\nH_('sq',esc(q)+'\\n'+r)}\n['un','pw'].forEach(i=>$(i).oninput=rq);$('s2').onclick=()=>{cc^=1;rq()};rq();\n\nconst ST=['Install Docker and read the Juice Shop README (isolated lab only).','Run it bound to localhost: docker run --rm -p 127.0.0.1:3000:3000 bkimminich/juice-shop','Open http://localhost:3000 in the browser (WebGoat: follow its official README).','Pick 3 one-star challenges. Note steps, screenshot evidence, and impact.','Map each challenge to an OWASP category in Practical 2.'];let sd=ST.map(()=>0);\nfunction r1(){H_('p1',ST.map((s,i)=>`\u003cdiv class=\"b row\" style=\"margin:4px 0\">\u003cbutton class=\"x ${sd[i]?'':'off'}\" data-i=\"${i}\">${sd[i]?'✅':'⬜'} Step ${i+1}\u003c/button>\u003cspan style=\"flex:1\">${esc(s)}\u003c/span>\u003c/div>`).join(''));$('pb').style.width=sd.reduce((a,b)=>a+b)*20+'%';document.querySelectorAll('#p1 button').forEach(b=>b.onclick=()=>{sd[b.dataset.i]^=1;r1()})}r1();\nconst FI=[['Order of another user visible by changing id','A01 / A01','Server does not check order owner','GET /orders?id=102 returned 200 with another name','Privacy breach, data theft','Verify ownership on server; deny by default'],['Stack trace shown on error','A05 / A02 (and A10)','Debug mode on, verbose errors','Error page displayed file paths and framework version','Information disclosure aids attackers','Disable debug; generic error + log details server-side'],['Outdated JS library','A06 / A03','No dependency updates or scanning','Page source shows an old library version','Known flaws may be reused','Inventory, update, run SCA scan']];\nconst cell=c=>`\u003ctd contenteditable=\"true\">${esc(c)}\u003c/td>`,fr=r=>'\u003ctr>'+r.map(cell).join('')+'\u003c/tr>';\nH_('fi','\u003ctr>\u003cth>Finding\u003c/th>\u003cth>OWASP 2021 / 2025\u003c/th>\u003cth>Cause\u003c/th>\u003cth>Evidence\u003c/th>\u003cth>Impact\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>'+FI.map(fr).join(''));$('ar').onclick=()=>$('fi').insertAdjacentHTML('beforeend',fr(['','','','','','']));\n$('cc').onclick=()=>{const q=s=>'\"'+s.replace(/\"/g,'\"\"')+'\"';$('cv2').value=[...$('fi').rows].map(r=>[...r.cells].map(c=>q(c.textContent)).join(',')).join('\\n');$('cv2').style.display='block';try{navigator.clipboard.writeText($('cv2').value)}catch(e){}};\nconst CK=[['🧹 Input validation',['Validate type, length, format with an allow-list (server side)','Use parameterised queries / ORM, never string concatenation','Reject unexpected input; do not trust hidden fields'],'A03/A05'],['🔑 Authorization checks',['Deny by default','Check object ownership & role on every request on the server','Never trust IDs or roles sent by the client'],'A01'],['🖨️ Output encoding',['Encode output for its context (HTML, attribute, JS, URL)','Use framework auto-escaping; add Content-Security-Policy'],'A03/A05'],['⚙️ Safe configuration',['Disable debug & directory listing; change default credentials','Generic error messages; log details privately','HTTPS, secure cookies (HttpOnly, Secure, SameSite)'],'A05/A02'],['📦 Dependency updates',['Keep an inventory (SBOM) of libraries','Update regularly & run a dependency scan','Verify package integrity; remove unused libraries'],'A06/A08'],['📹 Bonus: auth & logging',['Hash passwords with bcrypt/argon2; offer MFA, lockout','Log failed logins & access denials; alert on patterns'],'A02/A07/A09']];\nlet ck={},tot=CK.reduce((a,g)=>a+g[1].length,0);\nfunction rk(){H_('ck',CK.map((g,gi)=>`\u003cdiv class=\"b\" style=\"margin:6px 0\">\u003cb>${g[0]}\u003c/b> \u003cspan class=\"p nw\">${g[2]}\u003c/span>`+g[1].map((it,ii)=>`\u003cdiv>\u003cbutton class=\"x ${ck[gi+'-'+ii]?'':'off'}\" data-k=\"${gi}-${ii}\" style=\"padding:2px 8px\">${ck[gi+'-'+ii]?'✅':'⬜'}\u003c/button> ${it}\u003c/div>`).join('')+'\u003c/div>').join(''));const n=Object.values(ck).filter(Boolean).length;$('cb2').style.width=n/tot*100+'%';$('cs').textContent=n==tot?'🏆 Checklist complete: secure-by-default mindset!':`${n}/${tot} practices ticked`;document.querySelectorAll('#ck button').forEach(b=>b.onclick=()=>{ck[b.dataset.k]=!ck[b.dataset.k];rk()})}rk();\nH_('ms','\u003ctr>\u003cth>2021 category\u003c/th>\u003cth>2025 mapping\u003c/th>\u003cth>Typical cause\u003c/th>\u003cth>Example\u003c/th>\u003cth>Mitigation\u003c/th>\u003c/tr>'+C.map(c=>`\u003ctr>\u003ctd>\u003cb>${c[0]}\u003c/b> ${c[1]}\u003c/td>\u003ctd>${c[2]}\u003c/td>\u003ctd>${c[5]}\u003c/td>\u003ctd>${c[6]}\u003c/td>\u003ctd>${c[8]}\u003c/td>\u003c/tr>`).join(''));\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!doctype html>\u003chtml>\u003chead>\u003cscript>(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true})}catch(x){}try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>SQL Safety Lab\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap\">\n\u003cstyle>\n/* Layout: sticky skin switcher on top, one column of lab stations over a full-screen animated canvas.\n   Every skin is a token set; panels keep text readable on any background. */\n:root{\n  --bg:#0b0820;--fg:#ece9ff;--muted:#b4acd8;--accent:#9d7bff;--accent2:#4fc3ff;\n  --panel:rgba(18,12,48,.80);--line:rgba(157,123,255,.38);--code:#07051a;\n  --good:#5ee6a8;--warn:#ffcf5c;--bad:#ff6b8a;--on-accent:#0b0820;\n  --f-display:'Unbounded','Trebuchet MS',sans-serif;--f-body:'Figtree',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;\n  color-scheme:dark;\n}\n:root[data-skin=\"blackhole\"]{--bg:#050404;--fg:#fff3e6;--muted:#dcbc9e;--accent:#ff9a3c;--accent2:#ffe3b0;--panel:rgba(14,9,6,.84);--line:rgba(255,154,60,.42);--code:#000;--on-accent:#120a04}\n:root[data-skin=\"supernova\"]{--bg:#1a0504;--fg:#fff0e0;--muted:#ffc9a0;--accent:#ff6a35;--accent2:#ffd23f;--panel:rgba(40,8,6,.82);--line:rgba(255,120,50,.46);--code:#110302;--on-accent:#1a0504}\n:root[data-skin=\"aurora\"]{--bg:#0 educe){*{transition:none!important;animation:none!important}}\n\u003c/style>\n\u003cstyle>\n@keyframes popin{from{opacity:0;transform:translateY(-8px);background:var(--accent)}to{opacity:1;transform:none}}\n@keyframes flash{0%,100%{background:transparent}30%{background:var(--accent2);color:var(--on-accent)}}\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}\n.tab[aria-selected=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.dbt{border-collapse:collapse;font:13px var(--f-mono);width:100%}\n.dbt th{text-align:left;padding:6px 10px;border-bottom:2px solid var(--accent);color:var(--accent2);white-space:nowrap}\n.dbt td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}\n.dbt tr.new{animation:popin .8s}.dbt td.flash{animation:flash 1s}.dbt tr.fade{opacity:0;transition:opacity .5s}.dbt tr.hit td{background:color-mix(in srgb,var(--accent2) 28%,transparent)}\n.dbt th.hl,.dbt td.hl{background:color-mix(in srgb,var(--accent) 28%,transparent)}\n.dbt tr.hlr td{background:color-mix(in srgb,var(--warn) 28%,transparent)}\n.dbt td.pw{color:var(--muted)}\n.verbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.verbs button{border:1px solid var(--line);background:var(--code);border-radius:10px;padding:10px 8px;text-align:left;min-width:0}\n.verbs button b{display:block;font:700 14px var(--f-mono);color:var(--accent2)}\n.verbs button span{font-size:12.5px;color:var(--muted)}\n.verbs button:hover{border-color:var(--accent)}\n.terms{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}\n.terms button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font:600 13px var(--f-mono)}\n.terms button[aria-pressed=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.sqlin{width:100%;min-height:74px;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px var(--f-mono);resize:vertical}\n.qbox{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:13px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-all;min-width:0}\n.qin{background:color-mix(in srgb,var(--warn) 38%,transparent);border-radius:4px;padding:0 2px;outline:1px dashed var(--warn)}\n.qcode{color:var(--muted)}\n.tks{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}\n.tk{font:12px var(--f-mono);padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--code);white-space:pre-wrap;word-break:break-all}\n.tk-kw{color:var(--accent);border-color:var(--accent)}.tk-id{color:var(--accent2)}.tk-str{color:var(--good);border-color:var(--good)}.tk-num{color:var(--warn)}.tk-op,.tk-p{color:var(--muted)}\n.tk-bad{color:var(--bad);border-color:var(--bad)}\n.tk-comment{color:var(--bad);border-color:var(--bad);text-decoration:line-through;opacity:.85}\n.tk.bound{border-style:dashed;box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 25%,transparent)}\n.legend{display:flex;flex-wrap:wrap;gap:8px;font:12px var(--f-mono);color:var(--muted);margin-top:8px}\n.out{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;border:1px solid var(--line);background:var(--code)}\n.out.good{border-color:var(--good)}.out.bad{border-color:var(--bad)}\n.out b.g{color:var(--good)}.out b.b{color:var(--bad)}\n.lg{display:grid;gap:10px}\n.lg label{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}\n.lg input[type=text],.lg input[type=password]{width:100%;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--f-mono)}\n.pnl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);min-width:0}\n.pnl h3{font-size:16px;margin-bottom:8px}\n.pnl.v h3{color:var(--bad)}.pnl.s h3{color:var(--good)}\n.slot{display:inline-block;border:2px dashed var(--good);border-radius:8px;padding:1px 8px;color:var(--good);font:600 12px var(--f-mono)}\n.cmpt{width:100%;border-collapse:collapse;font-size:14px}\n.cmpt th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.cmpt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:140px}\n.cmpt td:nth-child(2){color:var(--bad)}.cmpt td:nth-child(3){color:var(--good)}\n.cmpt td:first-child{font-weight:600;color:var(--fg);min-width:120px}\n.bad-t{color:var(--bad)}.good-t{color:var(--good)}\n.code{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.6 var(--f-mono);overflow-x:auto;white-space:pre;min-width:0}\n.code .rm{display:block;background:color-mix(in srgb,var(--bad) 22%,transparent)}\n.code .ad{display:block;background:color-mix(in srgb,var(--good) 22%,transparent)}\n.code .cm{color:var(--muted)}\n.lay{display:grid;gap:8px}\n.ly{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--code);transition:.35s;min-width:0}\n.ly input{accent-color:var(--accent);width:18px;height:18px;flex:none}\n.ly b{display:block;font-size:15px}.ly small{color:var(--muted);font-size:13px}\n.ly.off{opacity:.45}\n.ly.pass{border-color:var(--warn)}.ly.stop{border-color:var(--good);box-shadow:0 0 18px -4px var(--good)}\n.mx{border-collapse:collapse;font:13px var(--f-mono)}\n.mx th,.mx td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:center}\n.mx th:first-child,.mx td:first-child{text-align:left}\n.mx input{accent-color:var(--accent);width:18px;height:18px}\n.ptry{display:grid;gap:6px}\n.ptry button{text-align:left;border:1px solid var(--line);background:var(--code);border-radius:8px;padding:6px 10px;font:12.5px var(--f-mono);color:var(--fg)}\n.ptry button:hover{border-color:var(--accent)}\n.pstep{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--code);min-width:0}\n.pstep h4{margin:0 0 6px;font:700 13px var(--f-mono);color:var(--accent2);letter-spacing:.06em;text-transform:uppercase}\n.pstep ol{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}\n.cmd{display:block;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:13px var(--f-mono);margin-top:6px;overflow-x:auto;white-space:nowrap}\n.res-ok{color:var(--good);font-weight:700}.res-bad{color:var(--bad);font-weight:700}\n@media (max-width:760px){.verbs{grid-template-columns:1fr 1fr}}\n\u003c/style>\n\u003ccanvas id=\"bg\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"bar\" role=\"toolbar\" aria-label=\"Choose theme\">\n  \u003cb>Theme\u003c/b>\n  \u003cdiv class=\"skins\" id=\"skins\">\n    \u003cbutton class=\"skin\" data-skin=\"galaxy\" aria-pressed=\"true\">\u003ci style=\"background:linear-gradient(135deg,#9d7bff,#4fc3ff)\">\u003c/i>Galaxy\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"blackhole\" aria-pressed=\"false\">\u003ci style=\"background:radial-gradient(#000 35%,#ff9a3c)\">\u003c/i>Black Hole\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"supernova\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff3b1f,#ffd23f)\">\u003c/i>Supernova\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"aurora\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#3df5b0,#1a8f9c)\">\u003c/i>Aurora\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"cyber\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff2fb3,#19f0ff)\">\u003c/i>Cyberpunk\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"ocean\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#26c6ff,#0a3a7a)\">\u003c/i>Deep Ocean\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"sunset\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff9448,#ff6fae,#6a2c8a)\">\u003c/i>Sunset Retro\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"paper\" aria-pressed=\"false\">\u003ci style=\"background:#fff;border:1px solid #bbb\">\u003c/i>Light Paper\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cheader class=\"hero\">\n  \u003cdiv>\n    \u003cdiv class=\"eyebrow\">Day 11 · Data, queries and the mistake behind SQL injection\u003c/div>\n    \u003ch1>SQL Injection \u003cspan>&amp; Database Security\u003c/span>\u003c/h1>\n    \u003cp>Learn how a database reads a query, why gluing user input into SQL breaks it, and how placeholders fix it. Everything runs on a toy database inside this page. No real site, account or database is involved.\u003c/p>\n    \u003cdiv class=\"chips\">\n      \u003ca class=\"chip\" href=\"#s1\">1 · Tables &amp; CRUD\u003c/a>\u003ca class=\"chip\" href=\"#s2\">2 · SQL playground\u003c/a>\n      \u003ca class=\"chip\" href=\"#s3\">3 · Root cause\u003c/a>\u003ca class=\"chip\" href=\"#s4\">4 · Toy login app\u003c/a>\n      \u003ca class=\"chip\" href=\"#s5\">5 · The fix\u003c/a>\u003ca class=\"chip\" href=\"#s6\">6 · Least privilege\u003c/a>\n      \u003ca class=\"chip\" href=\"#s7\">7 · Defense layers\u003c/a>\u003ca class=\"chip\" href=\"#s8\">8 · Comparison\u003c/a>\u003ca class=\"chip\" href=\"#s9\">9 · Revision\u003c/a>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv>\n    \u003csvg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Query chips flowing into a database through a shield that turns input into plain data\" style=\"width:100%;height:auto\">\n      \u003cellipse cx=\"290\" cy=\"70\" rx=\"46\" ry=\"14\" fill=\"var(--code)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      \u003cpath d=\"M244 70v90c0 8 20 14 46 14s46-6 46-14V70\" fill=\"var(--code)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      \u003cpath d=\"M244 110c0 8 20 14 46 14s46-6 46-14M244 140c0 8 20 14 46 14s46-6 46-14\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n      \u003cpath d=\"M170 60l36 12v40c0 28-16 46-36 56-20-10-36-28-36-56V72z\" fill=\"var(--code)\" stroke=\"var(--good)\" stroke-width=\"3\"/>\n      \u003ctext x=\"170\" y=\"118\" text-anchor=\"middle\" font-size=\"26\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--good)\">?\u003c/text>\n      \u003cg font-family=\"JetBrains Mono,monospace\" font-size=\"12\">\n        \u003cg>\u003crect x=\"-34\" y=\"-10\" width=\"68\" height=\"20\" rx=\"6\" fill=\"var(--code)\" stroke=\"var(--warn)\"/>\u003ctext x=\"0\" y=\"4\" text-anchor=\"middle\" style=\"fill:var(--warn)\">o'brien\u003c/text>\n          \u003canimateMotion dur=\"4s\" repeatCount=\"indefinite\" path=\"M40,92 L150,92\"/>\u003c/g>\n        \u003cg>\u003crect x=\"-30\" y=\"-10\" width=\"60\" height=\"20\" rx=\"6\" fill=\"var(--code)\" stroke=\"var(--good)\"/>\u003ctext x=\"0\" y=\"4\" text-anchor=\"middle\" style=\"fill:var(--good)\">'data'\u003c/text>\n          \u003canimateMotion dur=\"4s\" begin=\"2s\" repeatCount=\"indefinite\" path=\"M200,128 L240,128\"/>\u003c/g>\n      \u003c/g>\n      \u003ctext x=\"180\" y=\"224\" text-anchor=\"middle\" font-size=\"12\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--muted)\">placeholders keep input as data\u003c/text>\n    \u003c/svg>\n  \u003c/div>\n\u003c/header>\n\n\u003c!-- 1 -->\n\u003csection id=\"s1\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 1\u003c/span>\u003ch2>Tables, rows, columns and the four verbs\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">A database is a set of tables. Press a verb and watch the table change.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card scroll\">\n      \u003ctable class=\"dbt\" id=\"anat\">\u003cthead>\u003ctr>\u003cth data-c=\"0\">id\u003c/th>\u003cth data-c=\"1\">username\u003c/th>\u003cth data-c=\"2\">role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"anatB\">\u003c/tbody>\u003c/table>\n      \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn ghost\" id=\"hlCol\">Show a column\u003c/button>\u003cbutton class=\"btn ghost\" id=\"hlRow\">Show a row\u003c/button>\u003c/div>\n      \u003cp style=\"margin-top:10px;font-size:14px;color:var(--muted)\">\u003cb style=\"color:var(--fg)\">Table\u003c/b> = the whole grid (users). \u003cb style=\"color:var(--fg)\">Column\u003c/b> = one field. \u003cb style=\"color:var(--fg)\">Row\u003c/b> = one record. SQL = the language you use to talk to it.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"verbs\" id=\"verbs\">\n        \u003cbutton data-v=\"select\">\u003cb>SELECT\u003c/b>\u003cspan>Read rows\u003c/span>\u003c/button>\n        \u003cbutton data-v=\"insert\">\u003cb>INSERT\u003c/b>\u003cspan>Add a row\u003c/span>\u003c/button>\n        \u003cbutton data-v=\"update\">\u003cb>UPDATE\u003c/b>\u003cspan>Change a value\u003c/span>\u003c/button>\n        \u003cbutton data-v=\"delete\">\u003cb>DELETE\u003c/b>\u003cspan>Remove a row\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"qbox\" id=\"verbQ\" style=\"margin-top:12px\">Press a verb.\u003c/div>\n      \u003cp id=\"verbN\" style=\"margin-top:10px;color:var(--muted);font-size:14px\">\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection id=\"s2\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 2 · Practical 1\u003c/span>\u003ch2>SQL playground on a toy SQLite-style database\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Type a query or press a preset. The toy database lives only in this page and resets with one click.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"terms\" id=\"presets\">\u003c/div>\n      \u003ctextarea class=\"sqlin\" id=\"sqlin\" aria-label=\"SQL query\" spellcheck=\"false\">SELECT * FROM users\u003c/textarea>\n      \u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"btn\" id=\"runq\">Run ▶\u003c/button>\u003cbutton class=\"btn ghost\" id=\"resetdb\">Reset database\u003c/button>\u003c/div>\n      \u003cdiv class=\"out\" id=\"qout\" aria-live=\"polite\">Result appears here.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card scroll\">\n      \u003cdiv class=\"tabs\" id=\"dbtabs\">\u003cbutton class=\"tab\" aria-selected=\"true\" data-t=\"users\">users\u003c/button>\u003cbutton class=\"tab\" aria-selected=\"false\" data-t=\"products\">products\u003c/button>\u003c/div>\n      \u003ctable class=\"dbt\" id=\"dbview\">\u003c/table>\n      \u003cp style=\"margin-top:10px;font-size:13px;color:var(--muted)\">Passwords are plain text here only because this is a toy. Real systems store salted hashes (bcrypt, argon2).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:8px\">The same thing for real, with Python and SQLite\u003c/h3>\n    \u003cdiv class=\"code\" id=\"pyBasic\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection id=\"s3\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 3\u003c/span>\u003ch2>Root cause: input glued into the query\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">The code builds one long string. The database cannot tell which part you meant as code and which part came from a user. Pick an input and see how it is read.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"terms\" id=\"rc\">\u003c/div>\n    \u003cdiv class=\"qbox\" id=\"rcQ\">\u003c/div>\n    \u003cdiv class=\"tks\" id=\"rcT\">\u003c/div>\n    \u003cdiv class=\"legend\">\u003cspan class=\"tk tk-kw\">keyword\u003c/span>\u003cspan class=\"tk tk-id\">column / table\u003c/span>\u003cspan class=\"tk tk-str\">text value\u003c/span>\u003cspan class=\"tk tk-comment\">ignored (comment)\u003c/span>\u003c/div>\n    \u003cdiv class=\"out\" id=\"rcO\" aria-live=\"polite\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection id=\"s4\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 4 · Practical 2 and 3\u003c/span>\u003ch2>Toy login app: vulnerable vs secure\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Same inputs go to both versions. Left glues strings. Right uses placeholders. Do not use these inputs on real sites or accounts.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"lg\">\n        \u003cdiv>\u003clabel for=\"lu\">Username\u003c/label>\u003cinput type=\"text\" id=\"lu\" value=\"alice\" autocomplete=\"off\" spellcheck=\"false\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"lp\">Password\u003c/label>\u003cinput type=\"text\" id=\"lp\" value=\"demo123\" autocomplete=\"off\" spellcheck=\"false\">\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"lrun\">Log in ▶\u003c/button>\u003c/div>\n        \u003cdiv class=\"terms\" id=\"lcases\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"lg\">\n        \u003cdiv>\u003clabel>Error display (vulnerable app)\u003c/label>\n          \u003cdiv class=\"terms\" id=\"errmode\">\u003cbutton aria-pressed=\"true\" data-e=\"detail\">Detailed (bad)\u003c/button>\u003cbutton aria-pressed=\"false\" data-e=\"generic\">Generic (good)\u003c/button>\u003c/div>\u003c/div>\n        \u003cp style=\"font-size:14px;color:var(--muted)\">Known test accounts: alice / demo123, bob / demo456, admin / demo-admin. When several rows match, the toy app logs in as the first one, a common real-world bug.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"grid2\" style=\"margin-top:16px\">\n    \u003cdiv class=\"pnl v\">\u003ch3>Vulnerable: string concatenation\u003c/h3>\u003cdiv class=\"qbox\" id=\"vq\">\u003c/div>\u003cdiv class=\"tks\" id=\"vt\">\u003c/div>\u003cdiv class=\"out\" id=\"vo\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"pnl s\">\u003ch3>Secure: parameterized query\u003c/h3>\u003cdiv class=\"qbox\" id=\"sq\">\u003c/div>\u003cdiv class=\"tks\" id=\"st\">\u003c/div>\u003cdiv class=\"out\" id=\"so\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch3 style=\"font-size:16px;color:var(--accent)\">Test cases\u003c/h3>\u003cbutton class=\"btn\" id=\"runall\">Run all test cases\u003c/button>\u003c/div>\n    \u003cdiv class=\"scroll\">\u003ctable class=\"cmpt\" id=\"tcases\">\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>What it tests\u003c/th>\u003cth>Username\u003c/th>\u003cth>Password\u003c/th>\u003cth>Expected\u003c/th>\u003cth>Vulnerable\u003c/th>\u003cth>Secure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection id=\"s5\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 5 · Practical 3\u003c/span>\u003ch2>The fix, line by line\u003c/h2>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003cbutton class=\"btn\" id=\"fixBtn\">Apply the fix ▶\u003c/button>\u003cbutton class=\"btn ghost\" id=\"unfixBtn\">Show original\u003c/button>\u003c/div>\n      \u003cdiv class=\"code\" id=\"diff\">\u003c/div>\n      \u003cp style=\"margin-top:10px;font-size:14px;color:var(--muted)\">The \u003ccode>?\u003c/code> marks are slots. The values travel separately as a tuple, so a quote inside a value can never end the string.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:8px\">Full toy script with test cases\u003c/h3>\n      \u003cdiv class=\"code\" id=\"pyFull\" style=\"max-height:340px;overflow:auto\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"btn\" id=\"copyPy\">Copy script\u003c/button>\u003cspan id=\"pyMsg\" style=\"font-size:14px;color:var(--good)\">\u003c/span>\u003c/div>\n      \u003ctextarea id=\"pyArea\" aria-label=\"Script text\" style=\"display:none;width:100%;min-height:120px;margin-top:10px;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px var(--f-mono)\">\u003c/textarea>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection id=\"s6\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 6\u003c/span>\u003ch2>Least privilege and safe error handling\u003c/h2>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:8px\">Rights of the app's database account\u003c/h3>\n      \u003cdiv class=\"terms\" id=\"rolep\">\u003cbutton data-r=\"owner\" aria-pressed=\"false\">Owner (everything)\u003c/button>\u003cbutton data-r=\"least\" aria-pressed=\"true\">Least privilege\u003c/button>\u003cbutton data-r=\"ro\" aria-pressed=\"false\">Read only\u003c/button>\u003c/div>\n      \u003cdiv class=\"scroll\">\u003ctable class=\"mx\" id=\"mx\">\u003c/table>\u003c/div>\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin:14px 0 8px\">Try a statement (on a throwaway copy)\u003c/h3>\n      \u003cdiv class=\"ptry\" id=\"ptry\">\u003c/div>\n      \u003cdiv class=\"out\" id=\"pout\" aria-live=\"polite\">Pick a statement.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:8px\">One failing query, two ways to show it\u003c/h3>\n      \u003cdiv class=\"pnl v\" style=\"margin-bottom:12px\">\u003ch3>Detailed error (leaks internals)\u003c/h3>\u003cdiv class=\"qbox\" id=\"e1\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"pnl s\">\u003ch3>Generic message + server log\u003c/h3>\u003cdiv class=\"qbox\" id=\"e2\">\u003c/div>\u003c/div>\n      \u003cp style=\"margin-top:10px;font-size:14px;color:var(--muted)\">Users need to know something failed. Only developers need to know why, and that goes in a private log.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection id=\"s7\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 7\u003c/span>\u003ch2>Defense in depth\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Switch layers on and off, then send a risky input at the toy app. The first fix is placeholders. The rest limit damage.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lay\" id=\"lay\">\u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" id=\"sendBad\">Send a risky input ▶\u003c/button>\u003c/div>\n    \u003cdiv class=\"out\" id=\"layO\" aria-live=\"polite\">Press the button.\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection id=\"s8\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 8 · Expected output\u003c/span>\u003ch2>Vulnerable pattern vs secure pattern\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card scroll\">\u003ctable class=\"cmpt\" id=\"cmpT\">\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Vulnerable pattern\u003c/th>\u003cth>Secure pattern\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" id=\"copyCmp\">Copy comparison and test results\u003c/button>\u003cspan id=\"cmpMsg\" style=\"font-size:14px;color:var(--good)\">\u003c/span>\u003c/div>\n  \u003ctextarea id=\"cmpArea\" aria-label=\"Comparison text\" style=\"display:none;width:100%;min-height:150px;margin-top:10px;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px var(--f-mono)\">\u003c/textarea>\n  \u003cdiv class=\"grid3\" style=\"margin-top:16px\">\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 1\u003c/h4>\u003col>\u003cli>Create \u003ccode>toy_app.py\u003c/code> from Station 5.\u003c/li>\u003cli>Run the setup to build the database.\u003c/li>\u003c/ol>\u003ccode class=\"cmd\">python3 toy_app.py\u003c/code>\u003ccode class=\"cmd\">sqlite3 toy.db \".schema\"\u003c/code>\u003c/div>\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 2\u003c/h4>\u003col>\u003cli>Call \u003ccode>login_vulnerable\u003c/code> with each test case.\u003c/li>\u003cli>Note which ones break or bypass the check.\u003c/li>\u003cli>Only your own toy file. No real systems.\u003c/li>\u003c/ol>\u003c/div>\n    \u003cdiv class=\"pstep\">\u003ch4>Practical 3\u003c/h4>\u003col>\u003cli>Switch to \u003ccode>login_secure\u003c/code>.\u003c/li>\u003cli>Rerun every test case.\u003c/li>\u003cli>Confirm all injection cases now fail to log in.\u003c/li>\u003c/ol>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection id=\"s9\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 9\u003c/span>\u003ch2>Quick revision\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:16px\">\u003cdiv class=\"cheat\" id=\"cheat\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Lab checklist\u003c/h3>\u003cdiv class=\"prog\">\u003ci id=\"prog\">\u003c/i>\u003c/div>\u003cdiv class=\"check\" id=\"check\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Expected output\u003c/h3>\n      \u003cdiv class=\"check\" style=\"gap:6px\">\u003cdiv class=\"stepbox\">Vulnerable vs secure comparison\u003c/div>\u003cdiv class=\"stepbox\">Test cases with results\u003c/div>\u003cdiv class=\"stepbox\">Working \u003ccode>toy_app.py\u003c/code>\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter>Day 11 · SQL Injection and Database Security · Toy application only. Never test real sites, accounts or databases.\u003c/footer>\n\u003c/div>\n\u003cscript>\n/* ===== Animated backgrounds + theme switcher ===== */\n(function(){\n  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');\n  var W=0,H=0,dpr=1,skin='galaxy';\n  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var stars=[],disk=[],bubbles=[],glows=[],parts=[],rings=[],burstT=0,sprites={};\n  var R=Math.random;\n\n  function resize(){\n    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;\n    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init();\n    if(rm)staticDraw();\n  }\n  function newBubble(first){return{x:R()*W,y:first?R()*H:H+30,r:2+Math.pow(R(),2)*14,sp:.02+R()*.05,ph:R()*6.28}}\n  function init(){\n    stars=[];var n=Math.round(W*H/9000);\n    for(var i=0;i\u003cn;i++)stars.push({x:R()*W,y:R()*H,r:R()*1.3+.3,p:R()*6.28,s:R()*2+.5});\n    disk=[];for(i=0;i\u003c700;i++)disk.push({a:R()*6.28,r:Math.pow(R(),.75),sz:R()*1.6+.5});\n    bubbles=[];for(i=0;i\u003c45;i++)bubbles.push(newBubble(true));\n    glows=[];for(i=0;i\u003c22;i++)glows.push({x:R()*W,y:R()*H,r:10+R()*30,ph:R()*6.28,vx:(R()-.5)*.01,vy:(R()-.5)*.01,c:R()\u003c.5?'60,230,255':'90,255,200'});\n    parts=[];rings=[];burstT=0;\n  }\n  function drawStars(t,rgb,mul){\n    for(var i=0;i\u003cstars.length;i++){var s=stars[i];\n      var a=(.25+.75*(.5+.5*Math.sin(t*.002*s.s+s.p)))*(mul||1);\n      ctx.fillStyle='rgba('+rgb+','+a.toFixed(3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}\n  }\n  function sprite(rgb){\n    if(sprites[rgb])return sprites[rgb];\n    var c=document.createElement('canvas');c.width=1;c.height=256;var g=c.getContext('2d');\n    var gr=g.createLinearGradient(0,0,0,256);\n    gr.addColorStop(0,'rgba('+rgb+',0)');gr.addColorStop(.12,'rgba('+rgb+',.95)');gr.addColorStop(.5,'rgba('+rgb+',.32)');gr.addColorStop(1,'rgba('+rgb+',0)');\n    g.fillStyle=gr;g.fillRect(0,0,1,256);return(sprites[rgb]=c);\n  }\n\n  function galaxy(t){\n    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b0820');g.addColorStop(.5,'#1a1040');g.addColorStop(1,'#07142e');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    var b=[[.2,.25,'157,123,255'],[.8,.35,'79,195,255'],[.5,.8,'255,100,200'],[.9,.9,'120,90,255']];\n    for(var i=0;i\u003cb.length;i++){\n      var x=W*(b[i][0]+Math.sin(t*.00008*(i+1)+i)*.06),y=H*(b[i][1]+Math.cos(t*.00007*(i+2))*.06),r=Math.max(W,H)*.45;\n      var rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba('+b[i][2]+',.26)');rg.addColorStop(1,'rgba('+b[i][2]+',0)');\n      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    }\n    drawStars(t,'255,255,255');\n    var k=(t%7000)/7000;\n    if(k\u003c.12){var p=k/.12;var x0=W*.15+W*.6*p,y0=H*.05+H*.25*p;\n      var sg=ctx.createLinearGradient(x0,y0,x0-90,y0-45);sg.addColorStop(0,'rgba(255,255,255,'+(1-p)+')');sg.addColorStop(1,'rgba(255,255,255,0)');\n      ctx.strokeStyle=sg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0-90,y0-45);ctx.stroke();}\n  }\n\n  function blackhole(t){\n    ctx.fillStyle='#050404';ctx.fillRect(0,0,W,H);drawStars(t,'255,235,210',.8);\n    var cx=W*.5,cy=H*.46,Rh=Math.min(W,H)*.11;\n    var rg=ctx.createRadialGradient(cx,cy,Rh*.8,cx,cy,Rh*5);rg.addColorStop(0,'rgba(255,170,80,.42)');rg.addColorStop(.4,'rgba(255,110,30,.14)');rg.addColorStop(1,'rgba(255,100,20,0)');\n    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    ctx.save();ctx.translate(cx,cy);ctx.rotate(-.35);\n    function pass(front){\n      for(var i=0;i\u003cdisk.length;i++){var d=disk[i];var rr=Rh*1.35+d.r*Rh*3.4;\n        var a=d.a+t*.0036*Math.pow(Rh*1.35/rr,1.5);var s=Math.sin(a);if((s>0)!==front)continue;\n        var heat=1-d.r;var col=heat>.7?'255,245,225':(heat>.35?'255,190,110':'255,120,40');\n        ctx.fillStyle='rgba('+col+','+(.3+heat*.65).toFixed(2)+')';var z=d.sz*(1+heat);\n        ctx.fillRect(Math.cos(a)*rr,s*rr*.26,z,z*.9);}\n    }\n    pass(false);\n    ctx.strokeStyle='rgba(255,190,110,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,Rh*1.7,Rh*1.45,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();\n    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,Rh,0,6.283);ctx.fill();\n    ctx.strokeStyle='rgba(255,220,170,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,Rh*1.02,0,6.283);ctx.stroke();\n    pass(true);ctx.restore();\n  }\n\n  function burst(x,y){\n    for(var i=0;i\u003c170;i++){var a=R()*6.283,sp=Math.sqrt(R())*6;\n      var life=2400+R()*2200;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,max:life,r:1+R()*2.6});}\n    rings.push({x:x,y:y,age:0});\n    if(parts.length>1200)parts.splice(0,parts.length-1200);\n  }\n  function supernova(t,dt){\n    var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#3a0a05');g.addColorStop(1,'#110202');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    burstT-=dt;if(burstT\u003c=0){burstT=3800;burst(W*(.3+R()*.4),H*(.25+R()*.4));}\n    ctx.globalCompositeOperation='lighter';\n    var i,p;\n    for(i=rings.length-1;i>=0;i--){var r=rings[i];r.age+=dt;\n      if(r.age>2600){rings.splice(i,1);continue;}\n      var al=1-r.age/2600;ctx.strokeStyle='rgba(255,150,60,'+(al*.5).toFixed(3)+')';ctx.lineWidth=3+al*5;\n      ctx.beginPath();ctx.arc(r.x,r.y,r.age*.22,0,6.283);ctx.stroke();\n      var fl=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,90);fl.addColorStop(0,'rgba(255,240,200,'+(Math.max(0,1-r.age/500)).toFixed(3)+')');fl.addColorStop(1,'rgba(255,120,30,0)');\n      ctx.fillStyle=fl;ctx.fillRect(r.x-90,r.y-90,180,180);}\n    for(i=parts.length-1;i>=0;i--){p=parts[i];p.life-=dt;\n      if(p.life\u003c=0){parts.splice(i,1);continue;}\n      p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.vx*=.993;p.vy*=.993;p.vy+=.0004*dt;\n      var a=p.life/p.max;ctx.fillStyle='hsla('+(8+a*52)+',100%,'+(45+a*35)+'%,'+a.toFixed(3)+')';\n      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.5+a),0,6.283);ctx.fill();}\n    ctx.globalCompositeOperation='source-over';\n  }\n\n  function aurora(t){\n    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02121a');g.addColorStop(1,'#04242b');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t,'220,255,245',.6);\n    var bands=[{c:'61,245,176',y:.26,h:.34,s:1},{c:'90,212,255',y:.34,h:.28,s:1.3},{c:'150,120,255',y:.2,h:.24,s:.8}];\n    ctx.globalCompositeOperation='lighter';\n    for(var i=0;i\u003cbands.length;i++){var b=bands[i],sp=sprite(b.c);\n      for(var x=0;x\u003c=W;x+=7){var nx=x/W;\n        var wave=Math.sin(nx*5+t*.0004*b.s+i*2)*.06+Math.sin(nx*11-t*.0006*b.s)*.025;\n        var top=H*(b.y+wave),len=H*b.h*(.6+.4*Math.sin(nx*8+t*.0009*b.s+i));\n        ctx.globalAlpha=.3+.25*Math.sin(nx*14+t*.0012*b.s+i);\n        ctx.drawImage(sp,0,0,1,256,x,top,7,len);}\n    }\n    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n    ctx.fillStyle='#02090c';ctx.beginPath();ctx.moveTo(0,H);\n    for(x=0;x\u003c=W;x+=20)ctx.lineTo(x,H*.9-Math.abs(Math.sin(x*.004+1))*H*.07-Math.sin(x*.011)*H*.015);\n    ctx.lineTo(W,H);ctx.closePath();ctx.fill();\n  }\n\n  function cyber(t){\n    var hy=H*.55;\n    var g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#0a0614');g.addColorStop(1,'#34093f');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);\n    drawStars(t,'255,200,255',.5);\n    var Rs=Math.min(W,H)*.2,cx=W/2,cy=hy-Rs*.15;\n    var sg=ctx.createLinearGradient(0,cy-Rs,0,cy+Rs);sg.addColorStop(0,'#ffe14d');sg.addColorStop(.55,'#ff2fb3');sg.addColorStop(1,'#7a1fd6');\n    ctx.save();ctx.beginPath();ctx.arc(cx,cy,Rs,0,6.283);ctx.clip();ctx.fillStyle=sg;ctx.fillRect(cx-Rs,cy-Rs,Rs*2,Rs*2);\n    ctx.fillStyle='#34093f';for(var k=0;k\u003c7;k++){var yy=cy+Rs*(.05+k*.14)+((t*.01)%(Rs*.14))*0;ctx.fillRect(cx-Rs,yy,Rs*2,2+k*1.6);}\n    ctx.restore();\n    var fg=ctx.createLinearGradient(0,hy,0,H);fg.addColorStop(0,'#1a0630');fg.addColorStop(1,'#07030f');ctx.fillStyle=fg;ctx.fillRect(0,hy,W,H-hy);\n    ctx.lineWidth=1;\n    var i;\n    for(i=-24;i\u003c=24;i++){var x1=W/2+i*W*.12;\n      ctx.strokeStyle='rgba(255,47,179,.55)';ctx.beginPath();ctx.moveTo(W/2+i*6,hy);ctx
