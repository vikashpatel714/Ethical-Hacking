);border-radius:8px;padding:8px 12px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}\n\n/* users */\n.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}\n.user{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);text-align:center;transition:.3s}\n.user .av{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 16px var(--f-mono);background:var(--accent);color:var(--on-accent)}\n.user.hl{border-color:var(--accent2);box-shadow:0 0 18px -4px var(--accent2)}\n.user small{display:block;color:var(--muted);font-size:12px}\n\n/* permissions */\n.permrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.pcol{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);min-width:0}\n.pcol h4{margin:0 0 8px;font:700 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}\n.bits{display:flex;gap:8px}\n.bit{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 0;font:700 20px var(--f-mono);display:grid;gap:2px;place-items:center;transition:.2s}\n.bit small{font:500 11px var(--f-body);color:var(--muted)}\n.bit[aria-pressed=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);transform:translateY(-3px)}\n.bit[aria-pressed=\"true\"] small{color:var(--on-accent)}\n.pcol .num{margin-top:8px;font:700 22px var(--f-mono);text-align:center}\n.big{font:700 clamp(20px,5vw,34px) var(--f-mono);letter-spacing:.06em;word-break:break-all}\n.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n.who{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);text-align:center}\n.who .ok{font-size:13px;margin-top:4px}\n.yes{color:var(--good)}.no{color:var(--bad)}\n\n/* processes */\n.tbl{width:100%;border-collapse:collapse;font:13px var(--f-mono)}\n.tbl th{font-weight:600;text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}\n.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\n.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}\n.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s}\n.svc{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--code)}\n.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:8px}\n.dot.up{background:var(--good);box-shadow:0 0 10px var(--good)}\n.tog{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font:600 12px var(--f-mono)}\n\n/* apt / env */\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.stepbox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--code);font:600 13px var(--f-mono);transition:.3s}\n.stepbox.on{border-color:var(--accent2);background:var(--accent);color:var(--on-accent)}\n.arrow{color:var(--accent2)}\n\n/* compare */\n.vs{display:grid;gap:10px}\n.vsrow{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:center;font-size:14px}\n.vsrow>div{min-width:0}\n.vsh{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.vsbar{height:22px;border-radius:6px;background:var(--code);overflow:hidden;position:relative;border:1px solid var(--line)}\n.vsbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width 1s}\n.vsbar.k i{background:var(--accent2)}\n.vsbar span{position:relative;font:600 11px var(--f-mono);padding-left:8px;line-height:20px;color:var(--fg)}\n\n/* terminal */\n.term{background:var(--code);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}\n.term-top{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}\n.term-top i{width:10px;height:10px;border-radius:50%;display:block}\n.term-top span{margin-left:8px;font:12px var(--f-mono);color:var(--muted)}\n#out{height:300px;overflow:auto;padding:12px;font:13px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}\n#out .p{color:var(--accent2)}#out .c{color:var(--fg);font-weight:600}\n.inputline{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}\n.inputline span{font:13px var(--f-mono);color:var(--accent2);white-space:nowrap}\n.inputline input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:14px var(--f-mono);outline:none}\n.steps{display:grid;gap:6px;max-height:340px;overflow:auto}\n.stp{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--code);font:13px var(--f-mono);text-align:left;width:100%}\n.stp.done{opacity:.55}.stp.cur{border-color:var(--accent2);box-shadow:0 0 12px -4px var(--accent2)}\n.stp b{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;flex:none}\n.explain{margin-top:10px;font-size:14px;color:var(--muted);min-height:44px}\n\n/* cheat + footer */\n.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}\n.cheat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--code);font-size:14px;min-width:0}\n.cheat code{color:var(--accent2);font-weight:600;display:block;margin-bottom:2px}\n.check{display:grid;gap:8px}\n.check label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--code);cursor:pointer}\n.check input{accent-color:var(--accent);margin-top:4px}\n.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:12px}\n.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .4s}\nfooter{padding-block:30px 60px;color:var(--muted);font-size:14px;text-align:center}\n\n@media (max-width:760px){\n  .hero,.grid2,.grid3,.permrow,.matrix{grid-template-columns:1fr}\n  .hero{padding-block:36px 10px}\n  .vsrow{grid-template-columns:1fr}\n  .bar b{display:none}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\u003c/style>\n\u003cstyle>\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}\n.tab[aria-selected=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.scene{width:100%;height:auto;display:block}\n.vcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--code);min-width:0}\n.vcard .q{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}\n.vcard h3{font-size:22px;margin:4px 0 6px;color:var(--accent)}\n.vcard .ex{margin-top:8px;font:13px var(--f-mono);color:var(--fg);border-top:1px dashed var(--line);padding-top:8px}\n.vcard a{color:var(--accent2)}\n.mset{display:flex;flex-wrap:wrap;gap:6px}\n.mset button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font:600 13px var(--f-mono)}\n.mset button[aria-pressed=\"true\"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n.mrow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;margin-bottom:10px}\n.mrow label{font:600 13px var(--f-mono);color:var(--muted)}\n.score{display:grid;place-items:center;border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--code);transition:border-color .3s}\n.score .n{font:700 clamp(40px,9vw,64px) var(--f-display);line-height:1}\n.score .l{font:700 14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}\n.scale{display:flex;height:12px;border-radius:8px;overflow:hidden;margin-top:12px;width:100%;position:relative}\n.scale i{display:block;height:100%}\n.scale b{position:absolute;top:-4px;width:4px;height:20px;background:var(--fg);border-radius:2px;transition:left .5s}\n.vec{font:12px var(--f-mono);color:var(--muted);word-break:break-all;margin-top:10px;text-align:center}\n.sevL{color:var(--good)}.sevM{color:var(--warn)}.sevH{color:var(--bad)}\n.fcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--code);min-width:0;transition:border-color .3s}\n.fcard.right{border-color:var(--good)}.fcard.wrong{border-color:var(--bad)}\n.fcard h4{margin:0;font-size:15px}\n.fmeta{font:12px var(--f-mono);color:var(--muted);margin:4px 0 8px;display:flex;gap:10px;flex-wrap:wrap}\n.fcard .res{margin-top:8px;font-size:14px}\n.hint{font:12.5px var(--f-mono);color:var(--accent2);background:var(--panel);border-radius:6px;padding:6px 8px;margin-top:8px}\n.sev{display:inline-block;border-radius:999px;padding:1px 8px;font:700 11px var(--f-mono);border:1px solid}\n.sev.Low{color:var(--good);border-color:var(--good)}.sev.Medium{color:var(--warn);border-color:var(--warn)}.sev.High,.sev.Critical{color:var(--bad);border-color:var(--bad)}\n.sev.Critical{background:var(--bad);color:var(--on-accent)}\n.m5{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;max-width:420px}\n.m5 .cell{aspect-ratio:1;border-radius:6px;position:relative;display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;align-content:center;font:700 10px var(--f-mono);min-width:0}\n.m5 .ax{display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--muted)}\n.m5 .dotf{background:var(--fg);color:var(--bg);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font:700 10px var(--f-mono)}\n.lowc{background:color-mix(in srgb,var(--good) 30%,transparent)}.medc{background:color-mix(in srgb,var(--warn) 32%,transparent)}.highc{background:color-mix(in srgb,var(--bad) 32%,transparent)}.critc{background:color-mix(in srgb,var(--bad) 62%,transparent)}\n.slr{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}\n.slr label{font:600 12px var(--f-mono);color:var(--muted);display:block}\n.slr input[type=range]{width:100%;accent-color:var(--accent)}\n.rt{display:grid;gap:10px}\n.rrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--code);min-width:0}\n.rrow .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}\n.rank{font:700 13px var(--f-mono);color:var(--accent2)}\n.treat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}\n.treat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--code);font-size:14px}\n.treat b{display:block;color:var(--accent);margin-bottom:2px}\n.form{display:grid;gap:10px}\n.form label{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}\n.form input,.form select,.form textarea{width:100%;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--f-body)}\n.form textarea{min-height:70px;resize:vertical}\n.rep{border:1px solid var(--line);border-radius:12px;background:var(--code);padding:16px;min-width:0}\n.rep h4{margin:0 0 10px;font-size:18px;color:var(--accent)}\n.rep dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14px}\n.rep dt{font:600 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}\n.rep dd{margin:0;min-width:0;word-break:break-word}\n.stat{display:inline-block;border-radius:6px;padding:2px 8px;font:700 12px var(--f-mono);border:1px solid var(--line)}\n.inv{width:100%;border-collapse:collapse;font:13px var(--f-mono)}\n.inv th{text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\n.inv td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}\n.pill{border-radius:999px;padding:1px 9px;font:700 11px var(--f-mono);border:1px solid}\n.pill.ok{color:var(--good);border-color:var(--good)}.pill.due{color:var(--warn);border-color:var(--warn)}.pill.over{color:var(--bad);border-color:var(--bad)}\n.sw{stroke-dasharray:1;stroke-dashoffset:1}\n@media (max-width:760px){.mrow{grid-template-columns:1fr}.slr{grid-template-columns:1fr}.rep dl{grid-template-columns:1fr}}\n\u003c/style>\n\u003ccanvas id=\"bg\" aria-hidden=\"true\">\u003c/canvas>\n\u003cdiv class=\"wrap\">\n\n\u003cdiv class=\"bar\" role=\"toolbar\" aria-label=\"Choose theme\">\n  \u003cb>Theme\u003c/b>\n  \u003cdiv class=\"skins\" id=\"skins\">\n    \u003cbutton class=\"skin\" data-skin=\"galaxy\" aria-pressed=\"true\">\u003ci style=\"background:linear-gradient(135deg,#9d7bff,#4fc3ff)\">\u003c/i>Galaxy\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"blackhole\" aria-pressed=\"false\">\u003ci style=\"background:radial-gradient(#000 35%,#ff9a3c)\">\u003c/i>Black Hole\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"supernova\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff3b1f,#ffd23f)\">\u003c/i>Supernova\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"aurora\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#3df5b0,#1a8f9c)\">\u003c/i>Aurora\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"cyber\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff2fb3,#19f0ff)\">\u003c/i>Cyberpunk\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"ocean\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#26c6ff,#0a3a7a)\">\u003c/i>Deep Ocean\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"sunset\" aria-pressed=\"false\">\u003ci style=\"background:linear-gradient(135deg,#ff9448,#ff6fae,#6a2c8a)\">\u003c/i>Sunset Retro\u003c/button>\n    \u003cbutton class=\"skin\" data-skin=\"paper\" aria-pressed=\"false\">\u003ci style=\"background:#fff;border:1px solid #bbb\">\u003c/i>Light Paper\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cheader class=\"hero\">\n  \u003cdiv>\n    \u003cdiv class=\"eyebrow\">Day 8 · Find it, prove it, rank it, fix it\u003c/div>\n    \u003ch1>Vulnerability Assessment \u003cspan>&amp; Risk Prioritization\u003c/span>\u003c/h1>\n    \u003cp>Learn to read scanner results the way a professional does: check what is real, score it, decide what to fix first, and write it up. Practice only on the approved training VM.\u003c/p>\n    \u003cdiv class=\"chips\">\n      \u003ca class=\"chip\" href=\"#s1\">1 · Scan vs pen test\u003c/a>\u003ca class=\"chip\" href=\"#s2\">2 · CVE, CWE, CVSS\u003c/a>\n      \u003ca class=\"chip\" href=\"#s3\">3 · CVSS calculator\u003c/a>\u003ca class=\"chip\" href=\"#s4\">4 · Workflow\u003c/a>\n      \u003ca class=\"chip\" href=\"#s5\">5 · Validate findings\u003c/a>\u003ca class=\"chip\" href=\"#s6\">6 · Prioritize\u003c/a>\n      \u003ca class=\"chip\" href=\"#s7\">7 · Report\u003c/a>\u003ca class=\"chip\" href=\"#s8\">8 · Patching\u003c/a>\u003ca class=\"chip\" href=\"#s9\">9 · Revision\u003c/a>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv>\n    \u003csvg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"A scanner line sweeping over a list of checks and flagging two of them\" style=\"width:100%;height:auto\">\n      \u003crect x=\"40\" y=\"30\" width=\"280\" height=\"180\" rx=\"14\" fill=\"var(--code)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      \u003cg font-family=\"JetBrains Mono,monospace\" font-size=\"13\">\n        \u003crect x=\"60\" y=\"52\" width=\"150\" height=\"10\" rx=\"5\" fill=\"var(--line)\"/>\u003ccircle cx=\"290\" cy=\"57\" r=\"8\" fill=\"var(--good)\"/>\n        \u003crect x=\"60\" y=\"82\" width=\"120\" height=\"10\" rx=\"5\" fill=\"var(--line)\"/>\u003ccircle cx=\"290\" cy=\"87\" r=\"8\" fill=\"var(--bad)\">\u003canimate attributeName=\"r\" values=\"8;11;8\" dur=\"1.6s\" repeatCount=\"indefinite\"/>\u003c/circle>\n        \u003crect x=\"60\" y=\"112\" width=\"170\" height=\"10\" rx=\"5\" fill=\"var(--line)\"/>\u003ccircle cx=\"290\" cy=\"117\" r=\"8\" fill=\"var(--good)\"/>\n        \u003crect x=\"60\" y=\"142\" width=\"100\" height=\"10\" rx=\"5\" fill=\"var(--line)\"/>\u003ccircle cx=\"290\" cy=\"147\" r=\"8\" fill=\"var(--warn)\"/>\n        \u003crect x=\"60\" y=\"172\" width=\"140\" height=\"10\" rx=\"5\" fill=\"var(--line)\"/>\u003ccircle cx=\"290\" cy=\"177\" r=\"8\" fill=\"var(--good)\"/>\n      \u003c/g>\n      \u003crect x=\"40\" y=\"30\" width=\"280\" height=\"18\" rx=\"6\" fill=\"var(--accent2)\" opacity=\".28\">\u003canimate attributeName=\"y\" values=\"30;192;30\" dur=\"4.5s\" repeatCount=\"indefinite\"/>\u003c/rect>\n    \u003c/svg>\n  \u003c/div>\n\u003c/header>\n\n\u003c!-- 1 -->\n\u003csection id=\"s1\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 1\u003c/span>\u003ch2>Vulnerability scan vs penetration test\u003c/h2>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:17px;color:var(--accent);margin-bottom:8px\">Scan: check every door and window\u003c/h3>\n      \u003csvg class=\"scene\" viewBox=\"0 0 300 130\" role=\"img\" aria-label=\"A scanner sweeping across many doors and flagging two\">\n        \u003cg stroke=\"var(--line)\" fill=\"var(--code)\" stroke-width=\"2\">\n          \u003crect x=\"14\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\u003crect x=\"62\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\u003crect x=\"110\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\u003crect x=\"158\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\u003crect x=\"206\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\u003crect x=\"254\" y=\"40\" width=\"32\" height=\"56\" rx=\"4\"/>\n        \u003c/g>\n        \u003crect x=\"0\" y=\"30\" width=\"14\" height=\"76\" fill=\"var(--accent2)\" opacity=\".5\">\u003canimate attributeName=\"x\" values=\"0;286;0\" dur=\"5s\" repeatCount=\"indefinite\"/>\u003c/rect>\n        \u003cg font-size=\"18\" text-anchor=\"middle\" font-weight=\"700\">\u003ctext x=\"78\" y=\"26\" style=\"fill:var(--bad)\">!\u003canimate attributeName=\"opacity\" values=\"0;0;1;1;0\" keyTimes=\"0;.15;.2;.9;1\" dur=\"5s\" repeatCount=\"indefinite\"/>\u003c/text>\u003ctext x=\"222\" y=\"26\" style=\"fill:var(--warn)\">!\u003canimate attributeName=\"opacity\" values=\"0;0;1;1;0\" keyTimes=\"0;.7;.75;.95;1\" dur=\"5s\" repeatCount=\"indefinite\"/>\u003c/text>\u003c/g>\n        \u003ctext x=\"150\" y=\"122\" text-anchor=\"middle\" font-size=\"12\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--muted)\">fast, wide, automated, may be wrong\u003c/text>\n      \u003c/svg>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:17px;color:var(--accent);margin-bottom:8px\">Pen test: a person tries to get in\u003c/h3>\n      \u003csvg class=\"scene\" viewBox=\"0 0 300 130\" role=\"img\" aria-label=\"A tester following one path through a door to a target\">\n        \u003crect x=\"170\" y=\"30\" width=\"110\" height=\"70\" rx=\"6\" fill=\"var(--code)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n        \u003crect x=\"170\" y=\"56\" width=\"10\" height=\"44\" fill=\"var(--warn)\"/>\u003crect x=\"246\" y=\"48\" width=\"22\" height=\"22\" rx=\"4\" fill=\"none\" stroke=\"var(--good)\" stroke-width=\"2\"/>\n        \u003cpath id=\"ptp\" d=\"M20 100 L120 100 L175 78 L257 59\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\n        \u003ccircle r=\"7\" fill=\"var(--accent2)\">\u003canimateMotion dur=\"4s\" repeatCount=\"indefinite\" path=\"M20,100 L120,100 L175,78 L257,59\"/>\u003c/circle>\n        \u003ctext x=\"150\" y=\"122\" text-anchor=\"middle\" font-size=\"12\" font-family=\"JetBrains Mono,monospace\" style=\"fill:var(--muted)\">slow, deep, manual, proves real impact\u003c/text>\n      \u003c/svg>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\u003cdiv class=\"vs\" id=\"vs1\">\u003c/div>\n    \u003cp class=\"note\" style=\"margin-top:12px\">Both need written permission and a defined scope. This course day is about assessment: finding and judging weaknesses, not attacking anything.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003c!-- 2 -->\n\u003csection id=\"s2\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 2\u003c/span>\u003ch2>CVE, CWE, CVSS and where to look them up\u003c/h2>\u003c/div>\n  \u003cdiv class=\"grid3\" id=\"vocab\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:10px\">Three common causes of findings\u003c/h3>\n    \u003cdiv class=\"grid3\">\n      \u003cdiv class=\"vcard\">\u003cdiv class=\"q\">Misconfiguration\u003c/div>\u003cp style=\"font-size:14px;margin-top:4px\">A setting is unsafe.\u003c/p>\u003cdiv class=\"ex\">Directory listing on /backup/\u003c/div>\u003c/div>\n      \u003cdiv class=\"vcard\">\u003cdiv class=\"q\">Outdated software\u003c/div>\u003cp style=\"font-size:14px;margin-top:4px\">A known flaw is not patched.\u003c/p>\u003cdiv class=\"ex\">Old service version still running\u003c/div>\u003c/div>\n      \u003cdiv class=\"vcard\">\u003cdiv class=\"q\">Exposed service\u003c/div>\u003cp style=\"font-size:14px;margin-top:4px\">Something is reachable that should not be.\u003c/p>\u003cdiv class=\"ex\">Telnet open on port 23\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 3 -->\n\u003csection id=\"s3\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 3\u003c/span>\u003ch2>CVSS 3.1 base score calculator\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">CVSS answers \"how bad is this flaw in general?\". Tap the metrics and watch the score move.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"row\" style=\"margin-bottom:12px\" id=\"cpre\">\u003c/div>\n      \u003cdiv id=\"cm\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"score\" id=\"score\">\u003cdiv class=\"n\" id=\"sn\">9.8\u003c/div>\u003cdiv class=\"l\" id=\"sl\">Critical\u003c/div>\u003c/div>\n      \u003cdiv class=\"scale\" id=\"scale\">\u003ci style=\"width:1%;background:var(--muted)\">\u003c/i>\u003ci style=\"width:39%;background:var(--good)\">\u003c/i>\u003ci style=\"width:30%;background:var(--warn)\">\u003c/i>\u003ci style=\"width:20%;background:var(--bad)\">\u003c/i>\u003ci style=\"width:10%;background:var(--bad);opacity:.7\">\u003c/i>\u003cb id=\"sneedle\">\u003c/b>\u003c/div>\n      \u003cdiv style=\"display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted);margin-top:6px\">\u003cspan>0\u003c/span>\u003cspan>3.9\u003c/span>\u003cspan>6.9\u003c/span>\u003cspan>8.9\u003c/span>\u003cspan>10\u003c/span>\u003c/div>\n      \u003cdiv class=\"vec\" id=\"vec\">\u003c/div>\n      \u003cp style=\"margin-top:10px;color:var(--muted);font-size:14px\">The score ignores your business. A 9.8 on a spare test box can matter less than a 6.1 on your payment site. Station 6 shows why.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 4 -->\n\u003csection id=\"s4\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 4\u003c/span>\u003ch2>The assessment workflow\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003cbutton class=\"btn\" id=\"wfPlay\">Play ▶\u003c/button>\u003cbutton class=\"btn ghost\" id=\"wfReset\">Reset\u003c/button>\u003c/div>\n    \u003cdiv class=\"flow\" id=\"wf\">\u003c/div>\n    \u003cdiv class=\"pkt\" id=\"wfInfo\" style=\"margin-top:12px\" aria-live=\"polite\">Press Play, or click a stage.\u003c/div>\n    \u003cp class=\"note\" style=\"margin-top:12px\">Training target: 192.168.56.101, an intentionally vulnerable VM in your isolated lab. Scan only what your scope document names.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 5 -->\n\u003csection id=\"s5\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 5 · Practical 1-2\u003c/span>\u003ch2>Validate scanner findings\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Below is pretend scanner output for the training VM. For each finding decide: real (true positive) or wrong (false positive). Use the safe check hint if you are unsure.\u003c/p>\n  \u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003cspan class=\"chip\" id=\"vscore\">Score 0 / 8\u003c/span>\u003cbutton class=\"btn ghost\" id=\"vreset\">Reset\u003c/button>\u003c/div>\n  \u003cdiv class=\"grid2\" id=\"finds\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:6px\">False negative: the one the scanner missed\u003c/h3>\n    \u003cp style=\"color:var(--muted)\">A manual review of the web root finds an old admin page on port 8080 that was outside the scan range. The scanner never reported it. A false negative is a real problem that no tool flagged, which is why validation includes looking around by hand, without changing or deleting anything.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 6 -->\n\u003csection id=\"s6\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 6 · Practical 3\u003c/span>\u003ch2>Severity vs business impact: build the priority list\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">Move the sliders. Risk = likelihood × impact. Watch the list re-sort. CVSS values here are practice numbers; always confirm real scores on NVD.\u003c/p>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"rt\" id=\"rt\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:10px\">Risk matrix\u003c/h3>\n      \u003cdiv class=\"m5\" id=\"m5\">\u003c/div>\n      \u003ch3 style=\"font-size:16px;color:var(--accent);margin:16px 0 8px\">Priority list\u003c/h3>\n      \u003cdiv id=\"prio\" style=\"display:grid;gap:6px\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3 style=\"font-size:16px;color:var(--accent);margin-bottom:10px\">Risk treatment: four choices\u003c/h3>\n    \u003cdiv class=\"treat\">\u003cdiv>\u003cb>Remediate\u003c/b>Fix it: patch, change the setting.\u003c/div>\u003cdiv>\u003cb>Mitigate\u003c/b>Reduce it: firewall rule, extra monitoring.\u003c/div>\u003cdiv>\u003cb>Accept\u003c/b>Live with it, in writing, with an owner.\u003c/div>\u003cdiv>\u003cb>Transfer\u003c/b>Share it: insurance or a vendor contract.\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 7 -->\n\u003csection id=\"s7\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 7 · Practical 4\u003c/span>\u003ch2>Write the finding report\u003c/h2>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card form\">\n      \u003cdiv>\u003clabel for=\"rf\">Load an example\u003c/label>\u003cselect id=\"rf\">\u003c/select>\u003c/div>\n      \u003cdiv>\u003clabel for=\"rname\">Finding\u003c/label>\u003cinput id=\"rname\">\u003c/div>\n      \u003cdiv>\u003clabel for=\"rev\">Evidence\u003c/label>\u003ctextarea id=\"rev\">\u003c/textarea>\u003c/div>\n      \u003cdiv>\u003clabel for=\"rasset\">Affected asset\u003c/label>\u003cinput id=\"rasset\">\u003c/div>\n      \u003cdiv>\u003clabel for=\"rsev\">Severity\u003c/label>\u003cselect id=\"rsev\">\u003coption>Low\u003c/option>\u003coption>Medium\u003c/option>\u003coption>High\u003c/option>\u003coption>Critical\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv>\u003clabel for=\"rimp\">Impact\u003c/label>\u003ctextarea id=\"rimp\">\u003c/textarea>\u003c/div>\n      \u003cdiv>\u003clabel for=\"rrem\">Remediation\u003c/label>\u003ctextarea id=\"rrem\">\u003c/textarea>\u003c/div>\n      \u003cdiv>\u003clabel for=\"rret\">Retest status\u003c/label>\u003cselect id=\"rret\">\u003coption>Not started\u003c/option>\u003coption>Fixed, waiting for retest\u003c/option>\u003coption>Retested: closed\u003c/option>\u003coption>Retested: still open\u003c/option>\u003c/select>\u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"rep\" id=\"rep\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn\" id=\"rcopy\">Copy report text\u003c/button>\u003cspan id=\"rmsg\" style=\"font-size:14px;color:var(--good)\">\u003c/span>\u003c/div>\n      \u003ctextarea id=\"rarea\" aria-label=\"Report text\" style=\"display:none;width:100%;min-height:140px;margin-top:10px;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px var(--f-mono)\">\u003c/textarea>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- 8 -->\n\u003csection id=\"s8\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 8\u003c/span>\u003ch2>Asset inventory and patch management\u003c/h2>\u003c/div>\n  \u003cp class=\"lead\">You cannot patch what you do not know you have. Example fix targets: Critical 7 days, High 30 days, Medium 90 days.\u003c/p>\n  \u003cdiv class=\"card scroll\">\u003ctable class=\"inv\">\u003cthead>\u003ctr>\u003cth>Asset\u003c/th>\u003cth>Owner\u003c/th>\u003cth>Criticality\u003c/th>\u003cth>Days since patch\u003c/th>\u003cth>Status\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"inv\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003c!-- 9 -->\n\u003csection id=\"s9\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"tag\">Station 9\u003c/span>\u003ch2>Quick revision\u003c/h2>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:16px\">\u003cdiv class=\"cheat\" id=\"cheat\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"grid2\">\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Lab checklist\u003c/h3>\u003cdiv class=\"prog\">\u003ci id=\"prog\">\u003c/i>\u003c/div>\u003cdiv class=\"check\" id=\"check\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch3 style=\"font-size:16px;margin-bottom:10px;color:var(--accent)\">Expected output\u003c/h3>\n      \u003cdiv class=\"check\" style=\"gap:6px\">\u003cdiv class=\"stepbox\">Vulnerability assessment report\u003c/div>\u003cdiv class=\"stepbox\">Evidence for each validated finding\u003c/div>\u003cdiv class=\"stepbox\">Prioritized remediation plan\u003c/div>\u003cdiv class=\"stepbox\">Retest status for every item\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter>Day 8 · Vulnerability Assessment and Risk Prioritization · Assess only systems you are authorized to test.\u003c/footer>\n\u003c/div>\n\u003cscript>\n/* ===== Animated backgrounds + theme switcher ===== */\n(function(){\n  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');\n  var W=0,H=0,dpr=1,skin='galaxy';\n  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var stars=[],disk=[],bubbles=[],glows=[],parts=[],rings=[],burstT=0,sprites={};\n  var R=Math.random;\n\n  function resize(){\n    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;\n    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init();\n    if(rm)staticDraw();\n  }\n  function newBubble(first){return{x:R()*W,y:first?R()*H:H+30,r:2+Math.pow(R(),2)*14,sp:.02+R()*.05,ph:R()*6.28}}\n  function init(){\n    stars=[];var n=Math.round(W*H/9000);\n    for(var i=0;i\u003cn;i++)stars.push({x:R()*W,y:R()*H,r:R()*1.3+.3,p:R()*6.28,s:R()*2+.5});\n    disk=[];for(i=0;i\u003c700;i++)disk.push({a:R()*6.28,r:Math.pow(R(),.75),sz:R()*1.6+.5});\n    bubbles=[];for(i=0;i\u003c45;i++)bubbles.push(newBubble(true));\n    glows=[];for(i=0;i\u003c22;i++)glows.push({x:R()*W,y:R()*H,r:10+R()*30,ph:R()*6.28,vx:(R()-.5)*.01,vy:(R()-.5)*.01,c:R()\u003c.5?'60,230,255':'90,255,200'});\n    parts=[];rings=[];burstT=0;\n  }\n  function drawStars(t,rgb,mul){\n    for(var i=0;i\u003cstars.length;i++){var s=stars[i];\n      var a=(.25+.75*(.5+.5*Math.sin(t*.002*s.s+s.p)))*(mul||1);\n      ctx.fillStyle='rgba('+rgb+','+a.toFixed(3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}\n  }\n  function sprite(rgb){\n    if(sprites[rgb])return sprites[rgb];\n    var c=document.createElement('canvas');c.width=1;c.height=256;var g=c.getContext('2d');\n    var gr=g.createLinearGradient(0,0,0,256);\n    gr.addColorStop(0,'rgba('+rgb+',0)');gr.addColorStop(.12,'rgba('+rgb+',.95)');gr.addColorStop(.5,'rgba('+rgb+',.32)');gr.addColorStop(1,'rgba('+rgb+',0)');\n    g.fillStyle=gr;g.fillRect(0,0,1,256);return(sprites[rgb]=c);\n  }\n\n  function galaxy(t){\n    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b0820');g.addColorStop(.5,'#1a1040');g.addColorStop(1,'#07142e');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    var b=[[.2,.25,'157,123,255'],[.8,.35,'79,195,255'],[.5,.8,'255,100,200'],[.9,.9,'120,90,255']];\n    for(var i=0;i\u003cb.length;i++){\n      var x=W*(b[i][0]+Math.sin(t*.00008*(i+1)+i)*.06),y=H*(b[i][1]+Math.cos(t*.00007*(i+2))*.06),r=Math.max(W,H)*.45;\n      var rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba('+b[i][2]+',.26)');rg.addColorStop(1,'rgba('+b[i][2]+',0)');\n      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    }\n    drawStars(t,'255,255,255');\n    var k=(t%7000)/7000;\n    if(k\u003c.12){var p=k/.12;var x0=W*.15+W*.6*p,y0=H*.05+H*.25*p;\n      var sg=ctx.createLinearGradient(x0,y0,x0-90,y0-45);sg.addColorStop(0,'rgba(255,255,255,'+(1-p)+')');sg.addColorStop(1,'rgba(255,255,255,0)');\n      ctx.strokeStyle=sg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0-90,y0-45);ctx.stroke();}\n  }\n\n  function blackhole(t){\n    ctx.fillStyle='#050404';ctx.fillRect(0,0,W,H);drawStars(t,'255,235,210',.8);\n    var cx=W*.5,cy=H*.46,Rh=Math.min(W,H)*.11;\n    var rg=ctx.createRadialGradient(cx,cy,Rh*.8,cx,cy,Rh*5);rg.addColorStop(0,'rgba(255,170,80,.42)');rg.addColorStop(.4,'rgba(255,110,30,.14)');rg.addColorStop(1,'rgba(255,100,20,0)');\n    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);\n    ctx.save();ctx.translate(cx,cy);ctx.rotate(-.35);\n    function pass(front){\n      for(var i=0;i\u003cdisk.length;i++){var d=disk[i];var rr=Rh*1.35+d.r*Rh*3.4;\n        var a=d.a+t*.0036*Math.pow(Rh*1.35/rr,1.5);var s=Math.sin(a);if((s>0)!==front)continue;\n        var heat=1-d.r;var col=heat>.7?'255,245,225':(heat>.35?'255,190,110':'255,120,40');\n        ctx.fillStyle='rgba('+col+','+(.3+heat*.65).toFixed(2)+')';var z=d.sz*(1+heat);\n        ctx.fillRect(Math.cos(a)*rr,s*rr*.26,z,z*.9);}\n    }\n    pass(false);\n    ctx.strokeStyle='rgba(255,190,110,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,Rh*1.7,Rh*1.45,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();\n    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,Rh,0,6.283);ctx.fill();\n    ctx.strokeStyle='rgba(255,220,170,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,Rh*1.02,0,6.283);ctx.stroke();\n    pass(true);ctx.restore();\n  }\n\n  function burst(x,y){\n    for(var i=0;i\u003c170;i++){var a=R()*6.283,sp=Math.sqrt(R())*6;\n      var life=2400+R()*2200;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,max:life,r:1+R()*2.6});}\n    rings.push({x:x,y:y,age:0});\n    if(parts.length>1200)parts.splice(0,parts.length-1200);\n  }\n  function supernova(t,dt){\n    var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#3a0a05');g.addColorStop(1,'#110202');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    burstT-=dt;if(burstT\u003c=0){burstT=3800;burst(W*(.3+R()*.4),H*(.25+R()*.4));}\n    ctx.globalCompositeOperation='lighter';\n    var i,p;\n    for(i=rings.length-1;i>=0;i--){var r=rings[i];r.age+=dt;\n      if(r.age>2600){rings.splice(i,1);continue;}\n      var al=1-r.age/2600;ctx.strokeStyle='rgba(255,150,60,'+(al*.5).toFixed(3)+')';ctx.lineWidth=3+al*5;\n      ctx.beginPath();ctx.arc(r.x,r.y,r.age*.22,0,6.283);ctx.stroke();\n      var fl=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,90);fl.addColorStop(0,'rgba(255,240,200,'+(Math.max(0,1-r.age/500)).toFixed(3)+')');fl.addColorStop(1,'rgba(255,120,30,0)');\n      ctx.fillStyle=fl;ctx.fillRect(r.x-90,r.y-90,180,180);}\n    for(i=parts.length-1;i>=0;i--){p=parts[i];p.life-=dt;\n      if(p.life\u003c=0){parts.splice(i,1);continue;}\n      p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.vx*=.993;p.vy*=.993;p.vy+=.0004*dt;\n      var a=p.life/p.max;ctx.fillStyle='hsla('+(8+a*52)+',100%,'+(45+a*35)+'%,'+a.toFixed(3)+')';\n      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.5+a),0,6.283);ctx.fill();}\n    ctx.globalCompositeOperation='source-over';\n  }\n\n  function aurora(t){\n    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02121a');g.addColorStop(1,'#04242b');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t,'220,255,245',.6);\n    var bands=[{c:'61,245,176',y:.26,h:.34,s:1},{c:'90,212,255',y:.34,h:.28,s:1.3},{c:'150,120,255',y:.2,h:.24,s:.8}];\n    ctx.globalCompositeOperation='lighter';\n    for(var i=0;i\u003cbands.length;i++){var b=bands[i],sp=sprite(b.c);\n      for(var x=0;x\u003c=W;x+=7){var nx=x/W;\n        var wave=Math.sin(nx*5+t*.0004*b.s+i*2)*.06+Math.sin(nx*11-t*.0006*b.s)*.025;\n        var top=H*(b.y+wave),len=H*b.h*(.6+.4*Math.sin(nx*8+t*.0009*b.s+i));\n        ctx.globalAlpha=.3+.25*Math.sin(nx*14+t*.0012*b.s+i);\n        ctx.drawImage(sp,0,0,1,256,x,top,7,len);}\n    }\n    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n    ctx.fillStyle='#02090c';ctx.beginPath();ctx.moveTo(0,H);\n    for(x=0;x\u003c=W;x+=20)ctx.lineTo(x,H*.9-Math.abs(Math.sin(x*.004+1))*H*.07-Math.sin(x*.011)*H*.015);\n    ctx.lineTo(W,H);ctx.closePath();ctx.fill();\n  }\n\n  function cyber(t){\n    var hy=H*.55;\n    var g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#0a0614');g.addColorStop(1,'#34093f');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);\n    drawStars(t,'255,200,255',.5);\n    var Rs=Math.min(W,H)*.2,cx=W/2,cy=hy-Rs*.15;\n    var sg=ctx.createLinearGradient(0,cy-Rs,0,cy+Rs);sg.addColorStop(0,'#ffe14d');sg.addColorStop(.55,'#ff2fb3');sg.addColorStop(1,'#7a1fd6');\n    ctx.save();ctx.beginPath();ctx.arc(cx,cy,Rs,0,6.283);ctx.clip();ctx.fillStyle=sg;ctx.fillRect(cx-Rs,cy-Rs,Rs*2,Rs*2);\n    ctx.fillStyle='#34093f';for(var k=0;k\u003c7;k++){var yy=cy+Rs*(.05+k*.14)+((t*.01)%(Rs*.14))*0;ctx.fillRect(cx-Rs,yy,Rs*2,2+k*1.6);}\n    ctx.restore();\n    var fg=ctx.createLinearGradient(0,hy,0,H);fg.addColorStop(0,'#1a0630');fg.addColorStop(1,'#07030f');ctx.fillStyle=fg;ctx.fillRect(0,hy,W,H-hy);\n    ctx.lineWidth=1;\n    var i;\n    for(i=-24;i\u003c=24;i++){var x1=W/2+i*W*.12;\n      ctx.strokeStyle='rgba(255,47,179,.55)';ctx.beginPath();ctx.moveTo(W/2+i*6,hy);ctx.lineTo(x1,H);ctx.stroke();}\n    var off=(t*.0004)%1;\n    for(i=0;i\u003c14;i++){var p=(i+off)/14,y=hy+(H-hy)*p*p;\n      ctx.strokeStyle='rgba(25,240,255,'+(.2+.5*p).toFixed(2)+')';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}\n    ctx.strokeStyle='rgba(25,240,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,hy);ctx.lineTo(W,hy);ctx.stroke();\n  }\n\n  function ocean(t,dt){\n    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a4a7a');g.addColorStop(.45,'#04223f');g.addColorStop(1,'#010811');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    ctx.globalCompositeOperation='lighter';\n    for(var i=0;i\u003c5;i++){var x=W*(.1+i*.2)+Math.sin(t*.0003+i)*60,w=60+i*14;\n      var rg=ctx.createLinearGradient(0,0,0,H*.8);rg.addColorStop(0,'rgba(120,220,255,.12)');rg.addColorStop(1,'rgba(120,220,255,0)');\n      ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+w,0);ctx.lineTo(x+w*3+Math.sin(t*.0004+i)*40,H*.8);ctx.lineTo(x-w,H*.8);ctx.closePath();ctx.fill();}\n    for(i=0;i\u003cglows.length;i++){var o=glows[i];o.x+=o.vx*dt;o.y+=o.vy*dt;\n      if(o.x\u003c-50)o.x=W+50;if(o.x>W+50)o.x=-50;if(o.y\u003c-50)o.y=H+50;if(o.y>H+50)o.y=-50;\n      var pu=.5+.5*Math.sin(t*.0012+o.ph),gr=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*(1+pu));\n      gr.addColorStop(0,'rgba('+o.c+','+(.35+pu*.35).toFixed(2)+')');gr.addColorStop(1,'rgba('+o.c+',0)');\n      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(o.x,o.y,o.r*(1+pu),0,6.283);ctx.fill();}\n    ctx.globalCompositeOperation='source-over';\n    for(i=0;i\u003cbubbles.length;i++){var b=bubbles[i];b.y-=b.sp*dt;var bx=b.x+Math.sin(t*.001+b.ph)*10;\n      if(b.y\u003c-30)bubbles[i]=newBubble(false);\n      ctx.strokeStyle='rgba(170,235,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,b.y,b.r,0,6.283);ctx.stroke();\n      ctx.fillStyle='rgba(220,250,255,.35)';ctx.beginPath();ctx.arc(bx-b.r*.3,b.y-b.r*.3,b.r*.22,0,6.283);ctx.fill();}\n  }\n\n  function sunset(t){\n    var g=ctx.createLinearGradient(0,0,0,H);\n    g.addColorStop(0,'#2a0f3a');g.addColorStop(.4,'#7a1f5c');g.addColorStop(.6,'#ff6a3d');g.addColorStop(.74,'#ffb347');g.addColorStop(1,'#3a1058');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(t,'255,230,240',.35);\n    var cx=W/2,cy=H*.6+Math.sin(t*.0005)*6,Rs=Math.min(W,H)*.2;\n    var sg=ctx.createLinearGradient(0,cy-Rs,0,cy+Rs);sg.addColorStop(0,'#fff1a8');sg.addColorStop(.5,'#ff9448');sg.addColorStop(1,'#ff4f8b');\n    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,Rs,0,6.283);ctx.fill();\n    ctx.fillStyle=g;for(var k=0;k\u003c7;k++){ctx.fillRect(cx-Rs,cy+Rs*(.0+k*.15),Rs*2,1.5+k*1.8);}\n    var cols=['#4a1468','#33104f','#1d0833'];\n    for(var L=0;L\u003c3;L++){ctx.fillStyle=cols[L];ctx.beginPath();ctx.moveTo(0,H);\n      for(var x=0;x\u003c=W;x+=16)ctx.lineTo(x,H*(.74+L*.07)+Math.sin(x*.006*(L+1)+t*.0004*(L+1))*H*.018);\n      ctx.lineTo(W,H);ctx.closePath();ctx.fill();}\n  }\n\n  function paper(t){\n    ctx.fillStyle='#f6f5f1';ctx.fillRect(0,0,W,H);\n    var b=[[.15,.2,'180,160,255',.2],[.85,.3,'120,220,190',.16],[.5,.85,'255,190,150',.16]];\n    for(var i=0;i\u003cb.length;i++){var x=W*(b[i][0]+Math.sin(t*.00006*(i+1)+i)*.05),y=H*(b[i][1]+Math.cos(t*.00005*(i+ 'Business impact changes the order'],['Retest','Prove the fix worked']].forEach(function(x){\n    var d=el('div');d.appendChild(el('code',null,x[0]));d.appendChild(document.createTextNode(x[1]));$('cheat').appendChild(d);\n  });\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>", "\u003c!DOCTYPE html>\u003chtml lang=\"en\" data-theme=\"galaxy\">\u003chead>\u003cscript>(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true})}catch(x){}try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Web Application Fundamentals & Burp Suite – Visual Notes\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--t:#f0eeff;--m:#b8b4e0;--c:rgba(15,12,45,.8);--a:#a78bfa;--b:#60a5fa;--bt:#000;--bd:rgba(255,255,255,.16);--bg:radial-gradient(ellipse at 30% 20%,#3a1c71,#0b0b2b 60%,#02020c)}\n[data-theme=blackhole]{--t:#fff3e6;--m:#d9bfa3;--c:rgba(10,8,6,.84);--a:#ff9a3c;--b:#ffd9a0;--bg:radial-gradient(circle at 50% 45%,#2a1405,#000 70%)}\n[data-theme=supernova]{--t:#fff1e0;--m:#f0c6a6;--c:rgba(40,6,4,.82);--a:#ff7a1a;--b:#ffd23f;--bg:radial-gradient(circle at 50% 45%,#5a1010,#140202 75%)}\n[data-theme=aurora]{--t:#e8fff6;--m:#9fd8c6;--c:rgba(4,28,30,.82);--a:#34d399;--b:#2dd4bf;--bg:linear-gradient(180deg,#02130f,#06293a)}\n[data-theme=neon]{--t:#f7f0ff;--m:#c9b3ee;--c:rgba(16,4,34,.84);--a:#ff2bd6;--b:#00f0ff;--bg:linear-gradient(180deg,#0a0014,#1a0036)}\n[data-theme=ocean]{--t:#e6f6ff;--m:#9ccbe6;--c:rgba(0,24,48,.82);--a:#38bdf8;--b:#5eead4;--bg:linear-gradient(180deg,#00264d,#00060f)}\n[data-theme=sunset]{--t:#fff0e6;--m:#f5c9bd;--c:rgba(45,15,60,.84);--a:#ff9e5e;--b:#ff6fb5;--bg:linear-gradient(160deg,#ff9966,#ff5e62 40%,#5b2a86)}\n[data-theme=paper]{--t:#1d2433;--m:#4d5870;--c:rgba(255,255,255,.93);--a:#4f46e5;--b:#0891b2;--bt:#fff;--bd:rgba(0,0,0,.14);--bg:#f6f3ec}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}\nbody{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}input[type=text]{width:100%;max-width:340px}textarea{width:100%;font:13px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}u.k{color:#ffd23f;cursor:pointer;text-decoration:underline dotted}\ncode{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:70px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}\n.bar2{height:14px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ffc24b;background:rgba(255,194,75,.14);border-radius:12px;padding:12px}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🕸️ Web Fundamentals & Burp Suite\u003c/h1>\u003cp class=\"m\">Day 9 · To test a web app you must first understand how browser and server talk. Burp Suite lets you \u003ci>see and replay\u003c/i> that conversation.\u003c/p>\n\u003cdiv class=\"warn\">⚠️ Use Burp only on your \u003cb>local training app\u003c/b> (e.g. localhost). Only harmless requests. Never intercept or modify traffic of real sites you don't own.\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">1️⃣ Client-server & HTTP\u003c/div>\u003cdiv class=\"b\">2️⃣ Forms, methods, status codes\u003c/div>\u003cdiv class=\"b\">3️⃣ Headers, cookies, sessions, tokens\u003c/div>\u003cdiv class=\"b\">4️⃣ SOP, CORS, CSRF\u003c/div>\u003cdiv class=\"b\">5️⃣ Burp Suite: Proxy, History, Repeater\u003c/div>\u003cdiv class=\"b\">6️⃣ Practicals 1–3\u003c/div>\u003cdiv class=\"b\">7️⃣ Annotated request/response\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Client-Server Architecture\u003c/h2>\u003cp>🧑‍💻 \u003cb>Client\u003c/b> (browser) sends a \u003cb>request\u003c/b> → 🖥️ \u003cb>Server\u003c/b> (web app + 🗄️ database) sends a \u003cb>response\u003c/b>. HTTP is stateless: the server forgets you after each reply, so cookies/tokens remember you.\u003c/p>\n\u003cdiv class=\"st\" id=\"t1\">\u003c/div>\u003cdiv id=\"b1\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. HTML Forms, Methods & Status Codes\u003c/h2>\n\u003ch3>🧪 Form → request builder\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"mg\">GET\u003c/button>\u003cbutton class=\"x off\" id=\"mp\">POST\u003c/button> search term: \u003cinput type=\"text\" id=\"q\" value=\"laptop\" style=\"max-width:160px\">\u003c/div>\u003cpre class=\"term\" id=\"rq\">\u003c/pre>\u003cdiv class=\"b\" id=\"rn\">\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003ctr>\u003ctd>GET\u003c/td>\u003ctd>Read data\u003c/td>\u003ctd>Params in URL (stored in history/logs)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST\u003c/td>\u003ctd>Send/create data\u003c/td>\u003ctd>Params in body\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PUT\u003c/td>\u003ctd>Replace/update\u003c/td>\u003ctd>Mostly APIs, idempotent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DELETE\u003c/td>\u003ctd>Remove\u003c/td>\u003ctd>Mostly APIs, must need authorisation\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>🚦 Status codes (click one)\u003c/h3>\u003cdiv class=\"st\" id=\"sc\">\u003c/div>\u003cdiv class=\"b\" id=\"sd\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Headers, Cookies, Sessions, Tokens & DevTools\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">📋 \u003cb>Headers\u003c/b>\u003cbr>Metadata in every request/response (Host, User-Agent, Content-Type, Set-Cookie…).\u003c/div>\u003cdiv class=\"b\">🍪 \u003cb>Cookie\u003c/b>\u003cbr>Small data stored by browser, sent back automatically.\u003cbr>Flags: \u003ccode>HttpOnly\u003c/code> (JS can't read), \u003ccode>Secure\u003c/code> (HTTPS only), \u003ccode>SameSite\u003c/code> (limits cross-site sending).\u003c/div>\u003cdiv class=\"b\">🎟️ \u003cb>Session\u003c/b>\u003cbr>Server stores your state; cookie holds only a random session ID.\u003c/div>\u003cdiv class=\"b\">🔑 \u003cb>Token (e.g. JWT)\u003c/b>\u003cbr>Signed token sent in \u003ccode>Authorization: Bearer …\u003c/code>; server can stay stateless.\u003c/div>\u003c/div>\n\u003ch3>🧰 Browser DevTools (F12)\u003c/h3>\u003cdiv class=\"st\" id=\"dt\">\u003c/div>\u003cdiv class=\"b\" id=\"dd\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Same-Origin Policy, CORS & CSRF\u003c/h2>\n\u003ch3>🧪 SOP: are these the same origin? (scheme + host + port)\u003c/h3>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"o1\" value=\"https://app.example.com/login\">\u003cinput type=\"text\" id=\"o2\" value=\"https://app.example.com:8443/api\">\u003c/div>\u003cdiv class=\"b\" id=\"od\">\u003c/div>\n\u003cp>\u003cb>SOP\u003c/b>: a page from origin A cannot read responses from origin B. \u003cb>CORS\u003c/b> = server opt-in to relax this with \u003ccode>Access-Control-Allow-Origin\u003c/code>.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"c1\">Server sends CORS header ❌ none\u003c/button>\u003cbutton class=\"x off\" id=\"c2\">Server allows https://app.example.com ✅\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"cd\">\u003c/pre>\n\u003ch3>🎭 CSRF: tricking your logged-in browser into sending a request\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"f1\">No defence ❌\u003c/button>\u003cbutton class=\"x off\" id=\"f2\">CSRF token + SameSite ✅\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"fd\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. Burp Suite: Proxy, HTTP History, Repeater\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🧱 \u003cb>Proxy\u003c/b>\u003cbr>Sits between browser and server, can pause (intercept) requests.\u003c/div>\u003cdiv class=\"b\">📜 \u003cb>HTTP history\u003c/b>\u003cbr>Log of every request/response.\u003c/div>\u003cdiv class=\"b\">🔁 \u003cb>Repeater\u003c/b>\u003cbr>Edit one request and resend it manually to compare responses.\u003c/div>\u003c/div>\n\u003csvg viewBox=\"0 0 700 80\" width=\"100%\">\u003cg fill=\"rgba(127,127,127,.2)\" stroke=\"var(--a)\" stroke-width=\"2\">\u003crect x=\"5\" y=\"15\" width=\"150\" height=\"50\" rx=\"10\"/>\u003crect x=\"275\" y=\"15\" width=\"150\" height=\"50\" rx=\"10\"/>\u003crect x=\"545\" y=\"15\" width=\"150\" height=\"50\" rx=\"10\"/>\u003c/g>\u003cpath d=\"M155 40H275M425 40H545\" stroke=\"var(--b)\" stroke-width=\"3\"/>\u003cg fill=\"var(--t)\" font-size=\"13\" text-anchor=\"middle\">\u003ctext x=\"80\" y=\"45\">🌐 Burp browser\u003c/text>\u003ctext x=\"350\" y=\"45\">🧱 Burp 127.0.0.1:8080\u003c/text>\u003ctext x=\"620\" y=\"45\">🖥️ Local app\u003c/text>\u003c/g>\u003ccircle r=\"6\" fill=\"#ffd23f\">\u003canimateMotion dur=\"3s\" repeatCount=\"indefinite\" path=\"M80 40H620\"/>\u003c/circle>\u003c/svg>\n\u003ch3>🧪 Intercept simulator\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"ic\">\u003c/button>\u003cselect id=\"rs\" style=\"padding:6px;border-radius:8px\">\u003coption>GET /search?q=test\u003c/option>\u003coption>POST /login\u003c/option>\u003coption>GET /profile?id=1\u003c/option>\u003c/select>\u003cbutton class=\"x off\" id=\"sb\">Browser sends request ▶\u003c/button>\u003c/div>\u003cdiv class=\"b\" id=\"ih\" style=\"display:none\">\u003cpre class=\"term\" id=\"ir\">\u003c/pre>\u003cbutton class=\"x\" id=\"fw\">Forward ▶\u003c/button>\u003cbutton class=\"x off\" id=\"dr\">Drop\u003c/button>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable id=\"hh\">\u003ctr>\u003cth>#\u003c/th>\u003cth>Method\u003c/th>\u003cth>URL\u003c/th>\u003cth>Status\u003c/th>\u003cth>Length\u003c/th>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Configure Burp's browser for your local training app\u003c/h3>\u003cdiv id=\"p1\">\u003c/div>\u003cdiv class=\"bar2\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003ch3>Practical 2 · Inspect login & search requests (click yellow text)\u003c/h3>\n\u003cpre class=\"term\">\u003cu class=\"k\" data-e=\"Method + path + HTTP version: this is a form submission (POST) to /login.\">POST /login HTTP/1.1\u003c/u>\n\u003cu class=\"k\" data-e=\"Host header: which site the request is for.\">Host: localhost:3000\u003c/u>\n\u003cu class=\"k\" data-e=\"Body format: URL-encoded form fields.\">Content-Type: application/x-www-form-urlencoded\u003c/u>\n\u003cu class=\"k\" data-e=\"Cookie sent by the browser automatically. Look for session IDs.\">Cookie: language=en\u003c/u>\n\n\u003cu class=\"k\" data-e=\"Parameters (name=value) in the BODY. Passwords in the body, never in the URL.\">user=raj&amp;pass=1234\u003c/u>\n\n\u003cspan class=\"cm\">HTTP/1.1 302 Found\u003c/span>\n\u003cu class=\"k\" data-e=\"302 = redirect after successful login. A 401 would mean failure.\">HTTP/1.1 302 Found\u003c/u>\n\u003cu class=\"k\" data-e=\"Where the browser goes next.\">Location: /dashboard\u003c/u>\n\u003cu class=\"k\" data-e=\"New session cookie. Check flags: HttpOnly, Secure, SameSite should be set.\">Set-Cookie: session=abc123; HttpOnly; Secure; SameSite=Lax\u003c/u>\n\n\u003cu class=\"k\" data-e=\"Search form: parameter q is in the URL (GET). Compare how the response reflects it.\">GET /search?q=laptop HTTP/1.1\u003c/u>\u003c/pre>\u003cdiv class=\"b\" id=\"pn\">Click a yellow line to identify headers, parameters, cookies and responses.\u003c/div>\n\u003ch3>Practical 3 · Mini Repeater (harmless edits only)\u003c/h3>\u003cdiv class=\"row\" id=\"pr\">\u003c/div>\u003ctextarea id=\"rp\" rows=\"5\">\u003c/textarea>\u003cbutton class=\"x\" id=\"rs2\">Send ▶\u003c/button>\u003cpre class=\"term\" id=\"ro\">\u003c/pre>\u003cdiv class=\"fb\" id=\"rd\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Expected Output · Annotated HTTP sheet\u003c/h2>\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Element\u003c/th>\u003cth>Example\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Security note\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Request line\u003c/td>\u003ctd>\u003ccode>POST /login HTTP/1.1\u003c/code>\u003c/td>\u003ctd>Method, path, version\u003c/td>\u003ctd>Wrong method should give 405\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Host\u003c/td>\u003ctd>\u003ccode>localhost:3000\u003c/code>\u003c/td>\u003ctd>Target site\u003c/td>\u003ctd>Scope check: is it your lab?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Cookie\u003c/td>\u003ctd>\u003ccode>session=abc123\u003c/code>\u003c/td>\u003ctd>Identifies you\u003c/td>\u003ctd>Must be random, HttpOnly, Secure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Body parameters\u003c/td>\u003ctd>\u003ccode>user=raj&amp;pass=1234\u003c/code>\u003c/td>\u003ctd>User input\u003c/td>\u003ctd>All input is untrusted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Status\u003c/td>\u003ctd>\u003ccode>302 Found\u003c/code>\u003c/td>\u003ctd>Redirect after login\u003c/td>\u003ctd>401 vs 403 must be correct\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Set-Cookie\u003c/td>\u003ctd>\u003ccode>…; HttpOnly; Secure; SameSite=Lax\u003c/code>\u003c/td>\u003ctd>New session\u003c/td>\u003ctd>Missing flags = weakness\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">GET read · POST send · PUT update · DELETE remove\u003c/div>\u003cdiv class=\"b\">401 = who are you? · 403 = not allowed\u003c/div>\u003cdiv class=\"b\">Cookie flags: HttpOnly, Secure, SameSite\u003c/div>\u003cdiv class=\"b\">Origin = scheme + host + port\u003c/div>\u003cdiv class=\"b\">Burp: Proxy → History → Repeater\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h,esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\n\nfunction FLOW(tid,bid,D,L,R){let k=Object.keys(D)[0],n=0,tm;const r=()=>{const S=D[k][1];H_(tid,Object.keys(D).map(q=>`\u003cbutton class=\"${q==k?'on':''}\" data-k=\"${q}\">${D[q][0]}\u003c/button>`).join(''));\nH_(bid,`\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cb>${L}\u003c/b>\u003cb>${R}\u003c/b>\u003c/div>`+S.map((s,i)=>`\u003cdiv class=\"fl\" style=\"justify-content:${s[0]?'flex-end':'flex-start'};opacity:${i\u003cn?1:.15}\">\u003cspan class=\"b2\">${s[0]?'⬅ ':''}${s[1]}${s[0]?'':' ➡'}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"b\">${n?S[n-1][2]:'Press Next ▶'}\u003c/div>\u003cbutton class=\"x\" data-a=\"n\">Next ▶\u003c/button>\u003cbutton class=\"x off\" data-a=\"r\">Reset\u003c/button>\u003cbutton class=\"x off\" data-a=\"a\">Auto\u003c/button>`);\ndocument.querySelectorAll('#'+tid+' button').forEach(b=>b.onclick=()=>{clearInterval(tm);k=b.dataset.k;n=0;r()});\ndocument.querySelectorAll('#'+bid+' button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;clearInterval(tm);if(a=='n'){if(n\u003cS.length)n++;r()}else if(a=='r'){n=0;r()}else{n=0;r();tm=setInterval(()=>{if(n\u003cS.length){n++;r()}else clearInterval(tm)},1000)}})};r()}\nFLOW('t1','b1',{pg:['🌐 Page load',[[0,'GET /index.html','Browser asks for the page'],[1,'200 OK + HTML','Server builds the page (may query the 🗄️ database) and replies'],[0,'GET /app.js, /style.css','Browser fetches extra files'],[1,'200 OK','Browser renders the page']]],lg:['🔑 Login',[[0,'POST /login (user, pass)','Form data travels in the request body'],[1,'302 + Set-Cookie: session=abc123','Server checked the DB, created a session'],[0,'GET /dashboard + Cookie','Browser now sends the cookie automatically'],[1,'200 OK (your data)','Server finds your session from the cookie']]]},'🧑‍💻 Browser','🖥️ Server');\n\nlet mt='GET';function rq(){const v=$('q').value,e=encodeURIComponent(v);$('mg').classList.toggle('off',mt!='GET');$('mp').classList.toggle('off',mt=='GET');\nH_('rq',mt=='GET'?`GET /search?q=\u003cspan class=\"o\">${esc(e)}\u003c/span> HTTP/1.1\\nHost: localhost:3000`:`POST /search HTTP/1.1\\nHost: localhost:3000\\nContent-Type: application/x-www-form-urlencoded\\nContent-Length: ${e.length+2}\\n\\nq=\u003cspan class=\"o\">${esc(e)}\u003c/span>`);\n$('rn').textContent=mt=='GET'?'🔎 GET: parameters are in the URL → visible in browser history, logs, referrers. Never put passwords here.':'📦 POST: parameters are in the body → not in the URL, but still readable by Burp (and by anyone if HTTP not HTTPS).'}\n$('mg').onclick=()=>{mt='GET';rq()};$('mp').onclick=()=>{mt='POST';rq()};$('q').oninput=rq;rq();\nconst SC=[[200,'OK','✅ Success','Check the body for accidental data leaks.'],[301,'Moved Permanently','↪️ Permanent redirect','Old URL → new URL. Attackers note old paths.'],[302,'Found (temporary redirect)','↪️ Temporary redirect','Common after login; watch Set-Cookie. Unvalidated redirects are a risk.'],[400,'Bad Request','🤷 Malformed request','Server could not understand the input.'],[401,'Unauthorized','🔐 Not authenticated','You must log in / credentials invalid.'],[403,'Forbidden','⛔ Not authorised','Logged in, but not allowed. Access control worked.'],[404,'Not Found','🕳️ Missing','Sometimes used to hide protected pages.'],[500,'Internal Server Error','💥 Server bug','Verbose errors can leak stack traces and paths.']];\nH_('sc',SC.map((s,i)=>`\u003cbutton class=\"${i?'':'on'}\" data-i=\"${i}\">${s[0]}\u003c/button>`).join(''));function rsc(i){document.querySelectorAll('#sc button').forEach(b=>b.classList.toggle('on',b.dataset.i==i));const s=SC[i];H_('sd',`\u003cb>${s[0]} ${s[1]}\u003c/b> – ${s[2]}\u003cbr>🛡️ ${s[3]}`)}document.querySelectorAll('#sc button').forEach(b=>b.onclick=()=>rsc(+b.dataset.i));rsc(0);\nconst DT=[['Elements','Inspect HTML: forms, hidden inputs, action URL and method.'],['Console','JavaScript messages and errors.'],['Network','Every request/response: headers, status, timing, payload.'],['Application','Cookies, localStorage, sessionStorage: check flags and what is stored.']];\nH_('dt',DT.map((d,i)=>`\u003cbutton class=\"${i?'':'on'}\" data-i=\"${i}\">${d[0]}\u003c/button>`).join(''));function rdt(i){document.querySelectorAll('#dt button').forEach(b=>b.classList.toggle('on',b.dataset.i==i));$('dd').textContent='🔍 '+DT[i][1]}document.querySelectorAll('#dt button').forEach(b=>b.onclick=()=>rdt(+b.dataset.i));rdt(0);\nfunction so(){try{const a=new URL($('o1').value),b=new URL($('o2').value),f=u=>[u.protocol,u.hostname,u.port||(u.protocol=='https:'?'443':'80')];const A=f(a),B=f(b),ok=A.every((v,i)=>v==B[i]);H_('od',`Scheme: ${A[0]} vs ${B[0]} ${A[0]==B[0]?'✅':'❌'}\u003cbr>Host: ${A[1]} vs ${B[1]} ${A[1]==B[1]?'✅':'❌'}\u003cbr>Port: ${A[2]} vs ${B[2]} ${A[2]==B[2]?'✅':'❌'}\u003cbr>\u003cb>${ok?'✅ Same origin':'🚫 Different origin → SOP blocks reading the response (unless CORS allows)'}\u003c/b>`)}catch(e){H_('od','Enter two full URLs (https://…)')}}$('o1').oninput=$('o2').oninput=so;so();\n$('c1').onclick=()=>H_('cd','Page on https://app.example.com asks https://api.other.com/data\\nResponse has no
