age',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Python, Bash & Security Automation – Visual Notes\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--t:#f0eeff;--m:#b8b4e0;--c:rgba(15,12,45,.8);--a:#a78bfa;--b:#60a5fa;--bt:#000;--bd:rgba(255,255,255,.16);--bg:radial-gradient(ellipse at 30% 20%,#3a1c71,#0b0b2b 60%,#02020c)}\n[data-theme=blackhole]{--t:#fff3e6;--m:#d9bfa3;--c:rgba(10,8,6,.84);--a:#ff9a3c;--b:#ffd9a0;--bg:radial-gradient(circle at 50% 45%,#2a1405,#000 70%)}\n[data-theme=supernova]{--t:#fff1e0;--m:#f0c6a6;--c:rgba(40,6,4,.82);--a:#ff7a1a;--b:#ffd23f;--bg:radial-gradient(circle at 50% 45%,#5a1010,#140202 75%)}\n[data-theme=aurora]{--t:#e8fff6;--m:#9fd8c6;--c:rgba(4,28,30,.82);--a:#34d399;--b:#2dd4bf;--bg:linear-gradient(180deg,#02130f,#06293a)}\n[data-theme=neon]{--t:#f7f0ff;--m:#c9b3ee;--c:rgba(16,4,34,.84);--a:#ff2bd6;--b:#00f0ff;--bg:linear-gradient(180deg,#0a0014,#1a0036)}\n[data-theme=ocean]{--t:#e6f6ff;--m:#9ccbe6;--c:rgba(0,24,48,.82);--a:#38bdf8;--b:#5eead4;--bg:linear-gradient(180deg,#00264d,#00060f)}\n[data-theme=sunset]{--t:#fff0e6;--m:#f5c9bd;--c:rgba(45,15,60,.84);--a:#ff9e5e;--b:#ff6fb5;--bg:linear-gradient(160deg,#ff9966,#ff5e62 40%,#5b2a86)}\n[data-theme=paper]{--t:#1d2433;--m:#4d5870;--c:rgba(255,255,255,.93);--a:#4f46e5;--b:#0891b2;--bt:#fff;--bd:rgba(0,0,0,.14);--bg:#f6f3ec}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}\nbody{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}\ninput[type=text]{width:190px}textarea{width:100%;font:13px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6}\npre.term .ln{display:block;padding:0 4px;border-radius:4px;transition:.3s}pre.term .on{background:rgba(255,210,63,.3);color:#fff}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}\ncode{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px}\n.bx{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--a);border-radius:10px;padding:6px 10px;min-width /div>\u003cdiv class=\"b\">4️⃣ Why automate?\u003c/div>\u003cdiv class=\"b\">5️⃣ Practicals 1–3\u003c/div>\u003cdiv class=\"b\">6️⃣ Expected output: analyzer + script\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Python Basics\u003c/h2>\n\u003ch3>📦 Variables & data types\u003c/h3>\u003cp class=\"m\">A variable is a labelled box. Type a value and see what Python calls it.\u003c/p>\n\u003cdiv class=\"row\">\u003ccode>x =\u003c/code>\u003cinput type=\"text\" id=\"vi\" value=\"192\">\u003cspan id=\"vo\">\u003c/span>\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:8px\">\u003cdiv class=\"b\">\u003cb>int\u003c/b> 5 · \u003cb>float\u003c/b> 3.14 · \u003cb>str\u003c/b> \"hello\" · \u003cb>bool\u003c/b> True/False · \u003cb>list\u003c/b> [1,2] · \u003cb>dict\u003c/b> {\"a\":1}\u003c/div>\u003c/div>\n\u003ch3>🔀 Conditions (if / elif / else)\u003c/h3>\n\u003cdiv class=\"row\">failed_logins = \u003cinput type=\"range\" id=\"fs\" min=\"0\" max=\"10\" value=\"4\"> \u003cb id=\"fv\">\u003c/b>\u003c/div>\u003cpre class=\"term\" id=\"fc\">\u003c/pre>\n\u003ch3>🔁 Loops + 🧩 functions\u003c/h3>\u003cp class=\"m\">A function is a machine: input → process → output. A loop repeats it for every item.\u003c/p>\n\u003cpre class=\"term\">\u003cspan class=\"cm\">def is_private(ip):\u003c/span>\n    return ip.startswith((\"10.\", \"192.168.\", \"172.16.\"))\n\u003cspan class=\"cm\">for ip in ips:\u003c/span>\n    print(ip, is_private(ip))\u003c/pre>\n\u003cdiv class=\"row\" id=\"lp\">\u003c/div>\u003cbutton class=\"x\" id=\"ls\">Step ▶\u003c/button>\u003cbutton class=\"x off\" id=\"lr\">Reset\u003c/button>\u003cpre class=\"term\" id=\"lo\" style=\"min-height:40px\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Strings, Lists, Dictionaries, Files, Exceptions\u003c/h2>\n\u003ch3>🔤 Strings (indexes start at 0!)\u003c/h3>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"si\" value=\"192.168.1.10\"> start \u003cinput type=\"range\" id=\"a1\" min=\"0\" max=\"12\" value=\"0\" style=\"width:90px\"> end \u003cinput type=\"range\" id=\"a2\" min=\"0\" max=\"12\" value=\"3\" style=\"width:90px\">\u003c/div>\n\u003cdiv class=\"sg\" id=\"sg\">\u003c/div>\u003cpre class=\"term\" id=\"so\">\u003c/pre>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">📋 \u003cb>List\u003c/b> – ordered, changeable\u003cbr>\u003cspan class=\"ch\">ips = [\"10.0.0.1\",\"8.8.8.8\"]\u003c/span>\u003cbr>\u003cspan class=\"ch\">ips.append(\"1.1.1.1\")\u003c/span> \u003cspan class=\"ch\">ips[0]\u003c/span>\u003c/div>\n\u003cdiv class=\"b\">🗂️ \u003cb>Dictionary\u003c/b> – key → value\u003cbr>\u003cspan class=\"ch\">c = {\"ERROR\": 0}\u003c/span>\u003cbr>\u003cspan class=\"ch\">c[\"ERROR\"] += 1\u003c/span>\u003c/div>\n\u003cdiv class=\"b\">📄 \u003cb>Files\u003c/b>\u003cbr>\u003cspan class=\"ch\">with open(\"a.log\") as f:\u003c/span>\u003cbr>\u003cspan class=\"ch\">for line in f:\u003c/span> (auto-closes the file)\u003c/div>\u003c/div>\n\u003ch3>💥 Exception handling (try / except)\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"e1\">sample.log exists ✅\u003c/button>\u003cbutton class=\"x off\" id=\"e2\">file missing ❌\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"eo\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Bash: Pipes, Redirection, Chaining\u003c/h2>\n\u003ch3>🚰 Pipe lab: output of one command becomes input of the next\u003c/h3>\u003cp class=\"m\">Pick a pipeline; each box shows how many lines are left.\u003c/p>\n\u003cdiv class=\"row\" id=\"pp\">\u003c/div>\u003cdiv class=\"pl\" id=\"pv\">\u003c/div>\u003cpre class=\"term\" id=\"po\">\u003c/pre>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>Symbol\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>|\u003c/code>\u003c/td>\u003ctd>pipe → next command's input\u003c/td>\u003ctd>cat a.log | grep ERROR\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&gt;\u003c/code>\u003c/td>\u003ctd>write output to file (overwrites)\u003c/td>\u003ctd>ls &gt; files.txt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&gt;&gt;\u003c/code>\u003c/td>\u003ctd>append to file\u003c/td>\u003ctd>date &gt;&gt; log.txt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;\u003c/code>\u003c/td>\u003ctd>file as input\u003c/td>\u003ctd>wc -l &lt; a.log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>2&gt;\u003c/code>\u003c/td>\u003ctd>save errors only\u003c/td>\u003ctd>cmd 2&gt; err.txt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>;\u003c/code> \u003ccode>&amp;&amp;\u003c/code> \u003ccode>||\u003c/code>\u003c/td>\u003ctd>run next always / only if success / only if fail\u003c/td>\u003ctd>mkdir x &amp;&amp; cd x\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>🔗 Chaining simulator: \u003ccode>mkdir lab &amp;&amp; echo OK || echo FAILED\u003c/code>\u003c/h3>\n\u003cbutton class=\"x\" id=\"c1\">mkdir succeeds ✅\u003c/button>\u003cbutton class=\"x off\" id=\"c2\">mkdir fails ❌\u003c/button>\u003cpre class=\"term\" id=\"co\">\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Automation in Security\u003c/h2>\u003cdiv class=\"g\">\u003cdiv class=\"b\">\u003cspan class=\"big\">📜\u003c/span>\u003cbr>\u003cb>Log analysis\u003c/b>\u003cbr>Count errors, find repeated failed logins in thousands of lines.\u003c/div>\u003cdiv class=\"b\">\u003cspan class=\"big\">📊\u003c/span>\u003cbr>\u003cb>Reporting\u003c/b>\u003cbr>Auto-generate summaries & CSVs for the audit report.\u003c/div>\u003cdiv class=\"b\">\u003cspan class=\"big\">🔁\u003c/span>\u003cbr>\u003cb>Repetitive tasks\u003c/b>\u003cbr>Check many IPs/hosts, rename files, collect evidence.\u003c/div>\u003cdiv class=\"b\">\u003cspan class=\"big\">⏰\u003c/span>\u003cbr>\u003cb>Scheduling\u003c/b>\u003cbr>Run scripts daily with cron.\u003c/div>\u003c/div>\n\u003cp class=\"m\">⚠️ Run scripts only on your own lab files/systems.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Python IP information\u003c/h3>\n\u003cpre class=\"term\" id=\"p1\">\u003c/pre>\u003cbutton class=\"x\" id=\"p1b\">Run next line ▶\u003c/button>\u003cbutton class=\"x off\" id=\"p1r\">Reset\u003c/button>\n\u003cdiv class=\"row\">Try your own IP: \u003cinput type=\"text\" id=\"p1i\" value=\"192.168.1.10\">\u003c/div>\u003cpre class=\"term\" id=\"p1o\">\u003c/pre>\n\u003ch3>Practical 2 · Log analyzer (edit the log, then Run)\u003c/h3>\u003ctextarea id=\"lg\" rows=\"8\">\u003c/textarea>\n\u003cbutton class=\"x\" id=\"ra\">▶ Run analyzer\u003c/button>\u003cdiv id=\"rv\">\u003c/div>\u003cpre class=\"term\" id=\"ro\">\u003c/pre>\n\u003ch3>Practical 3 · Bash directory listing & redirection (run in order!)\u003c/h3>\u003cdiv class=\"row\" id=\"b3\">\u003c/div>\u003cpre class=\"term\" id=\"bo\">$ click a command…\u003c/pre>\u003cdiv class=\"b\" id=\"bf\">📁 Folder: (empty)\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Expected Output\u003c/h2>\n\u003ch3>🐍 analyzer.py\u003c/h3>\u003cbutton class=\"x off cp\" data-s=\"c1x\">Copy\u003c/button>\u003cpre class=\"term\" id=\"c1x\">\u003c/pre>\n\u003ch3>🐚 notes.sh\u003c/h3>\u003cbutton class=\"x off cp\" data-s=\"c2x\">Copy\u003c/button>\u003cpre class=\"term\" id=\"c2x\">\u003c/pre>\n\u003cp class=\"m\">Run: \u003ccode>python3 analyzer.py\u003c/code> and \u003ccode>bash notes.sh\u003c/code> (put sample.log in the same folder).\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Python: variable → type → if/for → function\u003c/div>\u003cdiv class=\"b\">dict counter: \u003ccode>d[k] += 1\u003c/code>\u003c/div>\u003cdiv class=\"b\">Read file safely: \u003ccode>with open()\u003c/code> + \u003ccode>try/except\u003c/code>\u003c/div>\u003cdiv class=\"b\">Bash: \u003ccode>|\u003c/code> pipe · \u003ccode>&gt;\u003c/code> write · \u003ccode>&gt;&gt;\u003c/code> append · \u003ccode>&amp;&amp;\u003c/code> if success\u003c/div>\u003cdiv class=\"b\">\u003ccode>grep -c ERROR file\u003c/code> counts matches\u003c/div>\u003cdiv class=\"b\">\u003ccode>ls -la\u003c/code> = long list incl. hidden files\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h;\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\n\nconst esc=s=>s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst LOG=`2026-10-11 10:01:22 INFO Server started\n2026-10-11 10:02:05 WARNING Disk usage at 82%\n2026-10-11 10:03:41 ERROR Failed login from 10.0.0.5\n2026-10-11 10:04:10 INFO User raj logged in\n2026-10-11 10:05:33 ERROR Failed login from 10.0.0.5\n2026-10-11 10:06:12 WARNING Unusual traffic from 172.16.0.9\n2026-10-11 10:07:48 INFO Backup completed\n2026-10-11 10:08:59 ERROR Database timeout`;\n\n/* 1 basics */\nfunction rv(){const v=$('vi').value.trim();let ty='str',sh='\"'+v+'\"';if(/^-?\\d+$/.test(v)){ty='int';sh=v}else if(/^-?\\d*\\.\\d+$/.test(v)){ty='float';sh=v}else if(/^(True|False)$/.test(v)){ty='bool';sh=v}else if(/^\\[.*\\]$/.test(v)){ty='list';sh=v}else if(/^\\{.*\\}$/.test(v)){ty='dict';sh=v}\nH_('vo',`\u003cspan class=\"bx\">\u003cb>x\u003c/b>\u003cspan>${esc(sh)}\u003c/span>\u003ci>type: ${ty}\u003c/i>\u003c/span> → \u003ccode>type(x)\u003c/code> = &lt;class '${ty}'&gt;`)}$('vi').oninput=rv;rv();\nfunction rc(){const f=+$('fs').value;$('fv').textContent=f;const k=f>5?0:f>2?1:2;const L=['if failed &gt; 5:      print(\"🚨 ALERT: block IP\")','elif failed &gt; 2:    print(\"⚠️ WARNING\")','else:                print(\"✅ OK\")'];H_('fc',L.map((l,i)=>`\u003cspan class=\"ln ${i==k?'on':''}\">${l}\u003c/span>`).join(''))}$('fs').oninput=rc;rc();\nconst IPS=['10.0.0.1','8.8.8.8','192.168.1.5','172.16.0.9'];let li=0,lo='';const pr=ip=>/^(10\\.|192\\.168\\.|172\\.(1[6-9]|2\\d|3[01])\\.)/.test(ip);\nfunction rl(){H_('lp',IPS.map((ip,i)=>`\u003cspan class=\"bx\" style=\"${i==li-1?'background:var(--a);color:var(--bt)':''}\">\u003cb>${ip}\u003c/b>\u003ci>${i==li-1?'← now':'idx '+i}\u003c/i>\u003c/span>`).join(''));$('lo').innerHTML=lo||'\u003cspan class=\"m\">Press Step\u003c/span>'}\n$('ls').onclick=()=>{if(li\u003cIPS.length){lo+=`\u003cspan class=\"o\">${IPS[li]} ${pr(IPS[li])?'True':'False'}\u003c/span>\\n`;li++;rl()}};$('lr').onclick=()=>{li=0;lo='';rl()};rl();\n\n/* 2 */\nfunction rs2(){const s=$('si').value,a=+$('a1').value,b=+$('a2').value;H_('sg',[...s].map((c,i)=>`\u003cspan class=\"${i>=a&&i\u003cb?'hl':''}\">${esc(c)}\u003ci>${i}\u003c/i>\u003c/span>`).join(''));H_('so',`len(s) = ${s.length}\\ns[${a}:${b}] = \"${esc(s.slice(a,b))}\"\\ns.split(\".\") = [${s.split('.').map(p=>'\"'+esc(p)+'\"').join(', ')}]\\n\"168\" in s → ${s.includes('168')}`)}['si','a1','a2'].forEach(i=>$(i).oninput=rs2);rs2();\nconst EC=`\u003cspan class=\"cm\">try:\u003c/span>\\n    f = open(\"sample.log\")\\n\u003cspan class=\"cm\">except FileNotFoundError:\u003c/span>\\n    print(\"File not found!\")\\n`;\n$('e1').onclick=()=>H_('eo',EC+'\u003cspan class=\"o\">→ try block succeeded, except skipped. Program continues ✅\u003c/span>');$('e2').onclick=()=>H_('eo',EC+'\u003cspan class=\"er\">→ FileNotFoundError raised → except block runs: \"File not found!\"\\n   Program does NOT crash ✅\u003c/span>');H_('eo',EC);\n\n/* 3 bash */\nconst LG=LOG.split('\\n');\nconst ST={cat:['cat sample.log',a=>a],grep:['grep ERROR',a=>a.filter(l=>l.includes('ERROR'))],cut:[\"cut -d' ' -f3\",a=>a.map(l=>l.split(' ')[2])],sort:['sort',a=>[...a].sort()],uniq:['uniq -c',a=>{const r=[];a.forEach(l=>{const q=r[r.length-1];q&&q[1]==l?q[0]++:r.push([1,l])});return r.map(q=>`${q[0]} ${q[1]}`)}],wc:['wc -l',a=>[String(a.length)]]};\nconst PL=[['Find errors',['cat','grep']],['Count errors',['cat','grep','wc']],['Level frequency',['cat','cut','sort','uniq']]];\nH_('pp',PL.map((p,i)=>`\u003cbutton class=\"x ${i?'off':''}\" data-i=\"${i}\">${p[0]}\u003c/button>`).join(''));\nfunction pipe(i){document.querySelectorAll('#pp button').forEach(b=>b.classList.toggle('off',b.dataset.i!=i));let d=LG,h='';PL[i][1].forEach((k,j)=>{d=ST[k][1](d);h+=(j?'\u003cspan class=\"ar\">➜\u003c/span>':'')+`\u003cdiv class=\"s\" style=\"animation-delay:${j*.25}s\">\u003cb>${ST[k][0]}\u003c/b>\u003cbr>${d.length} line(s)\u003c/div>`});H_('pv',h);H_('po','$ '+PL[i][1].map(k=>ST[k][0]).join(' | ')+'\\n\u003cspan class=\"o\">'+esc(d.join('\\n'))+'\u003c/span>')}\ndocument.querySelectorAll('#pp button').forEach(b=>b.onclick=()=>pipe(+b.dataset.i));pipe(0);\n$('c1').onclick=()=>H_('co','$ mkdir lab &amp;&amp; echo OK || echo FAILED\\n\u003cspan class=\"o\">OK\u003c/span>   \u003cspan class=\"m\">(mkdir ok → && runs echo OK → || skipped)\u003c/span>');$('c2').onclick=()=>H_('co','$ mkdir lab &amp;&amp; echo OK || echo FAILED\\nmkdir: cannot create directory\\n\u003cspan class=\"er\">FAILED\u003c/span>   \u003cspan class=\"m\">(mkdir failed → && skipped → || runs)\u003c/span>');\n\n/* P1 */\nconst P1=[['import ipaddress',''],['ip = ipaddress.ip_address(\"192.168.1.10\")',''],['print(\"IP Address:\", ip)','IP Address: 192.168.1.10'],['print(\"Version:\", ip.version)','Version: 4'],['print(\"Private IP:\", ip.is_private)','Private IP: True']];let p1=0;\nfunction r1(){H_('p1',P1.map((l,i)=>`\u003cspan class=\"ln ${i==p1-1?'on':''}\">${esc(l[0])}${i\u003cp1&&l[1]?'\\n\u003cspan class=\"o\">'+l[1]+'\u003c/span>':''}\u003c/span>`).join(''))}$('p1b').onclick=()=>{if(p1\u003cP1.length)p1++;r1()};$('p1r').onclick=()=>{p1=0;r1()};r1();\nfunction ipi(s){s=s.trim();const q=s.split('.');if(q.length==4&&q.every(p=>/^\\d+$/.test(p)&&+p\u003c=255)){const a=q.map(Number);return[4,a[0]==10||a[0]==127||a[0]==0||(a[0]==172&&a[1]>=16&&a[1]\u003c=31)||(a[0]==192&&a[1]==168)||(a[0]==169&&a[1]==254)]}const l=s.toLowerCase();if(l.includes(':')&&/^[0-9a-f:]+$/.test(l))return[6,l=='::1'||l.startsWith('fe80')||/^f[cd]/.test(l)];return null}\nfunction r1o(){const s=$('p1i').value,r=ipi(s);H_('p1o',r?`IP Address: ${esc(s.trim())}\\nVersion: ${r[0]}\\nPrivate IP: ${r[1]?'True':'False'}`:`\u003cspan class=\"er\">ValueError: '${esc(s)}' does not appear to be an IPv4 or IPv6 address\u003c/span>`)}$('p1i').oninput=r1o;r1o();\n\n/* P2 */\n$('lg').value=LOG;let at;const CL={ERROR:'#ff6b6b',WARNING:'#ffc24b',INFO:'#4ade80'};\n$('ra').onclick=()=>{clearInterval(at);const L=$('lg').value.split('\\n').filter(l=>l.trim()),c={ERROR:0,WARNING:0,INFO:0};let i=0;H_('ro','');\nconst draw=cur=>{const mx=Math.max(1,...Object.values(c));H_('rv',Object.keys(c).map(k=>`\u003cdiv>${k}: \u003cb>${c[k]}\u003c/b>\u003cdiv class=\"bar2\">\u003ci style=\"width:${c[k]/mx*100}%;background:${CL[k]}\">\u003c/i>\u003c/div>\u003c/div>`).join('')+(cur?`\u003cdiv class=\"fb\">Reading line ${i}: \u003ccode>${esc(cur)}\u003c/code>\u003c/div>`:''))};draw('');\nat=setInterval(()=>{if(i>=L.length){clearInterval(at);draw('');H_('ro','Log summary\\n\u003cspan class=\"o\">'+Object.keys(c).map(k=>k+': '+c[k]).join('\\n')+'\u003c/span>');return}const l=L[i++];for(const k in c)if(l.includes(k))c[k]++;draw(l)},500)};\n\n/* P3 */\nlet dir=0,fil=0;const B3=[['mkdir -p security-notes',()=>{dir=1;return ''}],['ls -la > security-notes/files.txt',()=>{if(!dir)return '\u003cspan class=\"er\">bash: security-notes/files.txt: No such file or directory\u003c/span>';fil=1;return '\u003cspan class=\"m\">(no output – it was redirected into the file!)\u003c/span>'}],['cat security-notes/files.txt',()=>fil?'\u003cspan class=\"o\">total 20\\ndrwxr-xr-x 4 raj raj 4096 Oct 11 10:00 .\\ndrwxr-xr-x 9 raj raj 4096 Oct 11 09:58 ..\\n-rw-r--r-- 1 raj raj  412 Oct 11 10:00 analyzer.py\\n-rw-r--r-- 1 raj raj  398 Oct 11 10:00 sample.log\\ndrwxr-xr-x 2 raj raj 4096 Oct 11 10:01 security-notes\u003c/span>':'\u003cspan class=\"er\">cat: security-notes/files.txt: No such file or directory\u003c/span>']];\nH_('b3',B3.map((c,i)=>`\u003cbutton class=\"x\" data-i=\"${i}\">$ ${c[0]}\u003c/button>`).join('')+'\u003cbutton class=\"x off\" id=\"b3r\">Reset\u003c/button>');\ndocument.querySelectorAll('#b3 button[data-i]').forEach(b=>b.onclick=()=>{H_('bo','$ '+B3[b.dataset.i][0]+'\\n'+B3[b.dataset.i][1]());H_('bf','📁 Folder: '+(dir?'📂 security-notes/'+(fil?' → 📄 files.txt':' (empty)'):'(empty)'))});$('b3r').onclick=()=>{dir=fil=0;H_('bo','$ click a command…');H_('bf','📁 Folder: (empty)')};\n\n/* expected */\n$('c1x').textContent=`# analyzer.py - basic log analyzer\ncounts = {\"ERROR\": 0, \"WARNING\": 0, \"INFO\": 0}\n\ntry:\n    with open(\"sample.log\", \"r\") as f:\n        for line in f:\n            for level in counts:\n                if level in line:\n                    counts[level] += 1\nexcept FileNotFoundError:\n    print(\"sample.log not found!\")\n    raise SystemExit(1)\n\nprint(\"Log summary\")\nfor level, n in counts.items():\n    print(f\"{level}: {n}\")`;\n$('c2x').textContent=`#!/bin/bash\n# notes.sh - basic security notes script\nmkdir -p security-notes\nls -la > security-notes/files.txt\ncat security-notes/files.txt\necho \"ERROR count: $(grep -c ERROR sample.log)\" >> security-notes/report.txt\ncat security-notes/report.txt`;\ndocument.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText($(b.dataset.s).textContent);b.textContent='Copied ✅'}catch(e){b.textContent='Select & copy manually'}});\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!DOCTYPE html>\u003chtml lang=\"en\" data-theme=\"galaxy\">\u003chead>\u003cscript>(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};try{Object.defineProperty(window,'localStorage',{value:s,configurable:true})}catch(x){}try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true})}catch(x){}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Reconnaissance & Footprinting – Visual Notes\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--t:#f0eeff;--m:#b8b4e0;--c:rgba(15,12,45,.8);--a:#a78bfa;--b:#60a5fa;--bt:#000;--bd:rgba(255,255,255,.16);--bg:radial-gradient(ellipse at 30% 20%,#3a1c71,#0b0b2b 60%,#02020c)}\n[data-theme=blackhole]{--t:#fff3e6;--m:#d9bfa3;--c:rgba(10,8,6,.84);--a:#ff9a3c;--b:#ffd9a0;--bg:radial-gradient(circle at 50% 45%,#2a1405,#000 70%)}\n[data-theme=supernova]{--t:#fff1e0;--m:#f0c6a6;--c:rgba(40,6,4,.82);--a:#ff7a1a;--b:#ffd23f;--bg:radial-gradient(circle at 50% 45%,#5a1010,#140202 75%)}\n[data-theme=aurora]{--t:#e8fff6;--m:#9fd8c6;--c:rgba(4,28,30,.82);--a:#34d399;--b:#2dd4bf;--bg:linear-gradient(180deg,#02130f,#06293a)}\n[data-theme=neon]{--t:#f7f0ff;--m:#c9b3ee;--c:rgba(16,4,34,.84);--a:#ff2bd6;--b:#00f0ff;--bg:linear-gradient(180deg,#0a0014,#1a0036)}\n[data-theme=ocean]{--t:#e6f6ff;--m:#9ccbe6;--c:rgba(0,24,48,.82);--a:#38bdf8;--b:#5eead4;--bg:linear-gradient(180deg,#00264d,#00060f)}\n[data-theme=sunset]{--t:#fff0e6;--m:#f5c9bd;--c:rgba(45,15,60,.84);--a:#ff9e5e;--b:#ff6fb5;--bg:linear-gradient(160deg,#ff9966,#ff5e62 40%,#5b2a86)}\n[data-theme=paper]{--t:#1d2433;--m:#4d5870;--c:rgba(255,255,255,.93);--a:#4f46e5;--b:#0891b2;--bt:#fff;--bd:rgba(0,0,0,.14);--bg:#f6f3ec}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}\nbody{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ninput[type=text],textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:inherit}input[type=text]{width:180px}textarea{width:100%;font:12px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}u.k{color:#ffd23f;cursor:pointer;text-decoration:underline dotted}\ncode{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:70px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tr{position:relative;height:34px;flex:1;min-width:120px;border-bottom:2px dashed var(--bd)}.pk{position:absolute;top:2px;left:0;animation:mv 2.2s linear infinite;background:var(--a);color:var(--bt);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}@keyframes mv{to{left:65%}}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}\ntd[contenteditable]:focus{outline:2px solid var(--a)}\n.ct{animation:in .5s both}@keyframes in{from{opacity:0;transform:translateX(-14px)}}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}.in{background:#7dd3fc}\n.fb{font-weight:700;margin:6px 0}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🔭 Reconnaissance & Footprinting\u003c/h1>\u003cp class=\"m\">Day 5 · Before testing anything, collect information about the target. Like a detective: first observe from far, then (with permission) knock on the door. Use only your own / training domains. \u003ccode>example.com\u003c/code> is reserved for documentation.\u003c/p>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">1️⃣ Passive vs Active\u003c/div>\u003cdiv class=\"b\">2️⃣ DNS records + resolution flow\u003c/div>\u003cdiv class=\"b\">3️⃣ WHOIS/RDAP & certificate transparency\u003c/div>\u003cdiv class=\"b\">4️⃣ Search & tech footprinting\u003c/div>\u003cdiv class=\"b\">5️⃣ Scope, verification, evidence\u003c/div>\u003cdiv class=\"b\">6️⃣ Practicals 1–3\u003c/div>\u003cdiv class=\"b\">7️⃣ Report + scope document\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Passive vs Active Reconnaissance\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🕵️ \u003cb>Passive\u003c/b> – you never touch the target. You use third-party/public sources (search engines, WHOIS, CT logs, job posts). Target logs show nothing.\u003c/div>\u003cdiv class=\"b\">🚪 \u003cb>Active\u003c/b> – you send packets to the target (scans, probes). It can be logged/detected → needs \u003cb>permission\u003c/b>.\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"x\" id=\"mp\">🕵️ Passive\u003c/button>\u003cbutton class=\"x off\" id=\"ma\">🚪 Active\u003c/button>\u003c/div>\u003cdiv id=\"md\">\u003c/div>\n\u003ch3>🎮 Sort the activity\u003c/h3>\u003cdiv id=\"ag\">\u003c/div>\u003cdiv class=\"fb\" id=\"asc\">\u003c/div>\n\u003cp class=\"m\">Note: normal DNS lookups via your resolver are low-touch, but brute-forcing subdomains against the target's own nameserver is active.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Domain, IP & DNS Records\u003c/h2>\u003cp>DNS = the internet's phone book: name → IP. Click a record type (values below are illustrative, from documentation ranges).\u003c/p>\n\u003cdiv class=\"st\" id=\"rt\">\u003c/div>\u003cdiv class=\"b\" id=\"rd\" style=\"margin-top:8px\">\u003c/div>\n\u003ch3>🧭 How a lookup travels\u003c/h3>\u003cdiv id=\"fl\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. WHOIS / RDAP & Certificate Transparency\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">📇 \u003cb>WHOIS / RDAP\u003c/b>\u003cbr>Registration data: registrar, created/expiry dates, nameservers, abuse contact. Owner details are often redacted for privacy. RDAP is the modern, structured replacement.\u003c/div>\u003cdiv class=\"b\">📜 \u003cb>Certificate Transparency (CT)\u003c/b>\u003cbr>Public logs of every HTTPS certificate issued. Search sites like \u003ccode>crt.sh\u003c/code> to discover hostnames the owner may have forgotten. Fully passive.\u003c/div>\u003c/div>\n\u003ch3>🧪 CT log simulator for \u003ccode>%.example.com\u003c/code>\u003c/h3>\u003cbutton class=\"x\" id=\"cn\">Fetch next certificate ▶\u003c/button>\u003cbutton class=\"x off\" id=\"ca\">Show all\u003c/button>\u003cdiv id=\"cl\">\u003c/div>\u003cdiv class=\"fb\" id=\"cs\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Search-engine & Technology Footprinting\u003c/h2>\n\u003ch3>🔎 Search query builder (for your own domain)\u003c/h3>\u003cdiv class=\"row\">Domain \u003cinput type=\"text\" id=\"dd\" value=\"example.com\">\u003c/div>\u003cdiv class=\"row\" id=\"dk\">\u003c/div>\u003cpre class=\"term\" id=\"dq\">\u003c/pre>\u003cp class=\"m\">If you find sensitive files exposed on your own/authorised target, \u003cb>report\u003c/b> them — never misuse or spread them.\u003c/p>\n\u003ch3>🧩 Technology identification (click yellow clues)\u003c/h3>\n\u003cpre class=\"term\">\u003cspan class=\"cm\">HTTP/1.1 200 OK\u003c/span>\n\u003cu class=\"k\" data-e=\"Web server + exact version → look up if it is outdated. Fix: hide/limit version banners.\">Server: nginx/1.18.0\u003c/u>\n\u003cu class=\"k\" data-e=\"Backend language + version (PHP 7.4 is end-of-life). Fix: remove X-Powered-By header, upgrade.\">X-Powered-By: PHP/7.4.3\u003c/u>\n\u003cu class=\"k\" data-e=\"Session cookie name reveals PHP is used.\">Set-Cookie: PHPSESSID=abc123; path=/\u003c/u>\n\u003cspan class=\"cm\">&lt;html&gt; …\u003c/span>\n\u003cu class=\"k\" data-e=\"CMS and version are public → check known issues for that version.\">&lt;meta name=\"generator\" content=\"WordPress 6.2\"&gt;\u003c/u>\u003c/pre>\n\u003cdiv class=\"b\" id=\"tn\">Click a yellow line to see what an attacker (and you) can learn.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. Scope Validation, Verification & Evidence\u003c/h2>\n\u003cdiv class=\"b\">\u003cb>📜 Scope says:\u003c/b> ✅ In: www.example.com · portal.example.com · 192.0.2.10 &nbsp; ❌ Out: anything third-party or listed as excluded (e.g. vpn.example.com).\u003c/div>\n\u003ch3>🎯 Is it in scope? (decide for each discovered asset)\u003c/h3>\u003cdiv id=\"sc\">\u003c/div>\n\u003ch3>✅ Verification: confirm every finding\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">1️⃣ \u003cb>Two sources\u003c/b> – e.g. DNS + CT log agree\u003c/div>\u003cdiv class=\"b\">2️⃣ \u003cb>Re-check later\u003c/b> – DNS changes, TTLs\u003c/div>\u003cdiv class=\"b\">3️⃣ \u003cb>Label confidence\u003c/b> – Confirmed / Likely / Unverified\u003c/div>\u003c/div>\n\u003ch3>🗃️ Evidence collection checklist\u003c/h3>\u003cdiv class=\"row\" id=\"ev\">\u003c/div>\u003cdiv class=\"fb\" id=\"evs\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Practicals\u003c/h2>\n\u003ch3>Practical 1 · DNS records (click commands, then yellow text)\u003c/h3>\u003cdiv class=\"row\" id=\"cm\">\u003c/div>\u003cpre class=\"term\" id=\"tm\">$ choose a command…\u003c/pre>\u003cdiv class=\"b\" id=\"tx\">Run these only on your own/training domain. Outputs here are simulated for example.com.\u003c/div>\n\u003ch3>Practical 2 · Permission gate before ACTIVE testing\u003c/h3>\u003cdiv class=\"row\" id=\"gt\">\u003c/div>\u003cdiv class=\"fb\" id=\"gs\">\u003c/div>\n\u003ch3>Practical 3 · Document public info (editable table: click any cell)\u003c/h3>\u003cdiv class=\"tbl\">\u003ctable id=\"sp\">\u003c/table>\u003c/div>\u003cbutton class=\"x\" id=\"ar\">+ Add row\u003c/button>\u003cbutton class=\"x off\" id=\"cc\">Show as CSV\u003c/button>\u003ctextarea id=\"cv2\" rows=\"6\" style=\"display:none\">\u003c/textarea>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Expected Output\u003c/h2>\n\u003ch3>📄 Reconnaissance Report (template, filled with mock data)\u003c/h3>\n\u003cdiv class=\"b\">\u003cb>1. Objective & scope:\u003c/b> Passive footprinting of example.com (training domain).\u003cbr>\u003cb>2. Method:\u003c/b> Passive – DNS records (dig/nslookup via public resolver), WHOIS/RDAP, CT logs. Active – none.\u003cbr>\u003cb>3. Findings:\u003c/b>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Finding\u003c/th>\u003cth>Evidence\u003c/th>\u003cth>Confidence\u003c/th>\u003cth>Relevance\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>F-01\u003c/td>\u003ctd>SPF uses softfail (~all)\u003c/td>\u003ctd>E-003 (TXT record)\u003c/td>\u003ctd>Confirmed\u003c/td>\u003ctd>\u003cspan class=\"p me\">Medium\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F-02\u003c/td>\u003ctd>dev & staging hostnames public via CT\u003c/td>\u003ctd>E-005 (crt.sh)\u003c/td>\u003ctd>Confirmed\u003c/td>\u003ctd>\u003cspan class=\"p me\">Medium\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F-03\u003c/td>\u003ctd>Server banner reveals nginx/1.18.0, PHP 7.4\u003c/td>\u003ctd>E-006 (headers)\u003c/td>\u003ctd>Confirmed\u003c/td>\u003ctd>\u003cspan class=\"p hi\">High (outdated)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F-04\u003c/td>\u003ctd>Two nameservers configured\u003c/td>\u003ctd>E-004 (NS)\u003c/td>\u003ctd>Confirmed\u003c/td>\u003ctd>\u003cspan class=\"p lo\">Good\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"b\" style=\"margin-top:6px\">\u003cb>4. Evidence index:\u003c/b> E-001…E-006 (command, timestamp, source, screenshot, hash)\u003cbr>\u003cb>5. Recommendations:\u003c/b> tighten SPF/DMARC, hide banners, upgrade PHP, review exposed dev/staging, disable zone transfers.\u003c/div>\n\u003ch3>📋 Scope Document (template)\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">\u003cb>Client / Authoriser\u003c/b>\u003cbr>Name, role, signature, date\u003c/div>\u003cdiv class=\"b\">\u003cb>In scope\u003c/b>\u003cbr>www.example.com, portal.example.com, 192.0.2.10\u003c/div>\u003cdiv class=\"b\">\u003cb>Out of scope\u003c/b>\u003cbr>vpn.example.com, third-party/cloud-provider systems, staff personal accounts\u003c/div>\u003cdiv class=\"b\">\u003cb>Allowed\u003c/b>\u003cbr>Passive recon, DNS queries, CT/WHOIS, light active checks only if signed\u003c/div>\u003cdiv class=\"b\">\u003cb>Forbidden\u003c/b>\u003cbr>Exploitation, DoS, social engineering, data download\u003c/div>\u003cdiv class=\"b\">\u003cb>Time window & contacts\u003c/b>\u003cbr>Dates/hours, emergency contact, stop rule\u003c/div>\u003c/div>\n\u003cp class=\"m\">Tip: Ctrl+P prints these as a clean document.\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Passive = no contact · Acti ').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n\n/* 1 */\nfunction rm(a){$('mp').classList.toggle('off',a);$('ma').classList.toggle('off',!a);H_('md',a?'\u003cdiv class=\"row\">\u003cspan class=\"big\">🕵️\u003c/span>\u003cdiv class=\"tr\">\u003cspan class=\"pk\">port probe\u003c/span>\u003c/div>\u003cspan class=\"big\">🎯\u003c/span>\u003c/div>\u003cpre class=\"term\">\u003cspan class=\"er\">Target firewall log: 10:42:07 SCAN from 203.0.113.9 → ports 22,80,443\u003c/span>\u003c/pre>\u003cb>You were visible → get written permission first.\u003c/b>':'\u003cdiv class=\"row\">\u003cspan class=\"big\">🕵️\u003c/span>\u003cdiv class=\"tr\">\u003cspan class=\"pk\">search\u003c/span>\u003c/div>\u003cspan class=\"big\">🔎 📇 📜\u003c/span>\u003c/div>\u003cpre class=\"term\">\u003cspan class=\"o\">Target logs: nothing. You only asked public sources.\u003c/span>\u003c/pre>\u003cb>Safe, quiet, and always allowed on public data.\u003c/b>')}\n$('mp').onclick=()=>rm(0);$('ma').onclick=()=>rm(1);rm(0);\nconst AP=[['Google the organisation & read its public pages',0,'Third-party sources only.'],['WHOIS / RDAP lookup',0,'Registry data, target not contacted.'],['Search certificates on crt.sh',0,'Public CT logs, not the target.'],['Read job posts to guess the tech stack',0,'Public info.'],['nmap port scan of the target',1,'Packets hit the target and get logged.'],['Ping sweep over the target IP range',1,'Direct probing.'],['Banner grabbing with netcat',1,'You connect to the service.'],['Zone transfer (AXFR) attempt',1,'Direct request to the target nameserver.']];let as=0,an=0;\nH_('ag',AP.map((a,i)=>`\u003cdiv class=\"b row\" style=\"margin:4px 0\">\u003cspan style=\"flex:1\">${a[0]}\u003c/span>\u003cbutton class=\"x off\" data-i=\"${i}\" data-v=\"0\">Passive\u003c/button>\u003cbutton class=\"x off\" data-i=\"${i}\" data-v=\"1\">Active\u003c/button>\u003cb id=\"a${i}\">\u003c/b>\u003c/div>`).join(''));\ndocument.querySelectorAll('#ag button').forEach(b=>b.onclick=()=>{const i=b.dataset var(--t);background:var(--bg) fixed;background-color:#0b0b2b;min-height:100vh}\n[data-theme=paper] body{background-color:#f6f3ec}\n#cv{position:fixed;inset:0;z-index:-1}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);backdrop-filter:blur(10px);padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--bd)}\n.th{border:1px solid var(--bd);background:transparent;color:var(--t);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}\n.th.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);font-weight:700}\nmain{max-width:1000px;margin:auto;padding:12px}\n.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,42px);margin:.2em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{color:var(--a);margin:0 0 10px}h3{margin:.9em 0 .3em}.m{color:var(--m)}\n.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.b{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:12px}\n.big{font-size:30px}\nbutton.x{background:var(--a);color:var(--bt);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px}\nbutton.x.off{background:transparent;color:var(--t);border:1px solid var(--bd)}\n.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\ntextarea{width:100%;background:rgba(127,127,127,.15);border:1px solid var(--bd);color:var(--t);padding:7px;border-radius:8px;font:12px monospace}\npre.term{background:rgba(0,0,0,.86);color:#cfe8ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:6px 0;line-height:1.6}\n.o{color:#7cfc9a}.er{color:#ff7b7b}.cm{color:#8fa}u.k{color:#ffd23f;cursor:pointer;text-decoration:underline dotted}\ncode{background:rgba(127,127,127,.25);padding:1px 6px;border-radius:5px;word-break:break-all}\n.st{display:flex;gap:6px;flex-wrap:wrap}.st button{flex:1;min-width:80px;background:rgba(127,127,127,.18);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;cursor:pointer;transition:.3s}.st button.on{background:linear-gradient(135deg,var(--a),var(--b));color:var(--bt);font-weight:700;transform:scale(1.05)}\n.fl{display:flex;margin:8px 0;transition:.5s}.b2{background:linear-gradient(90deg,var(--a),var(--b));color:var(--bt);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;max-width:88%}\n.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}\ntd[contenteditable]:focus{outline:2px solid var(--a)}\n.p{display:inline-block;padding:2px 9px;border-radius:99px;color:#000;font-weight:700;font-size:12px}.hi{background:#ff6b6b}.me{background:#ffc24b}.lo{background:#4ade80}\n.ho{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:440px;margin:8px 0}.ho div{aspect-ratio:1.4;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;transition:.3s}.ho .sc{background:var(--a);color:var(--bt)}.ho .up{background:#4ade80;color:#000;font-weight:700}\n.bar2{height:16px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}.bar2 i{display:block;height:100%;transition:width .5s}\n.fb{font-weight:700;margin:6px 0}.warn{border:2px solid #ff6b6b;background:rgba(255,107,107,.15);border-radius:12px;padding:12px}\n@media print{#cv,.bar{display:none}body{background:#fff!important;color:#000}.card{background:#fff;color:#000}h1,h2{color:#000;-webkit-text-fill-color:#000}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"cv\">\u003c/canvas>\u003cheader class=\"bar\" id=\"bar\">\u003c/header>\n\u003cmain>\n\u003cdiv class=\"card\">\u003ch1>🛰️ Nmap: Host Discovery & Port Scanning\u003c/h1>\u003cp class=\"m\">Day 6 · Nmap is a \"door-knocker\": it checks which hosts are alive and which ports (doors) listen. Scan only your own computer or an instructor's isolated lab.\u003c/p>\n\u003cdiv class=\"warn\">🚫 \u003cb>Never\u003c/b> run \u003ccode>-A\u003c/code>, aggressive or vulnerability scripts on public IPs without \u003cb>written authorisation\u003c/b>. Scanning others without permission can be a crime (see Day 1).\u003c/div>\n\u003cdiv class=\"g\" style=\"margin-top:10px\">\u003cdiv class=\"b\">1️⃣ Port states\u003c/div>\u003cdiv class=\"b\">2️⃣ Scan types (TCP connect, SYN, UDP)\u003c/div>\u003cdiv class=\"b\">3️⃣ Versions & OS fingerprinting\u003c/div>\u003cdiv class=\"b\">4️⃣ Discovery & timing\u003c/div>\u003cdiv class=\"b\">5️⃣ False positives, firewalls, authorisation\u003c/div>\u003cdiv class=\"b\">6️⃣ Practicals 1–3\u003c/div>\u003cdiv class=\"b\">7️⃣ Output file + inventory\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>1. Open, Closed & Filtered Ports\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🟢 \u003cb>Open\u003c/b>\u003cbr>A service is listening and answers.\u003c/div>\u003cdiv class=\"b\">🔴 \u003cb>Closed\u003c/b>\u003cbr>Host answers \"nothing here\" (reachable, no service).\u003c/div>\u003cdiv class=\"b\">🟡 \u003cb>Filtered\u003c/b>\u003cbr>No clear answer: a firewall drops/blocks probes.\u003c/div>\u003c/div>\n\u003cp class=\"m\">Pick a state, then press Next to see what Nmap receives.\u003c/p>\u003cdiv class=\"st\" id=\"t1\">\u003c/div>\u003cdiv id=\"b1\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>2. Scan Types\u003c/h2>\u003cdiv class=\"st\" id=\"t2\">\u003c/div>\u003cdiv id=\"b2\">\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>-sT Connect\u003c/th>\u003cth>-sS SYN\u003c/th>\u003cth>-sU UDP\u003c/th>\u003c/tr>\u003ctr>\u003ctd>How\u003c/td>\u003ctd>Full handshake\u003c/td>\u003ctd>Half-open (no final ACK)\u003c/td>\u003ctd>UDP packets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Root needed?\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Speed\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>Fast\u003c/td>\u003ctd>Slow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Detectable?\u003c/td>\u003ctd>Yes, apps log it\u003c/td>\u003ctd>Yes, IDS/firewalls still see it\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weak point\u003c/td>\u003ctd>Noisy\u003c/td>\u003ctd>Needs privileges\u003c/td>\u003ctd>\"open|filtered\" is ambiguous\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>3. Service/Version Detection & OS Fingerprinting\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">🔎 \u003cb>-sV\u003c/b>\u003cbr>Connects and reads banners/probe replies to name the real software + version. Without it, the \"service\" is only a \u003ci>guess from the port number\u003c/i>.\u003c/div>\u003cdiv class=\"b\">🖥️ \u003cb>-O\u003c/b>\u003cbr>Guesses the OS from TCP/IP behaviour. It is a \u003cb>guess\u003c/b>, not proof.\u003c/div>\u003c/div>\n\u003ch3>🧪 OS guess accuracy\u003c/h3>\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"o1\">Direct, no firewall\u003c/button>\u003cbutton class=\"x off\" id=\"o2\">Behind firewall/NAT/VM\u003c/button>\u003c/div>\u003cpre class=\"term\" id=\"od\">\u003c/pre>\u003cdiv class=\"bar2\">\u003ci id=\"ob\" style=\"width:95%;background:#4ade80\">\u003c/i>\u003c/div>\n\u003cp class=\"m\">Limits: firewalls hide ports, NAT/VMs change fingerprints, custom stacks fool Nmap, and OS detection needs at least one open and one closed port.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>4. Network Discovery & Scan Timing\u003c/h2>\n\u003cp>Host discovery (\u003ccode>-sn\u003c/code>) finds live hosts without scanning ports. Lab network \u003ccode>10.10.10.0/28\u003c/code> = 16 addresses.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"x\" id=\"d1\">▶ nmap -sn 10.10.10.0/28\u003c/button>\u003cbutton class=\"x off\" id=\"d2\">▶ nmap -Pn (skip ping)\u003c/button>\u003c/div>\u003cdiv class=\"ho\" id=\"ho\">\u003c/div>\u003cdiv class=\"fb\" id=\"dt\">\u003c/div>\n\u003ch3>⏱️ Timing templates (-T0 … -T5)\u003c/h3>\u003cdiv class=\"row\">\u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"5\" value=\"3\"> \u003cb id=\"tn\">\u003c/b>\u003c/div>\u003cdiv id=\"tb\">\u003c/div>\n\u003cp class=\"m\">In labs use \u003ccode>-T3\u003c/code> (default) or \u003ccode>-T4\u003c/code>. Slow timing is not a licence to scan without permission.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>5. False Positives, Firewalls & Authorisation\u003c/h2>\n\u003cdiv class=\"g\">\u003cdiv class=\"b\">⚠️ \u003cb>Banners can mislead\u003c/b>\u003cbr>A distro may backport patches, so \"old\" version ≠ always vulnerable. Verify before reporting.\u003c/div>\u003cdiv class=\"b\">🧱 \u003cb>Filtered ≠ closed\u003c/b>\u003cbr>A firewall may hide real services.\u003c/div>\u003cdiv class=\"b\">🛑 \u003cb>IPS / rate limits\u003c/b>\u003cbr>Some systems fake or block replies; re-scan, compare, use two methods.\u003c/div>\u003cdiv class=\"b\">📶 \u003cb>Moving targets\u003c/b>\u003cbr>DHCP changes IPs; hosts go up/down.\u003c/div>\u003c/div>\n\u003ch3>🎮 Safe or needs authorisation?\u003c/h3>\u003cdiv id=\"gm\">\u003c/div>\u003cdiv class=\"fb\" id=\"gs\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>6. Practicals\u003c/h2>\n\u003ch3>Practical 1 · Scan your own computer (click commands, then yellow text)\u003c/h3>\u003cdiv class=\"row\" id=\"c1\">\u003c/div>\u003cpre class=\"term\" id=\"p1\">$ choose a command…\u003c/pre>\u003cdiv class=\"b\" id=\"n1\">Outputs are simulated sample results.\u003c/div>\n\u003ch3>Practical 2 · Instructor lab VM: \u003ccode>nmap -sV 10.10.10.5\u003c/code>\u003c/h3>\u003cbutton class=\"x\" id=\"c2\">$ nmap -sV 10.10.10.5\u003c/button>\u003cpre class=\"term\" id=\"p2\">$ run the scan…\u003c/pre>\u003cdiv class=\"b\" id=\"n2\">-sV purpose: turn \"port 80 is open\" into \"Apache httpd 2.2.8 is running\". Version = what to research for weaknesses (research only, never exploit unless the lab exercise says so).\u003c/div>\n\u003ch3>Practical 3 · Convert scan → service inventory\u003c/h3>\u003ctextarea id=\"ta\" rows=\"9\">\u003c/textarea>\u003cbutton class=\"x\" id=\"cv1\">⚙️ Convert to inventory\u003c/button>\n\u003cdiv class=\"tbl\">\u003ctable id=\"inv\">\u003c/table>\u003c/div>\u003cbutton class=\"x off\" id=\"ar\">+ Add row\u003c/button>\u003cbutton class=\"x off\" id=\"cc\">Show as CSV\u003c/button>\u003ctextarea id=\"cv2\" rows=\"5\" style=\"display:none\">\u003c/textarea>\u003c/div>\n\n\u003cdiv class=\"card\">\u003ch2>7. Expected Output\u003c/h2>\n\u003ch3>📁 Nmap output file \u003ccode>lab-scan.txt\u003c/code> (created with \u003ccode>-oN\u003c/code>)\u003c/h3>\u003cbutton class=\"x off\" id=\"cp\">Copy\u003c/button>\u003cpre class=\"term\" id=\"of\">\u003c/pre>\n\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>Flag\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-sT / -sS / -sU\u003c/code>\u003c/td>\u003ctd>TCP connect / SYN / UDP scan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-sV\u003c/code>\u003c/td>\u003ctd>Service/version detection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-O\u003c/code>\u003c/td>\u003ctd>OS guess (needs root)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-sn\u003c/code> / \u003ccode>-Pn\u003c/code>\u003c/td>\u003ctd>Discovery only / skip host discovery\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-p 22,80\u003c/code> / \u003ccode>-p-\u003c/code>\u003c/td>\u003ctd>Chosen ports / all 65535\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-T3\u003c/code>\u003c/td>\u003ctd>Timing template\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-oN / -oX / -oA\u003c/code>\u003c/td>\u003ctd>Save normal / XML / all formats\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>📋 Port / service inventory\u003c/h3>\u003cp class=\"m\">Your Practical 3 table is the inventory (edit it, then use \"Show as CSV\" or Ctrl+P).\u003c/p>\n\u003ch3>⚡ Quick revision\u003c/h3>\u003cdiv class=\"g\">\u003cdiv class=\"b\">Open = answers · Closed = RST · Filtered = silence\u003c/div>\u003cdiv class=\"b\">-sT no root · -sS half-open · -sU slow & ambiguous\u003c/div>\u003cdiv class=\"b\">-sV names versions · -O only guesses\u003c/div>\u003cdiv class=\"b\">Scan = permission first, then save evidence (-oN)\u003c/div>\u003c/div>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),H_=(e,h)=>$(e).innerHTML=h;\nconst TH=[['galaxy','🌌 Galaxy'],['blackhole','🕳️ Black Hole'],['supernova','💥 Supernova'],['aurora','🌿 Aurora'],['neon','🌃 Neon'],['ocean','🌊 Ocean'],['sunset','🌇 Sunset'],['paper','📄 Paper']];\nconst cv=$('cv'),x=cv.getContext('2d');let W,H,th='galaxy',P=[],t=0;\nfunction init(){P=[];const n={galaxy:150,blackhole:280,supernova:170,aurora:80,neon:0,ocean:50,sunset:40,paper:35}[th],m=Math.min(W,H);for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,p:Math.random()*6.3,s:Math.random()*.7+.2,a:Math.random()*6.3,d:Math.random()*m*.5+45})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nfunction setTh(k){th=k;document.documentElement.dataset.theme=k;init();document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}\nH_('bar',TH.map(a=>`\u003cbutton class=\"th\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join(''));document.querySelectorAll('.th').forEach(b=>b.onclick=()=>setTh(b.dataset.k));\nfunction ln(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rg(cx,cy,r0,r1,c){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}\nfunction stars(){P.forEach(p=>{x.fillStyle=`rgba(255,255,255,${.4+.6*Math.sin(t*p.s*3+p.p)**2})`;x.fillRect(p.x,p.y,p.r,p.r)})}\nfunction loop(){t+=.016;x.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,m=Math.max(W,H)*.6;\nif(th=='galaxy')stars();\nelse if(th=='blackhole'){rg(cx,cy,30,280,'rgba(255,190,110,.55)');P.forEach(p=>{p.a+=p.s*1.8/p.d*3;x.fillStyle=`hsla(${20+p.d/9},100%,${60+p.s*30}%,.9)`;x.fillRect(cx+Math.cos(p.a)*p.d*1.3,cy+Math.sin(p.a)*p.d*.35,p.r*1.6,p.r*1.6)});x.fillStyle='#000';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.strokeStyle='rgba(255,220,160,.8)';x.lineWidth=2;x.stroke()}\nelse if(th=='supernova'){rg(cx,cy,5,200+30*Math.sin(t*3),'rgba(255,200,80,.5)');P.forEach(p=>{p.d+=p.s*3;if(p.d>m)p.d=0;const k=p.d/m;x.fillStyle=`hsla(${55-k*55},100%,${62-k*22}%,${1-k})`;x.beginPath();x.arc(cx+Math.cos(p.a)*p.d,cy+Math.sin(p.a)*p.d,p.r*1.6,0,7);x.fill()})}\nelse if(th=='aurora'){stars();for(let i=0;i\u003c4;i++)for(let X=0;X\u003cW;X+=6){const y=H*.18+Math.sin(X*.004+t*.5+i*1.3)*60+i*34;x.fillStyle=`hsla(${140+i*28},85%,55%,.07)`;x.fillRect(X,y,6,150+40*Math.sin(X*.01+t+i))}}\nelse if(th=='neon'){const hz=H*.55;x.lineWidth=1;x.strokeStyle='rgba(255,43,214,.5)';for(let i=-20;i\u003c=20;i++)ln(cx+i*18,hz,cx+i*W/10,H);x.strokeStyle='rgba(0,240,255,.5)';for(let i=0;i\u003c12;i++){const k=((i+t*.7)%12)/12;const y=hz+(H-hz)*k*k;ln(0,y,W,y)}x.strokeStyle='rgba(255,43,214,.8)';ln(0,hz,W,hz)}\nelse if(th=='ocean'){P.forEach(p=>{p.y-=p.s*1.2;if(p.y\u003c-10)p.y=H+10;x.strokeStyle='rgba(94,234,212,.55)';x.shadowColor='#5eead4';x.shadowBlur=10;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*4,0,7);x.stroke();x.shadowBlur=0})}\nelse if(th=='sunset'){const sy=H*.62+10*Math.sin(t);const g=x.createLinearGradient(0,sy-110,0,sy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f9a');x.fillStyle=g;x.beginPath();x.arc(cx,sy,110,0,7);x.fill();x.fillStyle='rgba(60,10,80,.55)';for(let i=0;i\u003c5;i++)x.fillRect(cx-115,sy+10+i*20,230,4+i*2);P.forEach(p=>{p.x=(p.x+p.s*.4)%W;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(p.x,p.y,p.r*1.5,p.r*1.5)})}\nelse{P.forEach(p=>{p.y-=p.s*.3;if(p.y\u003c-5)p.y=H+5;x.fillStyle='rgba(79,70,229,.16)';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*3,0,7);x.fill()})}\nrequestAnimationFrame(loop)}\nrs();setTh('galaxy');loop();\nconst esc=s=>s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n\nfunction FLOW(tid,bid,D,L,R){let k=Object.keys(D)[0],n=0,tm;const r=()=>{const S=D[k][1];H_(tid,Object.keys(D).map(q=>`\u003cbutton class=\"${q==k?'on':''}\" data-k=\"${q}\">${D[q][0]}\u003c/button>`).join(''));\nH_(bid,`\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cb>🛰️ ${L}\u003c/b>\u003cb>🎯 ${R}\u003c/b>\u003c/div>`+S.map((s,i)=>`\u003cdiv class=\"fl\" style=\"justify-content:${s[0]?'flex-end':'flex-start'};opacity:${i\u003cn?1:.15}\">\u003cspan class=\"b2\">${s[0]?'⬅ ':''}${s[1]}${s[0]?'':' ➡'}\u003c/span>\u003c/div>`).join('')+`\u003cdiv class=\"b\">${n?S[n-1][2]:'Press Next ▶'}\u003c/div>\u003cbutton class=\"x\" data-a=\"n\">Next ▶\u003c/button>\u003cbutton class=\"x off\" data-a=\"r\">Reset\u003c/button>\u003cbutton class=\"x off\" data-a=\"a\">Auto\u003c/button>`);\ndocument.querySelectorAll('#'+tid+' button').forEach(b=>b.onclick=()=>{clearInterval(tm);k=b.dataset.k;n=0;r()});\ndocument.querySelectorAll('#'+bid+' button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;clearInterval(tm);if(a=='n'){if(n\u003cS.length)n++;r()}else if(a=='r'){n=0;r()}else{n=0;r();tm=setInterval(()=>{if(n\u003cS.length){n++;r()}else clearInterval(tm)},1000)}})};r()}\nFLOW('t1','b1',{open:['🟢 Open',[[0,'SYN to port 80','Nmap knocks: \"Anyone listening on 80?\"'],[1,'SYN-ACK','Service answers → port is OPEN'],[0,'RST','Nmap hangs up (SYN scan). Result: open']]],closed:['🔴 Closed',[[0,'SYN to port 81','Nmap knocks'],[1,'RST','Host says \"nothing here\" → port CLOSED (host is alive)']]],filt:['🟡 Filtered',[[0,'SYN to port 82','Nmap knocks'],[0,'SYN (retry)','No reply… Nmap retries'],[1,'… silence / ICMP unreachable','A firewall drops the probe → FILTERED: open or closed is unknown']]]},'Nmap','Target');\nFLOW('t2','b2',{sT:['-sT Connect',[[0,'SYN','Nmap asks the OS to connect (no root needed)'],[1,'SYN-ACK','Port open'],[0,'ACK','Full handshake completes → application may log the connection'],[0,'RST / close','Connection torn down']]],sS:['-sS SYN',[[0,'SYN','Raw packet (needs root)'],[1,'SYN-ACK','Port open'],[0,'RST','Never completes the handshake (\"half-open\"): faster, but IDS can still detect it']]],sU:['-sU UDP',[[0,'UDP probe to port 161','UDP has no handshake'],[1,'ICMP port unreachable','→ port CLOSED'],[1,'… silence','→ open|filtered: cannot tell. UDP scans are slow']]]},'Nmap','Target');\n\nfunction os(a){$('o1').classList.toggle('off',a);$('o2').classList.toggle('off',!a);H_('od',a?'Running: unknown\\n\u003cspan class=\"er\">No exact OS matches for host\u003c/span>\\nAggressive guesses: Linux 4.x (61%), FreeBSD 12 (58%)':'OS details: \u003cspan class=\"o\">Linux 5.4 - 5.15\u003c/span>\\nOS detection performed. Accuracy: 95%');$('ob').style.width=a?'55%':'95%';$('ob').style.background=a?'#ffc24b':'#4ade80'}$('o1').onclick=()=>os(0);$('o2').onclick=()=>os(1);os(0);\n\nconst AL=[1,5,7,9],PNG=[1,5,7,9],FW=12;let dti;function rho(st){H_('ho',[...Array(16)].map((_,i)=>`\u003cdiv class=\"${st[i]||''}\">.${i}\u003c/div>`).join(''))}rho({});\nfunction disc(pn){clearInterval(dti);let i=0,st={},up=0;rho(st);$('dt').textContent='';dti=setInterval(()=>{if(i>=16){clearInterval(dti);$('dt').textContent=pn?`-Pn treats all 16 as up → ${up} responded to port probes (incl. .12 which blocks ping!). Slower, but finds hidden hosts.`:`${up} hosts up. (.12 is alive but blocks ping → missed. Try -Pn.)`;return}st[i]='sc';rho(st);setTimeout(()=>{const ok=pn?(AL.includes(i)||i==FW):AL.includes(i);st[i]=ok?'up':'';if(ok)up++;rho(st)},120);i++},220)}\n$('d1').onclick=()=>disc(0);$('d2').onclick=()=>disc(1);\nconst TN=[['T0 Paranoid','Waits minutes between probes'],['T1 Sneaky','Very slow'],['T2 Polite','Gentle on bandwidth'],['T3 Normal','Default'],['T4 Aggressive','Fast, good for reliable LAN'],['T5 Insane','May miss ports / overload']],SP=[1,2,2,3,4,5],NZ=[1,1,2,3,4,5],RK=[1,1,1,2,3,5];\nfunction rt(){const v=+$('ts').value;$('tn').textContent=TN[v][0]+' – '+TN[v][1];H_('tb',[['⚡ Speed',SP[v],'#60a5fa'],['📢 Noise / detectability',NZ[v],'#ffc24b'],['❌ Risk of missed/unstable results',RK[v],'#ff6b6b']].map(a=>`\u003cdiv>${a[0]}\u003cdiv class=\"bar2\">\u003ci style=\"width:${a[1]*20}%;background:${a[2]}\">\u003c/i>\u003c/div>\u003c/div>`).join(''))}$('ts').oninput=rt;rt();\n\nconst GM=[['nmap 127.0.0.1',1,'Your own computer.'],['nmap -sV 127.0.0.1',1,'Your own computer.'],['nmap -sV 10.10.10.5 (instructor\\'s isolated lab VM)',1,'Authorised lab target.'],['nmap -A 8.8.8.8',0,'Public IP, aggressive scan → needs written authorisation (usually impossible: not yours).'],['nmap --script vuln 203.0.113.50',0,'Vulnerability scripts on a public IP → never without written permission.'],['nmap -sn on someone else\\'s Wi-Fi / college network',0,'Not your network → get authorisation first.'],['nmap -p- -T5 company-website.com',0,'Third-party site, heavy scan → illegal/harmful without a signed scope.']];let gk=0,gn=0;\nH_('gm',GM.map((g,i)=>`\u003cdiv class=\"b row\" style=\"margin:4px 0\">\u003ccode style=\"flex:1\">${esc(g[0])}\u003c/code>\u003cbutton class=\"x off\" data-i=\"${i}\" data-v=\"1\">✅ OK (own / authorised lab)\u003c/button>\u003cbutton class=\"x off\" data-i=\"${i}\" data-v=\"0\">🚫 Needs written authorisation\u003c/button>\u003cb id=\"g${i}\">\u003c/b>\u003c/div>`).join(''));\ndocument.querySelectorAll('#gm button').forEach(b=>b.onclick=()=>{const i=b.dataset.i;if($('g'+i).textContent)return;const ok=+b.dataset.v==GM[i][1];gn++;if(ok)gk++;$('g'+i).textContent=(ok?'🎉 ':'🙈 ')+GM[i][2];$('gs').textContent=`Score ${gk}/${gn}`});\n\nconst T=(e,s)=>`\u003cu class=\"k2\" data-e=\"${e}\">${s}\u003c/u>`,HD='Starting Nmap 7.95 ( https://nmap.org ) at 2026-10-11 11:02 IST\\n';\nfunction term(bid,pid,nid,O){H_(bid,Object.keys(O).map(k=>`\u003cbutton class=\"x\" data-c=\"${esc(k)}\">$ ${esc(k)}\u003c/button>`).join(''));document.querySelectorAll('#'+b ly:var(--f-body)}\n\n/* layers */\n.layers{display:grid;gap:8px}\n.layer{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--code);transition:.3s;min-width:0}\n.layer .ic{font:700 13px var(--f-mono);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}\n.layer small{color:var(--muted);display:block;font-size:13px}\n.layer.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2),0 0 22px -4px var(--accent2);transform:translateX(6px)}\n.pkt{font:600 13px var(--f-mono);background:var(--code);border:1px dashed var(--accent2);border-radius:8px;padding:8px 12px;min-height:38px}\n\n/* tree */\n.tree{display:grid;gap:6px;font-family:var(--f-mono);font-size:14px}\n.node{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--code);border-radius:8px;padding:7px 12px;text-align:left;width:100%;transition:.25s}\n.node.l1{margin-left:22px;width:calc(100% - 22px)}\n.node:hover,.node.sel{border-color:var(--accent2);box-shadow:0 0 14px -4px var(--accent2)}\n.node .em{font-size:16px}\n.detail{min-height:150px}\n.detail h3{font-size:18px;margin-bottom:8px;color:var(--accent)}\n.detail ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}\n.path{font:600 15px var(--f-mono);background:var(--code);border-radius:8px;padding:8px 12px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}\n\n/* users */\n.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}\n.user{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code);text-align:center;transition:.3s}\n.user .av{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 16px var(--f-mono);background:var(--accent);color:var(--on-accent)}\n.user.hl{border-color:var(--accent2);box-shadow:0 0 18px -4px var(--accent2)}\n.user small{display:bloc
